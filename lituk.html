<!DOCTYPE html>
<html lang="en" data-lituk-nohub>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Life in the UK — Study Quest 💛</title>
<!-- lituk:shared -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{--lituk-sat:env(safe-area-inset-top,0px);--lituk-sar:env(safe-area-inset-right,0px);--lituk-sab:env(safe-area-inset-bottom,0px);--lituk-sal:env(safe-area-inset-left,0px);--lituk-inset:12px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-bottom:var(--lituk-sab)}body{padding-left:var(--lituk-sal);padding-right:var(--lituk-sar)}html:not([data-lituk-topbar]) body{padding-top:var(--lituk-sat)}html[data-lituk-topbar] header{padding-top:var(--lituk-sat)}</style>
<script src="app.js" defer></script>
<!-- /lituk:shared -->
<style>
/* ============================================================
   LIFE IN THE UK — STUDY QUEST
   A single-file gamified quiz. All CSS + JS inline. Works offline.
   ============================================================ */

:root{
  /* 💖 Pink theme — her favourite colour */
  --bg1:#3a0d2e; --bg2:#6b1450; --bg3:#9b2168;
  --card:rgba(255,255,255,0.09);
  --card-solid:#4a1138;
  --stroke:rgba(255,255,255,0.18);
  --text:#fff2f8; --muted:#f0b9d6;
  --accent:#ff4f9a; --accent2:#ffb347;
  --good:#3ddc97; --good-d:#1faa74;
  --bad:#ff6b8a;
  --blue:#ff79c6; --gold:#ffd34d;
  --r:22px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 15% -10%, #ff4f9a 0%, transparent 55%),
    radial-gradient(1000px 800px at 110% 10%, #ffb34744 0%, transparent 50%),
    linear-gradient(160deg, var(--bg1), var(--bg2) 45%, var(--bg3));
  background-attachment:fixed;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
button{font-family:inherit; cursor:pointer; border:none; color:inherit;}
.hidden{display:none !important;}

/* ---------- App shell ---------- */
#app{
  max-width:760px; margin:0 auto; padding:16px 16px 90px;
  min-height:100dvh; position:relative;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; margin-bottom:14px;
  background:var(--card); border:1px solid var(--stroke);
  border-radius:var(--r); backdrop-filter:blur(8px);
  box-shadow:var(--shadow);
}
.avatar{
  width:46px; height:46px; border-radius:50%; flex:0 0 auto;
  display:grid; place-items:center; font-size:26px;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  box-shadow:0 6px 18px rgba(255,93,143,.45);
}
.questHub{
  width:34px; height:34px; flex:0 0 auto; border-radius:50%;
  display:grid; place-items:center; text-decoration:none;
  color:var(--text); background:rgba(255,255,255,.10);
  border:1px solid var(--stroke); font-size:17px; font-weight:700;
}
.questHub:active{transform:scale(.94);}
.topinfo{flex:1; min-width:0;}
.topinfo .hi{font-size:13px; color:var(--muted);}
.topinfo .lvl{font-weight:bold; font-size:16px; display:flex; align-items:center; gap:8px;}
.xpwrap{height:9px; border-radius:9px; background:rgba(0,0,0,.3); overflow:hidden; margin-top:5px;}
.xpbar{height:100%; width:0%; border-radius:9px;
  background:linear-gradient(90deg,var(--gold),var(--accent2));
  transition:width .6s cubic-bezier(.2,.9,.3,1.2);}
.coinbox{display:flex; align-items:center; gap:5px; font-weight:bold; font-size:15px;
  background:rgba(0,0,0,.25); padding:7px 12px; border-radius:14px;}
.mutebtn{background:rgba(0,0,0,.25); border-radius:14px; padding:8px 11px; font-size:16px;}

/* ---------- Screens ---------- */
.screen{animation:fadeUp .45s cubic-bezier(.2,.8,.3,1.1);}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;}}

.hero{
  text-align:center; padding:26px 18px;
  background:var(--card); border:1px solid var(--stroke);
  border-radius:26px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  margin-bottom:18px;
}
.hero::before{content:""; position:absolute; inset:-40%;
  background:conic-gradient(from 0deg, #ff5d8f33,#ffb34733,#4f7cff33,#3ddc9733,#ff5d8f33);
  animation:spin 18s linear infinite; filter:blur(30px); opacity:.5;}
@keyframes spin{to{transform:rotate(360deg);}}
.hero>*{position:relative;}
.hero .flag{font-size:42px; letter-spacing:4px;}
/* An image, not the emoji — Windows renders 🇬🇧 as the letters "GB". */
.hero .flag img{display:block;margin:0 auto;width:48px;height:auto;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.hero h1{margin:6px 0 4px; font-size:30px; line-height:1.1;
  background:linear-gradient(90deg,#fff,#ffd9e6,#fff); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{margin:0; color:var(--muted); font-size:15px;}

.menu{display:grid; gap:14px;}
.tile{
  display:flex; align-items:center; gap:16px; text-align:left;
  padding:18px; border-radius:var(--r);
  background:linear-gradient(135deg, var(--card), rgba(255,255,255,.03));
  border:1px solid var(--stroke); box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease;
  width:100%;
}
.tile:active{transform:scale(.97);}
.tile .ti{font-size:34px; width:58px; height:58px; border-radius:18px; display:grid; place-items:center; flex:0 0 auto;}
.t-practice .ti{background:linear-gradient(145deg,#4f7cff,#7a5cff);}
.t-mock .ti{background:linear-gradient(145deg,#ff5d8f,#ff8a5c);}
.t-review .ti{background:linear-gradient(145deg,#ffb347,#ffd34d);}
.t-trophy .ti{background:linear-gradient(145deg,#3ddc97,#26b3a8);}
.t-settings .ti{background:linear-gradient(145deg,#9a8cff,#6c2bd9);}
.tile .tt{flex:1;}
.tile .tt b{font-size:18px; display:block;}
.tile .tt span{font-size:13px; color:var(--muted);}
.tile .chev{font-size:22px; color:var(--muted);}

/* section heading */
.sec-h{display:flex; align-items:center; gap:10px; margin:6px 4px 14px;}
.backbtn{background:var(--card); border:1px solid var(--stroke); border-radius:14px; padding:9px 14px; font-size:15px; font-weight:bold;}
.sec-h h2{margin:0; font-size:21px;}

/* chapter cards */
.chips{display:grid; gap:13px;}
.chap{
  text-align:left; padding:16px; border-radius:var(--r);
  background:var(--card); border:1px solid var(--stroke); box-shadow:var(--shadow);
  display:flex; align-items:center; gap:14px; transition:transform .12s;
}
.chap:active{transform:scale(.97);}
.chap .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:bold;font-size:18px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--accent),var(--accent2));}
.chap .ci{flex:1;}
.chap .ci b{font-size:16px; display:block;}
.chap .ci span{font-size:12px; color:var(--muted);}
.mini-bar{height:7px;border-radius:7px;background:rgba(0,0,0,.3);margin-top:7px;overflow:hidden;}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#7af0c0);border-radius:7px;}
.chap .star{font-size:18px;}

/* ---------- Quiz ---------- */
.quizhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
.qcount{font-size:14px; color:var(--muted); font-weight:bold;}
.timer{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:8px 13px;font-weight:bold;font-variant-numeric:tabular-nums;}
.timer.warn{color:#ffd34d; animation:pulseT .8s infinite;}
.timer.danger{color:#ff6b8a; animation:pulseT .5s infinite;}
@keyframes pulseT{50%{transform:scale(1.08);}}

.progrow{height:8px;border-radius:8px;background:rgba(0,0,0,.3);overflow:hidden;margin-bottom:16px;}
.progrow i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--accent));transition:width .4s;}

/* streak banner */
.streak{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:bold;font-size:14px;
  margin-bottom:12px;height:0;overflow:hidden;opacity:0;transition:all .35s;}
.streak.show{height:auto;opacity:1;padding:8px;border-radius:14px;
  background:linear-gradient(90deg,#ff5d8f33,#ffb34733);border:1px solid var(--stroke);}
.streak .fire{animation:wobble .7s infinite;}
@keyframes wobble{50%{transform:translateY(-3px) rotate(-6deg) scale(1.15);}}

.qcard{
  background:var(--card-solid); border:1px solid var(--stroke);
  border-radius:24px; padding:22px 20px; box-shadow:var(--shadow); margin-bottom:16px;
  position:relative; overflow:hidden;
}
.qcard.golden{box-shadow:0 0 0 2px var(--gold),0 18px 50px rgba(255,211,77,.35);}
.golden-tag{position:absolute;top:0;right:0;background:linear-gradient(135deg,var(--gold),var(--accent2));
  color:#3a1d00;font-weight:bold;font-size:12px;padding:6px 14px;border-bottom-left-radius:14px;}
.qtag{display:inline-block;font-size:12px;color:var(--muted);margin-bottom:8px;
  background:rgba(0,0,0,.25);padding:4px 10px;border-radius:10px;}
.qtext{font-size:20px; line-height:1.4; font-weight:bold; margin:4px 0 6px;}

.opts{display:grid; gap:11px; margin-top:16px;}
.opt{
  text-align:left; padding:15px 16px; border-radius:16px;
  background:rgba(255,255,255,.06); border:2px solid var(--stroke);
  font-size:16px; line-height:1.35; transition:transform .1s, background .2s, border-color .2s;
  display:flex; align-items:center; gap:12px;
}
.opt:active{transform:scale(.98);}
.opt .key{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-weight:bold;font-size:13px;flex:0 0 auto;}
.opt.correct{background:linear-gradient(135deg,var(--good-d),#2bbf86);border-color:var(--good);}
.opt.correct .key{background:rgba(0,0,0,.25);}
.opt.wrong{background:linear-gradient(135deg,#a83a55,#8c2f49);border-color:var(--bad);}
.opt.dim{opacity:.5;}
.opt[disabled]{cursor:default;}

/* feedback / explanation */
.explain{margin-top:14px;padding:14px 16px;border-radius:16px;font-size:14px;line-height:1.5;
  border:1px solid var(--stroke);animation:fadeUp .35s;}
.explain.ok{background:linear-gradient(135deg,#1faa7433,#3ddc9722);border-color:var(--good);}
.explain.no{background:linear-gradient(135deg,#ff6b8a22,#ff5d8f22);border-color:var(--bad);}
.explain b{display:block;margin-bottom:4px;font-size:15px;}
.explain .warm-line{font-size:14px;margin:2px 0 6px;color:#fff;font-weight:600;opacity:.95;}

.nextbtn{
  width:100%; padding:16px; border-radius:18px; font-size:17px; font-weight:bold; margin-top:4px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 26px rgba(255,93,143,.4); transition:transform .1s;
}
.nextbtn:active{transform:scale(.97);}
.nextbtn.ghost{background:var(--card);border:1px solid var(--stroke);box-shadow:none;}

/* ---------- Results ---------- */
.result{text-align:center;padding:8px;}
.result .big{font-size:74px;line-height:1;margin:6px 0;}
.result h2{font-size:30px;margin:6px 0;}
.scoreRing{width:170px;height:170px;margin:14px auto;position:relative;}
.scoreRing svg{transform:rotate(-90deg);}
.scoreRing .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:bold;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;}
.stat{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:14px 6px;}
.stat b{display:block;font-size:24px;}
.stat span{font-size:12px;color:var(--muted);}
.passbadge{display:inline-block;padding:8px 20px;border-radius:30px;font-weight:bold;font-size:18px;margin:6px 0;}
.passbadge.pass{background:linear-gradient(135deg,var(--good-d),var(--good));}
.passbadge.fail{background:linear-gradient(135deg,#7a3a5a,#a8557a);}

/* ---------- Trophy cabinet ---------- */
.trophy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px;}
.tcard{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:16px 12px;text-align:center;box-shadow:var(--shadow);}
.tcard.locked{opacity:.45;filter:grayscale(.7);}
.tcard .em{font-size:40px;}
.tcard b{display:block;margin-top:6px;font-size:14px;}
.tcard span{font-size:11px;color:var(--muted);}

/* ---------- Settings ---------- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:15px;margin-bottom:12px;}
.setrow label{font-weight:bold;font-size:15px;}
.setrow input[type=text]{background:rgba(0,0,0,.3);border:1px solid var(--stroke);color:var(--text);
  border-radius:12px;padding:10px 12px;font-size:15px;width:160px;text-align:right;font-family:inherit;}
.toggle{width:54px;height:30px;border-radius:30px;background:rgba(0,0,0,.4);position:relative;transition:background .2s;flex:0 0 auto;}
.toggle.on{background:var(--good-d);}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;}
.toggle.on i{left:27px;}
.danger-btn{width:100%;padding:14px;border-radius:16px;font-weight:bold;background:linear-gradient(135deg,#a83a55,#8c2f49);margin-top:6px;}

/* ---------- Mascot ---------- */
#mascot{position:fixed;bottom:18px;right:16px;z-index:60;width:128px;height:128px;
  display:grid;place-items:center;cursor:pointer;transition:transform .2s;}
#mascot .body{font-size:92px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));transition:transform .25s;
  animation:idleBob 3.4s ease-in-out infinite;}
#mascot.happy .body{animation:hop .55s ease;}
#mascot.cheer .body{animation:cheer 1.1s ease;}
#mascot.dance .body{animation:dance 1.1s ease;}
#mascot.sad .body{animation:droop 1.4s ease forwards;}
@keyframes idleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1);}30%{transform:translateY(-34px) scale(1.15);}60%{transform:translateY(0) scale(.95);}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1) rotate(0);}25%{transform:translateY(-38px) scale(1.2) rotate(-8deg);}50%{transform:translateY(-10px) scale(1.05) rotate(8deg);}75%{transform:translateY(-30px) scale(1.15) rotate(-5deg);}}
@keyframes dance{0%,100%{transform:rotate(0);}20%{transform:rotate(-18deg) scale(1.15);}40%{transform:rotate(16deg) scale(1.1);}60%{transform:rotate(-14deg) scale(1.12);}80%{transform:rotate(12deg) scale(1.08);}}
@keyframes droop{to{transform:translateY(8px) rotate(5deg) scale(.9);}}
.bubble{position:fixed;bottom:150px;right:16px;z-index:60;max-width:250px;
  background:#fff;color:#2a1a4a;font-weight:bold;font-size:14px;line-height:1.35;
  padding:12px 14px;border-radius:16px 16px 4px 16px;box-shadow:0 12px 30px rgba(0,0,0,.4);
  opacity:0;transform:translateY(10px) scale(.9);transition:all .3s cubic-bezier(.2,.9,.3,1.4);pointer-events:none;}
.bubble.show{opacity:1;transform:none;}
.bubble::after{content:"";position:absolute;bottom:-8px;right:18px;width:0;height:0;
  border:8px solid transparent;border-top-color:#fff;border-bottom:0;}

/* ---------- Toast / popups ---------- */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-120px);z-index:80;
  background:linear-gradient(135deg,#241552,#3a1d6e);border:1px solid var(--stroke);
  border-radius:18px;padding:14px 20px;font-weight:bold;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;max-width:90vw;transition:transform .45s cubic-bezier(.2,.9,.3,1.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast .em{font-size:26px;}

/* love-note / surprise modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
  background:rgba(10,4,30,.7);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s;}
.modal.show{opacity:1;pointer-events:auto;}
.modal .box{max-width:380px;width:100%;text-align:center;padding:30px 24px;border-radius:26px;
  background:linear-gradient(160deg,#3a1d6e,#5b2a86);border:1px solid var(--stroke);
  box-shadow:var(--shadow);transform:scale(.85);transition:transform .4s cubic-bezier(.2,.9,.3,1.5);}
.modal.show .box{transform:scale(1);}
.modal .box .em{font-size:56px;}
.modal .box h3{margin:10px 0 8px;font-size:24px;}
.modal .box p{color:#efe8ff;font-size:16px;line-height:1.5;margin:0 0 18px;}
.modal .box button{padding:13px 28px;border-radius:16px;font-weight:bold;font-size:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));}

/* confetti + fireworks canvas */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;}

/* level-up flash */
.levelup{position:fixed;inset:0;z-index:85;display:grid;place-items:center;pointer-events:none;}
.levelup .lu-card{text-align:center;transform:scale(.5);opacity:0;}
.levelup.go .lu-card{animation:lu 2.4s ease forwards;}
@keyframes lu{15%{transform:scale(1.1);opacity:1;}80%{transform:scale(1);opacity:1;}100%{opacity:0;transform:scale(1.2);}}
.levelup .lu-card .em{font-size:80px;}
.levelup .lu-card b{display:block;font-size:32px;
  background:linear-gradient(90deg,var(--gold),#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}

/* footer credit */
.credit{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;opacity:.7;}

@media (min-width:680px){
  .qtext{font-size:22px;}
  .menu{grid-template-columns:1fr 1fr;}
  .menu .t-settings,.menu .t-trophy{grid-column:auto;}
}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div id="app">
  <!-- top bar -->
  <div class="topbar">
    <a class="questHub" href="index.html" title="Back to the study hub" aria-label="Back to the study hub">←</a>
    <div class="avatar" id="avatarEmoji">🦊</div>
    <div class="topinfo">
      <div class="hi" id="greet">Hello!</div>
      <div class="lvl"><span id="lvlLabel">Level 1</span></div>
      <div class="xpwrap"><div class="xpbar" id="xpBar"></div></div>
    </div>
    <div class="coinbox">⭐ <span id="coinCount">0</span></div>
    <button class="mutebtn" id="muteBtn" title="Sound">🔊</button>
  </div>

  <div id="screens"></div>

  <div class="credit">Made with 💛 just for you · Life in the UK Study Quest</div>
</div>

<!-- mascot -->
<div id="mascot"><div class="body" id="mascotBody">🦊</div></div>
<div class="bubble" id="bubble"></div>

<!-- toast -->
<div class="toast" id="toast"><span class="em" id="toastEm">🎉</span><span id="toastMsg"></span></div>

<!-- level up -->
<div class="levelup" id="levelup"><div class="lu-card"><div class="em">⭐</div><b id="luText">LEVEL UP!</b></div></div>

<!-- modal -->
<div class="modal" id="modal"><div class="box">
  <div class="em" id="modalEm">💌</div>
  <h3 id="modalTitle">Surprise!</h3>
  <p id="modalBody"></p>
  <button id="modalClose">Aww, thank you 💛</button>
</div></div>

<script>
/* ============================================================
   1. CONFIG  —  ✏️ EDIT THIS BLOCK to personalise the gift
   ============================================================ */
const CONFIG = {
  PLAYER_NAME: "My Love",                        // ← EDIT ME: her real name
  MASCOT: "🥭",                                  // ← her favourite: mango! (or pick 🦊 🐧 🐱 🐼 🦄)

  // ← EDIT ME: affectionate nicknames, picked at random
  PET_NAMES: ["my love", "darling", "sweetheart", "superstar", "my mango", "head chef", "sugar"],

  // ← EDIT ME: little inside jokes that pop up in the mascot's speech bubble
  INSIDE_JOKES: [
    "Remember: tea first, revision second ☕",
    "You're already more British than the King 👑",
    "Studying is just like cooking — follow the recipe and it all comes together 🍳",
    "Life in the UK now, mango lassi to celebrate later 🥭🥤",
    "You season questions the way you season biryani — perfectly 🌶️",
    "Fun fact: you're sweeter than the ripest mango 🥭💕",
    "A watched pot never boils… but a studied chapter always sticks 😌"
  ],

  // ← EDIT ME: hidden love notes shown at milestones & the secret screen
  LOVE_NOTES: [
    "I'm so proud of how hard you're working. You've got this. 💖",

   ============================================================ */
let actx=null;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq,start,dur,type="sine",vol=.2){
  const a=audio(); if(!a||!S.sound) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination);
  const t=a.currentTime+start;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}

  click(){ tone(520,0,.05,"square",.08); },

/* ============================================================
   5. FX — confetti & fireworks (hand-rolled canvas)
   ============================================================ */
const fx=document.getElementById('fx'); const ctx=fx.getContext('2d');
let parts=[], rafOn=false;
function sizeFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
sizeFx(); addEventListener('resize',sizeFx);
const COLORS=["#ff4f9a","#ff7ec0","#ffa3d4","#ffb347","#ffd34d","#ff8ac0","#ff6b8a","#fff"];
function burst(x,y,n,power){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, sp=Math.random()*power+2;
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-3,
      g:.14+Math.random()*.08, life:60+Math.random()*40, age:0,
      s:5+Math.random()*7, c:COLORS[(Math.random()*COLORS.length)|0],
      rot:Math.random()*6, vr:(Math.random()-.5)*.4, shape:Math.random()<.5?0:1});
  }
  run();
}
function confetti(){ burst(innerWidth/2, innerHeight*0.35, 120, 9); }
function confettiSmall(x,y){ burst(x,y,28,7); }
function fireworks(){
  let shots=0;
  const iv=setInterval(()=>{
    burst(innerWidth*(0.2+Math.random()*0.6), innerHeight*(0.2+Math.random()*0.35), 70, 8);
    if(++shots>6) clearInterval(iv);
  },350);
}
function run(){ if(rafOn) return; rafOn=true; requestAnimationFrame(tick); }
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.age<p.life);
  parts.forEach(p=>{
    p.age++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.rot+=p.vr;
    const al=Math.max(0,1-p.age/p.life);
    ctx.save(); ctx.globalAlpha=al; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
    if(p.shape===0) ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.4);
    else { ctx.beginPath(); ctx.arc(0,0,p.s/1.6,0,7); ctx.fill(); }
    ctx.restore();
  });
  if(parts.length){ requestAnimationFrame(tick); } else { rafOn=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ============================================================
   13. CORE QUIZ ENGINE  (shared by all modes)
   ============================================================ */
let quiz=null;
function startQuiz(mode,chapter){
  let list = chapter._custom ? chapter._custom.slice()
           : chapter.questions.map((q,i)=>({...q,_tag:chapter.title,_ref:{chapterId:chapter.id,qIndex:i}}));
  if(mode!=='mock') list=shuffle(list);
  // shuffle options per question while tracking correct index
  list=list.map(q=>{
    const order=shuffle(q.a.map((t,i)=>({t,i})));
    return {...q, _opts:order.map(o=>o.t), _c:order.findIndex(o=>o.i===q.c)};
  });
  quiz={mode, chapter, list, idx:0, correct:0, streak:0, maxStreak:0, answers:[],
        timeLeft: mode==='mock'?CONFIG.MOCK_SECONDS:null, timer:null, locked:false};
  if(mode==='mock') startTimer();
  renderQ();
}
function startTimer(){
  quiz.timer=setInterval(()=>{
    quiz.timeLeft--;
    updateTimer();
    if(quiz.timeLeft<=0){ clearInterval(quiz.timer); finishQuiz(true); }
  },1000);
}
function updateTimer(){
  const el=$('#timer'); if(!el) return;
  const m=Math.floor(quiz.timeLeft/60), s=quiz.timeLeft%60;
  el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  el.className='timer'+(quiz.timeLeft<=30?' danger':quiz.timeLeft<=120?' warn':'');
}
function renderQ(){
  const q=quiz.list[quiz.idx];
  q._golden = quiz.mode!=='mock' && Math.random()<CONFIG.GOLDEN_CHANCE;
  const prog=((quiz.idx)/quiz.list.length)*100;
  go(`
    <div class="quizhead">
      <button class="backbtn" id="quitQ">‹ Quit</button>
      <div class="qcount">${quiz.idx+1} / ${quiz.list.length}</div>
      ${quiz.mode==='mock'?`<div class="timer" id="timer"></div>`:`<div class="qcount">⭐ ${quiz.correct}</div>`}
    </div>
    <div class="progrow"><i style="width:${prog}%"></i></div>
    <div class="streak" id="streakBox"></div>
    <div class="qcard ${q._golden?'golden':''}">
      ${q._golden?`<div class="golden-tag">✨ GOLDEN ×2</div>`:''}
      <span class="qtag">${q._tag||quiz.chapter.title}</span>
      <div class="qtext">${q.q}</div>
      <div class="opts" id="opts"></div>
      <div id="afterbox"></div>
    </div>
  `);
  $('#quitQ').onclick=()=>{ SFX.click(); if(quiz.timer)clearInterval(quiz.timer); quiz=null; home(); };
  const keys=['A','B','C','D','E'];
  const opts=$('#opts');
  q._opts.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.innerHTML=`<span class="key">${keys[i]}</span><span>${t}</span>`;
    b.onclick=()=>answer(i,b);
    opts.appendChild(b);
  });
  if(quiz.mode==='mock'){ updateTimer(); }
  showStreak();
}
function showStreak(){
  const sb=$('#streakBox'); if(!sb) return;
  if(quiz.streak>=2){ sb.classList.add('show'); sb.innerHTML=`<span class="fire">🔥</span> ${quiz.streak} in a row! ${quiz.streak>=5?'Combo ×'+(1+Math.floor(quiz.streak/5)):''}`; }
  else sb.classList.remove('show');
}
function answer(choice,btn){
  if(quiz.locked) return; quiz.locked=true;
  const q=quiz.list[quiz.idx];
  const correct = choice===q._c;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach((o,i)=>{ o.setAttribute('disabled','');
    if(i===q._c) o.classList.add('correct');
    else if(i===choice) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  quiz.answers.push({q, choice, correct});
  S.totalAnswered++; awardBadge('first');
  if(S.totalAnswered>=100) awardBadge('hundred');

  if(correct){
    quiz.correct++; quiz.streak++; quiz.maxStreak=Math.max(quiz.maxStreak,quiz.streak);
    S.totalCorrect++;
    const mult = q._golden?2:1;
    const combo = 1+Math.floor(quiz.streak/5);
    addXp(10*mult*combo); addCoins(q._golden?2:1);
    SFX[q._golden?'golden':'correct']();
    mascotReact(quiz.streak>=5?'dance':(quiz.streak>=3?'cheer':'happy'));
    if(q._golden){ awardBadge('golden'); confetti(); bubble(`A GOLDEN one, ${petName()}! Double points! 🪙✨`); }
    else { const r=btn.getBoundingClientRect(); confettiSmall(r.left+r.width/2, r.top+r.height/2);
           bubble(quiz.streak>=3?`🔥 ${quiz.streak} in a row, ${petName()}! Unstoppable!`:pick(['Yes! 🎉','That\'s my star! ⭐','Brilliant! 💛','Woohoo! 🙌']),2200); }
    if(quiz.streak===5) awardBadge('streak5');
    if(quiz.streak===10) awardBadge('streak10');
    // remove from wrong pool if reviewing/repeating
    if(q._ref) S.wrongPool=S.wrongPool.filter(w=>!(w.chapterId===q._ref.chapterId&&w.qIndex===q._ref.qIndex));
    feedback(true,q);
    // milestone love note every 10 correct overall
    if(S.totalCorrect%10===0){ setTimeout(()=>{ modal('💌','A little note',pick(CONFIG.LOVE_NOTES)); confetti(); },650); }
  } else {
    quiz.streak=0;
    SFX.wrong(); mascotReact('sad');
    if(q._ref && !S.wrongPool.some(w=>w.chapterId===q._ref.chapterId&&w.qIndex===q._ref.qIndex))
      S.wrongPool.push(q._ref);
    save();
    feedback(false,q);
  }
  save();
}
function feedback(ok,q){
  const after=$('#afterbox');
  const head = ok ? `${pick(PRAISE)}, ${petName()}! 🎉` : `${pick(COMFORT)}, ${petName()} 💛`;
  const warm = (ok ? pick(PRAISE_LONG) : pick(COMFORT_LONG)).replace('{p}',petName());
  after.innerHTML=`
    <div class="explain ${ok?'ok':'no'}">
      <b>${head}</b>
      <div class="warm-line">${warm}</div>
      ${ok?'':`<div style="margin:8px 0 4px">The correct answer was: <b style="display:inline">${q._opts[q._c]}</b></div>`}
      ${q.e||''}
    </div>
    <button class="nextbtn ${ok?'':'ghost'}" id="nextBtn">${quiz.idx+1<quiz.list.length?'Next question →':'See my results 🎊'}</button>`;
  $('#nextBtn').onclick=()=>{
    SFX.click();
    if(quiz.idx+1<quiz.list.length){ quiz.idx++; quiz.locked=false; renderQ(); }
    else finishQuiz(false);
  };
  if(!ok) bubble(`I'm right here with you, ${petName()}. 🫂💛`);
}

/* ============================================================
   14. RESULTS
   ============================================================ */
function finishQuiz(timedOut){
  if(quiz.timer) clearInterval(quiz.timer);
  const total=quiz.list.length, correct=quiz.correct;
  const pct=Math.round((correct/total)*100);
  const mode=quiz.mode;

  // record bests
  if(mode==='practice'){
    const id=quiz.chapter.id;
    S.chapterBest[id]=Math.max(S.chapterBest[id]||0, pct);
    if(pct>=100) awardBadge('perfect');
    if(id==='history' && pct>=Math.round(CONFIG.PASS_MARK*100)) awardBadge('history');
  }
  let passed=false;
  if(mode==='mock'){
    passed = pct>=Math.round(CONFIG.PASS_MARK*100);
    S.bestMock=Math.max(S.bestMock,pct);
    if(passed){ S.mockPassed=true; awardBadge('mock'); }
  }
  if(S.level>=5) awardBadge('level5');
  save(); refreshTop();

  // celebration choice
  const great = pct>= pctThreshold(mode);
  if(mode==='mock' && passed){ fireworks(); SFX.pass(); }
  else if(great){ confetti(); SFX.pass(); }

  const big = mode==='mock' ? (passed?'🎓':'📖') : (pct>=100?'🏆':pct>=75?'🌟':pct>=50?'👍':'🌱');
  const title = mode==='mock'
      ? (passed?`You PASSED, ${S.name}!`:`Good practice, ${petName()}`)
      : (pct>=100?`Flawless, ${petName()}!`: pct>=75?`Great work, ${petName()}!`:`Nice try, ${petName()}!`);

  const circ=2*Math.PI*70;
  const dash=circ*(pct/100);

  go(`
    <div class="result">
      <div class="big">${big}</div>
      <h2>${title}</h2>
      ${mode==='mock'?`<div class="passbadge ${passed?'pass':'fail'}">${passed?'PASS ✓':'Not yet — keep going!'}</div>`:''}
      <div class="scoreRing">
        <svg width="170" height="170">
          <circle cx="85" cy="85" r="70" stroke="rgba(255,255,255,.12)" stroke-width="14" fill="none"/>
          <circle cx="85" cy="85" r="70" stroke="url(#g)" stroke-width="14" fill="none"
            stroke-linecap="round" stroke-dasharray="${dash} ${circ}"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd34d"/><stop offset="1" stop-color="#ff5d8f"/></linearGradient></defs>
        </svg>
        <div class="pct">${pct}%</div>
      </div>
      <div class="statgrid">
        <div class="stat"><b>${correct}/${total}</b><span>Correct</span></div>
        <div class="stat"><b>🔥 ${quiz.maxStreak}</b><span>Best streak</span></div>
        <div class="stat"><b>⭐ ${correct*(mode==='mock'?1:1)}</b><span>Coins earned</span></div>
      </div>
      ${timedOut?`<p style="color:var(--muted)">⏱ Time ran out — but every attempt makes you stronger!</p>`:''}
      <p style="color:#efe8ff;line-height:1.5">${resultLine(mode,pct,passed)}</p>
      <button class="nextbtn" id="againBtn">${mode==='mock'?'Try another mock':'Practise again'}</button>
      <button class="nextbtn ghost" id="homeBtn" style="margin-top:10px">Back home 🏠</button>
    </div>`);
  $('#againBtn').onclick=()=>{ SFX.click();
    if(mode==='mock') mockIntro();
    else if(mode==='review') review();
    else startQuiz('practice',quiz.chapter); };
  $('#homeBtn').onclick=()=>{ SFX.click(); quiz=null; home(); };

  if(mode==='mock' && passed){ setTimeout(()=>modal('💌','You did it!',pick(CONFIG.LOVE_NOTES)),1400); }
}
function pctThreshold(mode){ return mode==='mock'?Math.round(CONFIG.PASS_MARK*100):75; }
function resultLine(mode,pct,passed){
  if(mode==='mock' && passed) return `That's a passing score on the real format. I'm SO proud of you. 💛`;
  if(mode==='mock') return `So close — the real pass mark is ${Math.round(CONFIG.PASS_MARK*100)}%. Review your mistakes and smash the next one!`;
  if(pct>=100) return `A perfect chapter! Add it to the trophy cabinet. ✨`;
  if(pct>=75) return `That's above the pass mark — brilliant progress!`;
  return `Every question you see again is one you'll remember. Keep going! 💪`;
}

/* ============================================================
   15. TROPHY CABINET
   ============================================================ */
function trophies(){
  const cards=BADGES.map(b=>{
    const got=!!S.badges[b.id];
    return `<div class="tcard ${got?'':'locked'}"><div class="em">${got?b.em:'🔒'}</div><b>${b.name}</b><span>${b.desc}</span></div>`;
  }).join('');
  go(`<div class="sec-h"><button class="backbtn" data-back>‹ Back</button><h2>Trophy Cabinet</h2></div>
    <div class="qcard" style="text-align:center;margin-bottom:16px">
      <div style="font-size:14px;color:var(--muted)">Total correct answers</div>
      <div style="font-size:34px;font-weight:bold">🧠 ${S.totalCorrect}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">Best mock: ${S.bestMock}% · Level ${S.level}</div>
    </div>
    <div class="trophy-grid">${cards}</div>`);
  $('[data-back]').onclick=()=>{SFX.click();home();};
}

/* ============================================================
   16. SETTINGS
   ============================================================ */
function settings(){
  go(`<div class="sec-h"><button class="backbtn" data-back>‹ Back</button><h2>Settings</h2></div>
    <div class="setrow"><label>Your name</label><input type="text" id="nameInput" value="${S.name.replace(/"/g,'&quot;')}" maxlength="20"></div>
    <div class="setrow"><label>Sound effects</label><div class="toggle ${S.sound?'on':''}" id="soundToggle"><i></i></div></div>
    <div class="setrow"><label>Best mock score</label><span style="font-weight:bold">${S.bestMock}%</span></div>
    <div class="setrow"><label>Questions answered</label><span style="font-weight:bold">${S.totalAnswered}</span></div>
    <button class="danger-btn" id="resetBtn">Reset all progress</button>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:14px">psst… try triple-tapping the ${CONFIG.MASCOT} 🤫</p>`);
  $('[data-back]').onclick=()=>{SFX.click();home();};
  $('#nameInput').oninput=e=>{ S.name=e.target.value.trim()||CONFIG.PLAYER_NAME; save(); refreshTop(); };
  $('#soundToggle').onclick=function(){ S.sound=!S.sound; this.classList.toggle('on',S.sound); save(); refreshTop(); if(S.sound)SFX.correct(); };
  $('#resetBtn').onclick=()=>{
    if(confirm('Reset all progress? This cannot be undone.')){
      const keepName=S.name; S=JSON.parse(JSON.stringify(DEFAULT_STATE)); S.name=keepName; save(); refreshTop();
      toast('🔄','Progress reset'); settings();
    }
  };
}

/* ============================================================
   17. SECRET KONAMI CODE (↑↑↓↓←→←→ B A)  — desktop easter egg
   ============================================================ */
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
addEventListener('keydown',e=>{
  S.konami.push(e.key); S.konami=S.konami.slice(-KONAMI.length);
  if(KONAMI.join(',').toLowerCase()===S.konami.join(',').toLowerCase()){ S.konami=[]; secretReveal(); }
  // desktop number/letter answering
  if(quiz && !quiz.locked){
    const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    const k=e.key.toLowerCase();
    if(map[k]!==undefined){ const btns=[...document.querySelectorAll('.opt')]; if(btns[map[k]]) btns[map[k]].click(); }
  }
});

/* unlock audio on first interaction (iOS/Safari autoplay rules) */
function unlockAudio(){ const a=audio(); if(a&&a.state==='suspended') a.resume(); window.removeEventListener('pointerdown',unlockAudio); window.removeEventListener('keydown',unlockAudio); }
addEventListener('pointerdown',unlockAudio); addEventListener('keydown',unlockAudio);

document.getElementById('muteBtn').onclick=()=>{ S.sound=!S.sound; save(); refreshTop(); if(S.sound)SFX.correct(); };

/* ============================================================
   18. BOOT
   ============================================================ */
refreshTop(); home();
</script>
</body>
</html>
