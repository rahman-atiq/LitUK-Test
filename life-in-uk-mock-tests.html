<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f7f9fc; --ink:#111827; --muted:#5b6472;
  --line:#e5e9f0; --brand:#1e5eff; --brand-ink:#ffffff; --good:#12965a; --good-bg:#e5f6ee;
  --bad:#d63b46; --bad-bg:#fdeaec; --warn:#b8860b; --chip:#eef2f9; --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --ring:#1e5eff33; --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b22; --panel-2:#1b212b; --ink:#e6edf3; --muted:#9aa4b2;
  --line:#262d38; --brand:#4d82ff; --brand-ink:#ffffff; --good:#39d98a; --good-bg:#0f2a20;
  --bad:#ff6b74; --bad-bg:#2b1417; --warn:#e0b341; --chip:#212836; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --ring:#4d82ff44;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
/* Header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.brand .flag{font-size:22px}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:0}
.hubLink{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-weight:700;text-decoration:none}
.hubLink:hover{border-color:var(--brand);color:var(--brand)}
.spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--brand)}
.nav{display:flex;gap:4px}
.nav button{border:none;background:transparent;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.nav button:hover{background:var(--chip);color:var(--ink)}
.nav button.on{background:var(--brand);color:var(--brand-ink)}
/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
h1{font-size:22px;letter-spacing:-.02em;margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:12px}
.stat-row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{padding:14px 16px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .n.good{color:var(--good)} .stat .n.bad{color:var(--bad)} .stat .n.brand{color:var(--brand)}
/* Buttons */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;padding:11px 16px;border-radius:11px;cursor:pointer;font-size:14px;transition:.12s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
/* Actions */
.actions{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:16px 0}
/* Daily drill hero */
.drill{display:flex;gap:16px;align-items:center;padding:18px;margin:18px 0;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel));
  border:1px solid color-mix(in srgb,var(--brand) 32%,var(--line))}
.drill .emo{font-size:32px;flex:0 0 auto;line-height:1}
.drill .body{flex:1;min-width:0}
.drill .t{font-weight:800;font-size:16px;letter-spacing:-.01em}
.drill .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.drill .streak{flex:0 0 auto;text-align:center;padding-left:14px;border-left:1px solid var(--line)}
.drill .streak b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.drill .streak span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){
  .drill{flex-wrap:wrap;gap:12px}
  .drill .streak{padding-left:0;border-left:0;text-align:left}
  .drill .go{width:100%}
}
.act{display:flex;gap:12px;align-items:center;text-align:left;padding:16px}
.act .emo{font-size:24px}
.act .t{font-weight:700}
.act .d{color:var(--muted);font-size:12.5px}
/* Test grid */
.tests{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tcard{padding:14px;cursor:pointer;position:relative;transition:.12s;display:flex;flex-direction:column;gap:8px}
.tcard:hover{border-color:var(--brand);transform:translateY(-2px)}
.tcard .tt{font-weight:800;font-size:15px}
.tcard .meta{color:var(--muted);font-size:12px}
.badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
.badge.pass{background:var(--good-bg);color:var(--good)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.none{background:var(--chip);color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar.good > i{background:var(--good)} .bar.bad > i{background:var(--bad)}
/* Quiz */
.qtop{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.qtop .prog{flex:1;min-width:160px}
.chip{background:var(--chip);color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;border-radius:20px;white-space:nowrap}
.chip.topic{background:transparent;border:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.warn{color:var(--bad)}
.qtext{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.4;margin:6px 0 4px}
.hint{color:var(--muted);font-size:13px;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel-2);transition:.1s;user-select:none}
.opt:hover{border-color:var(--brand)}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;color:transparent;margin-top:1px}
.opt.multi .mark{border-radius:6px}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--panel-2))}
.opt.sel .mark{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .mark{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.locked{cursor:default}
.setopt{text-align:left;padding:12px 14px}
.setopt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--panel))}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px}
.opt .otext{flex:1}
.explain{margin-top:14px;padding:14px 15px;border-radius:12px;border-left:4px solid var(--brand);background:var(--panel-2);display:none}
.explain.show{display:block;animation:fade .2s}
.explain .verdict{font-weight:800;margin-bottom:4px}
.explain .verdict.good{color:var(--good)} .explain .verdict.bad{color:var(--bad)}
.explain .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.qnav{display:flex;gap:10px;margin-top:18px;align-items:center}
.qnav .spacer{flex:1}
.flagbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.flagbtn.on{color:var(--warn);border-color:var(--warn)}
/* Dot navigator */
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.dot.cur{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 2px var(--ring)}
.dot.ans{background:var(--chip);color:var(--ink)}
.dot.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.dot.flag{border-color:var(--warn)}
/* Results ring */
.result-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--chip) 0)}
.ring .inner{width:104px;height:104px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:30px;font-weight:800;line-height:1}
.ring .sc{font-size:12px;color:var(--muted);font-weight:700}
.verdict-big{font-size:24px;font-weight:800}
.verdict-big.good{color:var(--good)} .verdict-big.bad{color:var(--bad)}
/* Review list */
.rev{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.rev summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.rev .ic.ok{background:var(--good)} .rev .ic.no{background:var(--bad)}
.rev .body{padding:0 14px 14px 46px;border-top:1px solid var(--line)}
.rev[open] summary{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted);margin-left:auto}
/* Topic bars */
.tbar{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;margin:10px 0}
.tbar .tn{font-weight:600;font-size:13.5px}
.tbar .track{height:9px;border-radius:9px;background:var(--chip);overflow:hidden;grid-column:1/-1}
.tbar .track > i{display:block;height:100%;border-radius:9px}
.tbar .pctl{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.55);display:none;place-items:center;z-index:60;padding:16px}
.modal-bg.show{display:grid}
.modal{max-width:420px;width:100%;animation:pop .16s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .e{font-size:40px}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;font-family:inherit}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:70;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
select,input[type=text]{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
@media(max-width:560px){
  .brand small{display:none}
  h1{font-size:20px}
  .qtext{font-size:17px}
  .nav button{padding:8px 9px;font-size:13px}
}
</style>

<script>const DATA={"passmark":18,"topics":["A modern, thriving society","A long and illustrious history","The UK government, the law and your role","The Values and principles of the UK","What is the UK?"],"tests":[{"n":1,"name":"Life in the UK Test 1","q":[{"g":0,"t":"What is known as Lent?","e":"The 40 days before Easter are known as Lent.","p":0,"o":[["The 40 days before Easter",1],["The 40 days after Christmas",0],["The 40 days before Christmas",0],["The 40 days after Easter",0]]},{"g":1,"t":"Which country's flag is not part of the Union Flag?","e":"The Welsh dragon is not part of the Union Flag.","p":1,"o":[["Wales",1],["Ireland",0],["Scotland",0],["England",0]]},{"g":2,"t":"What is the judiciary responsible for?","e":"Judges, who are together called 'the judiciary', are responsible for interpreting the law and ensuring that trials are conducted fairly.","p":2,"o":[["Deciding whether a person is guilty",0],["Interpreting the law",1],["Looking after a jury",0],["Putting people in prison",0]]},{"g":3,"t":"When did the Habeas Corpus Act become law?","e":"The Habeas Corpus Act became law in 1679. This was a very important piece of legislation which remains relevant today. Habeas corpus is Latin for 'you must present the person in court'. The Act guaranteed that no one could be held prisoner unlawfully. Every prisoner has a right to a court hearing.","p":1,"o":[["1679",1],["1687",0],["1685",0],["1683",0]]},{"g":4,"t":"Which of the events is the bombing of English cities by the Germans?","e":"The Blitz was the German air force bombing London and other British cities at night-time. The phrase 'the Blitz spirit' is still used today to describe Britons pulling together in the face of adversity.","p":1,"o":[["The Blitz",1],["The Dunkirk spirit",0],["D-Day",0],["The Battle of Britain",0]]},{"g":5,"t":"Why is it called 'The Glorious Revolution'?","e":"This event was later called the 'Glorious Revolution' because there was no fighting in England and because it guaranteed the power of Parliament, ending the threat of a monarch ruling on his or her own as he or she wished.","p":1,"o":[["Women were given the right to vote",0],["Because there was no fighting",1],["Because of new technological advances",0],["Because of new achievements",0]]},{"g":6,"t":"Which of these venues is located in Greenwich?","e":"There are many large venues that host music events throughout the year, such as: The O2 in Greenwich and the Scottish Exhibition and Conference Centre (SECC) in Glasgow.","p":0,"o":[["The Copenhagen Concert Hall",0],["The SECC",0],["The O2",1],["Auditorio de Tenerife",0]]},{"g":7,"t":"When did the UK leave the EU following the Brexit Vote?","e":"The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957. The UK originally decided not to join this group but it became a member in 1973. After UK's Brexit vote in 2020, there are now 27 EU member states.","p":2,"o":[["1987",0],["2020",1],["1957",0],["1973",0]]},{"g":8,"t":"When was The First British Prime minister (Sir Robert Walpole) in power?","e":"The first man to be called 'Prime Minister' was Sir Robert Walpole, who was Prime Minister from 1721 to 1742.","p":1,"o":[["1707-1714",0],["1742-1746",0],["1721-1742",1],["1714-1721",0]]},{"g":9,"t":"Which country's national flower is a thistle?","e":"A thistle is a national flower of Scotland.","p":0,"o":[["Northern Ireland",0],["England",0],["Scotland",1],["Wales",0]]},{"g":10,"t":"Who developed ideas about economics during the Enlightenment period which are still referred to today?","e":"Many of the great thinkers of the Enlightenment were Scottish. Adam Smith developed ideas about economics which are still referred to today. David Hume's ideas about human nature continue to influence philosophers. Scientific discoveries, such as James Watt's work on steam power, helped the progress of the Industrial Revolution.","p":1,"o":[["Isaac Newton",0],["Adam Smith",1],["James Watt",0],["David Hume",0]]},{"g":11,"t":"One TV licence covers all of the equipment at one address, but people who rent different rooms in a shared house must buy a separate TV licence","e":"One TV licence covers all of the equipment at one address, but people who rent different rooms in a shared house must buy a separate TV licence","p":2,"o":[["False",0],["True",1]]},{"g":12,"t":"Magistrates and Justices of the Peace (JPs) are members of what?","e":"Magistrates and Justices of the Peace (JPs) are members of the local community. In England, Wales and Scotland they usually work unpaid and do not need legal qualifications. They receive training to do the job and are supported by a legal adviser.","p":2,"o":[["Local Community",1],["Police Force",0],["Ruling Party",0],["Law Society",0]]},{"g":13,"t":"A 2 minutes silence is observed on Easter to commemorate the death of Jesus Christ","e":"Remembrance Day, 11 November, commemorates those who died fighting for the UK and its allies. Originally it commemorated the dead of the First World War, which ended on 11 November 1918. People wear poppies (the red flower found on the battlefields of the First World War). At 11.00 am there is a two-minute silence and wreaths are laid at the Cenotaph in Whitehall, London.","p":0,"o":[["False",1],["True",0]]},{"g":14,"t":"Peers nominated by the Prime Minister can only serve for their lifetime","e":"Since 1958, the Prime Minister has had the power to nominate peers just for their own lifetime. These are called life peers. They have usually had an important career in politics, business, law or another profession. Life peers are appointed by the monarch on the advice of the Prime Minister.","p":2,"o":[["False",0],["True",1]]},{"g":15,"t":"Which TWO countries took part in the Battle of Agincourt?","e":"English kings also fought a long war with France, called the Hundred Years War (even though it actually lasted 116 years). One of the most famous battles of the Hundred Years War was the Battle of Agincourt in 1415, where King Henry V's vastly outnumbered English army defeated the French. The English left France in the 1450s.","p":1,"o":[["France",1],["Scotland",0],["Wales",0],["England",1]]},{"g":16,"t":"Who is credited with the introduction of the National Health Service (NHS) in 1948?","e":"In 1948, Aneurin (Nye) Bevan, the Minister for Health, led the establishment of the National Health Service (NHS), which guaranteed a minimum standard of health care for all, free at the point of use","p":1,"o":[["Winston Churchill",0],["Florence Nightingale",0],["David Hume",0],["Aneurin Bevan",1]]},{"g":17,"t":"The Speaker is an MP, he/she represents a constituency and deals with constituents' problems like any other MP","e":"The Speaker is neutral and does not represent a political party, even though he or she is an MP, represents a constituency and deals with constituents' problems like any other MP.","p":2,"o":[["False",0],["True",1]]},{"g":18,"t":"What religion were Puritans?","e":"Puritans, a group of Protestants who advocated strict and simple religious doctrine and worship.","p":1,"o":[["Buddhists",0],["Jews",0],["Protestants",1],["Catholics",0]]},{"g":19,"t":"Who can nominate life peers? (Select TWO)","e":"Since 1958, the Prime Minister has had the power to nominate peers just for their own lifetime. These are called life peers. Life peers are appointed by the monarch on the advice of the Prime Minister. They also include people nominated by the leaders of the other main political parties or by an independent Appointments Commission for non-party peers.","p":2,"o":[["Leaders of other main political parties",1],["The Prime Minister",1],["The Monarchy",0],["The Speaker",0]]},{"g":20,"t":"What country did Hitler invade in 1939?","e":"The British government tried to avoid another war. However, when Hitler invaded Poland in 1939, Britain and France declared war in order to stop his aggression.","p":2,"o":[["Italy",0],["USSR",0],["The USA",0],["Poland",1]]},{"g":21,"t":"Name the most famous cricket competition, which is a series of Test matches played between England and Australia","e":"The most famous competition is the Ashes, which is a series of Test matches played between England and Australia.","p":0,"o":[["Ashes",1],["Lords",0],["Masters",0],["Classics",0]]},{"g":22,"t":"In England & Wales, the small claims procedure is an informal way of helping people to settle minor disputes claims of less than?","e":"The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer. This procedure is used for claims of less than £10,000 in England and Wales; £5,000 in Scotland and £5,000 in Northern Ireland (Changed from £3000).","p":2,"o":[["£4,000",0],["£3,000",0],["£2,000",0],["£10,000",1]]},{"g":23,"t":"Which tribes invaded Britain after the Romans had left?","e":"The Roman army left Britain in AD 410 to defend other parts of the Roman Empire and never returned. Britain was again invaded by tribes from northern Europe: the Jutes, the Angles and the Saxons.","p":1,"o":[["The Normans",0],["The Vikings",0],["The Jutes and the Anglo-Saxons",1],["The Celtics",0]]}]},{"n":2,"name":"Life in the UK Test 2","q":[{"g":24,"t":"Roast beef is a traditional food of which country?","e":"Roast beef, which is served with potatoes is an example of English traditional food.","p":0,"o":[["England",1],["Northern Ireland",0],["Wales",0],["Scotland",0]]},{"g":25,"t":"Who can get a 50% discount on their TV licence?","e":"People over 75 can apply for a free TV licence and blind people can get a 50% discount.","p":0,"o":[["Blind people",1],["Army Officers",0],["Deaf people",0],["Students",0]]},{"g":26,"t":"Which languages were the basis of modern English?","e":"After the Norman Conquest, the king and his noblemen had spoken Norman French and the peasants had continued to speak Anglo-Saxon. Gradually these two languages combined to become one English language.","p":1,"o":[["Norman French and Celtic",0],["Norman French and Anglo Saxon",1],["Celtic and Anglo Saxon",0],["Gaelic and Celtic",0]]},{"g":27,"t":"How many members does The Northern Ireland Assembly have?","e":"The Northern Ireland Assembly was established soon after the Belfast Agreement (or Good Friday Agreement) in 1998. There is a power-sharing agreement which distributes ministerial Offices amongst the main parties. The Assembly has 90 elected members (reduced from 108 in 2016), known as MLAs (members of the Legislative Assembly). They are elected with a form of proportional representation. The Assembly is chaired by a Speaker and three deputy Speakers. At least 10 members (including the Speaker) must be present in order for a vote to be taken on any matter.","p":2,"o":[["90",1],["129",0],["119",0],["110",0]]},{"g":28,"t":"When did the first farmers arrive in Britain?","e":"The first farmers arrived in Britain about 6,000 years ago. The ancestors of these first farmers probably came from south-east Europe. These people built houses, tombs and monuments on the land.","p":1,"o":[["4,000 years ago",0],["6,000 years ago",1],["8,000 years ago",0],["10,000 years ago",0]]},{"g":29,"t":"Who was the 'Iron Duke' that defeated the Emperor Napoleon?","e":"In 1815, the French Wars ended with the defeat of the Emperor Napoleon by the Duke of Wellington at the Battle of Waterloo. Wellington was known as the Iron Duke and later became Prime Minister.","p":1,"o":[["Churchill",0],["Wellington",1],["Sir Christopher Wren",0],["Admiral Nelson",0]]},{"g":30,"t":"When did the Irish Free State become a republic?","e":"In 1922 Ireland became two countries. The six counties in the north which were mainly Protestant remained part of the UK under the name Northern Ireland. The rest of Ireland became the Irish Free State. It had its own government and became a republic in 1949.","p":1,"o":[["1922",0],["1949",1],["1937",0],["1931",0]]},{"g":31,"t":"Ulster fry is a traditional food of which country?","e":"Northern Ireland's traditional food is 'Ulster fry' - a fried meal with bacon, eggs, sausage, black pudding, white pudding, tomatoes, mushrooms, soda bread and potato bread.","p":0,"o":[["England",0],["Northern Ireland",1],["Wales",0],["Scotland",0]]},{"g":32,"t":"Who tells visitors about the history of the Tower of London?","e":"The Tower of London was first built by William the Conqueror after he became king in 1066. Tours are given by the Yeoman Warders, also known as Beefeaters, who tell visitors about the building's history. People can also see the Crown Jewels there.","p":0,"o":[["London Guides",0],["Beefeaters",1],["Instructors",0],["History graduates",0]]},{"g":33,"t":"Which TWO wives of Henry VIII were executed?","e":"Anne Boleyn was English. She and Henry had one daughter, Elizabeth. Anne was unpopular in the country and was accused of taking lovers. She was executed at the Tower of London. Catherine was a cousin of Anne Boleyn. She was also accused of taking lovers and executed.","p":1,"o":[["Jayne Seymour",0],["Catherine Howard",1],["Anne Boleyn",1],["Anne of Cleves",0]]},{"g":34,"t":"When did Ireland split into two countries?","e":"In 1921 a peace treaty was signed and in 1922 Ireland became two countries. The six counties in the north which were mainly Protestant remained part of the UK under the name Northern Ireland. The rest of Ireland became the Irish Free State. It had its own government and became a republic in 1949.","p":1,"o":[["1922",1],["1916",0],["1921",0],["1959",0]]},{"g":35,"t":"Volunteering is compulsory in the UK","e":"Volunteering is working for good causes without payment. It is not compulsory.","p":2,"o":[["True",0],["False",1]]},{"g":36,"t":"Nowadays, the House of Commons has more power than the House of Lords","e":"The House of Commons has powers to overrule the House of Lords, but these are not used often.","p":2,"o":[["False",0],["True",1]]},{"g":37,"t":"Select TWO popular social networking websites","e":"Social networking websites such as Facebook and Twitter are a popular way for people to stay in touch with friends, organise social events, and share photos, videos and opinions. Many people use social networking on their mobile phones when out and about.","p":0,"o":[["Twitter",1],["E-mail",0],["Facebook",1],["Telephone",0]]},{"g":38,"t":"What can 'Carry on' be associated with?","e":"The 1950s and 1960s were a high point for British comedies, including Passport to Pimlico, The Ladykillers and, later, the Carry On films.","p":0,"o":[["Novels",0],["Art",0],["Films",1],["Music",0]]},{"g":39,"t":"How can you make a complaint about the Police? (Choose TWO)","e":"Anyone can make a complaint about the police by going to a police station or writing to the Chief Constable of the police force involved.","p":2,"o":[["Writing to the Chief Constable of the police force involved",1],["Going to a police station",1],["Visiting a council office",0],["Visiting the local polling places",0]]},{"g":40,"t":"Sir Edward Elgar is known for his famous music work - 'The Planets'","e":"More recently, important composers include Gustav Holst (1874-1934), whose work includes The Planets, a suite of pieces themed around the planets of the solar system. He adapted Jupiter, part of the Planets suite, as the tune for I vow to thee my country, a popular hymn in British churches.","p":0,"o":[["True",0],["False",1]]},{"g":41,"t":"What were the first Women's Social and Political Union group members called?","e":"Emmeline Pankhurst (1858-1928) was born in Manchester in 1858. She set up the Women's Franchise League in 1889, which fought to get the vote in local elections for married women. In 1903 she helped found the Women's Social and Political Union (WSPU). This was the first group whose members were called 'suffragettes'.","p":1,"o":[["Slaves",0],["House of Lords",0],["Rotten boroughs",0],["Suffragettes",1]]},{"g":42,"t":"What was the system of land ownership used by the Normans known as?","e":"The Normans used a system of land ownership known as feudalism. The king gave land to his lords in return for help in war. Landowners had to send certain numbers of men to serve in the army. Some peasants had their own land but most were serfs.","p":1,"o":[["The Magna Carta",0],["Feudalism",1],["Noble land",0],["Democracy",0]]},{"g":43,"t":"Who can only give 'advice, warn and encourage' about government matters?","e":"The monarch has regular meetings with the Prime Minister and can advice, warn and encourage, but the decisions on government policies are made by the Prime Minister and cabinet","p":1,"o":[["Members of the police",0],["Prime Minister",0],["The Monarch",1],["The Speaker",0]]},{"g":44,"t":"What awards event celebrates British theatre?","e":"The Laurence Olivier Awards take place annually at different venues in London. There are a variety of categories, including best director, best actor and best actress. The awards are named after the British actor Sir Laurence Olivier, later Lord Olivier, who was best known for his roles in various Shakespeare plays.","p":0,"o":[["The Brit Awards",0],["The Mercury Prize",0],["The Turner Prize",0],["The Laurence Olivier Awards",1]]},{"g":45,"t":"It is a legal requirement that men and women should not be discriminated against due to their gender or marital status","e":"UK laws ensure that people are not treated unfairly in any area of life or work because of their age, disability, sex, pregnancy and maternity, race, religion or belief, sexuality or marital status.","p":2,"o":[["False",0],["True",1]]},{"g":46,"t":"Catherine Howard was Anne Boleyn's cousin","e":"Catherine was a cousin of Anne Boleyn. She was also accused of taking lovers and executed.","p":1,"o":[["True",1],["False",0]]},{"g":47,"t":"Who is known as William the Conqueror?","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror.","p":1,"o":[["William, the Duke of Normandy",1],["William, the Duke of France",0],["William, the Duke of Edinburgh",0],["William, the Duke of Lion",0]]}]},{"n":3,"name":"Life in the UK Test 3","q":[{"g":48,"t":"What did Henry VII do?","e":"Henry VII wanted to make sure that England remained peaceful and that his position as king was secure. He deliberately strengthened the central administration of England and reduced the power of the nobles.","p":1,"o":[["Broke away from the Church of Rome",0],["Reduced the power of the nobles",1],["Restricted King's power",0],["Increased the power of the nobles",0]]},{"g":49,"t":"Which of these is not a music festival?","e":"The Edinburgh Festival takes place in Edinburgh, Scotland, every summer. The Fringe (One of the festivals) is a showcase of mainly theatre and comedy performances.","p":0,"o":[["The Fringe",1],["Creamfields",0],["Glastonbury",0],["V festival",0]]},{"g":50,"t":"Who is responsible for crime and immigration?","e":"Home Secretary is responsible for crime, policing and immigration.","p":2,"o":[["Foreign Secretary",0],["Home Secretary",1],["Chancellor of the Exchequer",0],["Secretary of State",0]]},{"g":51,"t":"When did the English civil war begin?","e":"Civil war between the king and Parliament could not now be avoided and began in 1642. The country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads).","p":1,"o":[["1646",0],["1640",0],["1641",0],["1642",1]]},{"g":52,"t":"In 1284 King Edward I of England introduced the Statute of Rhuddlan, which annexed Wales to the Crown of England.","e":"In 1284 King Edward I of England introduced the Statute of Rhuddlan, which annexed Wales to the Crown of England.","p":1,"o":[["True",1],["False",0]]},{"g":53,"t":"When were the Anglo-Saxon kingdoms established in England?","e":"By about AD 600, Anglo-Saxon kingdoms were established in Britain. These kingdoms were mainly in what is now England.","p":1,"o":[["By AD 500",0],["By AD 550",0],["By AD 600",1],["By AD 410",0]]},{"g":54,"t":"The Scottish Parliament (after the Magna Carta was established in England) was split into two estates: the Lords and the Commons","e":"In England, the nobility, great landowners and bishops sat in the House of Lords. Knights, who were usually smaller landowners, and wealthy people from towns and cities were elected to sit in the House of Commons. Only a small part of the population was able to join in electing the members of the Commons. In Scotland, the parliament had three Houses, called Estates: the Lords, the Commons and the Clergy.","p":1,"o":[["False",1],["True",0]]},{"g":55,"t":"What is the Shadow Cabinet?","e":"The leader of the opposition leads his or her party in pointing out what they see as the government's failures and weaknesses. The leader of the opposition also appoints senior opposition MPs to be 'shadow ministers'. They form the shadow cabinet and their role is to challenge the government and put forward alternative policies.","p":2,"o":[["The cabinet that is in trouble",0],["The cabinet where the Prime Minister had to resign",0],["Senior members of the main opposition party who 'shadow' Government ministers in different departments",1],["The name of the office of the Leader of the Opposition in the Parliament",0]]},{"g":56,"t":"Who wrote about their experiences in the First World War?","e":"Wilfred Owen and Siegfried Sassoon - were inspired to write about their experiences in the First World War.","p":0,"o":[["Lord Byron and John Masefield",0],["Wilfred Owen and William Blake",0],["Elizabeth and Robert Browning",0],["Wilfred Owen and Siegfried Sassoon",1]]},{"g":57,"t":"Discrimination in the workplace is a criminal offence","e":"An example of civil laws are disputes over wages and cases of unfair dismissal or discrimination in the workplace.","p":2,"o":[["True",0],["False",1]]},{"g":58,"t":"What is the Giant's Causeway made of?","e":"Located on the north-east coast of Northern Ireland, the Giant's Causeway is a land formation of columns made from volcanic lava. It was formed about 50 million years ago. There are many legends about the Causeway and how it was formed.","p":0,"o":[["Volcanic Lava",1],["Bronze",0],["Iron",0],["Stone",0]]},{"g":59,"t":"Conditions in Ireland in the 19th century were much better than in the rest of the UK","e":"Conditions in Ireland were not as good as in the rest of the UK. Two-thirds of the population still depended on farming to make their living, often on very small plots of land. Many depended on potatoes as a large part of their diet. In the middle of the century the potato crop failed, and Ireland suffered a famine. A million people died from disease and starvation.","p":1,"o":[["True",0],["False",1]]},{"g":60,"t":"Radar was developed by Scotsman Sir Robert Watson-Watt","e":"Radar was developed by Scotsman Sir Robert Watson-Watt (1892-1973), who proposed that enemy aircraft could be detected by radio waves. The first successful radar test took place in 1935.","p":0,"o":[["True",1],["False",0]]},{"g":61,"t":"When did the BBC begin the world's first regular TV service?","e":"The BBC started radio broadcasts in 1922 and began the world's first regular television service in 1936.","p":1,"o":[["1921",0],["1922",0],["1936",1],["1938",0]]},{"g":62,"t":"Satirical magazines began to be published in the 19th century. When was 'Punch' first published?","e":"Punch' was published for the first time in the 1840s","p":1,"o":[["1810s",0],["1870s",0],["1890s",0],["1840s",1]]},{"g":63,"t":"What destroyed London in year 1666?","e":"During Charles II's reign, in 1665, there was a major outbreak of plague in London. Thousands of people died, especially in poorer areas. The following year, a great fire destroyed much of the city, including many churches and St Paul's Cathedral.","p":3,"o":[["Nuclear Plant",0],["Fire",1],["Water",0],["Plague",0]]},{"g":64,"t":"Other than London universities, which university was credited with the discovery of the DNA molecule in 1953?","e":"The structure of the DNA molecule was discovered in 1953 through work at British universities in London and Cambridge. This discovery contributed to many scientific advances, particularly in medicine and fighting crime. Francis Crick (1916-2004), one of those awarded the Nobel Prize for this discovery, was British.","p":1,"o":[["Cambridge",1],["Oxford",0],["Edinburgh",0],["Aberdeen",0]]},{"g":65,"t":"During the reigns of Elizabeth I and James I, where did the English government encourage Scottish and English Protestants to settle?","e":"During the reigns of Elizabeth I and James I, many people in Ireland opposed rule by the Protestant government in England. There were a number of rebellions. The English government encouraged Scottish and English Protestants to settle in Ulster, the northern province of Ireland, taking over the land from Catholic landholders. These settlements were known as plantations.","p":1,"o":[["Cardiff",0],["Edinburgh",0],["East London",0],["Ulster",1]]},{"g":66,"t":"Which architectural style are the famous London buildings of the 19th century, such as the House of Parliament and St Pancras Station, associated with?","e":"In the 19th century, the medieval 'gothic' style became popular again. As cities expanded, many great public buildings were built in this style. The Houses of Parliament and St Pancras Station were built at this time, as were the town halls in cities such as Manchester and Sheffield.","p":1,"o":[["Gothic",1],["Indian",0],["Catholic",0],["Roman",0]]},{"g":67,"t":"What can the Laws made by the EU also be called?","e":"EU law is legally binding in the UK and all the other EU member states. European laws are called directives, regulations or framework decisions.","p":2,"o":[["Framework Decisions",0],["Regulations",0],["Directives",0],["All of these",1]]},{"g":68,"t":"Which TWO things happened when Mary Stuart's husband got murdered?","e":"The queen of Scotland, Mary Stuart (often now called 'Mary, Queen of Scots') was a Catholic. She was only a week old when her father died and she became queen. Much of her childhood was spent in France. When she returned to Scotland, she was the centre of a power struggle between different groups. When her husband was murdered, Mary was suspected of involvement and fled to England. She gave her throne to her Protestant son, James VI of Scotland. Mary was Elizabeth I's cousin and hoped that Elizabeth might help her, but Elizabeth suspected Mary of wanting to take over the English throne, and kept her a prisoner for 20 years. Mary was eventually executed, accused of plotting against Elizabeth I.","p":1,"o":[["She fled to France",0],["She gave her throne to Elizabeth I",0],["She was suspected of involvement in the murder",1],["She asked Elizabeth I for help",1]]},{"g":69,"t":"Whom did the serfs serve?","e":"The Normans used a system of land ownership known as feudalism. The king gave land to his lords in return for help in war. Landowners had to send certain numbers of men to serve in the army. Some peasants had their own land but most were serfs.","p":1,"o":[["Slaves",0],["Knights",0],["Peasants",0],["Lords",1]]},{"g":70,"t":"The Victoria Cross medal was introduced during which war?","e":"Queen Victoria introduced the Victoria Cross medal during the Crimean war. It honours acts of valour by soldiers.","p":1,"o":[["The First World War",0],["The Hundred Years War",0],["The Crimean War",1],["The Second World War",0]]},{"g":71,"t":"What is the 'Divine Right of Kings?","e":"Divine Right of Kings' is the idea that the king was directly appointed by God to rule. The king should be able to act without having to seek approval from Parliament.","p":1,"o":[["Increased power of the parliament",0],["The King was Appointed by God",1],["Reduced the power of the nobles",0],["Reduced the power of the King",0]]}]},{"n":4,"name":"Life in the UK Test 4","q":[{"g":72,"t":"Which of these UK landmarks is in Wales?","e":"Snowdonia is a national park in North Wales. It covers an area of 838 square miles. Its most well-known landmark is Snowdon, which is the highest mountain in Wales.","p":0,"o":[["The Lake District",0],["Snowdonia",1],["Loch Lomond",0],["The Giant's Causeway",0]]},{"g":73,"t":"What's the age requirement to drink wine with a meal with someone over 18?","e":"16 year olds can drink wine or beer with a meal in a hotel or restaurant as long as they are with someone over 18.","p":0,"o":[["21",0],["16",1],["17",0],["18",0]]},{"g":74,"t":"Who tried to arrest 5 parliamentary leaders from the House of Commons?","e":"Charles I entered the House of Commons and tried to arrest five parliamentary leaders, but they had been warned and were not there. This led to the English Civil war in 1642.","p":1,"o":[["Henry VII",0],["James I",0],["Charles I",1],["Henry VIII",0]]},{"g":75,"t":"When did Protestant ideas begin to spread?","e":"Protestant ideas gradually gained strength in England, Wales and Scotland during the 16th century.","p":1,"o":[["15th century",0],["16th century",1],["17th century",0],["18th century",0]]},{"g":76,"t":"What yearly event happens between Oxford and Cambridge Universities?","e":"Rowing is also popular, both as a leisure activity and as a competitive sport. There is a popular yearly race on the Thames between Oxford and Cambridge Universities.","p":0,"o":[["A game of Basketball",0],["A Rowing Race",1],["A Game of Football",0],["A Tennis Match",0]]},{"g":77,"t":"As per 2021 census, what percentage of the population in England and Wales doesn't follow a religion?","e":"The 2021 Census results released so far show 37% of people in England and Wales (from a total sampled 60 million) stated not to follow any religion. 46% of people identified themselves as Christian. Much smaller proportions identified themselves as Hindu (2%), Sikh (1%), Jewish or Buddhist (both around 0.5%), while 0.5% of people followed another religion.","p":0,"o":[["6%",0],["21%",0],["14%",0],["37%",1]]},{"g":78,"t":"People living in the UK must pay tax on which of the following TWO?","e":"People in the UK have to pay tax on their income, which includes: wages from paid employment; profits from self-employment, taxable benefits; pensions; income from property, savings and dividends.","p":2,"o":[["Payday Loans",0],["Income from property, savings and dividends",1],["Wages from paid employment",1],["Student Loans",0]]},{"g":79,"t":"Where were the first farmers that came to Britain from?","e":"The first farmers arrived in Britain about 6,000 years ago. The ancestors of these first farmers probably came from south-east Europe.","p":1,"o":[["South east Europe",1],["North Europe",0],["South west Europe",0],["North west Europe",0]]},{"g":80,"t":"D-Day is the day when the British evacuated the French from Normandy","e":"On 6 June 1944, allied forces landed in Normandy (this event is often referred to as 'D-Day').","p":1,"o":[["False",1],["True",0]]},{"g":81,"t":"Which TWO are Police duties?","e":"The job of the police in the UK is to: protect life and property; prevent disturbances (also known as keeping the peace); prevent and detect crime.","p":2,"o":[["Detect and prevent crime",1],["Misuse their authority",0],["Be corrupt",0],["Protect life and property",1]]},{"g":82,"t":"Where was Isaac Newton born?","e":"Born in Lincolnshire, eastern England, Isaac Newton first became interested in science when he studied at Cambridge University.","p":1,"o":[["Ireland",0],["Scotland",0],["Wales",0],["England",1]]},{"g":83,"t":"How many countries make up the EU?","e":"The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957. The UK originally decided not to join this group but it became a member in 1973. After the Brexit vote to leave in 2020, there are now 27 EU member states","p":2,"o":[["190",0],["54",0],["27",1],["15",0]]},{"g":84,"t":"Children's Hearings system is used in which country?","e":"In Scotland a system called the Children's Hearings System is used to deal with children and young people who have committed an offence. Northern Ireland has a system of youth conferencing to consider how a child should be dealt with when they have committed an offence.","p":2,"o":[["Northern Ireland",0],["England",0],["Wales",0],["Scotland",1]]},{"g":85,"t":"During the Bronze age people lived in roundhouses and buried their dead in tombs called round barrows","e":"The statement is true","p":1,"o":[["True",1],["False",0]]},{"g":86,"t":"What party won the General Election in 2010?","e":"In May 2010, and for the first time in the UK since February 1974, no political party won an overall majority in the General Election. The Conservative and Liberal Democrat parties formed a coalition and the leader of the Conservative Party, David Cameron, became Prime Minister.","p":2,"o":[["Liberal democrats",0],["None, Liberal Democrats and Conservative party formed a Coalition",1],["Tories",0],["Labour Party",0]]},{"g":87,"t":"Which TWO did the Romans establish in Britain?","e":"The Romans remained in Britain for 400 years. They built roads and public buildings, created a structure of law, and introduced new plants and animals","p":1,"o":[["Introduced new plants and animals",1],["Created a structure of law",1],["Introduced constitutional monarchy",0],["Introduced basic democracy",0]]},{"g":88,"t":"Robert the Bruce is associated with which country?","e":"In 1314 the Scottish, led by Robert the Bruce, defeated the English at the Battle of Bannockburn, and Scotland remained unconquered by the English.","p":1,"o":[["Ireland",0],["Scotland",1],["Wales",0],["England",0]]},{"g":89,"t":"What system can be used to complete a tax return if you are self-employed?","e":"For most people, the right amount of income tax is automatically taken from their income from employment by their employer and paid directly to HM Revenue Customs (HMRC), the government department that collects taxes. This system is called 'Pay As You Earn' (PAYE). If you are self-employed, you need to pay your own tax through a system called 'self-assessment', which includes completing a tax return.","p":2,"o":[["Self-checkout",0],["National Insurance contribution",0],["PAYE (Pay as you earn)",0],["Self-assessment",1]]},{"g":90,"t":"The London Eye is situated on the southern bank of which river?","e":"The London Eye is situated on the southern bank of the River Thames and is a Ferris wheel that is 443 feet (135 metres) tall. It was originally built as part of the UK's celebration of the new millennium and continues to be an important part of New Year celebrations.","p":0,"o":[["Clyde",0],["Tyburn",0],["Walbrook",0],["Thames",1]]},{"g":91,"t":"NSPCC is a charity for which of the following?","e":"Children - the National Society for the Prevention of Cruelty to Children (NSPCC); The homeless - Crisis and Shelter; Medical research charities - Cancer Research UK; Environmental charities- the National Trust and Friends of the Earth; Animals - People's Dispensary for Sick Animals (PDSA).","p":2,"o":[["Environment",0],["Old people",0],["Children",1],["Animals",0]]},{"g":92,"t":"After the Black Death, a new social class appeared, - owners of large areas of land. What were they called?","e":"New social classes appeared, including owners of large areas of land called 'the gentry', and people left the countryside to live in the towns. In the towns, growing wealth led to the development of a strong middle class.","p":1,"o":[["The Tudors",0],["The Clans",0],["The Gentry",1],["The Serfs",0]]},{"g":93,"t":"The Chartists are associated with the Civil War which took place in the 17th century","e":"In the 1830s and 1840s, a group called the Chartists campaigned for reform. They wanted six changes: for every man to have the vote; elections every year; for all regions to be equal in the electoral system; secret ballots; for any man to be able to stand as an MP; for MPs to be paid.","p":1,"o":[["False",1],["True",0]]},{"g":94,"t":"Mothering Sunday is the third Sunday in June","e":"Mothering Sunday (or Mother's Day) is the Sunday three weeks before Easter. Children send cards or buy gifts for their mothers.","p":0,"o":[["True",0],["False",1]]},{"g":95,"t":"In 1348, a disease, probably a form of plague, came to Britain. What was it called?","e":"In 1348, a disease, probably a form of plague, came to Britain. This was known as the Black Death. One third of the population of England died and a similar proportion in Scotland and Wales.","p":1,"o":[["White Death",0],["Black Death",1],["Malaria",0],["Giant Evil",0]]}]},{"n":5,"name":"Life in the UK Test 5","q":[{"g":96,"t":"Hadrian's Wall is a popular UNESCO World Heritage Site","e":"Parts of Hadrian's Wall, including the forts of Housesteads and Vindolanda, can still be seen. It is a popular area for walkers and is a UNESCO (United Nations Education, Scientific and Cultural Organization) World Heritage Site.","p":0,"o":[["True",1],["False",0]]},{"g":97,"t":"Who mapped the coast of Australia?","e":"Captain James Cook mapped the coast of Australia.","p":1,"o":[["Sir Francis Drake",0],["Sake Dean Mahomet",0],["James Cook",1],["Admiral Nelson",0]]},{"g":98,"t":"When did English become the official language for documents?","e":"By 1400, in England, official documents were being written in English, and English had become the preferred language of the royal court and Parliament.","p":1,"o":[["1451",0],["1554",0],["1400",1],["1502",0]]},{"g":99,"t":"What percentage of the total UK population lives in Wales?","e":"UK population is very unequally distributed over the four parts of the UK. Wales makes around 5%.","p":0,"o":[["1%",0],["5%",1],["10%",0],["20%",0]]},{"g":100,"t":"Who developed a radar?","e":"Radar was developed by Scotsman Sir Robert Watson-Watt (1892-1973), who proposed that enemy aircraft could be detected by radio waves. The first successful radar test took place in 1935.","p":1,"o":[["James Goodfellow",0],["Sir Robert Watson-Watt",1],["Patrick Steptoe",0],["Mary Peters",0]]},{"g":101,"t":"What is the capital of Northern Ireland?","e":"Belfast is the capital city of Northern Ireland.","p":0,"o":[["Edinburgh",0],["Cardiff",0],["Belfast",1],["London",0]]},{"g":102,"t":"As per 2021 survey, what percentage of Wales and England identified as Muslim?","e":"Islam is the second largest religion in the United Kingdom. The 2021 Census results released so far show a population of 3,868,133 (6.5%) in England and Wales (from a total sampled 60 million). 46% of people identified themselves as Christian. Much smaller proportions identified themselves as Hindu (2%), Sikh (1%), Jewish or Buddhist (both around 0.5%), 0.5% of people followed another religion and 37% stated not to follow any religion.","p":0,"o":[["11%",0],["16%",0],["6%",1],["2%",0]]},{"g":103,"t":"The Civil War in 1642 split the country into which two groups?","e":"Civil war between the king and Parliament could not now be avoided and began in 1642. The country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads).","p":1,"o":[["The landowners and the slaves",0],["House of Commons and House of Lords",0],["House of York and House of Lancaster",0],["The Roundheads and the Cavaliers",1]]},{"g":104,"t":"The small claims procedure in Northern Ireland is used for claims of less than what amount?","e":"The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer. This procedure is used for claims of less than £10,000 in England and Wales; £5,000 in Scotland and £5,000 in Northern Ireland (Changed from £3000).","p":2,"o":[["£5,000",1],["£10,000",0],["£20,000",0],["£1,000",0]]},{"g":105,"t":"Where was Emmeline Pankhurst born?","e":"Emmeline Pankhurst was born in Manchester in 1858. She set up the Women's Franchise League in 1889, which fought to get the vote in local elections for married women.","p":1,"o":[["Glasgow",0],["London",0],["Manchester",1],["Aberdeen",0]]},{"g":106,"t":"Which of these was said by Winston Churchill?","e":"All of these are examples of his speeches.","p":1,"o":[["I have nothing to offer but blood, toil, tears and sweat' only",0],["All of the these",1],["We shall never surrender' only",0],["Never in the field of human conflict was so much owed by so many to so few' only",0]]},{"g":107,"t":"Where is Snowdonia located?","e":"Snowdonia is a national park in North Wales. It covers an area of 838 square miles (2,170 square kilometres). Its most well-known landmark is Snowdon, which is the highest mountain in Wales.","p":0,"o":[["West England",0],["Scotland",0],["North England",0],["Wales",1]]},{"g":108,"t":"A 60 second silence is observed on the Remembrance Day","e":"Remembrance Day, 11 November, commemorates those who died fighting for the UK and its allies. Originally it commemorated the dead of the First World War, which ended on 11 November 1918. People wear poppies (the red flower found on the battlefields of the First World War). At 11.00 am there is a two-minute silence and wreaths are laid at the Cenotaph in Whitehall, London.","p":0,"o":[["True",0],["False",1]]},{"g":109,"t":"The European Convention on Human Rights is incorporated into UK law","e":"The Human Rights Act 1998 incorporated the European Convention on Human Rights into UK law. The government, public bodies and the courts must follow the principles of the Convention.","p":2,"o":[["False",0],["True",1]]},{"g":110,"t":"What should all new citizens do as part of the citizenship ceremony?","e":"New citizens swear or affirm loyalty to the Queen as part of the citizenship ceremony.","p":2,"o":[["Swear or affirm loyalty to the King (or Queen)",1],["Take ceremonial pictures",0],["Prepare and make an individual speech during the ceremony",0],["Sign passports and official citizenship certificates",0]]},{"g":111,"t":"One of the tribal leaders who fought against the Romans was Boudicca, the queen of the Iceni. What is it known as now?","e":"One of the tribal leaders who fought against the Romans was Boudicca, the queen of the Iceni in what is now eastern England. She is still remembered today and there is a statue of her on Westminster Bridge in London, near the Houses of Parliament.","p":1,"o":[["Northern England",0],["Southern England",0],["Western England",0],["Eastern England",1]]},{"g":112,"t":"Anyone who is on the electoral register and is aged 18-75 can be asked to serve on a jury","e":"As well as getting the right to vote, people on the electoral register are randomly selected to serve on a jury. Anyone who is on the electoral register and is aged 18 to 75 can be asked to do this. The age limit has been raised from 70 to 75 in Wales and England in 2016.","p":2,"o":[["True",1],["False",0]]},{"g":113,"t":"The Channel Islands are self-governing","e":"There are also several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called 'Crown dependencies'.","p":4,"o":[["False",0],["True",1]]},{"g":114,"t":"It is illegal for any person under the age of 18 to buy a Lottery ticket","e":"There is a National Lottery for which draws are made every week. You can enter by buying a ticket or a scratch card. People under 18 (Changed in 2021 from 16 to 18) are not allowed to participate in the National Lottery.","p":0,"o":[["True",1],["False",0]]},{"g":115,"t":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":0,"o":[["True",1],["False",0]]},{"g":116,"t":"The Commonwealth can suspend any of its members","e":"Membership is voluntary. The Commonwealth has no power over its members, although it can suspend membership.","p":2,"o":[["False",0],["True",1]]},{"g":117,"t":"The Proms is an eight-week summer season of what?","e":"The Proms is an eight-week summer season of orchestral (or solo instrumental) classical music that takes place in various venues, including the Royal Albert Hall in London. It has been organised by the British Broadcasting Corporation (BBC) since 1927. The Last Night of the Proms is the most well-known concert and (along with others in the series) is broadcast on television.","p":0,"o":[["Heavy metal music",0],["Orchestral classical music",1],["Underground Hip-Hop music",0],["Classic Pop music",0]]},{"g":118,"t":"Who built the Tower of London?","e":"The Tower of London was built by William the Conqueror after he became king in 1066.","p":1,"o":[["Henry VIII",0],["Henry VII",0],["William the Conqueror",1],["Oliver Cromwell",0]]},{"g":119,"t":"Who established the Church of England?","e":"To divorce his first wife, Henry VIII needed the approval of the Pope. When the Pope refused, Henry established the Church of England. In this new Church, the king, not the Pope, would have the power to appoint bishops and order how people should worship.","p":1,"o":[["Henry VII",0],["Henry VIII",1],["The Pope",0],["St George",0]]}]},{"n":6,"name":"Life in the UK Test 6","q":[{"g":120,"t":"Who was Queen Elizabeth II married to?","e":"Queen Elizabeth II reigned since her father's death in 1952, (she celebrated her Diamond Jubilee i.e. 60 years as queen) until she passed away in 2022. She was married to Prince Philip, the Duke of Edinburgh. Her eldest son, King Charles III (previously known as the Prince of Wales) became the sovereign monarch in 2022. His eldest son, heir to the throne, Prince William is the new Prince of Wales.","p":0,"o":[["Prince Philip",1],["Prince William",0],["Prince Harry",0],["King Charles III",0]]},{"g":121,"t":"When did the English Civil war begin?","e":"Civil war between the king and Parliament began in 1642. The country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads).","p":1,"o":[["1598",0],["1642",1],["1640",0],["1588",0]]},{"g":122,"t":"Who is Sir Chris Hoy?","e":"Sir Chris Hoy (1976-) is a Scottish cyclist who has won six gold and one silver Olympic medals. He has also won 11 world championship titles.","p":0,"o":[["A Scottish rower",0],["A Scottish cyclist",1],["A Scottish tennis player",0],["A Scottish runner",0]]},{"g":123,"t":"Who wrote the Canterbury Tales?","e":"In the years leading up to 1400, Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. The people decided to tell each other stories on the journey, and the poems describe the travellers and some of the stories they told called The Canterbury Tales.","p":1,"o":[["Geoffrey Chaucer",1],["J K Rowling",0],["Charles Dickens",0],["William Caxton",0]]},{"g":124,"t":"Who won gold medals for ice dancing at the Olympic Games in 1984?","e":"Jayne Torvill (1957-) and Christopher Dean (1958-) won gold medals for ice dancing at the Olympic Games in 1984 and in four consecutive world championships.","p":0,"o":[["Bobby Moore and Dame Kelly Holmes",0],["Jayne Torvill and Christopher Dean",1],["Peggy Fleming and Sasha Colin",0],["Tessa Virtue and Scott Moir",0]]},{"g":125,"t":"The Battle of Somme resulted in how many British casualties on the first day?","e":"One battle, the British attack on the Somme in July 1916, resulted in about 60,000 British casualties on the first day alone.","p":1,"o":[["140000",0],["120000",0],["40000",0],["60000",1]]},{"g":126,"t":"For how many years did Charles I raise money without Parliament's approval?","e":"For 11 years, Charles I found ways in which to raise money without Parliament's approval but eventually trouble in Scotland meant that he had to recall Parliament.","p":1,"o":[["10",0],["12",0],["11",1],["15",0]]},{"g":127,"t":"The burial place of one of the kings was at Sutton Hoo in modern Suffolk","e":"The burial place of one of the Anglo-Saxon kings was at Sutton Hoo in modern Suffolk. This king was buried with treasure and armour, all placed in a ship which was then covered by a mound of earth.","p":1,"o":[["True",1],["False",0]]},{"g":128,"t":"What is the National Citizen Service?","e":"There are many opportunities for young people to volunteer and receive accreditation which will help them to develop their skills. These include the National Citizen Service programme, which gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project.","p":2,"o":[["It provides free, independent, impartial advice on your rights and responsibilities",0],["It provides free, confidential and impartial advice on consumer issues",0],["It is a volunteering programme for young people who want to do voluntary development work abroad",0],["It helps you build your skills for work and life",1]]},{"g":129,"t":"Protestant Christian groups include Baptists, Methodists, Presbyterians and Quakers","e":"Protestant Christian groups in the UK are Baptists, Methodists, Presbyterians and Quakers. There are also other denominations of Christianity, the biggest of which is Roman Catholic.","p":1,"o":[["True",1],["False",0]]},{"g":130,"t":"Which of the options given below is not necessary for a new car?","e":"If your vehicle is over three years old, you must take it for a Ministry of Transport (MOT) test every year. It is an offence not to have an MOT certificate if your vehicle is more than three years old.","p":2,"o":[["Car insurance",0],["Road tax",0],["Seat belts",0],["MOT test",1]]},{"g":131,"t":"What is the BBC funded by?","e":"Money from TV licences goes to the BBC.","p":1,"o":[["The local council",0],["TV licences",1],["Advertisements",0],["The government",0]]},{"g":132,"t":"How many senior MPs get appointed by the Prime Minister to become ministers in charge of departments?","e":"The Prime Minister appoints about 20 senior MPs to become ministers in charge of departments. These include: Chancellor of the Exchequer: responsible for the economy; Home Secretary:responsible for crime, policing and immigration; Foreign Secretary: responsible for managing relationships with foreign countries; other ministers (called 'Secretaries of State') are responsible for subjects such as education, health and defence.","p":2,"o":[["20",1],["40",0],["5",0],["50",0]]},{"g":133,"t":"When was the Scottish Parliament formed?","e":"Since 1997, some powers have been devolved from the central government to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them. There has been a Welsh Assembly and a Scottish Parliament since 1999.","p":2,"o":[["1999",1],["1978",0],["1989",0],["1991",0]]},{"g":134,"t":"It is illegal to sell tobacco products such as cigarettes, cigars, roll-up tobacco to anyone under what age?","e":"It is illegal to sell tobacco products (for example, cigarettes, cigars, roll-up tobacco) to anyone under the age of 18.","p":2,"o":[["18",1],["16",0],["17",0],["21",0]]},{"g":135,"t":"People living and working in towns after Black Death led to the development of what?","e":"Following the Black Death, the smaller population meant there was less need to grow cereal crops. There were labour shortages and peasants began to demand higher wages. New social classes appeared, including owners of large areas of land (later called the gentry), and people left the countryside to live in the towns. In the towns, growing wealth led to the development of a strong middle class.","p":1,"o":[["Strong Middle Class",1],["Young Workforce",0],["Powerful Clans",0],["Slavery",0]]},{"g":136,"t":"£10 £20 £50 £100 are the only banknotes currently allowed in the UK","e":"The currency in the UK is the pound sterling (symbol £). There are 100 pence in a pound. The denominations (values) of currency are - coins: 1p, 2p, 5p, 10p, 20p, 50p, £1 and £2; notes: £5, £10, £20, £50.","p":2,"o":[["False",1],["True",0]]},{"g":137,"t":"When did the American Colonies declare their independence?","e":"In 1776, 13 American colonies declared their independence, stating that people had a right to establish their own governments. The colonists eventually defeated the British army and Britain recognised the colonies' independence in 1783.","p":1,"o":[["1776",1],["1783",0],["1733",0],["1749",0]]},{"g":138,"t":"Which of the following statements does NOT apply to the United Nations?","e":"The UK is part of the United Nations (UN), an international organisation with more than 190 countries as members. The UN was set up after the Second World War and aims to prevent war and promote international peace and security. There are 15 members on the UN Security Council, which recommends action when there are international crises and threats to peace. The UK is one of five permanent members of the Security Council.","p":2,"o":[["The UN has five members in total",1],["It was set up after the Second World War",0],["It aims to prevent war",0],["The UK is one of five permanent members of the UN Security Council",0]]},{"g":139,"t":"The Archbishop of Canterbury is the spiritual leader of the Church of England","e":"The spiritual leader of the Church of England is the Archbishop of Canterbury. The monarch has the right to select the Archbishop and other senior church officials, but usually the choice is made by the Prime Minister and a committee appointed by the Church. Several Church of England bishops sit in the House of Lords. The monarch is the head of state of the church.","p":1,"o":[["True",1],["False",0]]},{"g":140,"t":"The Speaker is elected by fellow MPs using the open ballot system","e":"The Speaker is chosen by other MPs in a secret ballot.","p":2,"o":[["True",0],["False",1]]},{"g":141,"t":"What was the name of the movement which protested against the Roman Catholic church during Henry VIII's time?","e":"During Henry III's reign, the Reformation was happening across Europe. This was a movement against the authority of the Pope and the ideas and practices of the Roman Catholic Church.","p":1,"o":[["The Reformation",1],["Glorious Revolution",0],["Rebellion of the Clans",0],["Holy Wars",0]]},{"g":142,"t":"What is the money limit for the small claims procedure in England and Wales?","e":"The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer. This procedure is used for claims of less than £10,000 in England and Wales; £5,000 in Scotland and £5,000 in Northern Ireland (Changed from £3000).","p":2,"o":[["£4,000",0],["£3,000",0],["£10,000",1],["£2,000",0]]},{"g":143,"t":"What is the responsibility that you have as a UK citizen?","e":"Flowing from the fundamental principles are responsibilities and freedoms which are shared by all those living in the UK and which we expect all residents to respect. If you wish to be a permanent resident or citizen of the UK, you should: respect and obey the law; respect the rights of others, including their right to their own opinions; treat others with fairness; look after yourself and your family; look after the area in which you live and the environment.","p":3,"o":[["Going to the cinema",0],["Look after yourself and your family",1],["Keeping an allotment",0],["Going to the library",0]]}]},{"n":7,"name":"Life in the UK Test 7","q":[{"g":144,"t":"Which flower is associated with England?","e":"A rose is the flower associated with England.","p":0,"o":[["Rose",1],["Shamrock",0],["Thistle",0],["Daffodil",0]]},{"g":145,"t":"Who was the first Briton to win the Olympic gold medal in the 10,000 meters?","e":"Mo Farah was the first British runner to win the gold medal in the 10 km.","p":0,"o":[["Mo Farah",1],["Sir Chris Hoy",0],["Bradley Wiggins",0],["David Weir",0]]},{"g":146,"t":"How many American colonies declared their independence in 1776?","e":"In 1776, 13 American colonies declared their independence, stating that people had a right to establish their own governments. The colonists eventually defeated the British army and Britain recognised the colonies' independence in 1783.","p":1,"o":[["7",0],["5",0],["13",1],["17",0]]},{"g":147,"t":"When is St Patrick's day?","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":0,"o":[["30th of November",0],["17th of March",1],["1st of March",0],["23rd of April",0]]},{"g":148,"t":"What university did Isaac Newton attend?","e":"Born in Lincolnshire, eastern England, Isaac Newton first became interested in science when he studied at Cambridge University. He became an important figure in the field. His most famous published work was Philosophiae Naturalis Principia Mathematica (Mathematical Principles of Natural Philosophy), which showed how gravity applied to the whole universe.","p":1,"o":[["London State University",0],["Cambridge",1],["Oxford",0],["Warwick",0]]},{"g":149,"t":"National Insurance is needed if you wish to work in the UK","e":"Almost everybody in the UK who is in paid work, including self-employed people, must pay National Insurance Contributions. The money raised from National Insurance Contributions is used to pay for state benefits and services such as the state retirement pension and the National Health Service (NHS).","p":2,"o":[["False",0],["True",1]]},{"g":150,"t":"What can be done to protect a person from being forced into a marriage, or to protect a person in a forced marriage?","e":"Forced Marriage Protection Orders were introduced in 2008 for England, Wales and Northern Ireland under the Forced Marriage (Civil Protection) Act 2007. Court orders can be obtained to protect a person from being forced into a marriage, or to protect a person in a forced marriage. Similar Protection Orders were introduced in Scotland in November 2011.","p":2,"o":[["Court orders can be obtained by a potential victim or someone acting for them",1],["Ask the priest to verify the identities",0],["Check the age of both people to make sure they are over 18",0],["Check the age of both people to make sure they are over 25",0]]},{"g":151,"t":"What can the Scottish Parliament do?","e":"The Scottish Parliament can pass laws for Scotland on all matters which are not specifically reserved to the UK Parliament. The matters on which the Scottish Parliament can legislate include: civil and criminal law, health, education, planning and additional tax-raising powers.","p":2,"o":[["May pass laws on anything in Scotland",0],["May pass laws on general economic policy",0],["May pass laws on foreign and defence affairs",0],["May pass legislation on anything not specifically reserved to the UK Parliament",1]]},{"g":152,"t":"Who designed the new St Paul's?","e":"In 1666, a great fire destroyed much of the city, including many churches and St Paul's Cathedral. London was rebuilt with a new St Paul's, which was designed by a famous architect, Sir Christopher Wren.","p":1,"o":[["Sir Christopher Wren",1],["Robert Adam",0],["Sir Edwin Lutyens",0],["Gertrude Jekyll",0]]},{"g":153,"t":"Where are the more serious civil cases dealt with in Scotland?","e":"More serious civil cases - for example, when a large amount of compensation is being claimed - are dealt with in the High Court in England, Wales and Northern Ireland. In Scotland, they are dealt with in the Court of Session in Edinburgh.","p":2,"o":[["Court of Session in Edinburgh",1],["High Court",0],["Peace Courts",0],["Sheriff Court",0]]},{"g":154,"t":"St George is the national saint of Northern Ireland","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":0,"o":[["False",1],["True",0]]},{"g":155,"t":"What is the name of the building where the Northern Irish Assembly meets?","e":"In Northern Ireland elected members, known as MLAs, meet in the Northern Ireland Assembly at Stormont, in Belfast.","p":2,"o":[["Holyrood",0],["Senedd",0],["Stormont",1],["Westminster",0]]},{"g":156,"t":"When was the Emancipation Act signed? It abolished slavery throughout the British Empire","e":"Along with other abolitionists (people who supported the abolition of slavery), William Wilberforce succeeded in turning public opinion against the slave trade. In 1807, it became illegal to trade slaves in British ships or from British ports, and in 1833 the Emancipation Act abolished slavery throughout the British Empire.","p":1,"o":[["1807",0],["1837",0],["1833",1],["1817",0]]},{"g":157,"t":"Magna Carta is Latin for what?","e":"In Latin Magna Carta means the Great Charter","p":1,"o":[["The Great Charter",1],["The Bible law",0],["The act of government",0],["The British Agreement",0]]},{"g":158,"t":"What were the Irish people who favoured complete independence from the UK known as?","e":"The Irish Nationalist movement had grown strongly through the 19th century. Some, such as the Fenians, favoured complete independence.","p":1,"o":[["Roundheads",0],["Fenians",1],["People of Ireland",0],["Cavaliers",0]]},{"g":159,"t":"Which religion did the Huguenots follow?","e":"Between 1680 and 1720 many refugees called Huguenots came from France. They were Protestants and had been persecuted for their religion. Many were educated and skilled and worked as scientists, in banking, or in weaving or other crafts.","p":1,"o":[["Protestantism",1],["Russian Orthodox",0],["Buddhism",0],["Catholicism",0]]},{"g":160,"t":"Robert Browning, William Blake and Lord Byron were all famous poets","e":"The statement is true","p":1,"o":[["True",1],["False",0]]},{"g":161,"t":"Which event is celebrated on the 5th of November each year?","e":"Bonfire Night, 5 November, is an occasion when people in Great Britain set off fireworks at home or in special displays. The origin of this celebration was an event in 1605, when a group of Catholics led by Guy Fawkes failed in their plan to kill the Protestant king with a bomb in the Houses of Parliament.","p":0,"o":[["A plot to blow up the Houses of Parliament in 1605",1],["The end of the Second World War",0],["The end of the First World War",0],["The defeat of the Spanish Armada",0]]},{"g":162,"t":"The jury decides on the penalty if the defendant is found guilty","e":"The jury has to listen to the evidence presented at the trial and then decide a verdict of 'guilty' or 'not guilty' based on what they have heard. In Scotland, a third verdict of 'not proven' is also possible. If the jury finds a defendant guilty, the judge decides on the penalty.","p":2,"o":[["False",1],["True",0]]},{"g":163,"t":"It is illegal for shops and businesses to not accept the banknotes of Northern Ireland and Scotland","e":"Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK. However, shops and businesses do not have to accept them.","p":2,"o":[["False",1],["True",0]]},{"g":164,"t":"The role and membership of the House of Lords has changed over the last 50 years","e":"The role and membership of the House of Lords has changed over the last 50 years.","p":2,"o":[["True",1],["False",0]]},{"g":165,"t":"Which TWO religions celebrate Diwali?","e":"Diwali normally falls in October or November and lasts for five days. It is often called the Festival of Lights. It is celebrated by Hindus and Sikhs. It celebrates the victory of good over evil and the gaining of knowledge. There are different stories about how the festival came about. There is a famous celebration of Diwali in Leicester.","p":0,"o":[["Hindu",1],["Islam",0],["Buddhism",0],["Sikh",1]]},{"g":166,"t":"What is the capital of Wales?","e":"Cardiff is the capital of Wales.","p":0,"o":[["Belfast",0],["London",0],["Edinburgh",0],["Cardiff",1]]},{"g":167,"t":"Who is the heir to the throne?","e":"The King's eldest son, Prince William (the Prince of Wales), is the heir to the throne.","p":2,"o":[["Prince George",0],["Prince Philip",0],["Prince Harry",0],["Prince William",1]]}]},{"n":8,"name":"Life in the UK Test 8","q":[{"g":168,"t":"Which Two British film actors have recently won Oscars?","e":"Recent British actors to have won Oscars include Colin Firth, Sir Anthony Hopkins, Dame Judi Dench, Kate Winslet and Tilda Swinton.","p":0,"o":[["Jackie Stewart",0],["Colin Firth",1],["Tilda Swinton",1],["Leonardo DiCaprio",0]]},{"g":169,"t":"What created the United Kingdom of Great Britain and Ireland?","e":"The Act of Union of 1800 created the United Kingdom of Great Britain and Ireland.","p":1,"o":[["The Act of Union",1],["The Act for the governments",0],["The Great Union",0],["The Great governments",0]]},{"g":170,"t":"What is the money limit for the small claims procedure in England and Wales?","e":"The small claims procedure is used for claims of less than £10,000 in England and Wales.","p":2,"o":[["£6,000",0],["£10,000",1],["£5,000",0],["£4,000",0]]},{"g":171,"t":"When did the 'Battle of Agincourt' take place?","e":"One of the most famous battles of the Hundred Years War was the Battle of Agincourt in 1415, where King Henry V's vastly outnumbered English army defeated the French. The English left France in the 1450s.","p":1,"o":[["1200",0],["1415",1],["1613",0],["1716",0]]},{"g":172,"t":"What is the Church of England usually known as in other countries?","e":"The official Church of the state is the Church of England, called the Anglican Church in other countries and the Episcopal Church in Scotland and the United States.","p":0,"o":[["The Anglican Church",1],["The Episcopal Church",0],["The State Church",0],["The Great Church",0]]},{"g":173,"t":"When was the Scottish Parliament established?","e":"There has been a Welsh Assembly and a Scottish Parliament since 1999.","p":2,"o":[["1999",1],["1997",0],["2000",0],["1998",0]]},{"g":174,"t":"During Slave trade, where did slaves primarily come from?","e":"Slaves came primarily from West Africa. Travelling on British ships in horrible conditions, they were taken to America and the Caribbean, where they were made to work on tobacco and sugar plantations.","p":1,"o":[["North Africa",0],["West Africa",1],["South Africa",0],["East Africa",0]]},{"g":175,"t":"Who is the Patron St of Wales?","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":0,"o":[["St George",0],["St Patrick",0],["St Andrew",0],["St David",1]]},{"g":176,"t":"What is the only major golf tournament held outside of the US?","e":"The Open Championship is the only 'Major' golf tournament held outside the United States. It is hosted by a different golf course every year.","p":0,"o":[["The English Premier League",0],["The Open Championship",1],["The Wimbledon Championship",0],["Royal Ascot",0]]},{"g":177,"t":"What is Richard Arkwright remembered for?","e":"Born in 1732, Arkwright originally trained and worked as a barber. He was able to dye hair and make wigs. When wigs became less popular, he started to work in textiles. He improved the original carding machine. Arkwright is particularly remembered for the efficient and profitable way that he ran his factories.","p":1,"o":[["Cutting hair",0],["Improving steam power",0],["Efficiently running factories",1],["Creating a carding machine",0
