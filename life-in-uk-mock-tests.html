ecurity; right to a fair trial; freedom of thought, conscience and religion; freedom of expression (speech).","p":2,"o":[["Freedom of forced labour",0],["Right to a fair trial",1],["Right to liberty and security",1],["Prohibition of life",0]]},{"g":1027,"t":"Rudyard Kipling was born in South Africa","e":"Rudyard Kipling was born in India in 1865 and later lived in India, the UK and the USA. He wrote books and poems set in both India and the UK. His poems and novels reflected the idea that the British Empire was a force for good. Kipling was awarded the Nobel Prize in Literature in 1907.","p":1,"o":[["False",1],["True",0]]},{"g":1028,"t":"When King Charles I tried to impose a revised Prayer Book on the Presbyterian Church in Scotland, which TWO events occurred?","e":"Charles I wanted the worship of the Church of England to include more ceremony and introduced a revised Prayer Book. He tried to impose this Prayer Book on the Presbyterian Church in Scotland and this led to serious unrest. A Scottish army was formed and Charles could not find the money he needed for his own army without the help of Parliament. In 1640, he recalled Parliament to ask it for funds. Many in Parliament were Puritans, a group of Protestants who advocated strict and simple religious doctrine and worship. They did not agree with the king's religious views and disliked his reforms of the Church of England. Parliament refused to give the king the money he asked for, even after the Scottish army invaded England.","p":1,"o":[["A Scottish army was formed and it invaded England",1],["King Charles I formed his own army without asking for help from Parliament",0],["Parliament only gave the money to King Charles when the Scottish army invaded England",0],["King Charles I recalled Parliament to ask it for funds to form his own army",1]]},{"g":1029,"t":"Which TWO are correct about Mary Stuart?","e":"The queen of Scotland, Mary Stuart (often now called 'Mary, Queen of Scots') was a Catholic. She was only a week old when her father died and she became queen. Much of her childhood was spent in France. When she returned to Scotland, she was the centre of a power struggle between different groups. When her husband was murdered, Mary was suspected of involvement and fled to England. She gave her throne to her Protestant son, James VI of Scotland. Mary was Elizabeth I's cousin and hoped that Elizabeth might help her, but Elizabeth suspected Mary of wanting to take over the English throne, and kept her a prisoner for 20 years. Mary was eventually executed, accused of plotting against Elizabeth I.","p":1,"o":[["She was Elizabeth I's sister",0],["She died of the Black Death",0],["She was only a week old when she became queen",1],["She spent much of her childhood in France",1]]},{"g":1030,"t":"The 39 steps was directed by David Lean in 1980","e":"The 39 Steps (1935), directed by Alfred Hitchcock","p":0,"o":[["True",0],["False",1]]},{"g":1031,"t":"What celebration takes place on the 25th of December each year?","e":"Christmas Day, 25 December, celebrates the birth of Jesus Christ. It is a public holiday. Many Christians go to church on Christmas Eve (24 December) or on Christmas Day itself.","p":0,"o":[["Father's Day",0],["Boxing Day",0],["Hogmanay",0],["Christmas Day",1]]}]},{"n":44,"name":"Life in the UK Test 44","q":[{"g":1032,"t":"How often are the General Elections held?","e":"MPs are elected at a General Election, which is held at least every five years.","p":2,"o":[["Every year",0],["Every 5 years",1],["Every 7 years",0],["Every 3 years",0]]},{"g":1033,"t":"How long is the Bayeux Tapestry?","e":"The Battle of Hastings is commemorated in a great piece of embroidery, known as the Bayeux Tapestry which is 70 meters long.","p":1,"o":[["3m",0],["40m",0],["12m",0],["70m",1]]},{"g":1034,"t":"Who invaded the Falkland Islands in 1982?","e":"In 1982, Argentina invaded the Falkland Islands, a British overseas territory in the South Atlantic.","p":1,"o":[["Spain",0],["Argentina",1],["Columbia",0],["Portugal",0]]},{"g":1035,"t":"Who first introduced James Bond?","e":"Ian Fleming's books introduced James Bond.","p":0,"o":[["J K Rowling",0],["Ian Fleming",1],["Charles Dickens",0],["JRR Tolkien",0]]},{"g":1036,"t":"Who is responsible for the economy?","e":"The Prime Minister appoints about 20 senior MPs to become ministers in charge of departments. These include: Chancellor of the Exchequer: responsible for the economy; Home Secretary:responsible for crime, policing and immigration; Foreign Secretary: responsible for managing relationships with foreign countries; other ministers (called 'Secretaries of State') are responsible for subjects such as education, health and defence.","p":2,"o":[["Chancellor of the Exchequer",1],["Secretary of State",0],["Foreign Secretary",0],["Home Secretary",0]]},{"g":1037,"t":"What was an important English export in the Middle Ages?","e":"English wool became a very important export in the middle ages. People came to England from abroad to trade and also to work. Many had special skills, such as weavers from France, engineers from Germany, glass manufacturers from Italy and canal builders from Holland.","p":1,"o":[["Glass",0],["Wool",1],["Stone",0],["Potatoes",0]]},{"g":1038,"t":"Who sat in the House of Commons in the Middle Ages?","e":"In the middle ages, the nobility, great landowners and bishops sat in the House of Lords. Knights, who were usually smaller landowners, and wealthy people from towns and cities were elected to sit in the House of Commons.","p":1,"o":[["Bishops",0],["Great Landowners",0],["The Nobility",0],["Knights",1]]},{"g":1039,"t":"Where can you find a solicitor in the UK?","e":"Solicitors are trained lawyers who give advice on legal matters. They take action for their clients and represent them in court. The Citizens Advice Bureau can give you names of local solicitors and which areas of law they specialise in. You can also get this information from the Law Society.","p":2,"o":[["By contacting the police",0],["The Citizens Advice Bureau",1],["Paying expensive Law firms to find one",0],["Go to one of the Youth Courts",0]]},{"g":1040,"t":"How many members does a jury have in Scotland?","e":"A jury is made up of members of the public chosen at random from the local electoral register (see The Electoral Register). In England, Wales and Northern Ireland a jury has 12 members, and in Scotland a jury has 15 members.","p":2,"o":[["12",0],["15",1],["18",0],["21",0]]},{"g":1041,"t":"The Commonwealth is made up of countries which were once part of the British Empire only","e":"The Commonwealth is an association of countries that support each other and work together towards shared goals in democracy and development. Most member states were once part of the British Empire, although a few countries which were not have also joined.","p":1,"o":[["False",1],["True",0]]},{"g":1042,"t":"During the civil war of 1455, what colour rose was the symbol of the House of Lancaster?","e":"In 1455, a civil war was begun to decide who should be king of England. It was fought between the supporters of two families: the House of Lancaster and the House of York. This war was called the Wars of the Roses, because the symbol of Lancaster was a red rose and the symbol of York was a white rose.","p":1,"o":[["Orange",0],["White",0],["Red and White",0],["Red",1]]},{"g":1043,"t":"Which TWO are famous British fashion designers?","e":"Britain has produced many great designers, from Thomas Chippendale (who designed furniture in the 18th century) to Clarice Cliff (who designed Art Deco ceramics) to Sir Terence Conran (a 20th-century interior designer). Leading fashion designers of recent years include Mary Quant, Alexander McQueen and Vivienne Westwood.","p":0,"o":[["Alexander McQueen",1],["Mary Quant",1],["Isambard Kingdom Brunel",0],["Robert Adam",0]]},{"g":1044,"t":"Which of these is correct?","e":"Rape in a romantic relationship and marriage is considered Marital Rape. This includes forced sex and sexual assault between spouses. It is an offense.","p":2,"o":[["Any man who forces a woman to have sex, including her husband, can be charged with rape",1],["Any man who forces a woman to have sex, excluding her husband, can be charged with rape",0]]},{"g":1045,"t":"In 1982, which country invaded the Falklands prompting UK to send its naval force in defense?","e":"In 1982, Argentina invaded the Falkland Islands, a British overseas territory in the South Atlantic. A naval task force was sent from the UK and military action led to the recovery of the islands.","p":1,"o":[["France",0],["Spain",0],["Belgium",0],["Argentina",1]]},{"g":1046,"t":"What service does the TV licence pay for?","e":"The money from TV licences is used to pay for the British Broadcasting Corporation (BBC).","p":0,"o":[["Freeview channels",0],["None of these",0],["Free radio and tv channels",0],["The BBC",1]]},{"g":1047,"t":"Who directed the British movie the Belles of St Trinian's in 1954?","e":"The Belles of St Trinian's (1954) was directed by Frank Launder","p":1,"o":[["David Lean",0],["Frank Launder",1],["Mary Peters",0],["Alfred Hitchcock",0]]},{"g":1048,"t":"Who was the first Archbishop of Canterbury?","e":"Missionaries from Ireland spread the religion in the north. The most famous of these were St Patrick, who would become the patron saint of Ireland, and St Columba, who founded a monastery on the island of Iona, off the coast of what is now Scotland. St Augustine led missionaries from Rome, who spread Christianity in the south. St Augustine became the first Archbishop of Canterbury.","p":1,"o":[["St George",0],["St Augustine",1],["St Patrick",0],["St Columba",0]]},{"g":1049,"t":"How many ski centres are there in Scotland?","e":"Skiing is increasingly popular in the UK. Many people go abroad to ski and there are also dry ski slopes throughout the UK. Skiing on snow may also be possible during the winter. There are five ski centres in Scotland, as well as Europe's longest dry ski slope near Edinburgh.","p":0,"o":[["13",0],["1",0],["2",0],["5",1]]},{"g":1050,"t":"Which TWO are 20th century British inventions?","e":"Britain and France developed Concorde, the world's only supersonic passenger aircraft. It first flew in 1969 and began carrying passengers in 1976. Concorde was retired from service in 2003. The television was developed by Scotsman John Logie Baird in the 1920s. In 1932 he made the first television broadcast between London and Glasgow.","p":0,"o":[["Aspirin",0],["AC motor",0],["Television",1],["Concorde",1]]},{"g":1051,"t":"When walking your dog in a public place, what must you ensure?","e":"A lot of people in the UK have pets such as cats or dogs. They might have them for company or because they enjoy looking after them. It is against the law to treat a pet cruelly or to neglect it. All dogs in public places must wear a collar showing the name and address of the owner. The owner is responsible for keeping the dog under control and for cleaning up after the animal in a public place.","p":2,"o":[["That your dog wears a special dog coat",0],["That your dog never strays more than 3 metres away from you",0],["That your dog does not come into contact with other dogs",0],["That your dog wears a collar showing the name and address of the owner",1]]},{"g":1052,"t":"Arranged marriages are allowed in the UK","e":"A marriage should be entered into with the full and free consent of both people involved. Arranged marriages, where both parties agree to the marriage, are acceptable in the UK.","p":2,"o":[["False",0],["True",1]]},{"g":1053,"t":"What lead the American colonies to declare their independence?","e":"By the 1760s, there were substantial British colonies in North America. The colonies were wealthy and largely in control of their own affairs. Many of the colonist families had originally gone to North America in order to have religious freedom. They were well educated and interested in ideas of liberty. The British government wanted to tax the colonies.","p":1,"o":[["The UK not providing enough health care",0],["The UK not sending enough money",0],["The UK wanting to tax the colonies",1],["The UK wanting to stop the slave trade",0]]},{"g":1054,"t":"What did Sir Frank Whittle invent in the 1930s?","e":"The jet engine was developed in Britain in the 1930s by Sir Frank Whittle (1907-96), a British Royal Air Force engineer Officer.","p":0,"o":[["Telephone",0],["Jet engine",1],["Ballpoint pen",0],["Computer",0]]},{"g":1055,"t":"Where is Tate Britain and Tate Modern located?","e":"Works by British and international artists are displayed in galleries across the UK. Some of the most well-known galleries are The National Gallery, Tate Britain and Tate Modern in London, the National Museum in Cardiff, and the National Gallery of Scotland in Edinburgh.","p":0,"o":[["Cardiff",0],["London",1],["Manchester",0],["Edinburgh",0]]}]},{"n":45,"name":"Life in the UK Test 45","q":[{"g":1056,"t":"For how long did England remain a republic?","e":"Britain had been a republic for 11 years.","p":1,"o":[["11 years",1],["14 years",0],["12 years",0],["10 years",0]]},{"g":1057,"t":"Where was one of the Anglo Saxon kings buried with treasure and armour?","e":"The burial place of one of the kings was at Sutton Hoo in modern Suffolk. This king was buried with treasure and armour, all placed in a ship which was then covered by a mound of earth. Scotland and Wales remained free of Anglo Saxon rule.","p":1,"o":[["Newcastle",0],["Kent",0],["London",0],["Suffolk",1]]},{"g":1058,"t":"When did the Glorious Revolution happen?","e":"In 1688, important Protestants in England asked William to invade England and proclaim himself king. When William reached England, there was no resistance. This event was later called the 'Glorious Revolution' because there was no fighting in England and because it guaranteed the power of Parliament, ending the threat of a monarch ruling on his or her own as he or she wished.","p":1,"o":[["1688",1],["1685",0],["1680",0],["1692",0]]},{"g":1059,"t":"Who designed the Cenotaph?","e":"Sir Edwin Lutyens was responsible for many war memorials throughout the world, including the Cenotaph in Whitehall. The Cenotaph is the site of the annual Remembrance Day service attended by the Queen and many others.","p":0,"o":[["Sir Christopher Wren",0],["Robert Adam",0],["Inigo Jones",0],["Sir Edwin Lutyens",1]]},{"g":1060,"t":"What service can you use to find a lawyer or a solicitor?","e":"The Citizens Advice Bureau can give you names of local solicitors and which areas of law they specialise in. You can also get this information from the Law Society.","p":2,"o":[["The Citizens Advice Bureau",1],["County Courts",0],["The Police",0],["NSPCC",0]]},{"g":1061,"t":"What is the longest distance on the mainland in the UK?","e":"The longest distance on the mainland is from John O'Groats on the north coast of Scotland to Land's End in the south-west corner of England. It is about 870 miles (approximately 1,400 kilometres).","p":0,"o":[["950 miles",0],["1400 miles",0],["1240 miles",0],["870 miles",1]]},{"g":1062,"t":"Haggis is a traditional food of which country?","e":"Scotland's food is Haggis - a sheep's stomach stuffed with offal, suet, onions and oatmeal.","p":0,"o":[["England",0],["Northern Ireland",0],["Scotland",1],["Wales",0]]},{"g":1063,"t":"Who appoints the local Chief Constable?","e":"PCCs (Police and Crime Commissioners) set local police priorities and the local policing budget. They also appoint the Chief Constable.","p":2,"o":[["The Prime Minister",0],["The Monarch",0],["The Speaker",0],["Police and Crime Commissioners",1]]},{"g":1064,"t":"Who took the title 'King of Ireland'?","e":"Henry VII and Henry VIII had extended English control outside the Pale. Henry VIII took the title 'King of Ireland' and English laws were introduced.","p":1,"o":[["James VI",0],["Henry VII",0],["Henry VIII",1],["Charles II",0]]},{"g":1065,"t":"Who was Robert Burns?","e":"Known in Scotland as 'The Bard', Robert Burns was a Scottish poet. Burns' best-known work is probably the song Auld Lang Syne, which is sung by people in the UK and other countries when they are celebrating the New Year (or Hogmanay as it is called in Scotland).","p":1,"o":[["English social reformer",0],["English barber",0],["Welsh portrait painter",0],["Scottish poet",1]]},{"g":1066,"t":"The Council of Europe has no power to make laws","e":"The Council of Europe is separate from the EU. It has 47 member countries, including the UK, and is responsible for the protection and promotion of human rights in those countries. It has no power to make laws but draws up conventions and charters, the most well-known of which is the European Convention on Human Rights and Fundamental Freedoms, usually called the European Convention on Human Rights.","p":2,"o":[["False",0],["True",1]]},{"g":1067,"t":"Which of the following is correct?","e":"The population is very unequally distributed over the four parts of the UK. England more or less consistently makes up 84% of the total population, Wales around 5%, Scotland just over 8% and Northern Ireland less than 3%.","p":0,"o":[["Northern Ireland makes up 4% of the total population",0],["England makes up 83% of the total population",0],["Wales makes up 6% of the total population",0],["Scotland makes up 8% of the total population",1]]},{"g":1068,"t":"What percentage of the UK population lives in England?","e":"England more or less consistently makes up 84% of the total population, Wales around 5%, Scotland just over 8% and Northern Ireland less than 3%.","p":0,"o":[["95%",0],["84%",1],["71%",0],["62%",0]]},{"g":1069,"t":"The people of which age made the first coins to be minted in Britain?","e":"The people of the Iron Age had a sophisticated culture and economy. They made the first coins to be minted in Britain, some inscribed with the names of Iron Age kings. This marks the beginnings of British history.","p":1,"o":[["Iron Age",1],["Bronze Age",0],["Gold Age",0],["Stone Age",0]]},{"g":1070,"t":"As per 2021 census, what is the percentage of Muslims living in England and Wales?","e":"Islam is the second largest religion in the United Kingdom. The 2021 Census results released so far show a population of 3,868,133 (6.5%) in England and Wales (from a total sampled 60 million). 46% of people identified themselves as Christian. Much smaller proportions identified themselves as Hindu (2%), Sikh (1%), Jewish or Buddhist (both around 0.5%), 0.5% of people followed another religion and 37% stated not to follow any religion.","p":0,"o":[["1%",0],["15%",0],["11%",0],["6%",1]]},{"g":1071,"t":"Northern Ireland and Scotland have their own banknotes valid everywhere in the UK","e":"Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK. However, shops and businesses do not have to accept them.","p":0,"o":[["True",1],["False",0]]},{"g":1072,"t":"Who governs the Church of Scotland?","e":"In Scotland, the national Church is the Church of Scotland, which is a Presbyterian Church. It is governed by ministers and elders. The chairperson of the General Assembly of the Church of Scotland is the Moderator, who is appointed for one year only and often speaks on behalf of that Church.","p":0,"o":[["The Archbishop of Canterbury",0],["Ministers and elders",1],["The Pope",0],["Local Authorities",0]]},{"g":1073,"t":"In what year was there a revolution in France which led to a war with Britain?","e":"During the 18th century, Britain fought a number of wars with France. In 1789, there was a revolution in France and the new French government soon declared war on Britain. Napoleon, who became Emperor of France, continued the war.","p":1,"o":[["1679",0],["1298",0],["1097",0],["1789",1]]},{"g":1074,"t":"Which language was spoken by people during the Iron Age?","e":"Most Iron age people were farmers, craft workers or warriors. The language they spoke was part of the Celtic language family.","p":1,"o":[["Norman French",0],["Celtic",1],["English",0],["Anglo-Saxon",0]]},{"g":1075,"t":"What do the Brit Awards celebrate?","e":"The Brit Awards is an annual event that gives awards in a range of categories, such as best British group and best British solo artist.","p":0,"o":[["Movies",0],["Art",0],["Music",1],["Theatre",0]]},{"g":1076,"t":"When did the English settlers first begin to colonise the eastern coast of America?","e":"In Elizabeth I's time, English settlers first began to colonise the eastern coast of America. This colonisation, particularly by people who disagreed with the religious views of the next two kings, greatly increased in the next century.","p":1,"o":[["In Diana's time",0],["In Elizabeth I's time",1],["In William I's time",0],["In Mary I's time",0]]},{"g":1077,"t":"Which of these is a Crown Dependency of the UK and not a part of it?","e":"There are also several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called 'Crown dependencies'. There are also several British overseas territories in other parts of the world, such as St Helena and the Falkland Islands. They are also linked to the UK but are not a part of it.","p":4,"o":[["St Helena",0],["Channel Islands",1],["Falkland Islands",0],["Wales",0]]},{"g":1078,"t":"What is the judiciary responsible for?","e":"Judges, who are together called 'the judiciary', are responsible for interpreting the law and ensuring that trials are conducted fairly.","p":2,"o":[["Looking after a jury",0],["Interpreting the law",1],["Deciding whether a person is guilty",0],["Putting people in prison",0]]},{"g":1079,"t":"Why was Mary known as 'Bloody Mary'?","e":"Mary was a devout Catholic and persecuted Protestants.","p":1,"o":[["She put her sister in prison",0],["She persecuted Protestants",1],["She fought in numerous battles",0],["She killed her father",0]]}]}]};</script>
<script>
/* ============ STATE ============ */
const LS='lituk_v1';
const DEFAULT={tests:{},topics:{},mistakes:{},flags:{},answered:0,correct:0,attempts:0,passes:0,history:[],
  sr:{},                                   /* g -> {box,due,seen,last} spaced repetition */
  drill:{last:null,streak:0,best:0}};      /* daily drill streak */
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(LS));return Object.assign(structuredClone(DEFAULT),r||{})}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(LS,JSON.stringify(S))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* Build flat question index by global id */
const QByG={};
DATA.tests.forEach(t=>t.q.forEach(q=>{QByG[q.g]=q;q._test=t.n}));
const ALLQ=Object.values(QByG);
const PASSMARK=DATA.passmark;
const TOPICS=DATA.topics;

/* ============ THEME ============ */
function themeBtnLabel(){document.getElementById('themeBtn').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙'}
function toggleTheme(){LitUK.toggleTheme();themeBtnLabel()}
document.addEventListener('lituk:theme',themeBtnLabel);
themeBtnLabel();

/* ============ HELPERS ============ */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const correctIdx=q=>q.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);
const eqSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function testStat(n){return S.tests[n]||{best:null,attempts:0,lastPass:null}}
function go(v){
  ['dashboard','quiz','results','mistakes','stats'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);
  if(v==='dashboard')renderDashboard();
  if(v==='mistakes')renderMistakes();
  if(v==='stats')renderStats();
}

/* ============ DASHBOARD ============ */
function drillCard(){
  const plan=drillPlan();
  const due=plan.filter(p=>p.why==='due').length;
  const fix=plan.filter(p=>p.why==='mistake').length;
  const fresh=plan.filter(p=>p.why==='new').length;
  const done=drillDoneToday();
  const streak=(S.drill&&S.drill.streak)||0;
  const bits=[due?`${due} due for review`:'',fix?`${fix} to fix`:'',fresh?`${fresh} new`:''].filter(Boolean);
  return `<div class="card drill">
    <div class="emo">${done?'✅':'🔥'}</div>
    <div class="body">
      <div class="t">Daily drill${done?' — done today':''}</div>
      <div class="d">${plan.length} questions · ${bits.join(' · ')||'a fresh mix'}</div>
    </div>
    ${streak?`<div class="streak"><b>${streak}</b><span>day${streak===1?'':'s'}</span></div>`:''}
    <button class="btn primary go" onclick="startDrill()">${done?'Go again':'Start drill'} →</button>
  </div>`;
}
function renderDashboard(){
  const passed=Object.values(S.tests).filter(t=>t.lastPass).length;
  const acc=S.answered?Math.round(S.correct/S.answered*100):0;
  const mastered=Object.values(S.mistakes).filter(m=>m.done).length;
  const openMistakes=Object.values(S.mistakes).filter(m=>!m.done).length;
  const el=document.getElementById('view-dashboard');
  el.innerHTML=`
    <h1>Your dashboard</h1>
    <p class="sub">45 official-style mock tests · 24 questions each · 75% to pass.</p>
    ${drillCard()}
    <div class="grid stat-row">
      <div class="card stat"><div class="n brand">${passed}<span style="font-size:16px;color:var(--muted)">/45</span></div><div class="l">Tests passed</div></div>
      <div class="card stat"><div class="n ${acc>=75?'good':acc?'bad':''}">${acc}%</div><div class="l">Overall accuracy</div></div>
      <div class="card stat"><div class="n">${S.attempts}</div><div class="l">Attempts taken</div></div>
      <div class="card stat"><div class="n ${openMistakes?'bad':'good'}">${openMistakes}</div><div class="l">Mistakes to review</div></div>
    </div>
    <div class="grid actions">
      <button class="card act" onclick="startExam()"><span class="emo">🎲</span><div><div class="t">Random exam</div><div class="d">24 mixed questions, timed</div></div></button>
      <button class="card act" onclick="go('mistakes')"><span class="emo">🎯</span><div><div class="t">Practice mistakes</div><div class="d">${openMistakes} question${openMistakes===1?'':'s'} to fix</div></div></button>
      <button class="card act" onclick="topicPicker()"><span class="emo">📚</span><div><div class="t">Practice by topic</div><div class="d">Target a weak area</div></div></button>
    </div>
    <div class="btn-row" style="margin:8px 0 14px;align-items:center">
      <b style="margin-right:auto">All mock tests</b>
      <button class="chip" style="cursor:pointer;border:1px solid var(--line)" onclick="openSettings()">⚙️ ${prefs.feedback==='instant'?'Instant feedback':'Answers at end'} · ${prefs.shufQ?'Shuffled':'In order'}</button>
    </div>
    <div class="grid tests">
      ${DATA.tests.map(t=>{const st=testStat(t.n);const pct=st.best!=null?Math.round(st.best/24*100):0;
        const badge=st.best==null?'<span class="badge none">New</span>':st.lastPass?'<span class="badge pass">Passed</span>':'<span class="badge fail">Retry</span>';
        return `<div class="card tcard" onclick="startTest(${t.n})">
          ${badge}
          <div class="tt">Test ${t.n}</div>
          <div class="meta">${st.best!=null?`Best ${st.best}/24`:'Not attempted'}${st.attempts?` · ${st.attempts}×`:''}</div>
          <div class="bar ${st.best==null?'':st.lastPass?'good':'bad'}"><i style="width:${pct}%"></i></div>
        </div>`}).join('')}
    </div>`;
}

/* ============ PREFS ============ */
let prefs=Object.assign({shufQ:true,shufO:true,feedback:'instant'},JSON.parse(localStorage.getItem('lituk_prefs')||'{}'));
function savePrefs(){localStorage.setItem('lituk_prefs',JSON.stringify(prefs))}

/* ============ SESSION ============ */
let sess=null;
function makeSession(qs,{title,timed,testN=null,source='custom'}){
  let list=qs.slice();
  if(prefs.shufQ && source!=='mistakes')list=shuffle(list);
  const instant=prefs.feedback==='instant';
  sess={instant,title,timed,testN,source,idx:0,
    items:list.map(q=>{
      let order=q.o.map((_,i)=>i);
      if(prefs.shufO)order=shuffle(order);
      return {q,order,picked:[],checked:false};
    }),
    startTs:Date.now(),endTs:null,remain:timed?45*60:null};
  if(timed)startTimer();
  go('quiz');renderQuiz();
}
function startTest(n){const t=DATA.tests.find(x=>x.n===n);makeSession(t.q,{title:`Test ${n}`,timed:true,testN:n,source:'test'})}
function startExam(){makeSession(shuffle(ALLQ).slice(0,24),{title:'Random exam',timed:true,source:'random'})}
function practiceMistakes(){
  const ids=Object.entries(S.mistakes).filter(([g,m])=>!m.done).map(([g])=>QByG[g]).filter(Boolean);
  if(!ids.length){toast('No mistakes to review 🎉');return}
  makeSession(ids,{title:'Mistake practice',timed:false,source:'mistakes'});
}
function startTopic(tp){const qs=ALLQ.filter(q=>q.p===tp);makeSession(shuffle(qs).slice(0,24),{title:TOPICS[tp],timed:false,source:'topic'})}

/* ============ DAILY DRILL ============
   20 questions: whatever spaced repetition says is due, then your open
   mistakes, then fresh questions from your weakest topic. */
const DRILL_N=20;
function weakestTopics(){
  return TOPICS.map((n,i)=>{const s=S.topics[i]||{seen:0,correct:0};
    return{i,pct:s.seen?s.correct/s.seen:0,seen:s.seen}})
    .sort((a,b)=>(a.seen?a.pct:2)-(b.seen?b.pct:2)).map(t=>t.i);
}
function drillPlan(){
  const now=Date.now(),picked=[],taken=new Set();
  const add=(g,why)=>{if(taken.has(g)||!QByG[g]||picked.length>=DRILL_N)return;taken.add(g);picked.push({q:QByG[g],why})};

  srDue(now).slice(0,12).forEach(g=>add(+g,'due'));
  Object.entries(S.mistakes).filter(([,m])=>!m.done)
    .sort((a,b)=>(b[1].count||0)-(a[1].count||0)).forEach(([g])=>{if(picked.length<16)add(+g,'mistake')});
  for(const tp of weakestTopics()){
    if(picked.length>=DRILL_N)break;
    shuffle(ALLQ.filter(q=>q.p===tp&&!S.sr[q.g])).forEach(q=>add(q.g,'new'));
  }
  shuffle(ALLQ).forEach(q=>add(q.g,'new'));   /* nothing new left → anything */
  return picked;
}
function dayKey(d){d=d?new Date(d):new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function drillDoneToday(){return S.drill&&S.drill.last===dayKey()}
function startDrill(){
  const plan=drillPlan();
  if(!plan.length){toast('Nothing to drill yet');return}
  makeSession(plan.map(p=>p.q),{title:'Daily drill',timed:false,source:'drill'});
}
function noteDrillDone(){
  const t=dayKey(),y=dayKey(Date.now()-DAY);
  if(!S.drill)S.drill={last:null,streak:0,best:0};
  if(S.drill.last===t)return;
  S.drill.streak=S.drill.last===y?(S.drill.streak||0)+1:1;
  S.drill.last=t;
  S.drill.best=Math.max(S.drill.best||0,S.drill.streak);
}

/* ============ TIMER ============ */
let timerInt=null;
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{
  if(!sess||!sess.timed)return;
  sess.remain--;
  const t=document.getElementById('timer');
  if(t){t.textContent=fmt(sess.remain);t.classList.toggle('warn',sess.remain<=60)}
  if(sess.remain<=0){clearInterval(timerInt);toast("Time's up!");finishQuiz()}
},1000)}
function fmt(s){s=Math.max(0,s);return`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

/* ============ QUIZ RENDER ============ */
function renderQuiz(){
  const it=sess.items[sess.idx],q=it.q,ci=correctIdx(q),multi=ci.length>1;

      ${sess.timed?`<span class="chip timer" id="timer">${fmt(sess.remain)}</span>`:''}
      <button class="flagbtn ${S.flags[q.g]?'on':''}" id="flagBtn" onclick="toggleFlag(${q.g})">${S.flags[q.g]?'★ Flagged':'☆ Flag'}</button>

            <span class="mark">${multi?(sel?'✓':''):String.fromCharCode(65+pos)}</span>
            <span class="otext">${esc(q.o[oi][0])}</span>

      </div>
      <div class="explain" id="explain"></div>
    </div>
    <div class="qnav">

      <div class="spacer"></div>
      ${sess.instant && !it.checked
        ? `<button class="btn primary" id="mainBtn" onclick="checkQ()">Check answer</button>`
        : (sess.idx<sess.items.length-1
            ? `<button class="btn primary" id="mainBtn" onclick="nextQ()">Next →</button>`
            : `<button class="btn primary" id="mainBtn" onclick="finishQuiz()">Finish (${answeredCount}/${sess.items.length})</button>`)}

      ${sess.items.map((x,i)=>{let c='dot';if(i===sess.idx)c+=' cur';

        if(S.flags[x.q.g])c+=' flag';

function pick(oi){
  const it=sess.items[sess.idx];if(it.checked)return;
  const multi=correctIdx(it.q).length>1;
  if(multi){const k=it.picked.indexOf(oi);k>=0?it.picked.splice(k,1):it.picked.push(oi)}
  else it.picked=[oi];
  // update selection visuals without full re-render
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const s=it.picked.includes(+o.dataset.oi);o.classList.toggle('sel',s);
    if(multi)o.querySelector('.mark').textContent=s?'✓':'';
  });
  // auto-advance in exam single-choice? no — let user move. But refresh dot + finish count
  if(!sess.instant)refreshDots();
}
function refreshDots(){
  document.querySelectorAll('.dots .dot').forEach((d,i)=>{
    d.className='dot'+(i===sess.idx?' cur':'')+(sess.items[i].picked.length&&!sess.items[i].checked?' ans':'')
      +(sess.items[i].checked?(sess.items[i]._correct?' ok':' no'):'')+(S.flags[sess.items[i].q.g]?' flag':'');
  });
  const mb=document.getElementById('mainBtn');
  if(mb&&sess.idx===sess.items.length-1&&!sess.instant){const a=sess.items.filter(x=>x.picked.length).length;mb.textContent=`Finish (${a}/${sess.items.length})`}
}
function checkQ(){
  const it=sess.items[sess.idx];if(!it.picked.length){toast('Pick an answer first');return}
  it.checked=true;
  const ci=correctIdx(it.q);
  it._correct=eqSet(it.picked,ci);
  recordAnswer(it.q,it._correct);
  paintCheck();
  // swap button to Next/Finish
  renderQuiz();
}
function paintCheck(){
  const it=sess.items[sess.idx],ci=correctIdx(it.q);
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const oi=+o.dataset.oi;o.classList.add('locked');o.onclick=null;
    if(ci.includes(oi))o.classList.add('correct');
    else if(it.picked.includes(oi))o.classList.add('wrong');
    o.querySelector('.mark').textContent=ci.includes(oi)?'✓':(it.picked.includes(oi)?'✕':o.querySelector('.mark').textContent);
  });
  const ex=document.getElementById('explain');
  ex.className='explain show';
  ex.innerHTML=`<div class="verdict ${it._correct?'good':'bad'}">${it._correct?'✓ Correct':'✕ Not quite'}</div>
    <div class="lbl">Explanation</div><div>${esc(it.q.e||'—')}</div>`;
}
function toggleFlag(g){S.flags[g]?delete S.flags[g]:S.flags[g]=1;save();
  const b=document.getElementById('flagBtn');const on=!!S.flags[g];
  b.classList.toggle('on',on);b.textContent=on?'★ Flagged':'☆ Flag';refreshDots()}
function prevQ(){if(sess.idx>0){sess.idx--;renderQuiz()}}
function nextQ(){if(sess.idx<sess.items.length-1){sess.idx++;renderQuiz()}}
function jump(i){sess.idx=i;renderQuiz()}

/* ============ SPACED REPETITION ============
   Leitner boxes. Get it right, it comes back later; get it wrong, it drops to
   box 0 and reappears in the same session's tail or the next drill. */
const SR_DAYS=[0,1,3,7,16,35];
const DAY=864e5;
function srUpdate(g,correct){
  const now=Date.now();
  const e=S.sr[g]||(S.sr[g]={box:0,due:0,seen:0});
  e.seen=(e.seen||0)+1;e.last=now;
  e.box=correct?Math.min((e.box||0)+1,SR_DAYS.length-1):0;
  e.due=e.box?now+SR_DAYS[e.box]*DAY:now+10*6e4;   /* wrong → back in 10 minutes */
}
function srDue(now){now=now||Date.now();
  return Object.keys(S.sr).filter(g=>QByG[g]&&S.sr[g].due<=now)
    .sort((a,b)=>S.sr[a].due-S.sr[b].due)}
function srSeen(){return Object.keys(S.sr).length}

/* record into topic/mistake stats (once per exam grading or per practice check) */
function recordAnswer(q,correct){
  S.answered++;if(correct)S.correct++;
  srUpdate(q.g,correct);
  const tp=S.topics[q.p]||(S.topics[q.p]={seen:0,correct:0});tp.seen++;if(correct)tp.correct++;
  const m=S.mistakes[q.g];
  if(correct){
    if(m&&!m.done){m.streak=(m.streak||0)+1;if(m.streak>=2){m.done=true}}
  }else{
    if(m){m.done=false;m.streak=0;m.count=(m.count||0)+1}
    else S.mistakes[q.g]={count:1,streak:0,done:false};
  }
  save();
}

/* ============ FINISH / RESULTS ============ */
function finishQuiz(){
  clearInterval(timerInt);
  // grade any unchecked (exam) items now
  if(!sess.instant){
    sess.items.forEach(it=>{const ci=correctIdx(it.q);it.checked=true;it._correct=it.picked.length?eqSet(it.picked,ci):false;recordAnswer(it.q,it._correct)});
  }else{
    // practice: unchecked & unpicked count as not-correct but only grade if attempted
    sess.items.forEach(it=>{if(!it.checked){it.checked=true;it._correct=false}});
  }
  const score=sess.items.filter(it=>it._correct).length;
  const total=sess.items.length;
  const passed=score>=Math.round(PASSMARK/24*total);
  S.attempts++;if(passed)S.passes++;
  if(sess.testN){
    const st=testStat(sess.testN);
    S.tests[sess.testN]={best:Math.max(st.best??0,score),attempts:st.attempts+1,lastPass:passed,lastScore:score};
  }
  if(sess.source==='drill')noteDrillDone();
  S.history.unshift({t:Date.now(),title:sess.title,score,total,passed});
  S.history=S.history.slice(0,50);
  save();
  renderResults(score,total,passed);
  go('results');
}

            ?`🔥 Drill done${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :(passed?'🎉 Passed!':'Keep practising')}</div>
          <p class="sub" style="margin:6px 0 12px">You scored <b>${score}</b> of <b>${total}</b>. ${passed?`That's above the ${Math.round(PASSMARK/24*total)} needed.`:`You need <b>${Math.round(PASSMARK/24*total)}</b> to pass — ${Math.round(PASSMARK/24*total)-score} more.`} <span class="chip" style="margin-left:6px">${fmt(secs)} taken</span></p>
          <div class="btn-row">
            <button class="btn primary" onclick="retrySame()">↻ Retry</button>
            ${wrongItems.length?`<button class="btn" onclick="practiceMistakes()">🎯 Fix ${wrongItems.length} mistake${wrongItems.length===1?'':'s'}</button>`:''}
            <button class="btn ghost" onclick="go('dashboard')">Dashboard</button>
          </div>
        </div>
      </div>
    </div>
    <b>Review all ${total} questions</b>
    <div style="margin-top:8px">
    ${sess.items.map((it,i)=>{const ci=correctIdx(it.q);
      return `<details class="rev" ${it._correct?'':'open'}>
        <summary><span class="ic ${it._correct?'ok':'no'}">${it._correct?'✓':'✕'}</span>

        </div>

}
function retrySame(){
  if(sess.testN)return startTest(sess.testN);
  const src=sess.items.map(it=>it.q);
  makeSession(src,{title:sess.title,timed:sess.timed,testN:sess.testN,source:sess.source});
}

/* ============ MISTAKES ============ */

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',e=>{
  if(document.getElementById('view-quiz').classList.contains('hidden'))return;
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const it=sess.items[sess.idx];
  if(/^[1-9]$/.test(e.key)){const pos=+e.key-1;if(pos<it.order.length){pick(it.order[pos]);e.preventDefault()}}
  else if(e.key==='Enter'){const b=document.getElementById('mainBtn');if(b&&!b.disabled)b.click();e.preventDefault()}
  else if(e.key==='ArrowRight')nextQ();
  else if(e.key==='ArrowLeft')prevQ();
  else if(e.key.toLowerCase()==='f')toggleFlag(it.q.g);
});

/* ============ GUARD LEAVING MID-EXAM ============ */
window.addEventListener('beforeunload',e=>{if(sess&&sess.timed&&!sess.endTs&&document.getElementById('view-quiz')&&!document.getElementById('view-quiz').classList.contains('hidden')){e.preventDefault();e.returnValue=''}});

/* ============ DEEP LINKS ============
   #drill · #mistakes · #stats · #test=7 · #q=412 (from the hub's search) */
function showQuestion(g){
  const q=QByG[g];if(!q){toast('Question not found');return}
  const ci=correctIdx(q);
  modal(`<div class="tag" style="margin-bottom:6px">${esc(TOPICS[q.p])} · Test ${q._test}</div>
    <h3 style="margin:0 0 12px;font-size:17px;line-height:1.4">${esc(q.t)}</h3>
    ${q.o.map((o,i)=>`<div style="padding:5px 0;${ci.includes(i)?'color:var(--good);font-weight:700':'color:var(--muted)'}">${ci.includes(i)?'✓':'·'} ${esc(o[0])}</div>`).join('')}
    <div class="lbl" style="margin-top:12px">Explanation</div><div>${esc(q.e||'—')}</div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="closeModal();startTest(${q._test})">Take Test ${q._test}</button>
      <button class="btn" onclick="closeModal();startTopic(${q.p})">Practise this topic</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>`);
}
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h)return;
  const q=h.match(/^q=(\d+)$/);   if(q){go('dashboard');showQuestion(+q[1]);return}
  const t=h.match(/^test=(\d+)$/);if(t){startTest(+t[1]);return}
  if(h==='drill'){startDrill();return}
  if(h==='mistakes'||h==='stats')go(h);
}
addEventListener('hashchange',route);

/* ============ INIT ============ */
renderDashboard();
route();
</script>
