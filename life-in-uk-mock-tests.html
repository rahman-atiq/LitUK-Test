ith France, called the Hundred Years War (even though it actually lasted 116 years). One of the most famous battles of the Hundred Years War was the Battle of Agincourt in 1415, where King Henry V's vastly outnumbered English army defeated the French. The English left France in the 1450s.","p":1,"o":[["The Battle of Bannockburn",0],["The Hundred Years War",1],["The Battle of the Boyne",0],["The Battle of Trafalgar",0]]},{"g":815,"t":"William Orange was asked by Protestants to invade England. This event was later known as what?","e":"James II's elder daughter, Mary, was married to her cousin William of Orange, the Protestant ruler of the Netherlands. In 1688, important Protestants in England asked William to invade England and proclaim himself king. This event was later called the 'Glorious Revolution' because there was no fighting in England and because it guaranteed the power of Parliament.","p":1,"o":[["Glorious Revolution",1],["Magna Carta",0],["Industrial Revolution",0],["Orange Revolution",0]]}]},{"n":35,"name":"Life in the UK Test 35","q":[{"g":816,"t":"What did the 'Bill of Rights' confirm?","e":"The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king's power.","p":1,"o":[["Parliament's increased power",1],["Kings can administer justice",0],["Kings can collect taxes",0],["King's increased power",0]]},{"g":817,"t":"Where was Florence Nightingale born?","e":"Florence Nightingale was born in Italy to English parents in 1820.","p":1,"o":[["Italy",1],["Scotland",0],["France",0],["England",0]]},{"g":818,"t":"Which of these gardens is located in Wales?","e":"Bodnant Garden is in Wales.","p":0,"o":[["Mount Stewart",0],["Bodnant Garden",1],["Hidcote",0],["Sissinghurst",0]]},{"g":819,"t":"Who is responsible for subjects such as education, health and defence?","e":"Secretaries of State are responsible for subjects such as education, health and defence.","p":2,"o":[["Home Secretary",0],["Secretary of State",1],["Chancellor of the Exchequer",0],["Foreign Secretary",0]]},{"g":820,"t":"Who established the Church of England?","e":"To divorce his first wife, Henry VIII needed the approval of the Pope. When the Pope refused, Henry established the Church of England. In this new Church, the king, not the Pope, would have the power to appoint bishops and order how people should worship.","p":1,"o":[["Henry VIII",1],["St George",0],["The Pope",0],["Henry VII",0]]},{"g":821,"t":"What is an example of a Criminal Offence?","e":"Examples of criminal laws are - Carrying a weapon: it is a criminal offence to carry a weapon of any kind, even if it is for self-defence. This includes a gun, a knife or anything that is made or adapted to cause injury; Drugs: selling or buying drugs such as heroin, cocaine, ecstasy and cannabis is illegal in the UK; Racial crime: it is a criminal offence to cause harassment, alarm or distress to someone because of their religion or ethnic origin; Selling tobacco: it is illegal to sell tobacco products (for example, cigarettes, cigars, roll-up tobacco) to anyone under the age of 18; Smoking in public places: it is against the law to smoke tobacco products in nearly every enclosed public place in the UK. There are signs displayed to tell you where you cannot smoke; Buying alcohol: it is a criminal offence to sell alcohol to anyone who is under 18 or to buy alcohol for people who are under the age of 18; Drinking in public: some places have alcohol-free zones where you cannot drink in public. The police can also confiscate alcohol or move young people on from public places. You can be fined or arrested.","p":2,"o":[["Selling Tobacco to under 18's",1],["Owing Money",0],["Housing disputes",0],["Discrimination in the workplace",0]]},{"g":822,"t":"What UK landmark was voted as Britain's favourite view?","e":"The Lake District is England's largest national park. It covers 885 square miles (2,292 square kilometres). It is famous for its lakes and mountains and is very popular with climbers, walkers and sailors. The biggest stretch of water is Windermere. In 2007, television viewers voted Wastwater as Britain's favourite view.","p":0,"o":[["The Lake District",1],["Edinburgh Castle",0],["Loch Lomond",0],["Snowdonia",0]]},{"g":823,"t":"How many people lost their lives in the decades after 1969 due to violence in Northern Ireland?","e":"Some 3,000 people lost their lives in the decades after 1969 in the violence in Northern Ireland.","p":1,"o":[["60,000",0],["30,000",0],["12,000",0],["3,000",1]]},{"g":824,"t":"What do the National Insurance Contributions fund?","e":"Almost everybody in the UK who is in paid work, including self-employed people, must pay National Insurance Contributions. The money raised from National Insurance Contributions is used to pay for state benefits and services such as the state retirement pension and the National Health Service (NHS).","p":2,"o":[["The Police, NHS and Education",0],["The NHS and Police",0],["Schools and Education",0],["The NHS and state pension",1]]},{"g":825,"t":"How many people lost their lives in Northern Ireland in the decades after 1969?","e":"The 1970s were also a time of serious unrest in Northern Ireland. In 1972, the Northern Ireland Parliament was suspended and Northern Ireland was directly ruled by the UK government. Some 3,000 people lost their lives in the decades after 1969 in the violence in Northern Ireland.","p":1,"o":[["4000",0],["3000",1],["2000",0],["1000",0]]},{"g":826,"t":"What method is used to elect UK MPs?","e":"MPs are elected through a system called 'first past the post'. In each constituency, the candidate who gets the most votes is elected. The government is usually formed by the party that wins the majority of constituencies. If no party wins a majority, two parties may join together to form a coalition.","p":2,"o":[["Popularity",0],["Proportional Representation",0],["First past the post system",1],["Instant runoff",0]]},{"g":827,"t":"Julius Caesar led a Roman invasion of Britain in 55 BC but this was unsuccessful. For how many years did Britain remain separate from the Roman Empire?","e":"Julius Caesar led a Roman invasion of Britain in 55 BC. This was unsuccessful and for nearly 100 years Britain remained separate from the Roman Empire. In AD 43 the Emperor Claudius led the Roman army in a new invasion. This time, there was resistance from some of the British tribes but the Romans were successful in occupying almost all of Britain.","p":1,"o":[["400",0],["200",0],["100",1],["300",0]]},{"g":828,"t":"Hanukkah is celebrated to remember the Jews' struggle for religious freedom and it is in November or December for how many days?","e":"Hanukkah is in November or December and is celebrated for eight days. It is to remember the Jews' struggle for religious freedom. On each day of the festival a candle is lit on a stand of eight candles (called a menorah) to remember the story of the festival, where oil that should have lasted only a day did so for eight.","p":0,"o":[["7",0],["9",0],["8",1],["6",0]]},{"g":829,"t":"The leader of the Opposition appoints senior opposition MPs to be what?","e":"The leader of the Opposition also appoints senior opposition MPs to be 'shadow ministers'. They form the shadow cabinet and their role is to challenge the government and put forward alternative policies.","p":2,"o":[["Home Secretary",0],["Local Mayors",0],["Chancellor of the Exchequer",0],["Shadow Ministers",1]]},{"g":830,"t":"Which TWO of these countries are currently in the EU?","e":"Following a referendum held in the UK on 23 June 2016, the UK left the EU on 31 January 2020. France are Poland are still part of the EU.","p":2,"o":[["UK",0],["Russia",0],["France",1],["Poland",1]]},{"g":831,"t":"Christmas Day celebrates the birth of Jesus Christ","e":"Christmas Day, 25 December, celebrates the birth of Jesus Christ. It is a public holiday. Many Christians go to church on Christmas Eve (24 December) or on Christmas Day itself.","p":0,"o":[["True",1],["False",0]]},{"g":832,"t":"What is the second biggest country in the UK?","e":"Scotland has the second highest population and area.","p":0,"o":[["England",0],["Scotland",1],["Wales",0],["Northern Ireland",0]]},{"g":833,"t":"The EU was set up by 6 western countries who signed the Treaty of Rome on which date?","e":"The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957. The UK originally decided not to join this group but it became a member in 1973.","p":2,"o":[["25-Mar-57",1],["01-Mar-77",0],["30-May-47",0],["17-May-67",0]]},{"g":834,"t":"When Queen Anne died, a German, George of Hanover, became the next King of England","e":"When Queen Anne died in 1714, Parliament chose a German, George I, to be the next King, because he was Anne's nearest Protestant relative. An attempt by Scottish Jacobites to put James II's son on the throne instead was quickly defeated.","p":1,"o":[["True",1],["False",0]]},{"g":835,"t":"Which of these TWO lines from Shakespeare's plays and poems are often still quoted?","e":"Lines from Shakespeare's plays and poems which are often still quoted include: Once more unto the breach (Henry V); To be or not to be (Hamlet); A rose by any other name (Romeo and Juliet); All the world's a stage (As You Like It); The darling buds of May (Sonnet 18 'Shall I Compare Thee To a Summer's Day).","p":1,"o":[["A rose is beautiful",0],["The darling buds of May",1],["To be or not to be",1],["The world is your oyster",0]]},{"g":836,"t":"People who are self-employed need to pay National Insurance Contributions themselves","e":"Almost everybody in the UK who is in paid work, including self-employed people, must pay National Insurance Contributions.","p":2,"o":[["False",0],["True",1]]},{"g":837,"t":"The Swinging Sixties was a period of new ideas about politics, philosophy and science","e":"he decade of the 1960s was a period of significant social change. It was known as 'the Swinging Sixties'. There was growth in British fashion, cinema and popular music. Two well-known pop music groups at the time were The Beatles and The Rolling Stones. People started to become better off and many bought cars and other consumer goods. It was also a time when social laws were liberalised, for example in relation to divorce and to abortion in England, Wales and Scotland.","p":1,"o":[["True",0],["False",1]]},{"g":838,"t":"In year 1066, William the Conqueror invaded England in which battle?","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror. The battle is commemorated in a great piece of embroidery, known as the Bayeux Tapestry, which can still be seen in France today.","p":1,"o":[["Battle of Britain",0],["Battle of Hastings",1],["Battle of Agincourt",0],["Battle of Culloden",0]]},{"g":839,"t":"Which of the following discoveries contributed to the progress of the Industrial Revolution?","e":"During the 18th century, new ideas about politics, philosophy and science were developed. This is often called 'the Enlightenment'. Many of the great thinkers of the Enlightenment were Scottish. Adam Smith developed ideas about economics which are still referred to today. David Hume's ideas about human nature continue to influence philosophers. Scientific discoveries, such as James Watt's work on steam power, helped the progress of the Industrial Revolution.","p":1,"o":[["Television",0],["Penicillin",0],["Steam Power",1],["Jet Engine",0]]}]},{"n":36,"name":"Life in the UK Test 36","q":[{"g":840,"t":"What is the Church of England known as in Scotland and the US?","e":"The official Church of the state is the Church of England is called the Episcopal Church in Scotland and the United States. It is a Protestant Church.","p":0,"o":[["The Episcopal Church",1],["The Catholic Church",0],["The State Church",0],["The Anglican Church",0]]},{"g":841,"t":"Which countries are in Great Britain?","e":"Great Britain consists of 3 countries: England, Wales and Scotland.","p":4,"o":[["Wales, Northern Ireland, Scotland",0],["England, Scotland, Ireland",0],["England, Wales, Scotland, Northern Ireland",0],["England, Wales, Scotland",1]]},{"g":842,"t":"What language did the Iron Age people speak?","e":"Their language was part of the Celtic language family.","p":1,"o":[["Celtic",1],["Viking",0],["Anglo-Saxon",0],["English",0]]},{"g":843,"t":"When did the UK join the EEC?","e":"West Germany, France, Belgium, Italy, Luxembourg and the Netherlands formed the European Economic Community (EEC) in 1957. At first the UK did not wish to join the EEC but it eventually did so in 1973.","p":1,"o":[["1968",0],["1973",1],["1957",0],["1964",0]]},{"g":844,"t":"Who is able to change the Prime Minister during his/her term?","e":"The Prime Minister can be changed if the MPs in the governing party decide to do so, or if he or she wishes to resign. The Prime Minister usually resigns if his or her party loses a General Election.","p":2,"o":[["The Governing Party",1],["The Speaker",0],["The Monarch",0],["Fellow MPs",0]]},{"g":845,"t":"What can schools do to raise money?","e":"Many schools organise events to raise money for extra equipment or out-of-school activities. Activities might include book sales, toy sales or bringing food to sell.","p":2,"o":[["Ask parents for money",0],["Reduce teachers' wages",0],["Ask the local council for extra funding",0],["Organise events",1]]},{"g":846,"t":"Which of Henry VIII's wives were executed?","e":"Anne Boleyn was English. She and Henry had one daughter, Elizabeth. Anne was unpopular in the country and was accused of taking lovers. She was executed at the Tower of London. Catherine was a cousin of Anne Boleyn. She was also accused of taking lovers and executed.","p":1,"o":[["Catherine Parr and Anne of Cleves",0],["Anne Boleyn and Catherine Howard",1],["Catherine of Aragon and Anne Boleyn",0],["Anne of Cleves and Jane Seymour",0]]},{"g":847,"t":"Who led a team to clone a mammal for the first time?","e":"In 1996, two British scientists, Sir Ian Wilmot (1944-) and Keith Campbell (1954-2012), led a team which was the first to succeed in cloning a mammal, Dolly the sheep. This has led to further research into the possible use of cloning to preserve endangered species and for medical purposes.","p":1,"o":[["Patrick Steptoe and Patrick Steptoe",0],["John MacLeod and James Goodfellow",0],["Jayne Torvill and Mary Peters",0],["Sir Ian Wilmut and Keith Campbell",1]]},{"g":848,"t":"What tells us about how people lived just after the Norman Conquest?","e":"William sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book. It still exists today and gives a picture of society in England just after the Norman Conquest.","p":1,"o":[["The Domesday book",1],["Historical Landmarks",0],["The Bayeux Tapestry",0],["Historical Villages",0]]},{"g":849,"t":"Where was William Shakespeare born?","e":"Shakespeare (1564-1616) was born in Stratford-upon-Avon, England.","p":1,"o":[["London",0],["Stratford upon Avon",1],["Berkshire",0],["Essex",0]]},{"g":850,"t":"What tools did the Bronze age people introduce?","e":"The people of the Bronze Age were accomplished metalworkers who made many beautiful objects in bronze and gold, including tools, ornaments and weapons.","p":1,"o":[["Gold Currency",0],["Ornaments and weapons",1],["Basic farming machinery",0],["Roads",0]]},{"g":851,"t":"How many colonies were granted independence in 1947?","e":"Another aspect of change was self-government for former colonies. In 1947, independence was granted to nine countries, including India, Pakistan and Ceylon (now Sri Lanka). Other colonies in Africa, the Caribbean and the Pacific achieved independence over the next 20 years.","p":1,"o":[["11",0],["13",0],["7",0],["9",1]]},{"g":852,"t":"The Battle of Hastings is commemorated in a piece of embroidery , known as the Bayeux Tapestry","e":"The battle of Hastings is commemorated in a great piece of embroidery, known as the Bayeux Tapestry, which can still be seen in France today.","p":1,"o":[["False",0],["True",1]]},{"g":853,"t":"What are TWO responsibilities of members of Parliament (MPs)?","e":"MPs have a number of different responsibilities. They:; represent everyone in their constituency; ; help to create new laws; ; scrutinise and comment on what the government is doing; ; debate important national issues;","p":2,"o":[["Represent only those who voted for them",0],["They represent everyone in their constituency",1],["Appoint the Prime Minister (PM)",0],["Scrutinise and comment on what the government is doing",1]]},{"g":854,"t":"Where was Anne Boleyn, the wife of Henry VIII who was accused of taking lovers, executed?","e":"Anne Boleyn was English. She and Henry had one daughter, Elizabeth. Anne was unpopular in the country and was accused of taking lovers. She was executed at the Tower of London.","p":1,"o":[["Maiden Castle",0],["The Tower of London",1],["Windsor Castle",0],["Stonehenge",0]]},{"g":855,"t":"What is the percentage of Sikh living in the UK?","e":"In the 2021 England and Wales census, around 525,000 (0.9%) people from the sampled population of 60 million identified as Sikh. 46% of people identified themselves as Christian. Much smaller proportions identified themselves as Muslim (6.5%), Hindu (2%), Sikh (1%), Jewish or Buddhist (both around 0.5%), 0.5% of people followed another religion and 37% stated not to follow any religion.","p":0,"o":[["5%",0],["9%",0],["13.00%",0],["1%",1]]},{"g":856,"t":"Where can you find Crown Jewels?","e":"The Tower of London was first built by William the Conqueror after he became king in 1066. Tours are given by the Yeoman Warders, also known as Beefeaters, who tell visitors about the building's history. People can also see the Crown Jewels there.","p":0,"o":[["The Tower of London",1],["The National Museum",0],["Queen's house in Greenwich",0],["The Buckingham Palace",0]]},{"g":857,"t":"How is the Queen Elizabeth II's husband, Prince Philip, often called?","e":"Queen Elizabeth II reigned since her father's death in 1952, in 2012 she celebrated her Diamond Jubilee (60 years as queen) until she passed away in 2022. She was married to Prince Philip, the Duke of Edinburgh. Her eldest son, Prince Charles (the Prince of Wales) became the sovereign monarch in 2022.","p":0,"o":[["The Duke of Belfast",0],["The Duke of London",0],["The Duke of Swansea",0],["The Duke of Edinburgh",1]]},{"g":858,"t":"What name is given to the official flag that represents the union between England, Scotland, Wales and Northern Ireland?","e":"One symbol of the union between England, Scotland, Wales and Northern Ireland was a new version of the official flag, the Union Flag. This is often called the Union Jack.","p":1,"o":[["Union Queen",0],["Union Jack",1],["Union Ace",0],["Union King",0]]},{"g":859,"t":"Which TWO describe the Wimbledon Championships?","e":"Modern tennis evolved in England in the late 19th century. The first tennis club was founded in Leamington Spa in 1872. The most famous tournament hosted in Britain is The Wimbledon Championships, which takes place each year at the All England Lawn Tennis and Croquet Club. It is the oldest tennis tournament in the world and the only 'Grand Slam' event played on grass.","p":0,"o":[["Only 'Grand Slam' event played on grass",1],["Oldest tennis tournament in the world",1],["Only 'Major' tournament held outside the US",0],["Only tennis tournament that Andy Murray won",0]]},{"g":860,"t":"What is a good way to support your local community?","e":"A good way to support your local community is to shop for products locally where you can. This will help businesses and farmers in your area and in Britain. It will also reduce your carbon footprint, because the products you buy will not have had to travel as far.","p":2,"o":[["Donating to boost the economy",0],["Buying good from large supermarkets",0],["Driving everywhere",0],["Shop for products locally where you can",1]]},{"g":861,"t":"What is the geographic position of the UK in Europe?","e":"The UK is located in the North West of Europe.","p":4,"o":[["East",0],["North West",1],["West",0],["South",0]]},{"g":862,"t":"What is the official report that contains everything said in Parliament called?","e":"Proceedings in Parliament are broadcast on television and published in official reports called Hansard.","p":2,"o":[["The Domesday Book",0],["The Government report",0],["The Government press",0],["Hansard",1]]},{"g":863,"t":"When is St Patrick's day?","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":0,"o":[["30th of November",0],["1st of March",0],["23rd of April",0],["17th of March",1]]}]},{"n":37,"name":"Life in the UK Test 37","q":[{"g":864,"t":"Which charity works to preserve important buildings?","e":"Many parts of the countryside and places of interest are kept open by the National Trust. It aims to preserve important buildings, coastline and countryside in the UK. The National Trust was founded in 1895 by three volunteers. There are now more than 61,000 volunteers helping to keep the organisation running.","p":0,"o":[["Age UK",0],["The National Trust",1],["The Red Cross",0],["NSPCC",0]]},{"g":865,"t":"What is the capital of England?","e":"London is the capital city of England and the United Kingdom.","p":4,"o":[["London",1],["Belfast",0],["Cardiff",0],["Edinburgh",0]]},{"g":866,"t":"Who became Prime Minister during WWII?","e":"Hitler invaded Poland and took control of Belgium and the Netherlands. At this time of national crisis, Winston Churchill became Prime Minister.","p":1,"o":[["Winston Churchill",1],["Margaret Thatcher",0],["Robert Walpole",0],["Tony Blair",0]]},{"g":867,"t":"When is Boxing Day?","e":"Boxing Day (26th of December) is the day after Christmas Day (25th of December) and is a public holiday.","p":0,"o":[["The day after Christmas Day",1],["The day before Christmas Day",0],["The day before Easter",0],["The day after Easter",0]]},{"g":868,"t":"What is the capital of Wales?","e":"Cardiff is the capital of Wales.","p":0,"o":[["Cardiff",1],["Edinburgh",0],["London",0],["Belfast",0]]},{"g":869,"t":"Where are the most serious civil cases heard in England and Wales?","e":"More serious civil cases - for example, when a large amount of compensation is being claimed - are dealt with in the High Court in England, Wales and Northern Ireland.","p":2,"o":[["Sheriff Court",0],["High Court",1],["Crown Court",0],["The Court of Session",0]]},{"g":870,"t":"Where is the Millennium Stadium located?","e":"Sporting events take place at major stadiums such as Wembley Stadium in London and the Millennium Stadium in Cardiff.","p":0,"o":[["Edinburgh",0],["Cardiff",1],["London",0],["Manchester",0]]},{"g":871,"t":"What event is known as the evacuation of 300,000 people from the beaches?","e":"Many civilian volunteers in small pleasure and fishing boats from Britain helped the Navy to rescue more than 300,000 men from the beaches around Dunkirk. The evacuation gave rise to the phrase 'the Dunkirk spirit'.","p":1,"o":[["The Battle of Britain",0],["The Dunkirk spirit",1],["The Blitz spirit",0],["D-Day",0]]},{"g":872,"t":"Which river banks the London eye?","e":"The London Eye is situated on the southern bank of the River Thames and is a Ferris wheel that is 443 feet (135 metres) tall. It was originally built as part of the UK's celebration of the new millennium and continues to be an important part of New Year celebrations.","p":0,"o":[["Trent",0],["Severn",0],["Thames",1],["Wye",0]]},{"g":873,"t":"How many years did Charles I try to rule without Parliament?","e":"For 11 years, Charles I found ways in which to raise money without Parliament's approval but eventually trouble in Scotland meant that he had to recall Parliament.","p":1,"o":[["20",0],["16",0],["14",0],["11",1]]},{"g":874,"t":"When did the first Christian communities begin to appear in Britain?","e":"It was during the 3rd and 4th centuries AD that the first Christian communities began to appear in Britain.","p":1,"o":[["4th and 5th centuries",0],["5th and 6th centuries",0],["2nd and 3rd centuries",0],["3rd and 4th centuries",1]]},{"g":875,"t":"Where are the most serious criminal cases in Scotland heard at?","e":"The most serious cases in Scotland, such as murder, are heard at a High Court with a judge and jury.","p":2,"o":[["Sheriff Court",0],["Crown Court",0],["High Court",1],["Court of Session",0]]},{"g":876,"t":"Clans lost a lot of their power and influence after which event?","e":"The clans lost a lot of their power and influence after the Battle of Culloden (1746). Chieftains became landlords if they had the favour of the English king, and clansmen became tenants who had to pay for the land they used.","p":1,"o":[["The Battle of Agincourt",0],["The Crimean War",0],["The Battle of Culloden",1],["The Battle of Trafalgar",0]]},{"g":877,"t":"Where in Scotland is known as the home of golf?","e":"Game of golf can be traced back to 15th century Scotland. It is a popular sport played socially as well as professionally. There are public and private golf courses all over the UK. St Andrews in Scotland is known as the home of golf.","p":0,"o":[["Inverness",0],["Glasgow",0],["Edinburgh",0],["St Andrews",1]]},{"g":878,"t":"Which of the following was written by Lord Byron?","e":"She Walks in Beauty is a short poem by Lord Byron","p":0,"o":[["Anthem for Doomed Youth",0],["The Daffodils",0],["She Walks in Beauty",1],["The Tyger",0]]},{"g":879,"t":"Who gets appointed by local authorities to be the ceremonial leader of the council?","e":"Many local authorities appoint a mayor, who is the ceremonial leader of the council. In some towns, a mayor is elected to be the effective leader of the administration.","p":2,"o":[["Teamleader",0],["MP",0],["Mayor",1],["Council leader",0]]},{"g":880,"t":"Which country (or colony) did NOT gain its independence from the British Empire in 1947?","e":"In 1947, independence was granted to nine countries, including India, Pakistan and Ceylon (now Sri Lanka). Other colonies in Africa, the Caribbean (e.g. The British West Indies) and the Pacific achieved independence over the next 20 years.","p":1,"o":[["India",0],["The British West Indies",1],["Sri Lanka",0],["Pakistan",0]]},{"g":881,"t":"What language did the peasants speak after the Norman conquest?","e":"The Middle Ages saw the development of a national culture and identity. After the Norman Conquest, the king and his noblemen had spoken Norman French and the peasants had continued to speak Anglo-Saxon. Gradually these two languages combined to become one English language.","p":1,"o":[["Gaelic",0],["English",0],["Anglo Saxon",1],["Norman French",0]]},{"g":882,"t":"EastEnders and Coronation Street are popular soap operas.","e":"British television shows a wide variety of programmes. Popular programmes include regular soap operas such as Coronation Street and EastEnders.","p":0,"o":[["False",0],["True",1]]},{"g":883,"t":"Which TWO are used in making an Ulster fry?","e":"Ulster fry - a fried meal with bacon, eggs, sausage, black pudding, white pudding, tomatoes, mushrooms, soda bread and potato bread.","p":0,"o":[["Sausage",1],["Bacon",1],["Oatmeal",0],["Beef",0]]},{"g":884,"t":"In 1998, what was the estimated population of the UK?","e":"(1951, 50 million), (1998, 57 million), (2005, Just under 60 million), (2010, Just over 62 million)","p":0,"o":[["57 million",1],["75 million",0],["42 million",0],["62 million",0]]},{"g":885,"t":"Mary Stuart, often now called Mary Queen of Scots was a Protestant","e":"The queen of Scotland, Mary Stuart (often now called 'Mary, Queen of Scots') was a Catholic. She was only a week old when her father died and she became queen","p":1,"o":[["False",1],["True",0]]},{"g":886,"t":"Which TWO are some of the key roles of Governors and school boards?","e":"Governors and school boards have an important part to play in raising school standards. They have three key roles: setting the strategic direction of the school; ensuring accountability; monitoring and evaluating school performance.","p":2,"o":[["Monitoring expenses",0],["Evaluating school performance",1],["Setting the strategic direction",1],["Looking after school's finances",0]]},{"g":887,"t":"Which of the following flowers represents England?","e":"The national flower of England is the Rose.","p":0,"o":[["Rose",1],["Daffodil",0],["Thistle",0],["Shamrock",0]]}]},{"n":38,"name":"Life in the UK Test 38","q":[{"g":888,"t":"Which of these is a famous classical music event in the UK?","e":"The Proms is an eight-week summer season of classical music (orchestral or solo instrumental and nowadays may feature non-classical music) that takes place in various venues, including the Royal Albert Hall in London.","p":0,"o":[["Glastonbury Festival",0],["The Proms",1],["T in the Park",0],["Creamfields",0]]},{"g":889,"t":"When did the Enlightenment happen?","e":"During the 18th century, new ideas about politics, philosophy and science were developed. This is often called 'the Enlightenment'.","p":1,"o":[["18th century",1],["18th and 19th century",0],["19th century",0],["19th and 20th century",0]]},{"g":890,"t":"What is the period after the Norman Conquest up until 1485 called?","e":"The period after the Norman Conquest up until about 1485 is called the Middle Ages or the medieval period. It was a time of almost constant war.","p":1,"o":[["The Middle Ages",1],["The Iron Age",0],["The Bronze Age",0],["The Stone age",0]]},{"g":891,"t":"Which flower is associated with Northern Ireland?","e":"A shamrock is associated with Northern Ireland. A rose is associated with England, a thistle with Scotland and a daffodil with Wales.","p":0,"o":[["A thistle",0],["A shamrock",1],["A rose",0],["A daffodil",0]]},{"g":892,"t":"Where did the canal builders come from in the middle ages?","e":"People came to England from abroad to trade and also to work. Many had special skills, such as weavers from France, engineers from Germany, glass manufacturers from Italy and canal builders from Holland.","p":1,"o":[["Germany",0],["Holland",1],["Italy",0],["France",0]]},{"g":893,"t":"What percentage of the total population lives in England?","e":"The population is very unequally distributed over the four parts of the UK. England more or less consistently makes up 84% of the total population, Wales around 5%, Scotland just over 8% and Northern Ireland less than 3%.","p":0,"o":[["95%",0],["84%",1],["52%",0],["67%",0]]},{"g":894,"t":"Who wrote music for King George I?","e":"The German-born composer George Frideric Handel (1695-1759) spent many years in the UK and became a British citizen in 1727. He wrote the Water Music for King George I and Music for the Royal Fireworks for his son, George II.","p":0,"o":[["Sir William Walton",0],["George Frederick Handel",1],["Benjamin Britten",0],["Sir Edward Elgar",0]]},{"g":895,"t":"When did Britain recognise the American colonies' independence?","e":"In 1776, 13 American colonies declared their independence, stating that people had a right to establish their own governments. The colonists eventually defeated the British army and Britain recognised the colonies' independence in 1783.","p":1,"o":[["1751",0],["1783",1],["1776",0],["1763",0]]},{"g":896,"t":"Which TWO are located in Scotland?","e":"Loch Lomond and the Edinburgh Castle are located in Scotland.","p":0,"o":[["The Eden Project",0],["Loch Lomond",1],["Edinburgh Castle",1],["The Giant's Causeway",0]]},{"g":897,"t":"How many volunteers is The National Trust run by?","e":"The National Trust was set up by just 3 volunteers. Now over 61,000 people help to run it.","p":2,"o":[["3",0],["61000",1],["4500",0],["4",0]]},{"g":898,"t":"Many schools organise events to raise money for extra equipment or out-of-school activities","e":"Many schools organise events to raise money for extra equipment or out-of-school activities. Activities might include book sales, toy sales or bringing food to sell.","p":2,"o":[["False",0],["True",1]]},{"g":899,"t":"Many of the painters working in Britain in the 16th and 17th centuries were from abroad","e":"Many of the painters working in Britain in the 16th and 17th centuries were from abroad - for example, Hans Holbein and Sir Anthony Van Dyck.","p":2,"o":[["True",1],["False",0]]},{"g":900,"t":"What will happen to any driver who has either taken more than the acceptable quantity of alcohol or refused to take the test?","e":"If you are found driving while exceeding the alcohol limit you will be arrested.","p":2,"o":[["Given a warning",0],["Asked to provide medical certificate",0],["Taken to his home",0],["Arrested",1]]},{"g":901,"t":"Women over 21 were allowed to vote for the first time in 1969","e":"The voting franchise was also extended to women over 30, and then in 1928 to men and women over 21. In 1969, the voting age was reduced to 18 for men and women.","p":2,"o":[["True",0],["False",1]]},{"g":902,"t":"Who wrote the Canterbury Tales?","e":"In the years leading up to 1400, Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage.","p":1,"o":[["John Barbour",0],["William Caxton",0],["Geoffrey Chaucer",1],["William Walton",0]]},{"g":903,"t":"When did the Wars of the Roses end with the Battle of Bosworth?","e":"The Wars of the Roses ended with the Battle of Bosworth Field in 1485.","p":1,"o":[["1314",0],["1485",1],["1455",0],["1324",0]]},{"g":904,"t":"What kind of battle was the Battle of Britain (1940)?","e":"The Germans waged an air campaign against Britain, but the British resisted with their fighter planes and eventually won the crucial aerial battle against the Germans, called 'the Battle of Britain', in the summer of 1940. The most important planes used by the Royal Air Force in the Battle of Britain were the Spitfire and the Hurricane - which were designed and built in Britain.","p":1,"o":[["Border Battle",0],["All of these",0],["Air Battle",1],["Sea Battle",0]]},{"g":905,"t":"Mince pies are traditionally eaten on which day?","e":"Christmas is celebrated in a traditional way. People usually spend the day at home and eat a special meal, which often includes roast turkey, Christmas pudding and mince pies.","p":0,"o":[["Easter",0],["Christmas",1],["Halloween",0],["Diwali",0]]},{"g":906,"t":"David Hockney was an important contributor to the 'pop art' movement of the 1960s","e":"David Hockney (1937-) was an important contributor to the 'pop art' movement of the 1960s and continues to be influential today.","p":1,"o":[["False",0],["True",1]]},{"g":907,"t":"Which TWO are notable British artists?","e":"Joseph Turner (1775-1851) was an influential landscape painter in a modern style. He is considered the artist who raised the profile of landscape painting. John Constable (1776-1837) was a landscape painter most famous for his works of Dedham Vale on the Suffolk, Essex border in the east of England.","p":0,"o":[["Joseph Turner",1],["Matthew Harris Jouett",0],["Rembrandt Peale",0],["John Constable",1]]},{"g":908,"t":"What are elected members of the National Assembly of Wales known as?","e":"In Wales the elected members, known as AMs, meet in the Welsh Assembly in the Senedd in Cardiff Bay","p":2,"o":[["AMs",1],["MEPs",0],["MPs",0],["MLAs",0]]},{"g":909,"t":"In 1745, who was supported by clansmen from the Scottish highlands and raised an army?","e":"In 1745 there was another attempt to put a Stuart king back on the throne in place of George I's son, George II. Charles Edward Stuart (Bonnie Prince Charlie), the grandson of James II, landed in Scotland. He was supported by clansmen from the Scottish highlands and raised an army. Charles initially had some successes but was defeated by George II's army at the Battle of Culloden in 1746. Charles escaped back to Europe.","p":1,"o":[["Robert the Bruce",0],["Bonnie Prince Charlie",1],["Kenneth MacAlpin",0],["Oliver Cromwell",0]]},{"g":910,"t":"Northern Ireland has its own banknotes which are valid everywhere in the UK","e":"Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK. However, shops and businesses do not have to accept them.","p":2,"o":[["False",0],["True",1]]},{"g":911,"t":"Wales and Scotland use a system called 'individual registration'.All those entitled to vote must complete their own registration forms","e":"In Northern Ireland a system called 'individual registration' operates and all those entitled to vote must complete their own registration form. Once registered, people stay on the register provided their personal details do not change.","p":2,"o":[["False",1],["Trues",0]]}]},{"n":39,"name":"Life in the UK Test 39","q":[{"g":912,"t":"What is the monarch's ceremonial role?","e":"The Monarch has important ceremonial roles, such as the opening of the new parliamentary session each year.","p":2,"o":[["Making parliamentary policies",0],["Opening a parliamentary session",1],["Travelling abroad for banquets and to negotiate with foreign dignitaries",0],["Travelling in the UK",0]]},{"g":913,"t":"Under which king did the people unite to defeat the Vikings?","e":"The Anglo-Saxon kingdoms in England united under King Alfred the Great, who defeated the Vikings.","p":1,"o":[["Harold",0],["King Alfred the Great",1],["Henry I",0],["King William",0]]},{"g":914,"t":"What did the first farmers build in Britain?","e":"The first farmers built houses, tombs and monuments on the land.","p":1,"o":[["Houses and Monuments",1],["Hospitals and Roads",0],["Theatres and Houses",0],["Tombs and Stadiums",0]]},{"g":915,"t":"Which operas were written by Gilbert and Sullivan?","e":"Gilbert and Sullivan wrote comic operas, often making fun of popular culture and politics. These operas include HMS Pinafore, The Pirates of Penzance and The Mikado.","p":0,"o":[["Jesus Christ Superstar",0],["HMS Pinafore and The Mikado",1],["Tim Rice and Evita",0],["The Phantom of the Opera",0]]},{"g":916,"t":"What were the working conditions like during the Industrial Revolution?","e":"Working conditions during the Industrial Revolution were very poor. There were no laws to protect employees, who were often forced to work long hours in dangerous situations. Children also worked and were treated in the same way as adults.","p":1,"o":[["Average",0],["Very Poor",1],["Best in the World",0],["Acceptable",0]]},{"g":917,"t":"Which of these is not a valid bank note?","e":"The currency in the UK is the pound sterling (symbol £). There are 100 pence in a pound. The denominations (values) of currency are - coins: 1p, 2p, 5p, 10p, 20p, 50p, £1 and £2; notes: £5, £10, £20, £50.","p":0,"o":[["£100",1],["£5",0],["£20",0],["£50",0]]},{"g":918,"t":"Who is known as William the Conqueror?","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror.","p":1,"o":[["William, the Duke of Normandy",1],["William, the Duke of Lion",0],["William, the Duke of France",0],["William, the Duke of Edinburgh",0]]},{"g":919,"t":"When were the last Welsh rebellions defeated?","e":"By the middle of the 15th century the last Welsh rebellions had been defeated. English laws and the English language were introduced.","p":1,"o":[["14th century",0],["17th century",0],["16th century",0],["15th century",1]]},{"g":920,"t":"The Glorious Revolution was called the 'Glorious revolution' because there was no fighting in England and it guaranteed the power of Parliament","e":"The Glorious Revolution was called the 'Glorious revolution' because there was no fighting in England and it guaranteed the power of Parliament","p":1,"o":[["True",1],["False",0]]},{"g":921,"t":"Which TWO are compulsory in the UK if you own an old car?","e":"It is an offence not to have an MOT certificate if your vehicle is more than three years old or without car insurance.","p":0,"o":[["Mortgage",0],["A valid MOT test certificate",1],["Car insurance",1],["Life insurance",0]]},{"g":922,"t":"Which of these is a charity working with animals?","e":"People's Dispensary for Sick Animals (PDSA)is the charity that works with animals","p":2,"o":[["Crisis and Shelter",0],["NSPCC",0],["PDSA",1],["Age UK",0]]},{"g":923,"t":"Which of these names was Henry VIII and Anne Boleyn's child's name?","e":"Anne Boleyn was English. She and Henry had one daughter, Elizabeth. Anne was unpopular in the country and was accused of taking lovers. She was executed at the Tower of London.","p":1,"o":[["Edward",0],["Mary",0],["Elizabeth",1],["Catherine",0]]},{"g":924,"t":"Who makes a speech which summarises the government's policies for the year ahead?","e":"The Monarch (King Charles III at the time of writing) has important ceremonial roles, such as the opening of the new parliamentary session each year. On this occasion the Monarch makes a speech which summarises the government's policies for the year ahead. All Acts of Parliament are made in his name.","p":2,"o":[["The Prime Minister",0],["Local Authorities",0],["The Cabinet",0],["The Monarch",1]]},{"g":925,"t":"Until what time do people play jokes on one another on April Fool's Day?","e":"April Fool's Day, 1 April, is a day when people play jokes on each other until midday. The television and newspapers often have stories that are April Fool jokes.","p":0,"o":[["Until 9 PM",0],["Until 11 AM",0],["All day",0],["Until Midday",1]]},{"g":926,"t":"In which UK country can you find the best preserved prehistoric village in northern Europe?","e":"Skara Brae on Orkney, off the north coast of Scotland, is the best preserved prehistoric village in northern Europe, and has helped archaeologists to understand more about how people lived near the end of the Stone Age.","p":1,"o":[["Northern Ireland",0],["Wales",0],["England",0],["Scotland",1]]},{"g":927,"t":"In the middle of the 19th century the potato crop failed, and Ireland suffered a famine","e":"In the middle of the 19th century the potato crop failed, and Ireland suffered a famine. A million people died from disease and starvation. Another million and a half left Ireland.","p":1,"o":[["True",1],["False",0]]},{"g":928,"t":"What are the parliaments in Scotland, Wales and Northern Ireland also known as?","e":"Since 1997, some powers have been devolved from the central government to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them. These powers are also known as devolved administrations.","p":1,"o":[["Formal institutions",0],["Devolved administrations",1],["Political parties",0],["Local authorities",0]]},{"g":929,"t":"Select TWO famous Paralympians","e":"Baroness Tanni-Grey Thompson (1969-) is an athlete who uses a wheelchair and won 16 Paralympic medals, including 11 gold medals, in races over five Paralympic Games. She won the London Marathon six times and broke a total of 30 world records. Ellie Simmonds (1994-) is a Paralympian who won gold medals for swimming at the 2008 and 2012 Paralympic Games and holds a number of world records. She was the youngest member of the British team at the 2008 Games.","p":0,"o":[["Jessica Ennis",0],["Ellie Simmonds",1],["Baroness Tanni Grey-Thompson",1],["Dame Ellen MacArthur",0]]},{"g":930,"t":"What does the abbreviation PTA stand for?","e":"Sometimes school events are organised by parent-teacher associations (PTAs)","p":2,"o":[["Premier Tennis Association",0],["Parent Teacher Association",1],["Primary Teaching Agency",0],["Personal Trainer Awards",0]]},{"g":931,"t":"Which TWO of these are associated with Sir Francis Drake?","e":"Sir Francis Drake, one of the commanders in the defeat of the Spanish Armada, was one of the founders of England's naval tradition. His ship, the Golden Hind, was one of the first to sail right around ('circumnavigate') the world.","p":1,"o":[["Building the Titanic",0],["Sailing around the world",1],["The Spanish Armada invasion",1],["Invasion of Ireland",0]]},{"g":932,"t":"Which TWO major welfare changes were introduced between 1945 and 1950?","e":"In 1948, Aneurin (Nye) Bevan, the Minister for Health, led the establishment of the National Health Service (NHS). A national system of benefits was also introduced to provide 'social security', so that the population would be protected from the 'cradle to the grave'.","p":1,"o":[["A social security system for everyone",1],["State pension",0],["The NHS",1],["Employment benefits",0]]},{"g":933,"t":"Which of the following is a fundamental principle of British life?","e":"The fundamental principles of British life include: Democracy; The rule of law; Individual liberty; Tolerance of those with different faiths and beliefs; Participation in community life.","p":3,"o":[["Intolerance",0],["Inequality",0],["Extremism",0],["Individual liberty",1]]},{"g":934,"t":"Which comedy double act by Nick Park won many Oscars?","e":"Nick Park, who has won four Oscars for his animated films, including three for films featuring Wallace and Gromit.","p":0,"o":[["Gavin and Stacey",0],["Laurel and Hardy",0],["Wallace and Gromit",1],["Thelma and Louise",0]]},{"g":935,"t":"How many member states does the Commonwealth have?","e":"The Monarch (King Charles III) is the ceremonial head of the Commonwealth, which currently has 56 (can change) member states.","p":2,"o":[["27",0],["190",0],["56",1],["5",0]]}]},{"n":40,"name":"Life in the UK Test 40","q":[{"g":936,"t":"When is Christmas Eve?","e":"Christmas Day is on the 25th of December. Christmas Eve is the day before that which is the 24th of December.","p":0,"o":[["23rd of December",0],["24th of December",1],["25th of December",0],["26th of December",0]]},{"g":937,"t":"What is the system that automatically deducts tax called?","e":"This system that deducts tax automatically is called 'Pay As You Earn', also known as PAYE.","p":2,"o":[["Self-Assessment",0],["PAYE",1],["PAYG",0],["HMRC",0]]},{"g":938,"t":"Where did the ancestors of the first farmers come from?","e":"The first farmers came to Britain 6,000 years ago. The ancestors of these first farmers probably came from south-east Europe.","p":1,"o":[["North Europe",0],["South-East Europe",1],["North-East Europe",0],["North-West Europe",0]]},{"g":939,"t":"Where is Loch Lomond located?","e":"Loch Lomond is the largest expanse of freshwater in mainland Britain and probably the best-known part of the park. It is located in Scotland.","p":0,"o":[["Northern Ireland",0],["Scotland",1],["England",0],["Wales",0]]},{"g":940,"t":"When were films first shown in the UK?","e":"Films were first shown publicly in the UK in 1896 and film screenings very quickly became popular.","p":0,"o":[["1894",0],["1896",1],["1901",0],["1902",0]]},{"g":941,"t":"When did the Parliament begin developing into the institution it is now?","e":"In the Middle Ages, Parliament began to develop into the institution it is today. Its origins can be traced to the king's council of advisers, which included important noblemen and the leaders of the Church.","p":1,"o":[["During the Industrial Revolution",0],["During the Middle Ages",1],["During the Bronze Age",0],["During the Iron Age",0]]},{"g":942,"t":"Who set up the first formal anti-slavery campaigns?","e":"The first formal anti-slavery groups were set up by the Quakers in the late 1700s, and they petitioned Parliament to ban the practice.","p":1,"o":[["Roundheads",0],["The Quakers",1],["Cavaliers",0],["Jacobites",0]]},{"g":943,"t":"What type of painter was Joseph Turner?","e":"Joseph Turner (1775-1851) was an influential landscape painter in a modern style. He is considered the artist who raised the profile of landscape painting.","p":0,"o":[["Stained Glass",0],["Landscape",1],["Portrait",0],["Abstract Sculpture",0]]},{"g":944,"t":"When was the Magna Carta established?","e":"There were few formal limits to the king's power until 1215. In that year, King John was forced by his noblemen to agree to a number of demands. The result was a charter of rights called the Magna Carta (which means the Great Charter). The Magna Carta established the idea that even the king was subject to the law. It protected the rights of the nobility and restricted the king's power to collect taxes or to make or change laws.","p":1,"o":[["1415",0],["1215",1],["1314",0],["1516",0]]},{"g":945,"t":"What is the Mercury Music Prize awarded for?","e":"The Mercury Music Prize is awarded each September for the best album from the UK and Ireland. The Brit Awards is an annual event that gives awards in a range of categories, such as best British group and best British solo artist.","p":0,"o":[["The best music producer in the UK and Ireland",0],["The best classical song in the UK and Ireland",0],["The best song in the UK and Ireland",0],["The best album from the UK and Ireland",1]]},{"g":946,"t":"What percentage of the total population lives in Scotland?","e":"The population is very unequally distributed over the four parts of the UK. England more or less consistently makes up 84% of the total population, Wales around 5%, Scotland just over 8% and Northern Ireland less than 3%.","p":0,"o":[["21%",0],["8%",1],["2%",0],["14%",0]]},{"g":947,"t":"Who should you write to if you wish to make a complaint about the Police?","e":"Anyone can make a complaint about the police by going to a police station or writing to the Chief Constable of the police force involved.","p":2,"o":[["The House of Commons",0],["The House of Lords",0],["The Chief Constable",1],["Your local MP",0]]},{"g":948,"t":"How many members does the Scottish Parliament have?","e":"There are 129 members of the Scottish Parliament (MSPs), elected by a form of proportional representation. The Scottish Parliament can pass laws for Scotland on all matters which are not specifically reserved to the UK Parliament. The matters on which the Scottish Parliament can legislate include: civil and criminal law, health, education, planning, additional tax-raising powers.","p":2,"o":[["76",0],["129",1],["108",0],["94",0]]},{"g":949,"t":"When was Charles I executed?","e":"The king's army was defeated at the Battles of Marston Moor and Naseby. By 1646, it was clear that Parliament had won the war. Charles was held prisoner by the parliamentary army. He was still unwilling to reach any agreement with Parliament and in 1649 he was executed.","p":1,"o":[["1649",1],["1646",0],["1658",0],["1653",0]]},{"g":950,"t":"What kind of event is The Wimbledon Championship?","e":"Tennis evolved in England in the late 19th century. The first tennis club was founded in Leamington Spa in 1872. The most famous tournament hosted in Britain is The Wimbledon Championships, which takes place each year at the All England Lawn Tennis and Croquet Club. It is the oldest tennis tournament in the world and the only 'Grand Slam' event played on grass.","p":0,"o":[["Cricket",0],["Rugby",0],["Tennis",1],["Water sport",0]]},{"g":951,"t":"Who wrote the popular operas HMS Pinafore, The Pirates of Penzance and the Mikado?","e":"In the 19th century, Gilbert and Sullivan wrote comic operas, often making fun of popular culture and politics. These operas include HMS Pinafore, The Pirates of Penzance and The Mikado.","p":0,"o":[["Tim Rice",0],["Laurence Olivier",0],["Gilbert and Sullivan",1],["Andrew Webber",0]]},{"g":952,"t":"Local councils, in the UK, are often called local authorities","e":"The statement is correct","p":2,"o":[["True",1],["False",0]]},{"g":953,"t":"James Watt was famous for his work on what?","e":"James Watt's work on steam power, helped the progress of the Industrial Revolution.","p":0,"o":[["Radio",0],["Steam Power",1],["Human nature",0],["Economics",0]]},{"g":954,"t":"The Boer War of 1899 to 1902 established the idea that the British Empire is a force for good","e":"The Boer War of 1899 to 1902 made the discussions about the future of the Empire more urgent. The British went to war in South Africa with settlers from the Netherlands called the Boers. The Boers fought fiercely and the war went on for over three years. Many died in the fighting and many more from disease. There was some public sympathy for the Boers and people began to question whether the Empire could continue.","p":1,"o":[["True",0],["False",1]]},{"g":955,"t":"Who is the author of 'Charlie and the Chocolate Factory'?","e":"Roald Dahl was born in Wales to Norwegian parents. He served in the Royal Air Force during the Second World War. His best-known works include Charlie and the Chocolate Factory and George's Marvellous Medicine.","p":1,"o":[["Roald Dahl",1],["Charles Dickens",0],["Jane Kipling",0],["J.R.R. Tolkien",0]]},{"g":956,"t":"In which year did John Logie Baird make the first TV broadcast between Glasgow and London?","e":"The television was developed by Scotsman John Logie Baird (1888-1946) in the 1920s. In 1932 he made the first television broadcast between London and Glasgow.","p":1,"o":[["1945",0],["1932",1],["1955",0],["1920",0]]},{"g":957,"t":"Who founded a monastery on the Island of Iona?","e":"Missionaries from Ireland spread the religion in the north. The most famous of these were St Patrick, who would become the patron saint of Ireland, and St Columba, who founded a monastery on the island of Iona, off the coast of what is now Scotland. St Augustine led missionaries from Rome, who spread Christianity in the south. St Augustine became the first Archbishop of Canterbury.","p":1,"o":[["St Patrick",0],["St Andrew",0],["St Columba",1],["St Augustine",0]]},{"g":958,"t":"Which stories are associated with Geoffrey Chaucer?","e":"In the years leading up to 1400, Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. The people decided to tell each other stories on the journey, and the poems describe the travellers and some of the stories they told. This collection of poems is called The Canterbury Tales.","p":1,"o":[["The Eastend Tales",0],["The Westend Tales",0],["The London Tales",0],["The Canterbury Tales",1]]},{"g":959,"t":"The BBC is controlled by the UK government","e":"The BBC is the largest broadcaster in the world. It is the only wholly state-funded media organisation that is independent of government. Other UK channels are primarily funded through advertisements and subscriptions.","p":0,"o":[["False",1],["True",0]]}]},{"n":41,"name":"Life in the UK Test 41","q":[{"g":960,"t":"The UK government has used the power to suspend the Northern Ireland Assembly","e":"Since 1997, some powers have been devolved from the central government to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them. There has been a Welsh Assembly and a Scottish Parliament since 1999. There is also a Northern Ireland Assembly, although this has been suspended on a few occasions.","p":2,"o":[["True",1],["False",0]]},{"g":961,"t":"Where was Robert Burns from?","e":"Robert Burns is a famous Scottish Poet","p":0,"o":[["Northern Ireland",0],["Scotland",1],["Wales",0],["England",0]]},{"g":962,"t":"Where did the engineers come from in the middle ages?","e":"People came to England from abroad to trade and also to work. Engineers came from Germany.","p":1,"o":[["Holland",0],["Germany",1],["France",0],["Italy",0]]},{"g":963,"t":"Which party did Margaret Thatcher belong to?","e":"Margaret Thatcher, Britain's first woman Prime Minister, led the Conservative government from 1979 to 1990.","p":1,"o":[["Labour",0],["UKIP",0],["Conservative",1],["Liberal Democrats",0]]},{"g":964,"t":"Who is a Patron St of Scotland?","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":0,"o":[["St Patrick",0],["St Andrew",1],["St David",0],["St George",0]]},{"g":965,"t":"Who lost a lot of their power after the Battle of Culloden in 1746?","e":"The clans lost a lot of their power and influence after Culloden. Chieftains became landlords if they had the favour of the English king, and clansmen became tenants who had to pay for the land they used.","p":1,"o":[["The Farmers",0],["The Clans",1],["The King",0],["The Parliament",0]]},{"g":966,"t":"What medal was introduced during the Crimean War?","e":"Queen Victoria introduced the Victoria Cross medal during the Crimean war. It honours acts of valour by soldiers.","p":1,"o":[["Elizabeth gold",0],["Medal of Honour",0],["The Elizabeth Medal",0],["The Victoria Cross",1]]},{"g":967,"t":"What is the day before Lent called?","e":"The 40 days before Easter are known as Lent. The day before Lent starts is called Shrove Tuesday, or Pancake Day.","p":0,"o":[["Pancake Day",1],["Easter Monday",0],["Ash Wednesday",0],["Shrove Monday",0]]},{"g":968,"t":"What were the refugees that came from France called?","e":"Between 1680 and 1720 many refugees called Huguenots came from France. They were Protestants and had been persecuted for their religion.","p":1,"o":[["Jacobites",0],["Huguenots",1],["Cavaliers",0],["Roundheads",0]]},{"g":969,"t":"When did the first professional football clubs form?","e":"Football is the UK's most popular sport. It has a long history in the UK and the first professional football clubs were formed in the late 19th century.","p":0,"o":[["19th century",1],["20th century",0],["17th century",0],["18th century",0]]},{"g":970,"t":"What is 'Snowdon'?","e":"Snowdonia is a national park in North Wales. It covers an area of 838 square miles (2,170 square kilometres). Its most well-known landmark is Snowdon, which is the highest mountain in Wales.","p":0,"o":[["A castle",0],["A garden",0],["A lake",0],["A mountain",1]]},{"g":971,"t":"Where is the Cenotaph located?","e":"At 11.00 am there is a two-minute silence and wreaths are laid at the Cenotaph in Whitehall, London.","p":0,"o":[["Derbyshire",0],["New Delhi",0],["Dorset",0],["Whitehall",1]]},{"g":972,"t":"What created The Kingdom of Great Britain in 1707?","e":"The Act of Union, known as the Treaty of Union in Scotland, was agreed in 1707, creating the Kingdom of Great Britain.","p":1,"o":[["The Bill of Rights",0],["The Act of Union",1],["The Kingdom Act",0],["The act of Government of Wales",0]]},{"g":973,"t":"The UN was set up straight after the First World War. It now has over 190 countries as members","e":"The UK is part of the United Nations (UN), an international organisation with more than 190 countries as members. The UN was set up after the Second World War and aims to prevent war and promote international peace and security. There are 15 members on the UN Security Council, which recommends action when there are international crises and threats to peace. The UK is one of five permanent members of the Security Council.","p":2,"o":[["True",0],["False",1]]},{"g":974,"t":"When did the First World War end?","e":"The First World War ended at 11.00 am on 11th November 1918 with victory for Britain and its allies.","p":1,"o":[["1916",0],["1919",0],["1918",1],["1917",0]]},{"g":975,"t":"Choose TWO examples of a civil law offence","e":"Examples of civil laws are - Housing law: this includes disputes between landlords and tenants over issues such as repairs and eviction; Consumer rights: an example of this is a dispute about faulty goods or services; Employment law: these cases include disputes over wages and cases of unfair dismissal or discrimination in the workplace; Debt: people might be taken to court if they owe money to someone.","p":2,"o":[["Theft and assault",0],["Disputes between landlords and tenants",1],["Murder, racial crime",0],["Unfair dismissal or discrimination in the workplace",1]]},{"g":976,"t":"In what year was Germany comprehensively defeated by the Allies during the WWII?","e":"Following victory on the beaches of Normandy, the allied forces pressed on through France and eventually into Germany. The Allies comprehensively defeated Germany in May 1945.","p":1,"o":[["Jun-46",0],["May-39",0],["May-45",1],["Apr-44",0]]},{"g":977,"t":"By law, radio and television coverage of the political parties must be _____ , so equal time has to be given to rival viewpoints","e":"By law, radio and television coverage of the political parties must be balanced, so equal time has to be given to rival viewpoints.","p":2,"o":[["Classified",0],["Loyal",0],["Balanced",1],["Ethical",0]]},{"g":978,"t":"Which of these athletes is a Paralympian who won gold medals for swimming?","e":"Ellie Simmonds (1994-) is a Paralympian who won gold medals for swimming at the 2008 and 2012 Paralympic Games and holds a number of world records. She was the youngest member of the British team at the 2008 Games.","p":0,"o":[["Jessica Ennis",0],["Baroness Tanni Grey-Thompson",0],["David Weir",0],["Ellie Simmonds",1]]},{"g":979,"t":"Throughout the 1990s, Britain played a leading role in coalition forces involved in the liberation of Kuwait","e":"Throughout the 1990s, Britain played a leading role in coalition forces involved in the liberation of Kuwait, following the Iraqi invasion in 1990, and the conflict in the Former Republic of Yugoslavia. Since 2000, British armed forces have been engaged in the global fight against international terrorism and against the proliferation of weapons of mass destruction, including operations in Afghanistan and Iraq.","p":1,"o":[["True",1],["False",0]]},{"g":980,"t":"Which novel is the satirical novelist Evelyn Waugh best known for?","e":"Evelyn Waugh (1903-66) wrote satirical novels, including Decline and Fall and Scoop. He is perhaps best known for Brideshead Revisited.","p":1,"o":[["Brideshead Revisited",1],["Romeo and Juliet",0],["The Harry Potter Series",0],["Lord of the Rings",0]]},{"g":981,"t":"Which TWO are major political parties in the UK?","e":"The Conservative Party, the Labour Party, the Liberal Democrats are big political parties","p":2,"o":[["Democrats",0],["Labour Party",1],["Republicans",0],["Conservative Party",1]]},{"g":982,"t":"Complaints against the Police can only be made by writing to the Police Complaints Commissioner","e":"Anyone can make a complaint about the police by going to a police station or writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland.","p":2,"o":[["True",0],["False",1]]},{"g":983,"t":"The UK government hasn't used the power to suspend the Northern Ireland Assembly","e":"Since 1997, some powers have been devolved from the central government to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them. There has been a Welsh Assembly and a Scottish Parliament since 1999. There is also a Northern Ireland Assembly, although this has been suspended on a few occasions.","p":2,"o":[["False",1],["True",0]]}]},{"n":42,"name":"Life in the UK Test 42","q":[{"g":984,"t":"Who built the Tower of London?","e":"The Tower of London was built by William the Conqueror after he became king in 1066.","p":1,"o":[["Henry VIII",0],["Henry VII",0],["William the Conqueror",1],["Oliver Cromwell",0]]},{"g":985,"t":"Where is the best preserved prehistoric village 'Skara Brae on Orkney' located?","e":"Skara Brae on Orkney, off the north coast of Scotland, is the best preserved prehistoric village in northern Europe, and has helped archaeologists to understand more about how people lived near the end of the Stone Age.","p":1,"o":[["England",0],["Wales",0],["Ireland",0],["Scotland",1]]},{"g":986,"t":"What do you require by law to watch TV using any medium?","e":"If you watch or record live TV programmes on any channel, or download or watch BBC programmes on BBC iPlayer on any digital devices, you need to be covered by a TV Licence.","p":0,"o":[["The Internet",0],["A TV",0],["A valid TV licence",1],["An Antenna",0]]},{"g":987,"t":"Who became the first Briton to win the Tour de France?","e":"Bradley Wiggins (1980-) is a cyclist. In 2012, he became the first Briton to win the Tour de France. He has won seven Olympic medals, including gold medals in the 2004, 2008 and 2012 Olympic Games.","p":0,"o":[["Bradley Wiggins",1],["Andy Murray",0],["Mo Farah",0],["Sir Chris Hoy",0]]},{"g":988,"t":"How many years did Mary, the Queen of Scots spend in prison?","e":"Mary was Elizabeth I's cousin and hoped that Elizabeth might help her, but Elizabeth suspected Mary of wanting to take over the English throne, and kept her a prisoner for 20 years. Mary was eventually executed, accused of plotting against Elizabeth I.","p":1,"o":[["30",0],["11",0],["4",0],["20",1]]},{"g":989,"t":"The Scottish Parliament was formed in 1998 and sits in Edinburgh","e":"The Scottish Parliament was formed in 1999.","p":2,"o":[["False",1],["True",0]]},{"g":990,"t":"Who requested to write The Domesday book?","e":"William sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book. It still exists today and gives a picture of society in England just after the Norman Conquest.","p":1,"o":[["Edward I",0],["William the Conqueror",1],["Kenneth Macalpin",0],["King Alfred the Great",0]]},{"g":991,"t":"Since the Middle Ages, when did the first Jews come to Britain to settle in London?","e":"The first Jews to come to Britain since the Middle Ages settled in London in 1656.","p":1,"o":[["1652",0],["1680",0],["1656",1],["1646",0]]},{"g":992,"t":"The British constitution is described as 'unwritten'","e":"The British constitution is not written down in any single document, and therefore it is described as 'unwritten'. This is mainly because the UK, unlike America or France, has never had a revolution which led permanently to a totally new system of government. Our most important institutions have developed over hundreds of years.","p":1,"o":[["False",0],["True",1]]},{"g":993,"t":"Which TWO roles are school governors and school boards responsible for?","e":"Governors and school boards have an important part to play in raising school standards. They have three key roles: setting the strategic direction of the school, ensuring accountability, monitoring and evaluating school performance.","p":2,"o":[["Monitoring and evaluating school performance",1],["Setting the strategic direction of the school",1],["Doing outdoor activities",0],["Raising money",0]]},{"g":994,"t":"What is the origin of Parliament?","e":"In the Middle Ages, Parliament began to develop into the institution it is today. Its origins can be traced to the king's council of advisers, which included important noblemen and the leaders of the Church.","p":1,"o":[["The Noblemen's council of governance",0],["The Church's system of governance",0],["The King's council of advisers",1],["The Knights' round table",0]]},{"g":995,"t":"There are charities which may help people who cannot afford to pay for a vet","e":"Vaccinations and medical treatment for animals are available from veterinary surgeons (vets). There are charities which may help people who cannot afford to pay a vet.","p":0,"o":[["True",1],["False",0]]},{"g":996,"t":"What are TWO of the roles of the House of Lords?","e":"The House of Lords can suggest amendments or propose new laws, which are then discussed by MPs. It checks laws that have been passed by the House of Commons to ensure they are fit for purpose. It also holds the government to account to make sure that it is working in the best interests of the people.","p":2,"o":[["Scrutinise and comment on what the government is doing",0],["Check laws that have been passed to ensure that they are fit for purpose",1],["Suggest amendments or propose new laws, which are then discussed by the MPs",1],["Represent everyone in their constituency",0]]},{"g":997,"t":"Who was made a Dame of the British Empire in 2000?","e":"Born in Manchester, Mary Peters moved to Northern Ireland as a child. She was a talented athlete who won an Olympic gold medal in the pentathlon in 1972. After this, she raised money for local athletics and became the team manager for the women's British Olympic team. She continues to promote sport and tourism in Northern Ireland and was made a Dame of the British Empire in 2000 in recognition of her work.","p":0,"o":[["Dame Kelly Holmes",0],["Mary Peters",1],["Jayne Torvill",0],["Dame Ellen MacArthur",0]]},{"g":998,"t":"Which TWO will you be agreeing with when applying to become a permanent resident?","e":"You should accept all responsibilities that come with permanent residency and fundamental principles of British life","p":3,"o":[["To accept the responsibilities which come with 'Settlement'",1],["To support the Coalition Government",0],["To remain in the UK forever",0],["To respect the law, values and traditions of the UK",1]]},{"g":999,"t":"Which of the following is associated with the Elizabethan period in England?","e":"The Elizabethan period in England was a time of growing patriotism: a feeling of pride in being English. The Elizabethan period is also remembered for the richness of its poetry and drama, especially the plays and poems of William Shakespeare.","p":1,"o":[["Scientific movement",0],["Civil wars",0],["Growing patriotism",1],["Women rights",0]]},{"g":1000,"t":"Which TWO of the following are examples of criminal law?","e":"Examples of criminal laws are: Carrying a weapon; Selling or buying illegal drugs; Racial crime; Selling tobacco; Smoking in public places; Buying alcohol; Drinking in public.","p":2,"o":[["Disputes about faulty goods",0],["Racial crime",1],["Selling tobacco to anyone under the age of 18",1],["Discrimination in the workplace",0]]},{"g":1001,"t":"Which king defeated the Vikings?","e":"The Anglo-Saxon kingdoms in England united under King Alfred the Great, who defeated the Vikings. Many of the Viking invaders stayed in Britain - especially in the east and north of England, in an area known as the Danelaw","p":1,"o":[["King William the Conqueror",0],["King Robert the Bruce",0],["King Alfred the Great",1],["King Harold",0]]},{"g":1002,"t":"Who receives ambassadors and high commissioners, entertains visiting heads of state and makes state visits overseas in support of diplomatic and economic relationships with other countries?","e":"The Monarch (King Charles III) represents the UK to the rest of the world. He receives foreign ambassadors and high commissioners, entertains visiting heads of state, and makes state visits overseas in support of diplomatic and economic relationships with other countries.","p":2,"o":[["The Monarch",1],["The Speaker",0],["The Prime Minister",0],["The Foreign Secretary",0]]},{"g":1003,"t":"The devolved administrations each have their own civil service","e":"The devolved administrations each have their own civil service.","p":2,"o":[["True",1],["False",0]]},{"g":1004,"t":"What is known as 'canvassing'?","e":"Political parties are particularly busy at election times. Members work hard to persuade people to vote for their candidates - for instance, by handing out leaflets in the street or by knocking on people's doors and asking for their support.","p":0,"o":[["Persuade people to vote for the party you represent",1],["Filling in the ballot paper for those who cannot do it themselves",0]]},{"g":1005,"t":"What is your responsibility as UK citizen? Select TWO answers.","e":"Although Britain is one of the world's most diverse societies, there is a set of shared values and responsibilities that everyone can agree with. These values and responsibilities include: to obey and respect the law; to be aware of the rights of others and respect those rights; to treat others with fairness; to behave responsibly; to help and protect your family; to respect and preserve the environment; to treat everyone equally, regardless of sex, race, religion, age, disability, class or sexual orientation; to work to provide for yourself and your family; to help others; to vote in local and national government elections.","p":3,"o":[["To vote in local and national government elections",1],["To earn money",0],["To go to your local pub",0],["To help and protect your family",1]]},{"g":1006,"t":"Which of the following is part of the UK?","e":"The United Kingdom consists of Wales,England,Scotland and Northern Ireland.","p":4,"o":[["Wales",1],["Canada",0],["Channel Islands",0],["St Helena",0]]},{"g":1007,"t":"When is Boxing Day?","e":"Boxing Day (26th of December) is the day after Christmas Day (25th of December) and is a public holiday.","p":0,"o":[["The day after Christmas Day",1],["The day before Easter",0],["The day after Easter",0],["The day before Christmas Day",0]]}]},{"n":43,"name":"Life in the UK Test 43","q":[{"g":1008,"t":"Who appoints 'Life peers'?","e":"Life peers are appointed by the monarch on the advice of the Prime Minister.","p":2,"o":[["The Speaker",0],["The Monarch",1],["The Prime Minister",0],["The Shadow Cabinet",0]]},{"g":1009,"t":"Where did Charles II hide to escape from Cromwell's army?","e":"Charles II escaped from Worcester, famously hiding in an oak tree on one occasion, and eventually fled to Europe.","p":1,"o":[["In a house",0],["In an oak tree",1],["In a Church",0],["In a garden",0]]},{"g":1010,"t":"Which General remains a controversial figure in Ireland?","e":"Cromwell was successful in establishing the authority of the English Parliament in Ireland but did this with such violence that even today Cromwell remains a controversial figure.","p":1,"o":[["Nelson",0],["Oliver Cromwell",1],["Francis Drake",0],["James Cook",0]]},{"g":1011,"t":"What is MP's responsibility?","e":"MPs have a number of different responsibilities. They: represent everyone in their constituency, help to create new laws, scrutinise and comment on what the government is doing, debate important national issues.","p":2,"o":[["To point out failures",0],["To represent everyone in their constituency",1],["To represent everyone in the UK",0],["To get as many votes as possible",0]]},{"g":1012,"t":"What was 'Shampooing' when it was first introduced?","e":"Mahomet and his wife also introduced 'shampooing', the Indian art of head massage, to Britain.","p":1,"o":[["Washing your head with soap",0],["Cleaning your hair",0],["The Indian art of head massage",1],["The Indian art of washing",0]]},{"g":1013,"t":"How many AMs does the Welsh government have?","e":"The Welsh government and National Assembly for Wales are based in Cardiff, the capital city of Wales. The National Assembly (Senedd) consists of 60 elected Assembly members (AMs) and elections are held every four years using a form of proportional representation. Members can speak in either Welsh or English and all of the Assembly’s publications are in both languages.","p":2,"o":[["129",0],["60",1],["92",0],["108",0]]},{"g":1014,"t":"Where do you have to be registered to be able to vote?","e":"To be able to vote in a parliamentary, local or European election, you must have your name on the electoral register.","p":2,"o":[["The UK database",0],["The electoral register",1],["The UK registry",0],["The Home office",0]]},{"g":1015,"t":"Who designed the Dumfries House in Scotland?","e":"In the 18th century, simpler designs became popular. The Scottish architect Robert Adam influenced the development of architecture in the UK, Europe and America. He designed the inside decoration as well as the building itself in great houses such as Dumfries House in Scotland. His ideas influenced architects in cities such as Bath, where the Royal Crescent was built.","p":0,"o":[["Inigo Jones",0],["Robert Adam",1],["Sir Christopher Wren",0],["Sir Edwin Lutyens",0]]},{"g":1016,"t":"How many crosses does the Union flag have?","e":"The Union Flag consists of three crosses: The cross of St George, patron saint of England, is a red cross on a white ground; The cross of St Andrew, patron saint of Scotland, is a diagonal white cross on a blue ground; The cross of St Patrick, patron saint of Ireland, is a diagonal red cross on a white ground.","p":1,"o":[["4",0],["5",0],["3",1],["2",0]]},{"g":1017,"t":"Which TWO are part of the Government?","e":"In the UK, there are several different parts of government. The main ones are: the monarchy, Parliament (the House of Commons and the House of Lords), the Prime Minister, the cabinet, the judiciary (courts) ,the police, the civil service, local government.","p":2,"o":[["Local people",0],["The civil service",1],["The parliament",1],["Local business",0]]},{"g":1018,"t":"What was the name of plague that killed one third of the population of England in 1348?","e":"In 1348, a disease, probably a form of plague called 'the Black Death', came to Britain.","p":1,"o":[["The White Death",0],["The Black Death",1],["Bird Flu",0],["The Pale Flu",0]]},{"g":1019,"t":"Names of places, such as Grimsby and Scunthorpe come from which language?","e":"Many places names, such as Grimsby and Scunthorpe, come from the Viking languages","p":1,"o":[["Viking",1],["Saxon",0],["Norman",0],["Celtic",0]]},{"g":1020,"t":"What profession was Florence Nightingale famous for?","e":"At the age of 31, Florence Nightingale trained as a nurse in Germany. In 1854, she went to Turkey and worked in military hospitals, treating soldiers who were fighting in the Crimean War.","p":1,"o":[["Political Leader",0],["Painter",0],["Gardener",0],["Nurse",1]]},{"g":1021,"t":"Which ship was one of the first to circumnavigate the world?","e":"Sir Francis Drake, one of the commanders in the defeat of the Spanish Armada, was one of the founders of England's naval tradition. His ship, the Golden Hind, was one of the first to sail right around ('circumnavigate') the world.","p":1,"o":[["HMS Victory",0],["Golden Hind",1],["The Ship of Royals",0],["Royal Yacht Britannia",0]]},{"g":1022,"t":"What country is Swansea in?","e":"Swansea is a Welsh city.","p":0,"o":[["Scotland",0],["Wales",1],["Northern Ireland",0],["England",0]]},{"g":1023,"t":"Who led a team of scientists to develop the atomic bomb?","e":"Scientists led by Ernest Rutherford, working at Manchester and then Cambridge University, were the first to 'split the atom' and took part in the Manhattan Project in the United States, which developed the atomic bomb.","p":1,"o":[["Ernest Rutherford",1],["Sir John Lavery",0],["Isaac Newton",0],["Dylan Thomas",0]]},{"g":1024,"t":"The Restoration' refers to the reestablishment of Roman Catholicism","e":"In May 1660, Parliament invited Charles II to come back from exile in the Netherlands. He was crowned King Charles II of England, Wales, Scotland and Ireland. Charles II made it clear that he had 'no wish to go on his travels again'. There was a restoration of the monarchy.","p":1,"o":[["True",0],["False",1]]},{"g":1025,"t":"In Youth Courts, the name or photographs of the accused young person can be published in newspapers or used by the media","e":"Members of the public are not allowed in Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media.","p":2,"o":[["False",1],["True",0]]},{"g":1026,"t":"Which TWO principles are included in the European Convention on Human Rights?","e":"Some of the principles included in the European Convention on Human Rights are: right to life; prohibition of torture; prohibition of slavery and forced labour; right to liberty and s
