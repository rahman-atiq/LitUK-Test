been nominated to represent one of the major political parties.","p":2,"o":[["True",0],["False",1]]},{"g":599,"t":"You are not responsible for cleaning up after your pet in public places","e":"The owner is responsible for keeping the dog under control and for cleaning up after the animal in a public place.","p":0,"o":[["False",1],["True",0]]}]},{"n":26,"name":"Life in the UK Test 26","q":[{"g":600,"t":"Who was Henry Purcell?","e":"Henry Purcell (1659-95) was the organist at Westminster Abbey. He wrote church music and operas.","p":0,"o":[["A gardener",0],["An actor",0],["A poet",0],["A musician",1]]},{"g":601,"t":"What is the responsibility that you have as a UK citizen?","e":"Flowing from the fundamental principles are responsibilities and freedoms which are shared by all those living in the UK and which we expect all residents to respect. If you wish to be a permanent resident or citizen of the UK, you should: respect and obey the law; respect the rights of others, including their right to their own opinions; treat others with fairness; look after yourself and your family; look after the area in which you live and the environment.","p":3,"o":[["Keeping an allotment",0],["Going to the cinema",0],["Going to the library",0],["Look after yourself and your family",1]]},{"g":602,"t":"How many members does a jury have in Scotland?","e":"In England, Wales and Northern Ireland a jury has 12 members, and in Scotland a jury has 15 members.","p":2,"o":[["15",1],["12",0],["13",0],["14",0]]},{"g":603,"t":"How many member states does the UN have?","e":"The UK is part of the United Nations (UN), an international organisation with more than 190 countries as members.","p":2,"o":[["190",1],["15",0],["5",0],["27",0]]},{"g":604,"t":"Which is an example of a Civil Offence?","e":"Examples of civil laws are - Housing law: this includes disputes between landlords and tenants over issues such as repairs and eviction; Consumer rights: an example of this is a dispute about faulty goods or services; Employment law: these cases include disputes over wages and cases of unfair dismissal or discrimination in the workplace; Debt: people might be taken to court if they owe money to someone.","p":2,"o":[["Carrying a weapon",0],["Smoking in public places",0],["Selling Tobacco to under 18's",0],["Discrimination in the workplace",1]]},{"g":605,"t":"Who built the Hadrian's Wall to keep out the Picts?","e":"Areas of what is now Scotland were never conquered by the Romans, and the Emperor Hadrian built a wall in the north of England to keep out the Picts (ancestors of the Scottish people).","p":1,"o":[["Henry Hadrian",0],["Emperor Hadrian",1],["Sutton Hoo",0],["King Alfred the Great",0]]},{"g":606,"t":"What is Diwali often called?","e":"Diwali normally falls in October or November and lasts for five days. It is often called the Festival of Lights. It is celebrated by Hindus and Sikhs. It celebrates the victory of good over evil and the gaining of knowledge. There are different stories about how the festival came about. There is a famous celebration of Diwali in Leicester.","p":0,"o":[["The Festival of Love",0],["The Festival of Lights",1],["The Festival of the Sun",0],["The Festival of Fire",0]]},{"g":607,"t":"What is the maximum fine if you watch TV without a valid TV licence?","e":"You will receive a fine of up to £1,000 if you watch TV but do not have a TV licence.","p":0,"o":[["£1,000",1],["£500",0],["£3,000",0],["£2,000",0]]},{"g":608,"t":"What county does Stonehenge stand in?","e":"Stonehenge, still stands in what is now the English county of Wiltshire. Stonehenge was probably a special gathering place for seasonal ceremonies.","p":1,"o":[["Berkshire",0],["Lancashire",0],["Lothians",0],["Wiltshire",1]]},{"g":609,"t":"What does the York Minster have?","e":"York Minster had windows of stained glass, telling stories about the Bible and Christian saints.","p":1,"o":[["Stained Glass",1],["Stained Bricks",0],["Stained Limestone",0],["Stained Wood",0]]},{"g":610,"t":"Which was a crucial aerial battle against the Germans?","e":"The Germans waged an air campaign against Britain, but the British resisted with their fighter planes and eventually won the crucial aerial battle against the Germans, called 'the Battle of Britain'.","p":1,"o":[["The Blitz spirit",0],["The Battle of Britain",1],["The Dunkirk spirit",0],["D-Day",0]]},{"g":611,"t":"By which year did the English rule an area around Dublin called the Pale?","e":"At the beginning of the Middle Ages, Ireland was an independent country. The English first went to Ireland as troops to help the Irish king and remained to build their own settlements. By 1200, the English ruled an area of Ireland known as the Pale, around Dublin. Some of the important lords in other parts of Ireland accepted the authority of the English king.","p":1,"o":[["1400",0],["1100",0],["1200",1],["1300",0]]},{"g":612,"t":"Who appoints the members of the Cabinet?","e":"The Prime Minister appoints about 20 senior MPs to become ministers in charge of departments which together form the cabinet.","p":2,"o":[["The Prime Minister",1],["The Monarch",0],["The Speaker",0],["The people of the UK",0]]},{"g":613,"t":"When were women given the right to vote at the same age as men?","e":"In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War. Shortly before Emmeline's death in 1928, women were given the right to vote at the age of 21, the same as men.","p":1,"o":[["1928",1],["1969",0],["1832",0],["1918",0]]},{"g":614,"t":"Which house won the War of the Roses?","e":"The war ended with the Battle of Bosworth Field in 1485. King Richard III of the House of York was killed in the battle and Henry Tudor, the leader of the House of Lancaster, became King Henry VII.","p":1,"o":[["The House of Lancaster",1],["The House of Commons",0],["The House of York",0],["The House of Lords",0]]},{"g":615,"t":"How often are Elections for the European parliament held?","e":"Elections for the European Parliament are also held every five years. Elected members are called members of the European Parliament (MEPs).","p":2,"o":[["Every 5 years",1],["Every 6 years",0],["Every 4 years",0],["Every 3 years",0]]},{"g":616,"t":"Which TWO materials did the UK produce more than half of the world in the 19th century?","e":"British industry led the world in the 19th century. The UK produced more than half of the world's iron, coal and cotton cloth.","p":1,"o":[["Cotton Cloth",1],["Potatoes",0],["Bronze",0],["Iron",1]]},{"g":617,"t":"When was a Turing machine invented?","e":"A Turing machine is a theoretical mathematical device invented by Alan Turing (1912-54), a British mathematician, in the 1930s. The theory was influential in the development of computer science and the modern-day computer.","p":1,"o":[["1950s",0],["1930s",1],["1910s",0],["1970s",0]]},{"g":618,"t":"Queen Elizabeth II was married to Prince Phillip","e":"The statement is true","p":0,"o":[["True",1],["False",0]]},{"g":619,"t":"The leader of the Opposition usually becomes Prime Minister if his or her party wins the next General Election","e":"The second-largest party in the House of Commons is called the opposition. The leader of the opposition usually becomes Prime Minister if his or her party wins the next General Election.","p":2,"o":[["True",1],["False",0]]},{"g":620,"t":"It is illegal for shops and businesses to not accept the banknotes of Northern Ireland and Scotland","e":"Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK. However, shops and businesses do not have to accept them.","p":2,"o":[["True",0],["False",1]]},{"g":621,"t":"The devolved governments do not have the power to legislate on any issues but can advise and encourage","e":"Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control. However, many other public services, such as education, are controlled by the devolved administrations.","p":2,"o":[["False",1],["True",0]]},{"g":622,"t":"The anthem 'God save the King/Queen' can only be played in presence of the Monarch","e":"You can play the Anthem in anyone's presence","p":2,"o":[["True",0],["False",1]]},{"g":623,"t":"What is the Cenotaph associated with?","e":"After the First World War, Sir Edwin Lutyens was responsible for many war memorials throughout the world, including the Cenotaph in Whitehall. The Cenotaph is the site of the annual Remembrance Day service attended by the Queen/King, politicians and foreign ambassadors","p":0,"o":[["Park",0],["War Memorial",1],["Government office",0],["Garden",0]]}]},{"n":27,"name":"Life in the UK Test 27","q":[{"g":624,"t":"Which of these venues is located in Scotland?","e":"The Scottish Exhibition and Conference Centre (SECC) is located in Glasgow, Scotland.","p":0,"o":[["The SECC",1],["Wembley Stadium",0],["Troxy",0],["The O2",0]]},{"g":625,"t":"Which of these are 'Crown Dependencies'?","e":"The Channel Islands and the Isle of Man are closely related to the UK but are not part of it. They have their own governments and are called 'Crown dependencies'.","p":4,"o":[["Ireland and the Channel Islands",0],["St Helena and Falkland Islands",0],["St Helena and Wales",0],["The Channel Islands and the Isle of Man",1]]},{"g":626,"t":"Who was the first woman Prime Minister?","e":"In 1979, Margaret Thatcher became the first woman Prime Minister of the UK. She was the longest-serving Prime Minister of the 20th century, remaining in Office until 1990.","p":1,"o":[["Margaret Thatcher",1],["Elizabeth Brown",0],["Florence Nightingale",0],["Mary Peters",0]]},{"g":627,"t":"What did the Chartists campaign for?","e":"In the 1830s and 1840s, a group called the Chartists campaigned for reform. They wanted six changes: for every man to have the vote;elections every year;for all regions to be equal in the electoral system; secret ballots; for any man to be able to stand as an MP; for MPs to be paid.","p":1,"o":[["Anyone to be able to stand as an MP",0],["Open ballots",0],["Every man to have a vote",1],["Elections every 5 years",0]]},{"g":628,"t":"When did the Romans successfully invade Britain?","e":"Julius Caesar led a Roman invasion of Britain in 55 BC. This was unsuccessful and for nearly 100 years Britain remained separate from the Roman Empire. In AD 43 the Emperor Claudius led the Roman army in a new invasion. This time, there was resistance from some of the British tribes but the Romans were successful in occupying almost all of Britain.","p":1,"o":[["63 BC",0],["43 AD",1],["55 BC",0],["63 AD",0]]},{"g":629,"t":"What is the country house owned by the Prime Minister called?","e":"The official home of the Prime Minister is 10 Downing Street, in central London, near the Houses of Parliament. He or she also has a country house outside London called Chequers.","p":2,"o":[["Chequers",1],["Dormitory",0],["Cottage",0],["Chalet",0]]},{"g":630,"t":"Who led the team of scientists to 'split the atom' for the first time?","e":"Scientists led by Ernest Rutherford, working at Manchester and then Cambridge University, were the first to 'split the atom' and took part in the Manhattan Project in the United States, which developed the atomic bomb.","p":1,"o":[["Dylan Thomas",0],["Ernest Rutherford",1],["Alexander Fleming",0],["Sir Ian Wilmot",0]]},{"g":631,"t":"When is Vaisakhi celebrated?","e":"Vaisakhi (also spelled Baisakhi) is a Sikh festival which celebrates the founding of the Sikh community known as the Khalsa. It is celebrated on 14 April each year with parades, dancing and singing.","p":0,"o":[["In April",1],["In June",0],["In March",0],["In May",0]]},{"g":632,"t":"What were the refugees that came from France between 1680 and 1720 called?","e":"Between 1680 and 1720 many refugees called Huguenots came from France. They were Protestants and had been persecuted for their religion.","p":1,"o":[["Sikhs",0],["Huguenots",1],["Quakers",0],["Chartists",0]]},{"g":633,"t":"Where can you get help from if you are facing domestic violence?","e":"It is important for anyone facing domestic violence to get help as soon as possible. A solicitor or the Citizens Advice Bureau can explain the available options.","p":2,"o":[["Your Family",0],["Citizens advice Bureau",1],["High Court",0],["NSPCC",0]]},{"g":634,"t":"Mary Stuart (also known as 'Mary, Queen of Scots') fled to England. She was suspected of trying to take over the throne and was kept a prisoner for 20 years","e":"The statement is true.","p":1,"o":[["False",0],["True",1]]},{"g":635,"t":"Areas of what is now Scotland were never conquered by the Romans","e":"Areas of what is now Scotland were never conquered by the Romans, and the Emperor Hadrian built a wall in the north of England to keep out the Picts (ancestors of the Scottish people).","p":1,"o":[["True",1],["False",0]]},{"g":636,"t":"When did the First World War end?","e":"The First World War ended at 11.00 am on 11th November 1918 with victory for Britain and its allies.","p":1,"o":[["11th of November",1],["9th of july",0],["18th of August",0],["9th of May",0]]},{"g":637,"t":"Which TWO of these are cycling athletes?","e":"Sir Chris Hoy (1976-) is a Scottish cyclist who has won six gold and one silver Olympic medals. He has also won 11 world championship titles. Bradley Wiggins (1980-) is a cyclist. In 2012, he became the first Briton to win the Tour de France. He has won seven Olympic medals, including gold medals in the 2004, 2008 and 2012 Olympic Games.","p":0,"o":[["Sir Steve Redgrave",0],["Sir Chris Hoy",1],["Jessica Ennis",0],["Bradley Wiggins",1]]},{"g":638,"t":"In Scotland, judges developed 'common law' by following previous decisions. It was referred to as 'unwritten'","e":"In England, judges developed 'common law' by a process of precedence (that is, following previous decisions) and tradition. In Scotland, the legal system developed slightly differently and laws were 'codified' (that is, written down).","p":2,"o":[["True",0],["False",1]]},{"g":639,"t":"You need to buy a TV Licence if there are no TVs in your house but you watch TV programs on your mobile phone","e":"You must pay for a licence to watch TV through any medium.","p":2,"o":[["True",1],["False",0]]},{"g":640,"t":"Which TWO of these are English civil war battles?","e":"During the civil war, the king's army was defeated at the Battles of Marston Moor and Naseby. By 1646, it was clear that Parliament had won the war. Charles was held prisoner by the parliamentary army. He was still unwilling to reach any agreement with Parliament and in 1649 he was executed.","p":1,"o":[["Bannockburn",0],["Naseby",1],["Agincourt",0],["Marston Moor",1]]},{"g":641,"t":"Which TWO of these are core values and responsibilities of the British society?","e":"Although Britain is one of the world's most diverse societies, there is a set of shared values and responsibilities that everyone can agree with. These values and responsibilities include: to obey and respect the law; to be aware of the rights of others and respect those rights; to treat others with fairness; to behave responsibly; to help and protect your family; to respect and preserve the environment; to treat everyone equally, regardless of sex, race, religion, age, disability, class or sexual orientation; to work to provide for yourself and your family; to help others; to vote in local and national government elections.","p":3,"o":[["Not to behave responsibly",0],["Always share the same views as your partner",0],["To vote in local and national government elections",1],["To work to provide for yourself and your family",1]]},{"g":642,"t":"Who established the Church of England?","e":"To divorce his first wife, Henry needed the approval of the Pope. When the Pope refused, Henry established the Church of England. In this new Church, the king, not the Pope, would have the power to appoint bishops and order how people should worship.","p":1,"o":[["Henry VIII",1],["The Pope",0],["Edward II",0],["Charles II",0]]},{"g":643,"t":"There is a dragon on the official flag of Wales","e":"here is also an official Welsh flag, which shows a Welsh dragon. The Welsh dragon does not appear on the Union Flag because, when the first Union Flag was created in 1606 from the flags of Scotland and England, the Principality of Wales was already united with England.","p":1,"o":[["True",1],["False",0]]},{"g":644,"t":"Which TWO of these roles, in the UK, are unpaid?","e":"You can volunteer with the police, and become a special constable or a lay (non-police) representative. You can also apply to become a Magistrate.","p":2,"o":[["Magistrate",1],["Special Constable",1],["Chief of Police",0],["District Judge",0]]},{"g":645,"t":"You have to be 21 years old to stand as an MP","e":"Anyone aged 18 or over can stand for election as an MP but they are unlikely to win unless they have been nominated to represent one of the major political parties. These are the Conservative Party, the Labour Party, the Liberal Democrats, or one of the parties representing Scottish, Welsh or Northern Irish interests.","p":2,"o":[["True",0],["False",1]]},{"g":646,"t":"Where are the minor criminal cases dealt with in England, Wales and N. Ireland?","e":"In England, Wales and Northern Ireland, most minor criminal cases are dealt with in a Magistrates' Court. In Scotland, minor criminal offences go to a Justice of the Peace Court.","p":2,"o":[["High Court",0],["Crown Court",0],["Justice of the Peace Court",0],["Magistrates' Court",1]]},{"g":647,"t":"The National Citizen Service programme gives 16 and 17 year olds the opportunity to enjoy outdoor activities, develop their skills","e":"There are many opportunities for young people to volunteer and receive accreditation which will help them to develop their skills. These include the National Citizen Service programme, which gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project","p":2,"o":[["False",0],["True",1]]}]},{"n":28,"name":"Life in the UK Test 28","q":[{"g":648,"t":"What was the population of the UK in 1901?","e":"The population of the UK was 40 million in 1901.","p":0,"o":[["27 million",0],["40 million",1],["50 million",0],["60 million",0]]},{"g":649,"t":"When is Halloween celebrated?","e":"Halloween, 31 October, is an ancient festival and has roots in the pagan festival to mark the beginning of winter. Young people will often dress up in frightening costumes to play 'trick or treat'. People give them treats to stop them playing tricks on them. A lot of people carve lanterns out of pumpkins and put a candle inside.","p":0,"o":[["31st of October",1],["30th of October",0],["30th of November",0],["31st of November",0]]},{"g":650,"t":"When was the first coin in Britain made?","e":"The Iron Age people made the first coins to be minted in Britain, some inscribed with the names of Iron Age kings.","p":1,"o":[["The Iron age",1],["The Stone age",0],["The Gold age",0],["The Middle ages",0]]},{"g":651,"t":"What programme helps teenagers develop their skills?","e":"There are many opportunities for young people to volunteer and receive accreditation which will help them to develop their skills. These include the National Citizen Service programme, which gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project.","p":2,"o":[["Youth Opportunities",0],["The Teenage Programme",0],["The National Citizen Service",1],["The Youth Development Service",0]]},{"g":652,"t":"Where does the Scottish Grand National take place?","e":"Famous horse-racing events include: Royal Ascot, a five-day race meeting in Berkshire attended by members of the Royal Family; the Grand National at Aintree near Liverpool; and the Scottish Grand National at Ayr. There is a National Horseracing Museum in Newmarket, Suffolk.","p":0,"o":[["Ayr",1],["Berkshire",0],["Aintree",0],["The borders",0]]},{"g":653,"t":"When were women given the right to vote at the age of 18?","e":"By 1918, the voting franchise was extended to women over 30, and then in 1928 to men and women over 21. In 1969, the voting age was reduced to 18 for men and women.","p":2,"o":[["1959",0],["1969",1],["1918",0],["1928",0]]},{"g":654,"t":"Which of these words is based on Norman words?","e":"Some words in modern English - for example, 'park' and 'beauty' - are based on Norman French words. Others - for example, 'apple', 'cow' and 'summer' - are based on Anglo-Saxon words.","p":1,"o":[["Apple",0],["Summer",0],["Cow",0],["Park",1]]},{"g":655,"t":"Where is the Hadrian Wall?","e":"Areas of what is now Scotland were never conquered by the Romans, and the Emperor Hadrian built a wall in the north of England to keep out the Picts (ancestors of the Scottish people).","p":1,"o":[["In the north of Wales",0],["In the north of Ireland",0],["In the north of Scotland",0],["In the north of England",1]]},{"g":656,"t":"The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries","e":"The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries.","p":1,"o":[["True",1],["False",0]]},{"g":657,"t":"Puritans are a group of Catholics who advocate complex religious doctrine and worship","e":"Puritans, a group of Protestants who advocated strict and simple religious doctrine and worship.","p":1,"o":[["False",1],["True",0]]},{"g":658,"t":"Who mapped the coast of Australia?","e":"Captain James Cook mapped the coast of Australia and a few colonies were established there. Britain gained control over Canada, and the East India Company, originally set up to trade, gained control of large parts of India.","p":1,"o":[["Admiral Nelson",0],["James Cook",1],["Sir Francis Drake",0],["Sir Francis George",0]]},{"g":659,"t":"Easter eggs are often given as presents at Easter as a symbol of new life","e":"Easter is also celebrated by people who are not religious. 'Easter eggs' are chocolate eggs often given as presents at Easter as a symbol of new life.","p":0,"o":[["True",1],["False",0]]},{"g":660,"t":"How many counties in Ireland remained in the UK under Northern Ireland?","e":"In 1921 a peace treaty was signed and in 1922 Ireland became two countries. The six counties in the north which were mainly Protestant remained part of the UK under the name Northern Ireland. The rest of Ireland became the Irish Free State. It had its own government and became a republic in 1949.","p":1,"o":[["9",0],["12",0],["3",0],["6",1]]},{"g":661,"t":"Why is 1969 a very important year in British history?","e":"The voting franchise was also extended to women over 30, and then in 1928 to men and women over 21. In 1969, the voting age was reduced to 18 for men and women.","p":1,"o":[["Women were given the right to vote at the age of 30",0],["Women were given the right to vote at the age of 18",1],["Women were given the right to vote at the age of 21, same as men",0],["Women were given the right to vote",0]]},{"g":662,"t":"Blood and organ donations are compulsory in the UK","e":"it's a donation, thus its not compulsory. Donated blood is used by hospitals to help people with a wide range of injuries and illnesses. Giving blood only takes about an hour to do.","p":2,"o":[["False",1],["True",0]]},{"g":663,"t":"How can you help looking after the environment?","e":"It is important to recycle as much of your waste as you can. Using recycled materials to make new products uses less energy and means that we do not need to extract more raw materials from the earth. It also means that less rubbish is created, so the amount being put into landfill is reduced.","p":2,"o":[["Studying your area",0],["Recycling your waste",1],["Going shopping carefully",0],["Not smoking in public",0]]},{"g":664,"t":"Which TWO industries developed during the Great Depression?","e":"During the Great Depression (1929),he traditional heavy industries such as shipbuilding were badly affected but new industries - including the automobile and aviation industries - developed.","p":1,"o":[["Agriculture",0],["Shipbuilding",0],["Automobile",1],["Aviation",1]]},{"g":665,"t":"What is the currency used in the UK?","e":"The currency in the UK is the pound sterling (symbol £). There are 100 pence in a pound.","p":0,"o":[["Euro",0],["Dollars",0],["Pound sterling",1],["Gold",0]]},{"g":666,"t":"Which TWO are associated with the 'Dunkirk Spirit'?","e":"Many civilian volunteers in small pleasure and fishing boats from Britain helped the Navy to rescue more than 300,000 men from the beaches around Dunkirk. Although many lives and a lot of equipment were lost, the evacuation was a success and meant that Britain was better able to continue the fight against the Germans. The evacuation gave rise to the phrase 'the Dunkirk spirit'.","p":1,"o":[["Small boats coming to the rescue",1],["Invasion of Berlin on May 9",0],["The rescue of 300,000 men",1],["Landings on D-Day",0]]},{"g":667,"t":"George Frederick wrote which oratorio, which is sung regularly by choirs, often at Easter time?","e":"The German-born composer George Frideric Handel (1695-1759) spent many years in the UK and became a British citizen in 1727. He wrote the Water Music for King George I and Music for the Royal Fireworks for his son, George II. Both these pieces continue to be very popular. Handel also wrote an oratorio, Messiah, which is sung regularly by choirs, often at Easter time.","p":0,"o":[["Elijah",0],["Messiah",1],["The Light of the Moon",0],["The Origin",0]]},{"g":668,"t":"How many ski centres are there in Scotland?","e":"There are five ski centres in Scotland, as well as Europe's longest dry ski slope near Edinburgh.","p":0,"o":[["13",0],["1",0],["2",0],["5",1]]},{"g":669,"t":"What type of literature are 'The Canterbury Tales' written by Geoffrey Chaucer?","e":"In the years leading up to 1400, Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. The people decided to tell each other stories on the journey, and the poems describe the travellers and some of the stories they told. This collection of poems is called The Canterbury Tales. It was one of the first books to be printed by William Caxton, the first person in England to print books using a printing press. Many of the stories are still popular. Some have been made into plays and television programmes.","p":0,"o":[["Sonnets",0],["Poems",1],["Plays",0],["Novels",0]]},{"g":670,"t":"The Scottish Parliament has 33 members","e":"There are 129 members of the Scottish Parliament (MSPs), elected by a form of proportional representation. The Scottish Parliament can pass laws for Scotland on all matters which are not specifically reserved to the UK Parliament.","p":2,"o":[["False",1],["True",0]]},{"g":671,"t":"What did the Queen Elizabeth II celebrate in 2012?","e":"Queen Elizabeth II celebrated her Diamond Jubilee in 2012. The clock tower 'Big Ben' was named 'Elizabeth Tower' in honour of this event.","p":0,"o":[["Silver Jubilee",0],["Platinum Jubilee",0],["Diamond Jubilee",1],["Gold Jubilee",0]]}]},{"n":29,"name":"Life in the UK Test 29","q":[{"g":672,"t":"Who is currently the Head of State of the UK?","e":"King Charles III is the head of state of the UK. He is also the monarch or head of state for many countries in the Commonwealth.","p":2,"o":[["King Charles III",1],["Prince Charles",0],["The Prime Minister",0],["Prince Philip",0]]},{"g":673,"t":"Why was Mary known as 'Bloody Mary'?","e":"Mary was a devout Catholic and persecuted Protestants.","p":1,"o":[["She killed her father",0],["She put her sister in prison",0],["She persecuted Protestants",1],["She fought in numerous battles",0]]},{"g":674,"t":"What was encouraged to develop the UK economy in 1950?","e":"During the 1950s, there was still a shortage of labour in the UK. Further immigration was therefore encouraged for economic reasons, and many industries advertised for workers from overseas.","p":1,"o":[["Savings Accounts",0],["Immigration",1],["Education",0],["Slave Trade",0]]},{"g":675,"t":"What was the first war to be extensively covered by the media?","e":"From 1853 to 1856, Britain fought with Turkey and France against Russia in the Crimean War. It was the first war to be extensively covered by the media through news stories and photographs","p":1,"o":[["The Battle Of Britain",0],["The Battle of Waterloo",0],["The Battle of Hastings",0],["The Crimean War",1]]},{"g":676,"t":"Which of these countries was NOT UK's ally in the WWII?","e":"The war was initially fought between the Axis powers (fascist Germany and Italy and the Empire of Japan) and the Allies","p":1,"o":[["Soviet Union",0],["France",0],["Japan",1],["Poland",0]]},{"g":677,"t":"The members of the Armed Forces can stand for Public Office","e":"Most citizens of the UK, the Irish Republic or the Commonwealth aged 18 or over can stand for Public Office. There are some exceptions, including: members of the armed forces; civil servants; people found guilty of certain criminal offences.","p":2,"o":[["False",1],["True",0]]},{"g":678,"t":"Where is the SECC located?","e":"There are many large venues that host music events throughout the year, such as: Wembley Stadium; The O2 in Greenwich, south-east London; and the Scottish Exhibition and Conference Centre (SECC) in Glasgow.","p":0,"o":[["London",0],["Wales",0],["Glasgow",1],["Swansea",0]]},{"g":679,"t":"People of the Iron Age sometimes defended sites. What were these sites?","e":"People still lived in roundhouses, grouped together into larger settlements, and sometimes defended sites called hill forts. A very impressive hill fort can still be seen today at Maiden Castle, in the English county of Dorset.","p":1,"o":[["Round barrows",0],["Hill forts",1],["Skara Braes",0],["Hill barrows",0]]},{"g":680,"t":"What is the capital of Wales?","e":"Cardiff is the capital city of Wales","p":0,"o":[["Swansea",0],["Belfast",0],["Cardiff",1],["Edinburgh",0]]},{"g":681,"t":"How often are the European Parliament elections held?","e":"Elections for the European Parliament are also held every five years. Elected members are called members of the European Parliament (MEPs). Elections to the European Parliament use a system of proportional representation, where seats are allocated to each party in proportion to the total number of votes it has won.","p":2,"o":[["5",1],["3",0],["1",0],["4",0]]},{"g":682,"t":"How is the Church of England often called?","e":"In England, there is a constitutional link between Church and state. The official Church of the state is the Church of England called the Anglican Church in other countries and the Episcopal Church in Scotland and the United States.","p":1,"o":[["The Anglican Church",1],["The New Age Church",0],["The Catholic Church",0],["The Christian Church",0]]},{"g":683,"t":"What do the Brit Awards celebrate?","e":"The Brit Awards is an annual event that gives awards in a range of categories, such as best British group and best British solo artist.","p":0,"o":[["Movies",0],["Art",0],["Theatre",0],["Music",1]]},{"g":684,"t":"Which TWO houses formed the House of Tudor?","e":"King Richard III of the House of York was killed in the battle and Henry Tudor, the leader of the House of Lancaster, became King Henry VII. Henry then married King Richard's niece, Elizabeth of York, and united the two families. Henry was the first king of the House of Tudor. The symbol of the House of Tudor was a red rose with a white rose inside it as a sign that the Houses of York and Lancaster were now allies.","p":1,"o":[["House of Lords",0],["House of Lancaster",1],["House of York",1],["House of Commons",0]]},{"g":685,"t":"Which TWO are famous UK sports stars?","e":"Sir Jackie Stewart (1939-) is a Scottish former racing driver who won the Formula 1 world championship three times. Sir Chris Hoy (1976-) is a Scottish cyclist who has won six gold and one silver Olympic medals. He has also won 11 world championship titles.","p":0,"o":[["Jackie Stewart",1],["William Shakespeare",0],["Sir Chris Hoy",1],["Thomas Gainsborough",0]]},{"g":686,"t":"Which Monarch entered the House of Commons to arrest 5 parliamentary leaders?","e":"Charles I entered the House of Commons and tried to arrest five parliamentary leaders, but they had been warned and were not there. (No monarch has set foot in the Commons since.) Civil war between the king and Parliament could not now be avoided and began in 1642. The country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads).","p":1,"o":[["Oliver Cromwell",0],["James II",0],["Charles I",1],["James I",0]]},{"g":687,"t":"Who appoints life peers to the House of Lords?","e":"Life peers are appointed by the monarch on the advice of the Prime Minister.","p":2,"o":[["The cabinet",0],["The monarch",1],["Their parents/guardians",0],["The prime minister",0]]},{"g":688,"t":"Which government was elected in 1945?","e":"Clement Attlee was Winston Churchill's Deputy Prime Minister in the wartime coalition government and became Prime Minister after the Labour Party won the 1945 election. He was Prime Minister from 1945 to 1951 and led the Labour Party for 20 years. Attlee's government undertook the nationalisation of major industries (like coal and steel), created the National Health Service and implemented many of Beveridge's plans for a stronger welfare state.","p":1,"o":[["Labour",1],["UKIP",0],["Liberal Democrats",0],["Conservative",0]]},{"g":689,"t":"Which TWO are famous British sailors?","e":"A British sailor, Sir Francis Chichester, was the first person to sail single-handed around the world, in 1966/67. Two years later, Sir Robin Knox-Johnston became the first person to do this without stopping.","p":1,"o":[["Sir Robin Knox-Johnston",1],["Sir Jackie Stewart",0],["Sir Francis Chichester",1],["Sir Ian Botham",0]]},{"g":690,"t":"Which TWO of the following are major horse-racing events in the UK?","e":"Famous horse-racing events include: Royal Ascot, a five-day race meeting in Berkshire attended by members of the Royal Family; the Grand National at Aintree near Liverpool; and the Scottish Grand National at Ayr. There is a National Horseracing Museum in Newmarket, Suffolk.","p":0,"o":[["The Open Championship",0],["Scottish Grand National",1],["Royal Ascot",1],["Six Nations Championship",0]]},{"g":691,"t":"Which TWO are associated with a Bank Holiday?","e":"Bank holidays are public holidays, when banks and many other businesses are closed for the day.","p":0,"o":[["A day when most people have an official day off",1],["A public holiday",1],["A holiday which is always on a Monday",0],["A day off for all the banks in the country",0]]},{"g":692,"t":"Which of the following is a William Wordsworth's poem?","e":"All 4 options are poems, but all written by different poets.(Robert Browning, 1812-89 'Home Thoughts from Abroad'), (Lord Byron, 1788-1824 'She Walks in Beauty'), (William Blake, 1757-1827 'The Tyger'), (William Wordsworth, 1770-1850 'The Daffodils' - 'I wander'd lonely as a cloud, That floats on high o'er vales and hills, When all at once I saw a crowd, A host of golden daffodils').","p":0,"o":[["Home Thoughts from Abroad",0],["The Daffodils",1],["She Walks in Beauty",0],["The Tyger",0]]},{"g":693,"t":"Pakistan is part of the Commonwealth","e":"Pakistan is currently part of the Commonwealth","p":2,"o":[["False",0],["True",1]]},{"g":694,"t":"Which of the following traditional heavy industries were badly affected during the great depression?","e":"The effects of the depression of the 1930s were felt differently in different parts of the UK. The traditional heavy industries such as shipbuilding were badly affected but new industries - including the automobile and aviation industries - developed.","p":1,"o":[["Automobile",0],["Railway",0],["Shipbuilding",1],["Aviation",0]]},{"g":695,"t":"Who is the head of the Church of England?","e":"The monarch is the head of the Church of England. The spiritual leader of the Church of England is the Archbishop of Canterbury.","p":0,"o":[["The Duke of Edinburgh",0],["The Prime Minister",0],["The Monarch",1],["The Pope",0]]}]},{"n":30,"name":"Life in the UK Test 30","q":[{"g":696,"t":"Who designed the new St Paul Cathedral?","e":"Christopher Wren designed a new St Paul Cathedral after the previous one was destroyed by a great fire in 1666.","p":1,"o":[["Sir Christopher Wren",1],["Isaac Newton",0],["Isambard Kingdom Brunel",0],["Samuel Pepys",0]]},{"g":697,"t":"Who won two gold medals for running in the 2004 Olympic Games?","e":"Dame Kelly Holmes (1970-) won two gold medals for running in the 2004 Olympic Games.","p":0,"o":[["Dame Ellen MacArthur",0],["Jayne Torvill",0],["Christopher Dean",0],["Dame Kelly Holmes",1]]},{"g":698,"t":"What was the purpose of the Corn Laws in 1846?","e":"Corn Laws in 1846 had prevented the import of cheap grain.","p":1,"o":[["To improve working conditions",0],["To prevent the import of cheap grain",1],["To build railways",0],["To improve transport systems",0]]},{"g":699,"t":"Where did the Vikings come from?","e":"The Vikings came from Denmark and Norway. They first visited Britain in AD 789 to raid coastal towns and take away goods and slaves.","p":1,"o":[["Norway and Sweden",0],["Spain and France",0],["Austria and Germany",0],["Norway and Denmark",1]]},{"g":700,"t":"Which movement campaigned for the women's rights?","e":"In the late 19th and early 20th centuries, an increasing number of women campaigned and demonstrated for greater rights and, in particular, the right to vote. They formed the women's suffrage movement and became known as 'suffragettes'.","p":1,"o":[["Bishops",0],["Suffragettes",1],["Chartists",0],["Quakers",0]]},{"g":701,"t":"Who became famous in silent movies for his tramp character?","e":"Sir Charles (Charlie) Chaplin became famous in silent movies for his tramp character and was one of many British actors to make a career in Hollywood.","p":1,"o":[["Sir Christopher Wren",0],["Sir Francis Drake",0],["Sir Chris Hoy",0],["Sir Charles Chaplin",1]]},{"g":702,"t":"What do many theatres in the UK produce at Christmas time?","e":"One British tradition is the pantomime. Many theatres produce a pantomime at Christmas time. They are based on fairy stories and are light-hearted plays with music and comedy, enjoyed by family audiences. One of the traditional characters is the Dame, a woman played by a man.","p":0,"o":[["A music event",0],["An opera",0],["A stand up comedy show",0],["A pantomime",1]]},{"g":703,"t":"What does St Patrick's cross look like?","e":"The Union Flag consists of three crosses: The cross of St George, patron saint of England, is a red cross on a white ground; The cross of St Andrew, patron saint of Scotland, is a diagonal white cross on a blue ground; The cross of St Patrick, patron saint of Ireland, is a diagonal red cross on a white ground.","p":1,"o":[["Welsh dragon cross",0],["A red cross on a white ground",0],["A diagonal red cross on a white ground",1],["A diagonal white cross on a blue ground",0]]},{"g":704,"t":"The House of Lords is more independent of the government than the House of Commons","e":"The House of Lords is normally more independent of the government than the House of Commons. It can suggest amendments or propose new laws, which are then discussed by MPs. The House of Lords checks laws that have been passed by the House of Commons to ensure they are fit for purpose.","p":2,"o":[["True",1],["False",0]]},{"g":705,"t":"Who should you contact to get your National Insurance number?","e":"You will need to telephone the Department for Work and Pensions (DWP) to arrange to get a National Insurance number.","p":0,"o":[["Your local school",0],["The Home secretary",0],["Local government",0],["DWP (Department for Work and Pensions)",1]]},{"g":706,"t":"What is the name given to the conflict between those wishing for full Irish independence and those wishing to remain loyal to the UK government?","e":"The conflict between those wishing for full Irish independence and those wishing to remain loyal to the British government is often referred to as 'the Troubles'.","p":1,"o":[["The Clearances",0],["The Troubles",1],["The Problems",0],["The Great Depression",0]]},{"g":707,"t":"During the Middle Ages, which TWO wars were fought abroad?","e":"During the Middle Ages, the English kings also fought a number of wars abroad. Many knights took part in the Crusades, in which European Christians fought for control of the Holy Land. English kings also fought a long war with France, called the Hundred Years War (even though it actually lasted 116 years).","p":1,"o":[["Crusaders",1],["Hundred Years War",1],["Battle of Hastings",0],["The War of the Roses",0]]},{"g":708,"t":"Which party forms the government?","e":"Most MPs belong to a political party, and the party with the majority of MPs forms the government. If one party does not get a majority, two parties can join together to form a coalition.","p":2,"o":[["The party with the majority of the members of Parliament (MPs)",1],["The party appointed by the Monarch",0],["The party with the most votes",0],["The party which is the most popular",0]]},{"g":709,"t":"Who appoints the government, which most people have chosen in a democratic election?","e":"The monarch does not rule the country but appoints the government, which the people have chosen in a democratic election. The monarch invites the leader of the party with the largest number of MPs, or the leader of a coalition between more than one party, to become the Prime Minister.","p":2,"o":[["The House of Lords",0],["The House of Commons",0],["The Monarch",1],["The Prime Minister",0]]},{"g":710,"t":"Those who don't respect the law should not expect to be allowed to become permanent residents","e":"If you don't respect the law you should not expect to be allowed to settle in the UK","p":3,"o":[["True",1],["False",0]]},{"g":711,"t":"How often do the PM's questions take place?","e":"The leader of the opposition leads his or her party in pointing out what they see as the government's failures and weaknesses. One important opportunity to do this is at Prime Minister's Questions, which takes place every week while Parliament is sitting","p":2,"o":[["Every month",0],["Every week",1],["Every day",0],["Every year",0]]},{"g":712,"t":"The Anglo-Saxons established Christianity when they invaded Britain","e":"The Anglo-Saxons were not Christians when they first came to Britain but, during this period, missionaries came to Britain to preach about Christianity.","p":1,"o":[["False",1],["True",0]]},{"g":713,"t":"Which of these international events was held in London in 2012?","e":"The UK has hosted the Olympic Games on three occasions: 1908, 1948 and 2012. The Paralympic Games for 2012 were also hosted in London.","p":0,"o":[["EURO 2012",0],["The Paralympic Games",1],["The Commonwealth Games",0],["The World Cup",0]]},{"g":714,"t":"Pressure groups and lobby groups are organisations which try to influence government policy","e":"Pressure and lobby groups are organisations which try to influence government policy. They play an important role in politics.","p":2,"o":[["True",1],["False",0]]},{"g":715,"t":"The National Citizen Service provides military training to young people","e":"The National Citizen Service programme, which gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project.","p":2,"o":[["False",1],["True",0]]},{"g":716,"t":"The Monarch appoints the members of the Cabinet","e":"The Prime Minister (PM) is the leader of the political party in power. He or she appoints the members of the Cabinet and has control over many important public appointments.","p":2,"o":[["False",1],["True",0]]},{"g":717,"t":"Which TWO of the athletes are paralympians?","e":"Ellie Simmonds (1994-) is a Paralympian who won gold medals for swimming at the 2008 and 2012 Paralympic Games and holds a number of world records. She was the youngest member of the British team at the 2008 Games. David Weir (1979-) is a Paralympian who uses a wheelchair and has won six gold medals over two Paralympic Games. He has also won the London Marathon six times.","p":0,"o":[["Ellie Simmonds",1],["Andy Murray",0],["Jessica Ennis",0],["David Weir",1]]},{"g":718,"t":"After Cromwell defeated Charles II at Worcester, where did Charles II hide?","e":"The Scots had not agreed to the execution of Charles I and declared his son Charles II to be king. He was crowned king of Scotland and led a Scottish army into England. Cromwell defeated this army in the Battles of Dunbar and Worcester. Charles II escaped from Worcester, famously hiding in an oak tree on one occasion, and eventually fled to Europe.","p":1,"o":[["In a house",0],["In a lake",0],["In a field",0],["In an oak tree",1]]},{"g":719,"t":"Where does the Scottish Grand National take place?","e":"Famous horse-racing events include: Royal Ascot, a five-day race meeting in Berkshire attended by members of the Royal Family; the Grand National at Aintree near Liverpool; and the Scottish Grand National at Ayr. There is a National Horseracing Museum in Newmarket, Suffolk.","p":0,"o":[["Ayr",1],["Aintree",0],["Berkshire",0],["The borders",0]]}]},{"n":31,"name":"Life in the UK Test 31","q":[{"g":720,"t":"What is not a fundamental principle of British life?","e":"Driving a car is NOT one of the fundamental principles of British life","p":3,"o":[["Looking after the environment",0],["Driving a car",1],["Looking after yourself and family",0],["Treating others with fairness",0]]},{"g":721,"t":"Which style of architecture became popular in the 19th century?","e":"In the 19th century, the medieval 'gothic' style became popular once again.","p":0,"o":[["Neoclassical",0],["Simple",0],["Classical",0],["Gothic",1]]},{"g":722,"t":"Who was the first man to be called the 'Prime Minister'?","e":"The first man to be called 'Prime Minister' was Sir Robert Walpole, who was Prime Minister from 1721 to 1742.","p":1,"o":[["Winston Churchill",0],["Sir Robert Walpole",1],["Clement Attlee",0],["Margaret Thatcher",0]]},{"g":723,"t":"What were the Canterbury Tales about?","e":"In the years leading up to 1400, Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. The people decided to tell each other stories on the journey, and the poems describe the travellers and some of the stories they told. This collection of poems is called The Canterbury Tales.","p":1,"o":[["Canterbury tales about the King",0],["Canterbury life",0],["People fighting near Canterbury",0],["The stories people told each other",1]]},{"g":724,"t":"Who is Andy Murray?","e":"Andy Murray (1987-) is a Scottish tennis player who in 2012 won the men's singles in the US Open. He is the first British man to win a singles title in a Grand Slam tournament since 1936. In the same year, he won Olympic gold and silver medals.","p":0,"o":[["A Scottish tennis player",1],["A Scottish rower",0],["A Scottish cyclist",0],["A Scottish runner",0]]},{"g":725,"t":"How long does Diwali normally last for?","e":"Diwali normally falls in October or November and lasts for five days. It is often called the Festival of Lights. It is celebrated by Hindus and Sikhs. It celebrates the victory of good over evil and the gaining of knowledge. There are different stories about how the festival came about. There is a famous celebration of Diwali in Leicester.","p":0,"o":[["8 days",0],["7 days",0],["5 days",1],["3 days",0]]},{"g":726,"t":"Which tribes invaded Britain after the Romans had left?","e":"The Roman army left Britain in AD 410 to defend other parts of the Roman Empire and never returned. Britain was again invaded by tribes from northern Europe: the Jutes, the Angles and the Saxons.","p":1,"o":[["The Vikings",0],["The Celtics",0],["The Normans",0],["The Jutes and the Anglo-Saxons",1]]},{"g":727,"t":"What was the Spanish Armada?","e":"Elizabeth became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism.","p":1,"o":[["An illness",0],["A large fleet of ships",1],["A large army of people",0],["A French and Spanish army",0]]},{"g":728,"t":"Which of the devolved administrations has been suspended a few times?","e":"There has been a Welsh Assembly and a Scottish Parliament since 1999. There is a Northern Ireland Assembly, although this has been suspended on a few occasions.","p":2,"o":[["Northern Ireland Assembly",1],["Scottish Parliament",0],["Welsh Assembly",0],["Westminster",0]]},{"g":729,"t":"Who designed New Delhi to be the seat of government in India?","e":"In the 20th century, Sir Edwin Lutyens had an influence throughout the British Empire. He designed New Delhi to be the seat of government in India. He was responsible for many war memorials throughout the world, including the Cenotaph in Whitehall.","p":0,"o":[["Robert Adam",0],["Sir Edwin Lutyens",1],["Inigo Jones",0],["Sir Christopher Wren",0]]},{"g":730,"t":"The UK has a constitutional monarchy","e":"The UK has a constitutional monarchy. This means that the king or queen does not rule the country but appoints the government, which the people have chosen in a democratic election.","p":2,"o":[["True",1],["False",0]]},{"g":731,"t":"Rudyard Kipling reflected the idea that the British Empire was a force for good","e":"Kipling wrote books and poems set in both India and the UK. His poems and novels reflected the idea that the British Empire was a force for good. Kipling was awarded the Nobel Prize in Literature in 1907.","p":1,"o":[["True",1],["False",0]]},{"g":732,"t":"When did the British troops leave Iraq?","e":"Since 2000, British armed forces have been engaged in the global fight against international terrorism and against the proliferation of weapons of mass destruction, including operations in Afghanistan and Iraq. British combat troops left Iraq in 2009.","p":1,"o":[["2013",0],["2009",1],["2004",0],["2000",0]]},{"g":733,"t":"There is no place in British society for extremism or intolerance","e":"The statement is true","p":3,"o":[["True",1],["False",0]]},{"g":734,"t":"What is the national flower of Northern Ireland?","e":"A Shamrock is the national flower of Northern Ireland.","p":0,"o":[["A Thistle",0],["A Rose",0],["A Lily",0],["A Shamrock",1]]},{"g":735,"t":"In England and Wales, the small claims procedure is used for claims of less than what amount?","e":"The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer. This procedure is used for claims of less than £10,000 in England and Wales; £5,000 in Scotland and £5,000 in Northern Ireland (Changed from £3000).","p":2,"o":[["£10,000",1],["£7,000",0],["£11,000",0],["£3,000",0]]},{"g":736,"t":"Many people volunteer simply because they want to help other people","e":"Volunteering and helping your community are an important part of being a good citizen. They enable you to integrate and get to know other people. It helps to make your community a better place if residents support each other.","p":2,"o":[["False",0],["True",1]]},{"g":737,"t":"In Northern Ireland, what letter does a newly qualified driver has to display for one year after passing the test?","e":"In Northern Ireland, a newly qualified driver must display an 'R' place (for restricted driver) for one year after passing the test.","p":2,"o":[["D",0],["L",0],["T",0],["R",1]]},{"g":738,"t":"EEC was set up in 1957 by six countries","e":"The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957. The UK originally decided not to join this group but it became a member in 1973. After the Brexit vote to leave in 2020, there are now 27 EU member states","p":2,"o":[["False",0],["True",1]]},{"g":739,"t":"People over 70 can apply for a free TV licence and blind people can get a 75% discount","e":"People over 75 can apply for a free TV licence and blind people can get a 50% discount. You will receive a fine of up to £1,000 if you watch TV but do not have a TV licence.","p":0,"o":[["True",0],["False",1]]},{"g":740,"t":"There are some MPs (Members of Parliament) who do not represent any of the main political parties","e":"There are a few MPs who do not represent any of the main political parties. They are called 'independents' and usually represent an issue important to their constituency.","p":2,"o":[["False",0],["True",1]]},{"g":741,"t":"How many national parks are there in England, Wales and Scotland?","e":"There are 15 national parks in England, Wales and Scotland. They are areas of protected countryside that everyone can visit, and where people live, work and look after the landscape.","p":0,"o":[["15",1],["8",0],["5",0],["25",0]]},{"g":742,"t":"What should you do to make a complaint about the Police?","e":"Anyone can make a complaint about the police by going to a police station or writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland.","p":2,"o":[["Write to the Chief Constable of the Police force",1],["Write a complaint letter to the House of Commons",0],["Complain to the Police force directly",0],["Write to your MP",0]]},{"g":743,"t":"Who invented the World Wide Web?","e":"The inventor of the World Wide Web, Sir Tim Berners-Lee (1955-), is British. Information was successfully transferred via the web for the first time on 25 December 1990.","p":1,"o":[["Sir Robert Watson-Watt",0],["Mo Farah",0],["Winston Churchill",0],["Sir Tim Berners-Lee",1]]}]},{"n":32,"name":"Life in the UK Test 32","q":[{"g":744,"t":"How long did the Romans stay in Britain?","e":"The Romans remained in Britain for 400 years.","p":1,"o":[["300 years",0],["100 years",0],["400 years",1],["600 years",0]]},{"g":745,"t":"How old is Big Ben?","e":"Big Ben, also known as 'Elizabeth Tower', is over 150 years of age.","p":0,"o":[["150",1],["220",0],["200",0],["170",0]]},{"g":746,"t":"What must the police officer tell you if you get arrested?","e":"A Police officer will tell you the reason for your arrest and you will be able to seek legal advice.","p":2,"o":[["Ask about your background",0],["The reason for your arrest",1],["To follow his instructions",0],["To put your arms in the air",0]]},{"g":747,"t":"When did Ireland split into 2 countries?","e":"Ireland became two countries in 1922.","p":1,"o":[["1949",0],["1922",1],["1925",0],["1934",0]]},{"g":748,"t":"How many member states does the Commonwealth have?","e":"The Monarch (King Charles III) is the ceremonial head of the Commonwealth, which currently has 56 (can change) member states.","p":2,"o":[["190",0],["27",0],["56",1],["5",0]]},{"g":749,"t":"When did England win the World Cup?","e":"Bobby Moore (1941-93) captained the English football team that won the World Cup in 1966.","p":0,"o":[["1970",0],["1966",1],["1962",0],["1974",0]]},{"g":750,"t":"Who led the Labour Government from 2007 to 2010?","e":"Gordon Brown took over as Prime Minister in 2007 and led the Labour Party.","p":1,"o":[["Gordon Brown",1],["David Cameron",0],["Margaret Thatcher",0],["Tony Blair",0]]},{"g":751,"t":"Which Castles are in use to this day?","e":"Castles were built in many places in Britain and Ireland, partly for defence. Today many are in ruins, although some, such as Windsor and Edinburgh, are still in use.","p":1,"o":[["Edinburgh and Aberdeen",0],["Edinburgh and Dublin",0],["Edinburgh and London",0],["Edinburgh and Windsor",1]]},{"g":752,"t":"How many National Parks are there in the UK?","e":"There are 15 national parks in England, Wales and Scotland. They are areas of protected countryside that everyone can visit, and where people live, work and look after the landscape.","p":0,"o":[["12",0],["15",1],["10",0],["7",0]]},{"g":753,"t":"NATO aims to maintain peace between all of its members","e":"NATO is a group of European and North American countries that have agreed to help each other if they come under attack. It also aims to maintain peace between all of its members.","p":2,"o":[["False",0],["True",1]]},{"g":754,"t":"First professional football clubs were formed in the late 19th century","e":"its True. The first professional football clubs were formed in the late 19th century.","p":0,"o":[["True",1],["False",0]]},{"g":755,"t":"There are 9 National Parks in the UK","e":"The UK has a large network of public footpaths in the countryside. There are also many opportunities for mountain biking, mountaineering and hill walking. There are 15 national parks in England, Wales and Scotland. They are areas of protected countryside that everyone can visit, and where people live, work and look after the landscape.","p":2,"o":[["True",0],["False",1]]},{"g":756,"t":"The Prime Minister is the head of the Commonwealth","e":"The Monarch (King Charles III at the time of writing) is the ceremonial head of the Commonwealth, which currently has 56 member states.","p":2,"o":[["False",1],["True",0]]},{"g":757,"t":"Who was the Queen of the Iceni? She is still remembered today and there is a statue of her on Westminster Bridge in London","e":"One of the tribal leaders who fought against the Romans was Boudicca, the Queen of the Iceni in what is now eastern England.","p":1,"o":[["Boudicca",1],["Elefieta",0],["Elizabeth",0],["Mary",0]]},{"g":758,"t":"Which of these statements is correct?","e":"During the Victorian period, the British Empire grew to cover all of India, Australia and large parts of Africa. It became the largest empire the world has ever seen, with an estimated population of more than 400 million people.","p":2,"o":[["During Queen Victoria's reign the British Empire became the largest empire the world has ever seen",1],["During Queen Elizabeth's reign the British Empire became the largest empire the world has ever seen",0]]},{"g":759,"t":"If you think someone is trying to persuade you to join an extremist or terrorist cause, who should you notify?","e":"If you think someone is trying to persuade you to join an extremist or terrorist cause, you should notify your local police force.","p":2,"o":[["Police force",1],["MP",0],["Church",0],["Council office",0]]},{"g":760,"t":"How can you look after the environment? (Choose TWO)","e":"It is important to recycle as much of your waste as you can. A good way to support your local community is to shop for products locally where you can. This will help businesses and farmers in your area and in Britain. It will also reduce your carbon footprint, because the products you buy will not have had to travel as far.","p":2,"o":[["Always use your own car",0],["Shop for products locally as this reduces your carbon footprint",1],["Shop for fresh products only",0],["Recycle as much as you can",1]]},{"g":761,"t":"The Blitz is associated which event?","e":"Despite winning the Battle of Britain, the German air force was able to continue bombing London and other British cities at night-time. This was called the Blitz.","p":1,"o":[["The UK and Germany bombing French cities",0],["The UK bombing German cities",0],["Germany bombing British cities",1],["The UK evacuating troops from Dunkirk",0]]},{"g":762,"t":"In which year was Britain's first woman Prime Minister, Margaret Thatcher, elected to join the parliament of United Kingdom?","e":"Margaret Thatcher was the daughter of a grocer from Grantham in Lincolnshire. She trained as a chemist and lawyer. She was elected as a Conservative MP in 1959 and became a cabinet minister in 1970 as the Secretary of State for Education and Science. In 1975 she was elected as Leader of the Conservative Party and so became Leader of the Opposition.","p":1,"o":[["1979",0],["1986",0],["1959",1],["1949",0]]},{"g":763,"t":"Civil servants cannot stand for Office","e":"Most citizens of the UK, the Irish Republic or the Commonwealth aged 18 or over can stand for public Office. There are some exceptions, including: members of the armed forces; civil servants; people found guilty of certain criminal offences.","p":2,"o":[["True",1],["False",0]]},{"g":764,"t":"How often is the electoral register updated?","e":"The electoral register is updated every year in September or October. An electoral registration form is sent to every household and this has to be completed and returned with the names of everyone who is resident in the household and eligible to vote.","p":2,"o":[["Yearly",1],["Daily",0],["Weekly",0],["Monthly",0]]},{"g":765,"t":"Women over 30 were allowed to vote as a result of their contribution towards the war effort. Which war was it?","e":"In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War. Shortly before Emmeline's death in 1928, women were given the right to vote at the age of 21, the same as men.","p":1,"o":[["Second World War",0],["Boer War",0],["First World War",1],["Crimean war",0]]},{"g":766,"t":"Admiral Nelson died in which battle?","e":"Britain's navy fought against combined French and Spanish fleets, winning the Battle of Trafalgar in 1805. Admiral Nelson was in charge of the British fleet at Trafalgar and was killed in the battle.","p":1,"o":[["Battle of Britain",0],["Battle of Trafalgar",1],["Battle of Waterloo",0],["Battle of Agincourt",0]]},{"g":767,"t":"St Augustine led missionaries from Rome, who spread Christianity in the south. Who did he become?","e":"St Augustine led missionaries from Rome, who spread Christianity in the south. St Augustine became the first Archbishop of Canterbury (see the Archbishop of Canterbury and the Church in Britain today).","p":1,"o":[["The first prime minister",0],["The first Viking invader",0],["The first Archbishop of Canterbury",1],["The first King of England",0]]}]},{"n":33,"name":"Life in the UK Test 33","q":[{"g":768,"t":"When did the first Christian communities appear in Britain?","e":"It was during the 3rd and 4th centuries AD that the first Christian communities began to appear in Britain.","p":1,"o":[["1st and 2nd centuries",0],["2nd and 3rd centuries",0],["4th and 5th centuries",0],["3rd and 4th centuries",1]]},{"g":769,"t":"When do pubs usually open?","e":"Public Houses, also known as Pubs, usually open at 11:00 AM, 12:00 PM on Sundays.","p":0,"o":[["13:00",0],["22:00",0],["16:00",0],["11:00",1]]},{"g":770,"t":"Who led the Scottish Army during the Battle of Bannockburn?","e":"In Scotland, the English kings were less successful. In 1314 the Scottish, led by Robert the Bruce, defeated the English at the Battle of Bannockburn, and Scotland remained unconquered by the English.","p":1,"o":[["Edward I",0],["Robert the Bruce",1],["King Alfred the Great",0],["William the Conqueror",0]]},{"g":771,"t":"When did the development of a free press happen?","e":"From 1695, newspapers were allowed to operate without a government licence. Increasing numbers of newspapers began to be published.","p":1,"o":[["1695",1],["1832",0],["1805",0],["1755",0]]},{"g":772,"t":"Which of the Houses is more important in today's Britain?","e":"The House of Commons is regarded as the more important of the two chambers in Parliament because its members are democratically elected.","p":2,"o":[["The House of Commons",1],["The House of Lancaster",0],["The House of Lords",0],["The House of York",0]]},{"g":773,"t":"What does the UN aim to do?","e":"The UK is part of the United Nations (UN), an international organisation with more than 190 countries as members. The UN was set up after the Second World War and aims to prevent war and promote international peace and security.","p":2,"o":[["Prevent War",1],["Prevent High Inflation",0],["Prevent Starvation",0],["Prevent Diseases",0]]},{"g":774,"t":"What was the population of the UK in 1801?","e":"The population of the UK was just 8 million in 1801.","p":0,"o":[["20 million",0],["5 million",0],["4 million",0],["8 million",1]]},{"g":775,"t":"When did the Industrial Revolution take place?","e":"The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries.","p":1,"o":[["19th and 20th centuries",0],["19th century only",0],["18th and 19th centuries",1],["18th century only",0]]},{"g":776,"t":"When were films first shown publicly in the UK?","e":"Films were first shown publicly in the UK in 1896 and film screenings very quickly became popular","p":0,"o":[["1901",0],["1906",0],["1890",0],["1896",1]]},{"g":777,"t":"Where did the Jutes come from?","e":"Britain was invaded by tribes from northern Europe: the Jutes, the Angles and the Saxons. The languages they spoke are the basis of modern-day English.","p":1,"o":[["Southern Europe",0],["Central Europe",0],["East Europe",0],["Northern Europe",1]]},{"g":778,"t":"Which TWO buildings were built during the Middle Ages?","e":"The Middle Ages also saw a change in the type of buildings in Britain. Castles were built in many places in Britain and Ireland, partly for defence. Today many are in ruins, although some, such as Windsor and Edinburgh, are still in use. Great cathedrals - for example, Lincoln Cathedral - were also built, and many of these are still used for worship.","p":1,"o":[["The building of Parliament",0],["Lincoln Cathedral",1],["New St Paul's Cathedral",0],["Edinburgh Castle",1]]},{"g":779,"t":"It is an offence not to have an MOT certificate if your vehicle is more than _____ years old","e":"If your vehicle is over three years old, you must take it for a Ministry of Transport (MOT) test every year. It is an offence not to have an MOT certificate if your vehicle is more than three years old.","p":2,"o":[["3",1],["4",0],["2",0],["5",0]]},{"g":780,"t":"The Mousetrap','Jesus Christ Superstar' and 'Evita' are examples of British what?","e":"They are examples of theatre plays.","p":0,"o":[["Theatre",1],["Films",0],["Music",0],["Art",0]]},{"g":781,"t":"How old do you have to be to stand for election as an MP?","e":"Anyone aged 18 or over can stand for election as an MP but they are unlikely to win unless they have been nominated to represent one of the major political parties","p":2,"o":[["21",0],["16",0],["18",1],["25",0]]},{"g":782,"t":"During the reigns of Elizabeth I and James I, the English government encouraged Scottish and English Protestants to settle in which Irish province?","e":"During the reigns of Elizabeth I and James I, many people in Ireland opposed rule by the Protestant government in England. There were a number of rebellions. The English government encouraged Scottish and English Protestants to settle in Ulster, the northern province of Ireland, taking over the land from Catholic landholders.","p":1,"o":[["Grimsby",0],["Pale",0],["Ulster",1],["Dublin",0]]},{"g":783,"t":"The UK is a diverse and dynamic nation which welcomes those who want to make a positive contribution to the society","e":"The UK is a diverse and welcoming country. It welcomes those who want to make a positive contribution to the society","p":1,"o":[["True",1],["False",0]]},{"g":784,"t":"It is a criminal offence to owe money to someone and you might be taken to court","e":"Owing money is a civil offence","p":2,"o":[["False",1],["True",0]]},{"g":785,"t":"The Boer War took place in which country of the British Empire?","e":"The Boer War of 1899 to 1902 made the discussions about the future of the Empire more urgent. The British went to war in South Africa with settlers from the Netherlands called the Boers.","p":1,"o":[["Bangladesh",0],["South Africa",1],["Scotland",0],["Pakistan",0]]},{"g":786,"t":"Which Battle is commemorated in the Bayeux Tapestry?","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror. The battle is commemorated in a great piece of embroidery, known as the Bayeux Tapestry, which can still be seen in France today.","p":1,"o":[["Hastings",1],["Bosworth",0],["Boyne",0],["Agincourt",0]]},{"g":787,"t":"A treaty gave independence to the south of Ireland in 1921","e":"In 1921 a peace treaty was signed and in 1922 Ireland became two countries. The six counties in the north which were mainly Protestant remained part of the UK under the name Northern Ireland. The rest of Ireland became the Irish Free State. It had its own government and became a republic in 1949.","p":1,"o":[["True",1],["False",0]]},{"g":788,"t":"Who was the British scientist who was awarded the Nobel prize for the discovery of the structure of the DNA molecule?","e":"The structure of the DNA molecule was discovered in 1953 through work at British universities in London and Cambridge. This discovery contributed to many scientific advances, particularly in medicine and fighting crime. Francis Crick (1916-2004), one of those awarded the Nobel Prize for this discovery, was British.","p":0,"o":[["James Goodfellow",0],["Alan Turing",0],["Francis Crick",1],["John Macleod",0]]},{"g":789,"t":"Members of the European Union can vote in all public UK elections","e":"Prior to Brexit, adult citizens of other EU states who are resident in the UK could vote in all elections except General Elections. As of 2020, EU citizens' local voting rights have also changed and are now set on individual, per-country basis.","p":2,"o":[["True",0],["False",1]]},{"g":790,"t":"The system of government in the UK is a parliamentary democracy","e":"The system of government in the UK is a parliamentary democracy. The UK is divided into parliamentary constituencies. Voters in each constituency elect their member of Parliament (MP) in a General Election. All of the elected MPs from the House of Commons. Most MPs belong to a political party, and the party with the majority of MPs forms the government. If one party does not get a majority, two parties can join together to form a coalition.","p":2,"o":[["True",1],["False",0]]},{"g":791,"t":"The King Charles III's eldest son, Prince William, is also known as?","e":"Queen Elizabeth II reigned since her father's death in 1952, (she celebrated her Diamond Jubilee i.e. 60 years as queen) until she passed away in 2022. She was married to Prince Philip, the Duke of Edinburgh. Her eldest son, King Charles III (previously known as the Prince of Wales) became the sovereign monarch in 2022. His eldest son, heir to the throne, Prince William is the new Prince of Wales.","p":0,"o":[["The Duke of Edinburgh",0],["The Prince of Wales",1],["The King of Ireland",0],["Prince Harry",0]]}]},{"n":34,"name":"Life in the UK Test 34","q":[{"g":792,"t":"As per 2021 census, what percentage of the England and Wales population identified as Sikh?","e":"In the 2021 England and Wales census, around 525,000 people from the sampled population of 60 million identified as Sikh. 46% of people identified themselves as Christian. Much smaller proportions identified themselves as Muslim (6.5%), Hindu (2%), Sikh (1%), Jewish or Buddhist (both around 0.5%), 0.5% of people followed another religion and 37% stated not to follow any religion.","p":0,"o":[["2%",0],["4%",0],["1%",1],["3%",0]]},{"g":793,"t":"How often do the ministers meet to discuss important issues?","e":"Ministers form the cabinet, a committee which usually meets weekly and makes important decisions about government policy. Many of these decisions have to be debated or approved by Parliament.","p":2,"o":[["Weekly",1],["Daily",0],["Yearly",0],["Monthly",0]]},{"g":794,"t":"Where can you get help if you can't afford to pay a vet?","e":"Vaccinations and medical treatment for animals are available from veterinary surgeons (vets). There are charities which may help people who cannot afford to pay a vet.","p":0,"o":[["Friends",0],["Your vet",0],["Family",0],["Charities",1]]},{"g":795,"t":"Which of these are British Overseas Territories?","e":"There are also several British overseas territories in other parts of the world, such as St Helena and the Falkland Islands. They are also linked to the UK but are not a part of it.","p":4,"o":[["St Helena and Falkland Islands",1],["St Helena and the Isle of Man",0],["USA and Australia",0],["The Channel Islands and the Isle of Man",0]]},{"g":796,"t":"What percentage of the workforce are women?","e":"Women in Britain today make up about half of the workforce. On average, girls leave school with better qualifications than boys. More women than men study at university.","p":0,"o":[["50%",1],["40%",0],["60%",0],["30%",0]]},{"g":797,"t":"Which country invented Cricket?","e":"Cricket originated in England and is now played in many countries. Games can last up to five days but still result in a draw! The most famous Cricket competition is the Ashes, which is a series of Test matches played between England and Australia.","p":0,"o":[["Wales",0],["Australia",0],["Scotland",0],["England",1]]},{"g":798,"t":"What celebrates the end of Ramadan?","e":"Eid al-Fitr celebrates the end of Ramadan, when Muslims have fasted for a month. They thank Allah for giving them the strength to complete the fast.","p":0,"o":[["Eid al-Fitr",1],["Hanukkah",0],["Vaisakhi",0],["Eid ul Adha",0]]},{"g":799,"t":"How many Russian and Polish Jews came to Britain between 1870-1914?","e":"People continued to come to Britain from other parts of the world. For example, between 1870 and 1914, around 120,000 Russian and Polish Jews came to Britain to escape persecution.","p":1,"o":[["60,000",0],["120,000",1],["30,000",0],["140,000",0]]},{"g":800,"t":"Everything found in Hansard is available online","e":"Proceedings in Parliament are broadcast on television and published in official reports called Hansard. Written reports can be found in large libraries and online.","p":2,"o":[["True",1],["False",0]]},{"g":801,"t":"On average, girls leave school with better qualifications than boys","e":"The Statement is true","p":0,"o":[["True",1],["False",0]]},{"g":802,"t":"Where can you get details about the small claims procedure?","e":"You can get details about the small claims procedure from your local County Court or Sheriff Court.","p":2,"o":[["Any council office",0],["High Court",0],["Your local polling station",0],["Your local County Court",1]]},{"g":803,"t":"Who was John Constable?","e":"John Constable (1776-1837) was a landscape painter most famous for his works of Dedham Vale on the Suffolk, Essex border in the east of England.","p":0,"o":[["An important contributor to the 'pop art' movement of the 1960s",0],["A landscape painter, most famous for his works of Dedham Vale on the Suffolk-Essex border in the East of England",1],["A very successful Northern Irish portrait painter",0],["A Welsh artist, best known for his engravings and stained glass",0]]},{"g":804,"t":"What food is traditionally associated with Wales?","e":"Welsh cakes - a traditional Welsh snack made from flour, dried fruits and spices, and served either hot or cold.","p":0,"o":[["Welsh cakes",1],["Ulster fry",0],["Haggis",0],["Roast beef, which is served with potatoes, vegetables, Yorkshire puddings",0]]},{"g":805,"t":"Who of the following is associated with the Bonfire Night?","e":"Bonfire Night, 5 November, is an occasion when people in Great Britain set off fireworks at home or in special displays. The origin of this celebration was an event in 1605, when a group of Catholics led by Guy Fawkes failed in their plan to kill the Protestant king with a bomb in the Houses of Parliament.","p":0,"o":[["Roger Bannister",0],["Napoleon",0],["Guy Fawkes",1],["Ian Fleming",0]]},{"g":806,"t":"The Domesday Book gives a picture of society in England just after the Norman Conquest","e":"William the Conqueror (the Duke of Normandy) sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book. It still exists today and gives a picture of society in England just after the Norman Conquest.","p":1,"o":[["True",1],["False",0]]},{"g":807,"t":"Who invented the Jet Engine?","e":"The Jet Engine was developed in Britain in the 1930s by Sir Frank Whittle (1907-96), a British Royal Air Force engineer Officer.","p":2,"o":[["Sir Tim Berners-Lee",0],["John Logie Baird",0],["John MacLeod",0],["Sir Frank Whittle",1]]},{"g":808,"t":"What religion did Queen Elizabeth I practise?","e":"Queen Elizabeth I was a Protestant. She re-established the Church of England as the official Church in England. Everyone had to attend their local church and there were laws about the type of religious services and the prayers which could be said, but Elizabeth did not ask about people's real beliefs. She succeeded in finding a balance between the views of Catholics and the more extreme Protestants.","p":1,"o":[["Catholic",0],["Sikh",0],["Atheist",0],["Protestant",1]]},{"g":809,"t":"Who will remain the longest reigning monarch until 9 September 2015?","e":"In 1837, Queen Victoria became queen of the UK at the age of 18. She reigned until 1901, almost 64 years. Her reign is known as the Victorian Age. On September 9 2015, Queen Elizabeth II will pass the record set by her great-great-grandmother Queen Victoria.","p":1,"o":[["Victoria",1],["Mary",0],["Elizabeth II",0],["Elizabeth I",0]]},{"g":810,"t":"Which TWO developments are associated with the 'Swinging Sixties'?","e":"The Swinging Sixties was also a time when social laws were liberalised, for example in relation to divorce and to abortion in England, Wales and Scotland. The position of women in the workplace also improved. It was quite common at the time for employers to ask women to leave their jobs when they got married, but Parliament passed new laws giving women the right to equal pay and made it illegal for employers to discriminate against women because of their gender.","p":1,"o":[["Establishment of the NHS",0],["Divorce Law Reform",1],["Children's Rights Law Reform",0],["Abortion Law Reform",1]]},{"g":811,"t":"Which of these is a British invention/discovery?","e":"The structure of the DNA molecule was discovered in 1953 through work at British universities in London and Cambridge. This discovery contributed to many scientific advances, particularly in medicine and fighting crime. Francis Crick (1916-2004), one of those awarded the Nobel Prize for this discovery, was British.","p":1,"o":[["The structure of the DNA molecule",1],["Fire extinguisher",0],["Hovercraft tank",0],["Radiator",0]]},{"g":812,"t":"When are Pantomimes usually produced?","e":"One British tradition is the pantomime. Many theatres produce a pantomime at Christmas time. They are based on fairy stories and are light-hearted plays with music and comedy, enjoyed by family audiences. One of the traditional characters is the Dame, a woman played by a man. There is often also a pantomime horse or cow played by two actors in the same costume.","p":1,"o":[["Christmas",1],["Halloween",0],["School holidays",0],["Easter",0]]},{"g":813,"t":"Eid ul Adha remembers that the prophet Ibrahim was willing to sacrifice his son when God ordered him to","e":"Eid ul Adha remembers that the prophet Ibrahim was willing to sacrifice his son when God ordered him to. It reminds Muslims of their own commitment to God. Many Muslims sacrifice an animal to eat during this festival. In Britain this has to be done in a slaughterhouse.","p":0,"o":[["False",0],["True",1]]},{"g":814,"t":"What was the longest British War with France called?","e":"English kings also fought a long war w
