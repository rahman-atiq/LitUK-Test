/* ============ HELPERS ============ */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const correctIdx=q=>q.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);
const eqSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function testStat(n){return S.tests[n]||{best:null,attempts:0,lastPass:null}}
function go(v){
  ['dashboard','quiz','results','mistakes','history','stats','cram'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  /* A clock only runs while you are looking at it. A timed session left behind
     on another screen used to keep ticking and then grade itself (INV-9/INV-10);
     the deadline is absolute, so nothing is gained by counting in the dark. */
  if(v!=='quiz')stopTimer();
  window.scrollTo(0,0);
  if(v==='dashboard')renderDashboard();
  if(v==='mistakes')renderMistakes();
  if(v==='history')renderHistory();
  if(v==='stats')renderStats();
  if(v==='cram')renderCram();
  syncResumeChip();
}

/* ============ DASHBOARD ============ */
function drillCard(){
  const plan=drillPlan();
  const n=w=>plan.filter(p=>p.why===w).length;
  const done=drillDoneToday();
  const streak=(S.drill&&S.drill.streak)||0;
  const bits=[n('due')?`${n('due')} due for review`:'',n('mistake')?`${n('mistake')} to fix`:'',
    n('new')?`${n('new')} new`:'',n('missed')?`${n('missed')} missed before`:'',
    n('stale')?`${n('stale')} gone cold`:''].filter(Boolean);
  const mode=drillMode();
  return `<div class="card drill">
    <span class="emo">${done?'✅':'🔥'}</span>
    <div class="body">
      <div class="k">${done?'Drill done today':'Daily drill'}</div>
      <div class="t">${plan.length} question${plan.length===1?'':'s'}</div>
      <div class="d">${bits.join(' · ')||'a fresh mix'}${mode!=='coverage'?` · ${mode}`:''}</div>
    </div>
    ${streak?`<div class="streak"><b>${streak}</b><span>day${streak===1?'':'s'}</span></div>`:''}
    <button class="btn go" onclick="startDrill()">${done?'Go again':'Start drill'} →</button>
  </div>`;
}
/* `face` is the section's, so the tile can say "Paper 401" where its section
   says reported papers and inherit that section's colour. `i` is its position in
   the grid, which drives the arrival stagger — capped, because the last of 45
   tiles should not still be landing half a second after the first. */
function testTile(t,face,i){
  const st=testStat(t.n),pct=st.best!=null?Math.round(st.best/24*100):0;
  const state=st.best==null?'':st.lastPass?'pass':'retry';
  const mark=state==='pass'?'<span class="tm">✓</span>':state==='retry'?'<span class="tm">↻</span>':'';
  const word=face.word||'Test';
  /* Whether the best was set with the explanations on screen. Not a judgement,
     just provenance — it is the difference between a score and a walkthrough. */
  const shown=st.best!=null&&st.revealed?' · shown':'';
  const c=testMix(t),top=c.indexOf(Math.max(...c));
  const tip=`${word} ${t.n} — mostly ${TOPICS[top]} (${c[top]} of ${t.q.length})`
    +(shown?'. Best score was set with instant feedback on.':'');
  /* The mark is the word's sibling: the phone hides the word and would take the
     mark down with it. `Best 18/24` needs about 88px against the 81px a tile has
     to give, so it ellipsised into `Best 18/2…` — and of those two words the
     score is the one carrying the information. */
  return `<button class="card tcard${state?' '+state:''}${t.n===justPassed?' just':''}" style="--i:${Math.min(i,18)}" onclick="startTest(${t.n})" title="${esc(tip)}">
    <span class="tw">${esc(word)}</span>${mark}
    <span class="tnum">${t.n}</span>
    <span class="meta">${st.best!=null?`${st.best}/24`:'Not sat'}${st.attempts?` · ${st.attempts}×`:''}${shown}</span>
    ${st.best==null?'':`<span class="bar ${st.lastPass?'good':'bad'}"><i style="width:${pct}%"></i></span>`}
    ${mixStrip(t)}
  </button>`;
}
/* One labelled section per bank, each carrying where its questions came from —
   except that a bank whose tests declare a `kind` gets one section per kind.
   testprep.uk's 38 mocks and its 11 exam papers are the same pool sliced two
   ways, and which slice a test came from is the most useful thing that source
   knows. One flat grid of 49 tiles throws it away. */
const KIND_LABEL={mock:'Mock Tests',exam:'Exam Tests'};
const KIND_SUB={exam:EXAM_CLAIM+'.'};
/* Each source's own licence and disclaimer, mirrored rather than paraphrased —
   and the two do not say the same thing, which is the point of keeping them
   per-bank. testprep.uk states an OGL v3.0 grant. lifeintheuktestweb.co.uk
   states no licence at all: its footer claims copyright over the compilation
   and it sells ads against the pages. Writing it an OGL note by symmetry would
   be putting a grant in a publisher's mouth that the publisher never made, so
   its note says what its footer actually says instead.
   Presentation, not data — the bank files are generated and nothing here is
   allowed to need a rebuild. */
const OGL='https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/';
const BANK_NOTE={
  testprep:`TestPrep.UK publishes these as independent study material based on public sector information licensed under the <a href="${OGL}" target="_blank" rel="noopener noreferrer">Open Government Licence v3.0</a>. Neither that site nor this one is affiliated with the Home Office, the DVSA or any UK Government body, and the UK Government does not accept responsibility for the accuracy of the material.`,
  lituktestweb:`LifeInTheUKTestWeb.co.uk publishes these as “a compilation of exam questions reported by candidates”. That site publishes no licence of its own: its footer reads “© Copyright 2026 · Life in the UK Test Web · All Rights Reserved”, and it runs advertising against the pages. There is no Open Government Licence grant to point at here — only Crown copyright handbook material underneath a compilation the site claims as its own. Neither that site nor this one is affiliated with the Home Office, the DVSA or any UK Government body.`,
};
/* Which groups are open. A view preference, not progress, so it lives on its own
   key rather than in the save — and it has to live somewhere outside the DOM at
   all, because renderDashboard() rebuilds innerHTML on every answer and would
   otherwise shut every section you just opened. */
/* Which tiles to draw. Presentation only: nothing is computed, stored or graded
   differently, the filter just decides what is on screen. A section that has
   nothing matching is not drawn at all, so "Not sat" turns the library into the
   papers you still owe.
   `Not sat` and not `Not attempted`, for two reasons: it is the word the tiles
   underneath have always used, and the four chips have to land inside 361px on
   one row. */
const FILTERS=[['all','All'],['new','Not sat'],['passed','Passed'],['retry','Retry']];
let testFilter='all';
function filterCounts(){
  const n={all:TESTS.length,new:0,passed:0,retry:0};
  TESTS.forEach(t=>{const st=testStat(t.n);
    if(st.best==null)n.new++;else if(st.lastPass)n.passed++;else n.retry++});
  return n;
}
function testMatch(t){
  if(testFilter==='all')return true;
  const st=testStat(t.n);
  if(testFilter==='new')return st.best==null;
  if(testFilter==='passed')return !!st.lastPass;
  if(testFilter==='retry')return st.best!=null&&!st.lastPass;
  return true;
}
function setTestFilter(f){testFilter=f;renderDashboard()}
/* The tile you passed on the way here, so the dashboard can point at it once.
   Cleared the moment it has been rendered — a pulse that replays on every later
   visit is a notification, not a reward. */
let justPassed=null;
/* The five-topic mix of a paper, cached per test: it never changes, and it is
   read once per tile on every dashboard render. */
const TMIX=new Map();
function testMix(t){
  let c=TMIX.get(t.n);
  if(!c){c=[0,0,0,0,0];t.q.forEach(q=>{if(c[q.p]!=null)c[q.p]++});TMIX.set(t.n,c)}
  return c;
}
function mixStrip(t){
  return `<span class="mix" aria-hidden="true">${testMix(t).map((v,i)=>
    v?`<i style="flex:${v};background:var(--t${i})"></i>`:'').join('')}</span>`;
}
/* The section a test belongs to, resolved the same way testGroup resolves it —
   bank id plus kind, and `:all` for a bank that does not split. Used by tiles
   and by the start-here card, both of which need a section's face without
   being inside its render. */
function faceFor(t){
  const b=t._bank,ks=bankKinds(b);
  return GRP_FACE[ks.length<2?`${b.id}:all`:`${b.id}:${t.kind}`]||{ico:'📄',acc:GRP_ACC[0]};
}
const GRP_LS='lituk_groups';
let grpOpen=(()=>{try{return JSON.parse(localStorage.getItem(GRP_LS))||{}}catch(e){return{}}})();
function grpSave(){try{localStorage.setItem(GRP_LS,JSON.stringify(grpOpen))}catch(e){}}
function grpToggle(k,open){grpOpen[k]=open;grpSave()}
/* Section keys in render order, so `grpKeys()[0]` is the one group open by
   default and "expand/collapse all" can speak for sections it cannot see. */
function bankKinds(b){return [...new Set(b.tests.map(t=>t.kind))].filter(k=>KIND_LABEL[k])}
function grpKeys(){return BANKS.flatMap(b=>{const ks=bankKinds(b);return ks.length<2?[`${b.id}:all`]:ks.map(k=>`${b.id}:${k}`)})}
function grpAnyOpen(){return grpKeys().some((k,i)=>grpOpen[k]??i===0)}
function toggleAllGroups(){const open=!grpAnyOpen();grpKeys().forEach(k=>grpOpen[k]=open);grpSave();renderDashboard()}
/* A face per section, keyed the same way the section is: bank id + kind.
   `name` is the section's own, because five headings built out of their sources
   read as a bibliography — "TestPrep Mock Tests" above "TestPrep Exam Tests"
   names the publisher twice and the thing itself never. The source moves to the
   line under it, which is where the attribution belongs and where it still is:
   the sources are credited here, in each panel's note, and on the tests.
   `unit` keeps the plain words on screen, so a named section still says what it
   holds. Presentation keyed on bank id like BANK_NOTE above, and a bank arriving
   without an entry falls back to its own label. */
/* One walk from rose to periwinkle, in section order, rather than five unrelated
   hues. The old set was indigo/sky/teal/amber/pink — five colours that agreed on
   nothing, so a dashboard of shut sections read as a colour chart. Stepping along
   a single ramp keeps every section individually identifiable while the stack of
   them reads as one object.

   Each value is mid-toned on purpose: --acc is spent on a 14-18% color-mix wash,
   a 6px progress fill and the open chevron, against --panel in BOTH themes. Only
   a mid tone clears 3:1 on white and on near-black at once — lighten these for
   the dark theme and they disappear on the light one. */
const GRP_ACC=['#c2628f','#b06aa8','#9575c4','#7b82d6','#5e93d0'];
const GRP_FACE={
  /* Every London cabbie's word for learning a whole city by heart — and this is
     the biggest bank of the five. */
  'mock:all':{ico:'🧠',acc:'#c2628f',name:'The Knowledge',unit:'mock tests',word:'Test'},
  'practice:all':{ico:'📘',acc:'#b06aa8',name:'The Reading Room',unit:'practice tests',word:'Test'},
  'testprep:mock':{ico:'🧪',acc:'#9575c4',name:'The Proving Ground',unit:'mock tests',word:'Mock'},
  'testprep:exam':{ico:'⭐',acc:'#7b82d6',name:'Exam Conditions',unit:'exam papers',word:'Exam'},
  /* Not a paper anyone sat here — it is what came back out of the test centre. */
  'lituktestweb:all':{ico:'🔥',acc:'#5e93d0',name:'Word from the Room',unit:'reported papers',word:'Paper'},
};
/* `key` is bank id + kind, the same pair the section is built from, so it is
   stable across renders and across a bank gaining tests. `dflt` opens the first
   group on a first visit: a page of nothing but shut headers doesn't show what
   a test tile is. */
function testGroup(b,tests,label,sub,key,dflt,note,seq){
  /* `tests` is the section as it really is; `shown` is what the filter lets
     through. The header keeps counting the real thing — a section that says
     "6/45 passed" while a filter hides the other 39 is still telling the truth,
     and the line under the name says how many of them you are looking at. */
  const shown=tests.filter(testMatch);
  if(!shown.length)return '';
  const done=tests.filter(t=>testStat(t.n).lastPass).length;
  const face=GRP_FACE[key]||{ico:'📄',acc:GRP_ACC[seq%GRP_ACC.length]};
  const pct=Math.round(done/tests.length*100);
  const unit=esc(face.unit||'tests');
  /* Forced open while a filter is on — a filter that reveals nothing but shut
     headers has not filtered anything — and for the section holding the tile you
     have just passed, so the pulse lands somewhere you can see it. Neither
     writes to grpOpen: `toggle` does not fire for a <details> parsed open, so
     only a real tap on the header persists a state. */
  const open=testFilter!=='all'||(justPassed!=null&&shown.some(t=>t.n===justPassed))||(grpOpen[key]??dflt);
  /* `nm`, not `lbl`: .lbl is the app's small-caps caption class, and borrowing it
     here uppercased both the section name and the source under it. */
  return `<details class="bankgrp" style="--acc:${face.acc}"${open?' open':''} ontoggle="grpToggle('${key}',this.open)">
    <summary class="bankhd" title="${esc(label)}">
      <span class="ico" aria-hidden="true">${face.ico}</span>
      <span class="nm">
        <b>${esc(face.name||label)}</b>
        <span class="src">${shown.length===tests.length?`${tests.length} ${unit}`:`${shown.length} of ${tests.length} ${unit}`} · <a href="${esc(b.sourceUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${esc(b.source)}</a></span>
      </span>
      <span class="ring-sm" style="--p:${pct}" aria-hidden="true"></span>
      <span class="tag${done===tests.length?' done':''}">${done}/${tests.length} passed</span>
      <span class="chev" aria-hidden="true">▸</span>
    </summary>
    <div class="bankbody">
      ${sub?`<p class="banksub">${esc(sub)}</p>`:''}
      <div class="grid tests">${shown.map((t,i)=>testTile(t,face,i)).join('')}</div>
      ${note?`<p class="banknote">${note}</p>`:''}
    </div>
  </details>`;
}
/* ---- Start here ----
   The next paper you have never sat, or once they are all sat the weakest one
   you have still not passed. This is the answer to 150 identical doors: one of
   them is open. */
function nextUp(){
  const unsat=TESTS.filter(t=>testStat(t.n).best==null);
  if(unsat.length)return{t:unsat[0],why:'new'};
  const open=TESTS.filter(t=>!testStat(t.n).lastPass);
  if(!open.length)return null;
  return{t:open.slice().sort((a,b)=>(testStat(a.n).best??0)-(testStat(b.n).best??0))[0],why:'retry'};
}
function nextUpCard(){
  const nx=nextUp();
  if(!nx)return `<div class="card nextup" style="--tone:var(--good);cursor:default">
    <span class="ico" aria-hidden="true">🏆</span>

function filterChips(){

/* The big numbers roll up rather than snapping into place. Only elements whose
   whole text is the number carry data-count — the ones with markup inside them
   (the "112/150" stat) would have it overwritten. */
function countUp(el){
  const ns=el.querySelectorAll('[data-count]');
  if(!ns.length)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  ns.forEach(n=>{
    const to=+n.dataset.count,suf=n.dataset.suf||'';
    if(!(to>0))return;
    const t0=performance.now(),dur=560;
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
      n.textContent=Math.round(to*e)+suf;
      if(k<1)requestAnimationFrame(step);
    };
    n.textContent='0'+suf;
    requestAnimationFrame(step);
  });
}

     has one kind and one section — and the earlier `,null)` here dropped the

  const kinds=bankKinds(b);

/* Enter and Space for the one card on the page that is a button by role only.
   The tiles are real <button>s and never reach here; .nextup and .drill are left
   as plain cards because each already holds a real button that fires the same
   call, and wrapping a second tab stop around an interactive child is a worse

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const t=e.target instanceof Element&&e.target.closest('[role="button"][tabindex]');
  if(!t)return;

/* ============ PREFS ============
   dailyTarget is the drill size. 60 by default: 1,858 questions and a
   four-week sprint means 60 a day is the floor for seeing the bank once with
   room for a second pass. 20 was a habit-builder, not a study plan. */
const DRILL_MIN=5,DRILL_MAX=200,DRILL_DEFAULT=60,DRILL_SIZES=[20,40,60,100];
let prefs=Object.assign({shufQ:true,shufO:true,feedback:'instant',dailyTarget:DRILL_DEFAULT,recall:'weak'},JSON.parse(localStorage.getItem('lituk_prefs')||'{}'));
/* Same reasoning as save(): a settings write must not throw out of an onchange
   handler. Prefs are small and re-derivable, so a lost one is a nuisance, not a
   loss — it does not deserve the full reclaim dance. */
function savePrefs(){try{localStorage.setItem('lituk_prefs',JSON.stringify(prefs))}catch(e){saveFailed()}}
function drillSize(){const n=Math.round(+prefs.dailyTarget||DRILL_DEFAULT);
  return Math.max(DRILL_MIN,Math.min(DRILL_MAX,n))}
function setDailyTarget(n){prefs.dailyTarget=n;savePrefs();openSettings()}

/* ============ SESSION STORE ============
   A session used to be one module variable with no way back into it. Leave the
   quiz view and it was unreachable; reload and it was gone; and a timed one kept
   ticking under whatever screen you had moved to until it graded fifteen
   unanswered questions, incremented S.attempts and filed the sit — the one bug
   in this app that made it lie to you about how ready you are.

   So sessions live in their own localStorage key, as a keyed collection rather
   than a slot: several at once, and starting one never destroys another (D-2).

   What is stored is a slim projection, never the session itself. items[].q is a
   live reference into the bank, so persisting sessions whole would duplicate
   ~60 KB of question text per drill; only the global id goes to disk and QByG
   rehydrates it — ~5 KB for a default drill, against an S that is already
   rewritten in full on every single answer.

   INV-11: this is a third key. lituk_v1 and lituk_prefs are untouched, and the
   store is deliberately absent from backups — an unfinished session is not
   progress, and a backup restored onto another phone should not resurrect a
   half-finished mock from this one. */
const SESS_LS='lituk_sess_v1';
const TEST_MINUTES=45;
let sess=null;                             /* the live session, in memory only */
let sessOpen=false;                        /* "N more" expander — view state, never stored */
let _sessDropped=0;

/* Items of the Date Gauntlet are built for the session, not drawn from the bank:
   their options do not correspond to the bank question's option list, so `picked`
   would be meaningless against it. Their stem and options ride along; everything
   else still comes from the id. */
function slimItem(it){
  const o={g:it.q.g,order:it.order,picked:it.picked,checked:!!it.checked};
  if(it.checked)o._correct=!!it._correct;
  if(it.unsure)o.unsure=1;
  /* Both belong to the recall attempt, and both have to survive a reload: come
     back to a resumed session and the options you had already opened must still
     be open, and a miss you already owned up to must not be asked about twice. */
  if(it.shown)o.sh=1;
  if(it.recall)o.rc=it.recall;
  /* Not optional (F-7): without it "Wasn't sure" on a resumed question reads
     preBox as undefined, zeroes the box instead of restoring it, and leaves the
     credited day banked. */
  if(it._rec)o._rec=it._rec;
  if(it.q._derived)o.d={t:it.q.t,o:it.q.o,_derived:it.q._derived};
  return o;
}
function fatItem(si){
  const base=QByG[si.g];
  if(!base)return null;
  const q=si.d?Object.assign({},base,{t:si.d.t,o:si.d.o,_derived:si.d._derived}):base;
  const it={q,order:si.order,picked:si.picked,checked:!!si.checked};
  if(si.checked)it._correct=!!si._correct;
  if(si.unsure)it.unsure=true;
  if(si.sh)it.shown=true;
  if(si.rc==='hit'||si.rc==='miss')it.recall=si.rc;
  if(si._rec)it._rec=si._rec;
  return it;
}
/* INV-12, the loud half: a stored session is only offered if every one of its
   ids still resolves and every index is still in range. The silent failure —
   resuming a 24-question test with 23 questions — is the one thing worse than
   not resuming at all. */
function sessOk(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.items)||!s.items.length)return false;
  if(typeof s.sid!=='number'||typeof s.idx!=='number'||s.idx<0||s.idx>=s.items.length)return false;
  if(typeof s.title!=='string')return false;
  if(s.timed&&typeof s.deadline!=='number')return false;
  return s.items.every(it=>{
    if(!it||typeof it.g!=='number'||!Array.isArray(it.order)||!Array.isArray(it.picked))return false;
    const opts=it.d?it.d.o:(QByG[it.g]&&QByG[it.g].o);
    if(!Array.isArray(opts)||it.order.length!==opts.length)return false;
    return it.order.every(i=>i>=0&&i<opts.length)&&it.picked.every(i=>i>=0&&i<opts.length);
  });
}
function slimSess(s){
  return {sid:s.sid,instant:s.instant,title:s.title,timed:s.timed,testN:s.testN,
    source:s.source,idx:s.idx,readyBefore:s.readyBefore,startTs:s.startTs,
    recall:!!s.recall,deadline:s.deadline,items:s.items.map(slimItem)};
}
function hydrate(s){
  if(!sessOk(s))return null;
  const items=s.items.map(fatItem);
  if(items.some(x=>!x))return null;        /* all or nothing (INV-12) */
  return {sid:s.sid,instant:!!s.instant,title:s.title,timed:!!s.timed,
    recall:!!s.recall,
    testN:s.testN==null?null:s.testN,source:s.source,idx:s.idx,

function loadSessions(){
  let raw=null;const out={};let dropped=0;
  try{raw=JSON.parse(localStorage.getItem(SESS_LS))}catch(e){raw=null}

    for(const s of Object.values(raw.sessions)){
      if(sessOk(s))out[s.sid]=s;else dropped++;
    }
  }
  /* One bad session never blocks the others (INV-12). */
  if(dropped)console.error(`LITUK: dropped ${dropped} unfinished session(s) that no longer resolve against the bank`);
  _sessDropped=dropped;
  return out;
}
let sessions=loadSessions();
if(_sessDropped)saveSessions();

function saveSessions(){
  try{localStorage.setItem(SESS_LS,JSON.stringify({v:1,sessions}))}
  catch(e){console.error('LITUK: could not write the session store',e)}
}
/* Called on every state change the quiz can make — pick, check, unsure, and
   every move between questions. Strictly cheaper than the full-S write that
   already happens alongside it. */
function touchSess(){
  if(!sess)return;
  sessions[sess.sid]=slimSess(sess);
  saveSessions();
}
/* One of exactly two places a session leaves the store; the other is an explicit
   discard. No expiry, no cap, no eviction (INV-13). */
function forgetSess(sid){delete sessions[sid];saveSessions()}
function discardSess(sid){
  forgetSess(sid);
  if(sess&&sess.sid===sid){stopTimer();sess=null}
  syncResumeChip();
}
function confirmDiscard(sid){
  const s=sessions[sid];if(!s)return;

    <p class="sub">${esc(sessLine(s))}. Nothing is recorded and nothing is taken back — answers you already checked keep whatever they did to your progress.</p>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn primary" style="background:var(--bad);border-color:var(--bad)" onclick="closeModal();discardSess(${sid});renderDashboard();toast('Session discarded')">Discard</button>
      <button class="btn ghost" onclick="closeModal()">Keep it</button>

const quizHidden=()=>document.getElementById('view-quiz').classList.contains('hidden');
const remainSecs=s=>s&&s.deadline?Math.max(0,(s.deadline-Date.now())/1000|0):null;

function newestOf(source,testN){
  return sessList().find(s=>s.source===source&&(testN===undefined||s.testN===testN));
}
function startedAgo(ts){
  const d=new Date(ts),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const k=dayKey(ts);
  if(k===dayKey())return `started ${hm} today`;
  if(k===dayKey(Date.now()-DAY))return `started ${hm} yesterday`;
  return `started ${Math.round((Date.now()-ts)/DAY)} days ago`;
}
function sessLine(s){
  const bits=[`Q${s.idx+1}/${s.items.length}`];
  if(s.timed){const r=remainSecs(s);bits.push(r?`${Math.ceil(r/60)} min left`:'time up')}

}
function toggleSessOpen(){sessOpen=!sessOpen;renderDashboard()}
function resumeSection(){

}
function syncResumeChip(){
  const b=document.getElementById('resumeChip');if(!b)return;
  /* Only while a session is genuinely live: a finished one is off the store the
     moment it is graded, so the chip cannot outlive it onto the results screen. */

}
function resumeActive(){if(sess)resumeSess(sess.sid)}
function resumeSess(sid){

  sess=live;
  closeModal();
  /* Past the deadline you get a choice, never a verdict (INV-9, D-1). */
  if(sess.timed&&remainSecs(sess)<=0){expiredPrompt();return}
  go('quiz');renderQuiz();

/* The only screen that may offer to record a timed sit you did not finish, and
   it offers — it never acts. No third option, no default, nothing on a timer. */
function expiredPrompt(){
  const s=sess;if(!s)return;
  const answered=s.items.filter(x=>x.picked.length).length;
  modal(`<h3 style="margin:0 0 4px">Time's up — ${esc(s.title)}</h3>
    <p class="sub" style="margin:0 0 14px">The ${TEST_MINUTES} minutes ran out. You answered <b>${answered}</b> of <b>${s.items.length}</b>, and nothing has been recorded yet.</p>
    <div class="lbl">Submit what I had</div>
    <p class="sub" style="margin:2px 0 12px;font-size:12.5px">Grades the ${s.items.length - answered} unanswered question${s.items.length-answered===1?'':'s'} as wrong and files the attempt${s.testN?` against Test ${s.testN}`:''}.</p>
    <div class="lbl">Discard, record nothing</div>
    <p class="sub" style="margin:2px 0 14px;font-size:12.5px">The session goes; your score, attempts and pass probability are untouched.</p>
    <div class="btn-row">
      <button class="btn primary" onclick="closeModal();finishQuiz()">Submit what I had</button>
      <button class="btn ghost" onclick="closeModal();discardSess(${s.sid});go('dashboard')">Discard, record nothing</button>
    </div>`);
}
/* ---- A tab navigates, a button acts (§3.1) ----
   The Drill tab used to be a start action wearing a navigation label: Drill →
   Stats → Drill left two half-finished drills behind. Now the tab walks back
   into the newest one, and the dashboard's Start drill button is the thing that
   deliberately begins a fresh one. */
function resumeOrStart(source,start){
  const s=newestOf(source);
  if(s)return resumeSess(s.sid);
  start();
}
function drillTab(){resumeOrStart('drill',startDrill)}
/* The one genuinely ambiguous case: source AND testN both matching. A Test 12
   against an open Daily drill is not a collision — it is the point of D-2. */
let _freshFn=null;
function runFresh(){const f=_freshFn;_freshFn=null;if(f)f()}
function collisionPrompt(s,fresh){
  _freshFn=fresh;
  modal(`<h3 style="margin:0 0 4px">${esc(s.title)} is already open</h3>
    <p class="sub" style="margin:0 0 14px">${esc(sessLine(s))}. Starting fresh leaves that one waiting on your dashboard.</p>
    <div class="btn-row">
      <button class="btn primary" onclick="closeModal();resumeSess(${s.sid})">Resume</button>
      <button class="btn" onclick="closeModal();runFresh()">Start fresh</button>
    </div>`);
}

/* ============ SESSION ============ */
/* `instant` overrides the feedback pref for modes that only make sense one way
   (Sweep). Everything else — timed tests included — follows the pref: when you
   see the answer is your decision, not the app's. What the app does owe you is
   an honest label, so a `best` set with the answers on screen says so on the
   tile (see testTile).

   `order` decides how the questions are laid out:
     null      shuffle, unless the pref says otherwise (the old behaviour)
     'cluster' related questions adjacent, neediest cluster first (see CLUSTERS)
     'keep'    exactly as handed in — the caller has already ordered it */
function makeSession(qs,{title,timed,testN=null,source='custom',instant=null,order=null}){
  let list=qs.slice();
  if(order==='cluster')list=clusterOrder(list);
  else if(order!=='keep'&&prefs.shufQ&&source!=='mistakes'&&source!=='mset')list=shuffle(list);
  if(instant==null)instant=prefs.feedback==='instant';
  /* startTs doubles as the session id: unique per session for any human, and it
     sorts the resume list by recency for free. The loop is pure insurance
     against two sessions landing in the same millisecond. */
  let startTs=Date.now();while(sessions[startTs])startTs++;
  sess={sid:startTs,instant,title,timed,testN,source,idx:0,
    /* Fixed at the start and carried, never re-read per question. Changing the
       setting mid-session would otherwise fold the options away on question 40
       of a session that has not asked for them once. */
    recall:recallOn(source,timed),
    readyBefore:readiness().p,             /* so the results screen can show what the session moved */
    items:list.map(q=>{
      let order=q.o.map((_,i)=>i);
      if(prefs.shufO)order=shuffle(order);
      return {q,order,picked:[],checked:false};
    }),
    startTs,
    /* INV-10: an absolute deadline, so time passes whether the app is on screen
       or not. The old counter was decremented once per interval tick, which a
       backgrounded PWA stops firing — every timed test was quietly longer than
       45 minutes by however long you had looked away. */
    deadline:timed?startTs+TEST_MINUTES*60000:null};
  touchSess();
  go('quiz');renderQuiz();
  if(timed)startTimer();
}
function startTest(n){
  const t=TESTS.find(x=>x.n===n);if(!t){toast('That test no longer exists');return}
  const fresh=()=>makeSession(t.q,{title:`Test ${n}`,timed:true,testN:n,source:'test'});
  const open=newestOf('test',n);
  open?collisionPrompt(open,fresh):fresh();
}
function startExam(){makeSession(shuffle(POOL).slice(0,24),{title:'Random exam',timed:true,source:'random'})}
function practiceMistakes(){
  const ids=Object.entries(S.mistakes).filter(([g,m])=>!m.done).map(([g])=>QByG[g]).filter(Boolean);
  if(!ids.length){toast('No mistakes to review 🎉');return}
  makeSession(ids,{title:'Mistake practice',timed:false,source:'mistakes'});
}
function startTopic(tp){const qs=POOL.filter(q=>q.p===tp);makeSession(shuffle(qs).slice(0,24),{title:TOPICS[tp],timed:false,source:'topic'})}

/* ============ MISTAKE SETS ============
   practiceMistakes() serves the whole list in one go. At 150+ that is not a
   session, it is a wall, and a wall gets abandoned halfway — which is the
   actual reason the list drains slowly. It is not the retirement rule. Nothing
   clears on a session you did not finish.

   So the same pile, cut into papers. Not a smaller dose: the appetite here is
   the whole list in a day and more, sat across six or seven sittings that each
   feel like a test with a front and a back. The chunk is the entire feature.

   Two rules decide what is in each one, and neither touches how hard it is to
   clear a question:

   1. Only what can still EARN something today. A day is credited once
      (recordAnswer), and never on the day you slipped, so an entry already
      ticked off today or missed today is dead weight — right or wrong, its
      counter cannot move again until tomorrow. That also makes the sets walk
      forward on their own: every question answered leaves the pool, so set 2
      is 24 questions set 1 never showed you, with no bookkeeping to keep.
   2. Oldest-untouched first, not random. Retirement needs each question to
      collect its own separate days, so the queue has to walk the whole list
      rather than re-roll the same faces; a random draw leaves a tail that
      never comes up at all.

   Severity is the tie-break, not the sort. Ranking by it outright means a
   solid block of leeches every day while the tail starves — and leeches have
   their own protection already: they never retire on the counter, so they
   cannot leave the list by accident however often they surface. */
const MISTAKE_SET_N=24;
/* Open, not already credited today, not missed today — everything a session
   today could actually move. */
function mistakePool(){
  const today=dayKey();
  return Object.entries(S.mistakes)
    .filter(([,m])=>!m.done&&m.miss!==today&&!(m.ok||[]).includes(today))
    .map(([g,m])=>({q:QByG[canon(g)],m})).filter(x=>x.q);
}
function mistakeQueue(){
  return mistakePool().sort((a,b)=>lastSeen(a.q)-lastSeen(b.q)||cramRank(b.m)-cramRank(a.m));
}
/* "Set 3 of 7", derived, never stored. Counting what has already had its day
   is the same question asked from the other side, so the label cannot drift
   out of step with the pool: an abandoned set leaves its questions live and
   the number simply does not advance, mistakes made in a practice test during
   the day grow the denominator honestly, and clearing one in the daily drill
   moves the set on because it genuinely did the work. */
function mistakeSetPos(){
  const today=dayKey(),open=Object.values(S.mistakes).filter(m=>!m.done);
  const spent=open.filter(m=>m.miss===today||(m.ok||[]).includes(today)).length;
  return {i:Math.floor(spent/MISTAKE_SET_N)+1,
          of:Math.max(1,Math.ceil(open.length/MISTAKE_SET_N)),
          live:open.length-spent,open:open.length};
}
function startMistakeSet(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||MISTAKE_SET_N)));
  const qs=mistakeQueue().slice(0,size).map(x=>x.q);
  if(!qs.length){
    toast(cramCount()?'Every open mistake has had its day today ✅ — the next tick has to be tomorrow':'No mistakes to review 🎉');
    return;
  }
  const p=mistakeSetPos();
  /* Its own source, not 'mistakes': makeSession leaves the order alone for both
     (the queue above IS the point — shuffling it hands back a random 24), but
     only this one is a training set, walks a queue on Next batch, and needs a
     results screen that talks about days rather than a pass mark. */
  makeSession(qs,{title:`Mistake set ${p.i} of ${p.of}`,timed:false,source:'mset'});
}

/* ============ DAILY DRILL ============
   prefs.dailyTarget questions, mixed by an explicit ratio: what spaced
   repetition says is due, your open mistakes, and questions you have never
   seen.

   The old mix gave 4 of its 20 slots to unseen questions — 100 questions
   before exam day, 5% of the bank, with the other 16 slots recycling material
   already known. Coverage first: while there is bank left to see, 60% of every
   drill goes to questions you have never met. */
const MIX={coverage:   {due:.20,mistake:.20,new:.60},
           consolidate:{due:.35,mistake:.35,new:.30},
           final:      {due:.50,mistake:.50,new:.00}};
/* Not laid eyes on in this many days = cold, and in the final week it comes
   back regardless of which box it is sitting in. */
const STALE_DAYS=10;
/* Driven by the exam date: consolidate at 14 days out, final at FINAL_AT. With
   no date set the sprint is treated as being in its coverage weeks.

   FINAL_AT was 6, and 6 was right for the bank this rule was written against:
   1,858 questions with complete coverage as the stated baseline, where by six
   days out there was nothing unseen left to serve and the switch cost nothing.
   The bank is 3,147 now — it grew by about seventy per cent after the rule was
   set, and the rule did not move with it. At 6 the switch would have buried
   whatever was still unseen on 30 August without saying so, which is not a
   decision a threshold should make on your behalf.

   3, so new questions keep arriving until 2 September. That is one day inside
   EXAM_GAP, which is deliberate: a question first met on the 2nd still gets its
   last review before the ladder stops scheduling. Meeting one for the first
   time in the exam is the outcome this is spending three days to avoid. */
const FINAL_AT=3;
function drillMode(){
  const left=daysLeft();
  if(left==null)return 'coverage';
  return left<=FINAL_AT?'final':left<=14?'consolidate':'coverage';
}
function weakestTopics(){
  return TOPICS.map((n,i)=>{const s=S.topics[i]||{seen:0,correct:0};
    return{i,pct:s.seen?s.correct/s.seen:0,seen:s.seen}})
    .sort((a,b)=>(a.seen?a.pct:2)-(b.seen?b.pct:2)).map(t=>t.i);
}
/* Never-answered questions, weakest topic first. POOL, not ALLQ: a question
   whose duplicate you have already answered is not unseen. */
function unseenQuestions(){
  const byTopic={};
  for(const q of POOL)if(!S.sr[q.g])(byTopic[q.p]||(byTopic[q.p]=[])).push(q);
  return weakestTopics().flatMap(tp=>shuffle(byTopic[tp]||[]));
}
function drillPlan(){
  const now=Date.now(),N=drillSize(),mode=drillMode(),mix=MIX[mode]||MIX.coverage,fin=mode==='final';
  const picked=[],taken=new Set();
  const add=(g,why)=>{g=canon(+g);
    if(taken.has(g)||!QByG[g]||picked.length>=N)return false;
    taken.add(g);picked.push({q:QByG[g],why});return true};
  /* Take up to `quota` from this list. add() caps the total at N, so a quota
     of N means "as many as still fit". */
  const fill=(list,why,quota)=>{let n=0;for(const g of list){if(n>=quota)break;if(add(g,why))n++}};

  const due=srDue(now);
  /* Leeches first, always: four misses means the drill is where it gets fixed,
     not somewhere behind 40 questions you have missed once. Then by how much
     trouble the question has caused — misses and guesses both count. */
  const trouble=m=>(m.count||0)+(m.unsure||0);
  const mistakes=Object.entries(S.mistakes).filter(([,m])=>!m.done)
    .sort((a,b)=>(b[1].leech?1:0)-(a[1].leech?1:0)||trouble(b[1])-trouble(a[1])).map(([g])=>+g);
  const unseen=mix.new>0?unseenQuestions().map(q=>q.g):[];
  /* Final week only. Everything you have ever missed comes back, retired or
     not — cleared in August is not the same as known in September — and so
     does anything you have not laid eyes on in STALE_DAYS, whatever box it
     climbed to. Spaced repetition is a plan for a year you do not have. */
  const missed=fin?Object.entries(S.mistakes).filter(([,m])=>m.done)
    .sort((a,b)=>trouble(b[1])-trouble(a[1])).map(([g])=>+g):[];
  const stale=fin?Object.keys(S.sr).filter(g=>QByG[g]&&(S.sr[g].last||0)<now-STALE_DAYS*DAY)
    .sort((a,b)=>(S.sr[a].last||0)-(S.sr[b].last||0)).map(g=>+g):[];

  fill(due,'due',Math.round(N*mix.due));
  fill(mistakes,'mistake',Math.round(N*mix.mistake));
  fill(unseen,'new',N);                      /* new takes its share plus every slot the other two left */
  /* Both empty outside the final week. Inside it they split what is left
     rather than letting one eat the drill: there are hundreds of old mistakes
     and hundreds of cold cards, and a session of nothing but old mistakes
     never checks whether the questions you got right in August survived. */
  if(fin){
    fill(missed,'missed',Math.ceil((N-picked.length)/2));
    fill(stale,'stale',N);
    fill(missed,'missed',N);                 /* nothing cold left → back to the mistakes */
  }
  /* Still short? A thin category's slack goes to whatever is left, in order of
     what it costs you to skip. `final` mode allows no new questions at all, so
     it can legitimately come in under target. */
  fill(due,'due',N);
  fill(mistakes,'mistake',N);
  if(mix.new>0)fill(shuffle(POOL).map(q=>q.g),'new',N);   /* nothing unseen left → anything */
  return picked;
}
function dayKey(d){d=d?new Date(d):new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
/* ---- Two days, not one ----
   `last` is the day something was studied: a sweep and a gauntlet are the day's
   work as much as a drill is, and that is what the streak counts. `drilled` is
   the day the daily drill itself was finished, and it is the only thing the
   tile's tick may speak for — a mistake set is not the drill, and neither is a
   drill walked out of at question nine. They used to be the same field, so any
   session in the app closed the drill for the day. */
function drillDoneToday(){return S.drill&&S.drill.drilled===dayKey()}
/* Every question answered. Reaching the last one and pressing Finish is not the
   same as having done the drill, and the button says so — it counts up to the
   total precisely so it can be left short. */
function drillComplete(s){return !!s&&s.items.every(it=>it.picked.length>0)}
function startDrill(){
  const plan=drillPlan();
  if(!plan.length){toast('Nothing to drill yet');return}
  /* Clustered, not shuffled: the plan's priority order survives at cluster
     level, but questions about the same thing arrive together (see CLUSTERS). */
  makeSession(plan.map(p=>p.q),{title:'Daily drill',timed:false,source:'drill',order:'cluster'});
}
/* ---- Sweep: first contact with the bank ----
   Nothing but questions you have never seen, untimed, answer shown after each
   one. No due cards, no mistakes, no ratios — this is the mode the coverage
   weeks are actually spent in, and the only job is to meet all 1,858 once.
   A question leaves the pool the moment it is answered, so batches never
   repeat until there is nothing unseen left. */
const SWEEP_N=50;
function startSweep(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||SWEEP_N)));
  /* Cluster the whole unseen pool and then cut, rather than cutting first:
     that way cluster-mates land in the same batch instead of a fortnight
     apart. */
  const qs=clusterOrder(unseenQuestions()).slice(0,size);
  if(!qs.length){toast('Every question has been seen at least once 🎉');return}
  makeSession(qs,{title:`Sweep — ${qs.length} unseen`,timed:false,instant:true,source:'sweep',order:'keep'});
}
/* `ts` is when the session STARTED, not when it was handed in. A sweep begun at
   quarter past eleven and finished at one minute past midnight is that
   evening's work: stamping it with the clock at the finish gave the day away to
   a tomorrow that was sixty seconds old, and the tile then spent that whole day
   saying the drill was done. Fifty questions do not get answered in a minute,
   and the day credited should be the one they were answered in.

   Days already banked are never re-credited or taken back, which is also what
   keeps a long-abandoned session honest: resuming one started last week and
   handing it in today credits nothing rather than dragging `last` backwards and
   resetting a streak that has run since. */
function noteStudyDone(ts){
  ts=ts||Date.now();
  const t=dayKey(ts),y=dayKey(ts-DAY);
  if(!S.drill)S.drill={last:null,streak:0,best:0,drilled:null};
  if(S.drill.last&&S.drill.last>=t)return;     /* ISO dates sort as dates */
  S.drill.streak=S.drill.last===y?(S.drill.streak||0)+1:1;
  S.drill.last=t;
  S.drill.best=Math.max(S.drill.best||0,S.drill.streak);
}
/* A finished drill is the day's study too, so it does both. Kept as its own
   stamp rather than a second streak: the tick answers "have I drilled today",
   which is a question about today and needs no history behind it. */
function noteDrillDone(ts){
  noteStudyDone(ts);
  const t=dayKey(ts||Date.now());
  if(!S.drill.drilled||S.drill.drilled<t)S.drill.drilled=t;
}

/* ============ CLUSTERS ============
   Shuffling is what makes this bank easier than the exam. "Life peers are
   appointed by the monarchy on the advice of the Prime Minister" is trivial on
   its own — you recognise the wording. Put it straight after three other
   statements about constitutional appointments and recognition stops working;
   you have to actually know which way round it goes.

   So questions that share a salient entity — a year, a proper noun, an Act —
   are served adjacently. The signal is entirely derived from text already in
   the bank (INV-7): no content is generated, only re-ordered.

   Two passes, rarest key first, because a key shared by three questions says
   far more than one shared by thirty:
     1. proper nouns and years, the strong signal
     2. rare lowercase content words, to catch what pass 1 leaves behind
   That puts ~93% of the bank into a cluster; the rest are served alone. */
const CLUSTER_MAX=5;                                  /* longer runs stop feeling like one topic */
const YEAR_G=/\b(1[0-9]{3}|20[0-2][0-9])\b/g;
const HAS_YEAR=/\b(1[0-9]{3}|20[0-2][0-9])\b/;        /* /g + .test() is a lastIndex trap */
const qText=q=>q.t+' \n '+q.o.map(o=>o[0]).join(' \n ')+' \n '+(q.e||'');
/* Words that start a sentence are capitalised too, so "However" and "Almost"
   look like proper nouns. Anything also seen lowercase somewhere in 1,858
   questions is not a name. */
const CAP_STOP=new Set(('is are was were the a an of in on at to for and or which what who when where how why '+
  'true false correct statement below this that you your it its as by with from they them their there here '+
  'about into during over under between than then').split(' '));
let _lowerVocab=null,_df=null;
function lowerVocab(){
  if(_lowerVocab)return _lowerVocab;
  _lowerVocab=new Set();
  for(const q of POOL)for(const w of qText(q).split(/[^A-Za-z'’-]+/))
    if(/^[a-z][a-z'’-]{2,}$/.test(w))_lowerVocab.add(w);
  return _lowerVocab;
}
/* Document frequency, for pass 2: a word in two questions is a link, a word in
   two hundred is filler. */
function df(){
  if(_df)return _df;
  _df=new Map();
  for(const q of POOL){
    for(const w of new Set(qText(q).toLowerCase().split(/[^a-z'’-]+/)))
      if(w.length>4&&!CAP_STOP.has(w))_df.set(w,(_df.get(w)||0)+1);
  }
  return _df;
}
/* Pass 1 keys: every year mentioned, and every run of capitalised words. */
function salientKeys(q){
  const t=qText(q),out=new Set(),lo=lowerVocab();
  for(const m of t.matchAll(YEAR_G))out.add('y:'+m[1]);
  let run=[];
  const flush=()=>{
    if(run.length>1)out.add('n:'+run.join(' ').toLowerCase());
    else if(run.length===1){const w=run[0].toLowerCase();if(!lo.has(w)&&!CAP_STOP.has(w))out.add('n:'+w)}
    run=[];
  };
  for(const w of t.split(/[^A-Za-z0-9'’-]+/)){
    if(/^[A-Z][A-Za-z’'-]{2,}$/.test(w)&&!CAP_STOP.has(w.toLowerCase()))run.push(w);else flush();
  }
  flush();
  return out;
}
/* Pass 2 keys: uncommon ordinary words — "solicitor", "constituency". */
function weakKeys(q){
  const d=df(),out=new Set();
  for(const w of new Set(qText(q).toLowerCase().split(/[^a-z'’-]+/))){
    if(w.length<=4||CAP_STOP.has(w))continue;
    const n=d.get(w)||0;
    if(n>=2&&n<=25)out.add('w:'+w);
  }
  return out;
}
/* Greedy: take the rarest key first and give it every member still unclaimed.
   Works on array indices, not ids, because the Date Gauntlet can put two
   questions derived from the same id in one list. */
function clusterSplit(qs){
  const strong=new Map(),weak=new Map();
  const push=(m,k,i)=>{const a=m.get(k);a?a.push(i):m.set(k,[i])};
  qs.forEach((q,i)=>{
    for(const k of salientKeys(q))push(strong,k,i);
    for(const k of weakKeys(q))push(weak,k,i);
  });
  const taken=new Set(),clusters=[];
  const sweep=m=>{
    const cand=[...m.entries()].filter(([,v])=>v.length>1&&v.length<=CLUSTER_MAX*2)
      .sort((a,b)=>a[1].length-b[1].length||(a[0]<b[0]?-1:1));   /* rarest, then stable by key */
    for(const [,members] of cand){
      const free=members.filter(i=>!taken.has(i));
      for(let i=0;i+1<free.length;i+=CLUSTER_MAX){
        const grp=free.slice(i,i+CLUSTER_MAX);
        if(grp.length<2)break;
        grp.forEach(x=>taken.add(x));clusters.push(grp);
      }
    }
  };
  sweep(strong);sweep(weak);
  return {clusters,loners:qs.map((_,i)=>i).filter(i=>!taken.has(i))};
}
/* Reorders a list so cluster-mates are adjacent. `rank` (default: the position
   the caller handed it in at) decides which cluster goes first — a cluster is
   worth its most urgent member, so one unseen question drags its four relatives
   to the front with it. That is the point: you meet the whole knot at once. */
function clusterOrder(qs,rank){
  if(qs.length<3)return qs.slice();
  const pos=new Map();qs.forEach((q,i)=>{if(!pos.has(q))pos.set(q,i)});
  const rk=rank?(q=>rank(q)):(q=>pos.get(q));
  const {clusters,loners}=clusterSplit(qs);
  const groups=clusters.map(c=>c.map(i=>qs[i])).concat(loners.map(i=>[qs[i]]));
  const scored=groups.map(g=>{
    const sorted=g.slice().sort((a,b)=>rk(a)-rk(b));
    return {g:sorted,best:rk(sorted[0]),r:Math.random()};
  });
  scored.sort((a,b)=>a.best-b.best||a.r-b.r);         /* one random draw each: a stable comparator */
  return scored.flatMap(s=>s.g);
}

/* ============ TWIST GAUNTLET ============
   509 of the 1,858 questions have two options — 352 true/false and 157
   discrimination pairs. They are a 50% guess in isolation and they are exactly
   the format the real test twists you with. Diluted across the whole bank they
   arrive one at a time, where recognition carries you. Clustered, they cannot:
   four statements about the same appointment, three of them worded to look
   right.

   Order is by how much the question still owes you, so successive sessions walk
   the whole 509 rather than re-serving the same batch. */
/* ============ RECALL ============
   Fold the options away and answer from memory first. Recognising the right
   answer among four is a different and much easier act than knowing it, and the
   exam is the only place that difference gets expensive — so where it is cheap,
   practise the harder one.

   Two whole classes cannot be attempted from the stem, and offering the fold on
   them is worse than not having it: you would meet a question with nothing in
   it, open the options immediately, and learn to open them without reading.

     - A literal true/false. The options are always "True" and "False"; hiding
       them removes nothing and tells you nothing.
     - The 155 whose entire stem is "Which of these statements is correct?".
       There, the question IS the options. Fold them away and no question is
       left on the screen at all.

   Measured over the 3,158 unique questions: 2,182 single-answer and 354
   select-two stems stand on their own (80%), 444 true/false and 155 content-free
   stems do not (19%). The "select TWO" ones are the best material here, not the
   worst — "which TWO countries fought at Agincourt" is a real memory question.

   What this deliberately does NOT do is blank words out of a stem to make it
   recallable. That is generating question content, and INV-7 forbids it for the
   reason it has always forbidden it: a question the app invented can teach a
   fact the handbook never stated. */
const RECALL_DEAD=/^\s*(which (of (these|the following) )?statements? (is|are)|which (of these|of the following) is (correct|true|incorrect|false)|select the (correct|true) statement)/i;
function recallable(q){
  if(!q||!q.t||!Array.isArray(q.o)||q.o.length<2)return false;
  if(RECALL_DEAD.test(q.t))return false;
  if(q.o.length===2&&q.o.every(o=>/^(true|false)$/i.test(String(o[0]).trim())))return false;
  return true;
}
/* Where recognition is most likely to be fooling you: questions that have
   already caught you once. Those lists are short and bounded, so the slower pace
   costs a known amount — unlike a coverage sweep, where it would cost you the
   thing coverage is short of. */
const RECALL_WEAK=new Set(['mistakes','mset','hset']);
/* Never in a timed sit, at any setting. The real test is multiple choice against
   a clock, and the one session that has to be the real test is the timed one. */
function recallOn(source,timed){
  if(timed)return false;
  const m=prefs.recall||'weak';
  return m==='off'?false:m==='all'?true:RECALL_WEAK.has(source);
}
/* Is the fold standing in front of this question right now? */
function recallHidden(it){
  return !!(sess&&sess.recall&&it&&!it.shown&&!it.checked&&recallable(it.q));
}
/* Options open, answer not yet checked — the window the honesty row lives in. */
function recallAsking(it){
  return !!(sess&&sess.recall&&it&&it.shown&&!it.checked&&recallable(it.q));
}
const RECALL_N=POOL.filter(recallable).length;
const TWO_OPT=POOL.filter(q=>q.o.length===2);
/* Lower = drill me sooner. Never seen beats leech beats open mistake beats
   whatever is sitting in the lowest box. */
function urgency(q){
  const g=canon(q.g),e=S.sr[g],m=S.mistakes[g];
  if(!e)return 0;
  if(m&&!m.done)return m.leech?1:2;
  return 3+(e.box||0);
}
const lastSeen=q=>{const e=S.sr[canon(q.g)];return e&&e.last||0};
function twistOrder(){
  const rank=new Map();
  TWO_OPT.forEach(q=>rank.set(q,urgency(q)*1e13+lastSeen(q)));
  return clusterOrder(TWO_OPT,q=>rank.get(q));
}
function twistStats(){
  const fresh=TWO_OPT.filter(q=>!S.sr[canon(q.g)]).length;
  const weak=TWO_OPT.filter(q=>{const m=S.mistakes[canon(q.g)];return m&&!m.done}).length;
  return {total:TWO_OPT.length,fresh,weak};
}
function startTwist(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||drillSize())));
  const qs=twistOrder().slice(0,size);
  if(!qs.length){toast('No two-option questions in the bank');return}
  makeSession(qs,{title:`Twist gauntlet — ${qs.length}`,timed:false,source:'twist',order:'keep'});
}

/* ============ REAL-EXAM QUESTIONS ============
   663 of the 3,147 are reported by test-takers as recently asked in a real
   exam — 263 from testprep.uk's 11 exam papers and 406 from
   lifeintheuktestweb.co.uk's 17, which are 96% new material rather than a
   second copy of the first. That is 21% of the bank carrying the strongest
   yield signal anything here has, and the only other way to meet them is to
   happen to sit one of the 28 exam papers — which serve them 24 at a time,
   mixed with nothing, and say nothing about the rest.

   Ordered like the gauntlets, by what the question still owes you, so
   successive sessions walk all 663 instead of re-serving the same batch. It is
   a filter over the same pool, not a new one: every card is a real question,
   answered against its own id, feeding the same spaced repetition. */
function examStats(){
  const fresh=EXAM_POOL.filter(q=>!S.sr[canon(q.g)]).length;
  const weak=EXAM_POOL.filter(q=>{const m=S.mistakes[canon(q.g)];return m&&!m.done}).length;
  return {total:EXAM_POOL.length,fresh,weak};
}
function startExamQs(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||drillSize())));
  const qs=EXAM_POOL.slice().sort((a,b)=>urgency(a)-urgency(b)||lastSeen(a)-lastSeen(b)).slice(0,size);
  if(!qs.length){toast('No exam-reported questions in the bank');return}
  makeSession(qs,{title:`Real-exam questions — ${qs.length}`,timed:false,source:'examq',order:'keep'});
}

/* ============ DATE GAUNTLET ============
   62 questions in the bank are answered by a bare year, which makes them the
   only place a year is stated as fact rather than mentioned in passing. Both
   directions are drilled off them:

     forward   the original question, verbatim, but with the three nearest
               years found anywhere in the bank as distractors instead of the
               four it shipped with. You cannot pass it on the shape of the
               option list any more.
     reverse   a year, and four verbatim question stems — only one of which it
               answers.

   INV-7 is the constraint that shapes this. Nothing here is written: every
   option is a string lifted character-for-character out of the bank, and the
   only new text is the frame around them. A year mined out of an explanation
   and turned into a question would be a fact nobody checked, drilled daily.

   Only one direction per source question per session — serve both and the
   forward item hands you the answer to the reverse one. */
const BARE_YEAR=/^\s*(1[0-9]{3}|20[0-2][0-9])\s*$/;
function yearAnswer(q){
  const c=q.o.filter(o=>o[1]);
  return c.length===1&&BARE_YEAR.test(c[0][0])?c[0][0].trim():null;
}
const YEAR_Q=POOL.map(q=>({q,y:yearAnswer(q)})).filter(x=>x.y);
/* Every year that appears anywhere in the bank — stems, options, explanations.
   The distractor pool, so a near miss is a year the handbook actually uses. */
const YEAR_POOL=(function(){const s=new Set();
  for(const q of POOL)for(const m of qText(q).matchAll(YEAR_G))s.add(m[1]);
  return [...s]})();
/* Real questions that mention a year — what the gauntlet pads with once the 62
   derived items run out. */
const YEAR_CARRY=POOL.filter(q=>HAS_YEAR.test(qText(q)));
function dateForward(x){
  const y=+x.y;
  const near=YEAR_POOL.filter(v=>+v!==y).sort((a,b)=>Math.abs(+a-y)-Math.abs(+b-y)||+a-+b).slice(0,3);
  if(near.length<2)return null;
  return {...x.q,o:shuffle([[x.y,1],...near.map(v=>[v,0])]),_derived:'date'};
}
function dateReverse(x){
  /* A distractor must not be answered by this year too, and no two options may
     read as the same question — the bank holds "When did the English civil war
     begin?" and "When did the English Civil war begin?" as separate ids, and
     offering both is noise at best and unanswerable at worst. */
  const others=[],taken=new Set([dupNorm(x.q.t)]);
  for(const o of shuffle(YEAR_Q)){
    if(others.length===3)break;
    if(o.y===x.y)continue;
    const k=dupNorm(o.q.t);
    if(taken.has(k))continue;
    taken.add(k);others.push(o);
  }
  if(others.length<3)return null;
  return {g:x.q.g,p:x.q.p,e:x.q.e,_test:x.q._test,_bank:x.q._bank,_derived:'date',
    t:`${x.y} — which of these questions does it answer?`,
    o:shuffle([[x.q.t,1],...others.map(o=>[o.q.t,0])])};
}
function startDates(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||drillSize())));
  const src=YEAR_Q.slice().sort((a,b)=>urgency(a.q)-urgency(b.q)||lastSeen(a.q)-lastSeen(b.q));
  const qs=[],used=new Set();
  for(const x of src){
    if(qs.length>=size)break;
    const item=Math.random()<.5?(dateForward(x)||dateReverse(x)):(dateReverse(x)||dateForward(x));
    if(!item)continue;
    qs.push(item);used.add(x.q.g);
  }
  /* Short of a full session? Top up with real questions that carry a year,
     clustered — which, since a year is a cluster key, groups them by date. */
  if(qs.length<size){
    const pad=YEAR_CARRY.filter(q=>!used.has(q.g))
      .sort((a,b)=>urgency(a)-urgency(b)||lastSeen(a)-lastSeen(b));
    qs.push(...clusterOrder(pad).slice(0,size-qs.length));
  }
  if(!qs.length){toast('No dated questions in the bank');return}
  makeSession(qs,{title:`Date gauntlet — ${qs.length}`,timed:false,source:'dates',order:'keep'});
}

/* ============ TIMER ============ */
let timerInt=null;
function stopTimer(){clearInterval(timerInt);timerInt=null}
/* The tick paints; it does not keep score. Remaining time is derived from the
   absolute deadline every second (INV-10), so a dropped tick costs nothing and a
   backgrounded app cannot grant you extra minutes.

   The visibility guard is belt and braces on top of go() clearing the interval:
   no path may resurrect a hidden session's clock, because a clock reaching zero
   off screen is exactly how the app used to file a sit nobody asked for. */
function tickTimer(){
  if(!sess||!sess.timed||quizHidden()){stopTimer();return}
  const r=remainSecs(sess),t=document.getElementById('timer');
  if(t){t.textContent=fmt(r);t.classList.toggle('warn',r<=60)}
  /* Even here, watching it happen, expiry offers — it never submits (INV-9). */
  if(r<=0){stopTimer();expiredPrompt()}
}
function startTimer(){stopTimer();tickTimer();timerInt=setInterval(tickTimer,1000)}
/* iOS suspends a backgrounded PWA's intervals outright, so coming back to the
   app would otherwise show a clock frozen where you left it — the display lying
   about a deadline that never stopped. Repaint from the wall clock on return. */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&sess&&sess.timed&&!quizHidden())startTimer();
});
function fmt(s){s=Math.max(0,s);return`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

/* ============ QUIZ RENDER ============ */
/* Expanded at 24 or fewer — the exam-shaped sessions, where going back over
   your flagged ones is the point — collapsed above that, where the grid was
   costing more screen than it earned. prefs.jumpOpen is null until you say
   otherwise, and then it is your answer everywhere. */
const jumpOpen=()=>prefs.jumpOpen==null?sess.items.length<=24:!!prefs.jumpOpen;
function toggleJump(){prefs.jumpOpen=!jumpOpen();savePrefs();renderQuiz()}
/* One class function for both navigators, so the strip and the grid can never
   disagree about the same question. */
function dotClass(x,i){
  let c=i===sess.idx?' cur':'';
  if(x.checked)c+=x._correct?' ok':' no';else if(x.picked.length)c+=' ans';
  return c;
}
/* The gap closes as the session gets longer: at 200 questions, a 1px gap
   between every pair would be more gap than strip. */
function renderQuiz(){
  const it=sess.items[sess.idx],q=it.q,ci=correctIdx(q),multi=ci.length>1;
  const answeredCount=sess.items.filter(x=>x.picked.length).length;
  const open=jumpOpen();
  const el=document.getElementById('view-quiz');
  el.innerHTML=`
    <div class="qtop">
      <span class="chip title">${esc(sess.title)}</span>
      <span class="chip count">Q ${sess.idx+1} / ${sess.items.length}</span>
      <div class="spacer"></div>
      ${sess.timed?`<span class="chip timer" id="timer">${fmt(remainSecs(sess))}</span>`:''}
      <button class="flagbtn ${flagged(q.g)?'on':''}" id="flagBtn" onclick="toggleFlag(${q.g})">${flagged(q.g)?'★ Flagged':'☆ Flag'}</button>
    </div>
    <div class="qstrip" id="qstrip">
      ${sess.items.map((x,i)=>`<i class="${dotClass(x,i).trim()}"></i>`).join('')}
    </div>
    <div class="card pad">
      <div class="qhead">
        <span class="chip topic">${esc(TOPICS[q.p])}</span>
        ${histBadge(q)}
        ${multi?`<span class="chip" style="color:var(--warn)">Select ${ci.length}</span>`:''}
      </div>
      <div class="qtext">${esc(q.t)}</div>
      ${/* Only say something worth reading. "Choose one answer. Feedback shows
            after each answer." was two lines of screen repeated 60 times a
            session telling you what you already knew by question two. */
        (()=>{const bits=[];
          if(multi)bits.push(`This question needs <b>${ci.length}</b> answers.`);
          if(!sess.instant&&sess.idx===0)bits.push('Answers stay hidden until you finish.');
          return bits.length?`<div class="hint">${bits.join(' ')}</div>`:''})()}
      ${recallHidden(it)?`<div class="recall">
        <div class="rlbl">Answer it from memory first</div>
        <p class="rsub">Say it out loud before you open these. Picking the right answer out of ${it.order.length} is a much easier thing than knowing it — and the exam is the only place that difference costs you.</p>
        <button class="btn ghost" onclick="revealOpts()">Show the options</button>
      </div>`:`
      ${recallAsking(it)?`<div class="rrow">
        <span class="rq">Did you have it?</span>
        <button class="btn sm ghost${it.recall==='hit'?' on':''}" onclick="recallSay(1)">Had it</button>
        <button class="btn sm ghost miss${it.recall==='miss'?' on miss':''}" onclick="recallSay(0)">Didn't</button>
      </div>`:''}
      <div class="opts" id="opts">
        ${it.order.map((oi,pos)=>{
          const sel=it.picked.includes(oi);
          return `<div class="opt ${multi?'multi':''} ${sel?'sel':''}" data-oi="${oi}" onclick="pick(${oi})">
            <span class="mark">${multi?(sel?'✓':''):String.fromCharCode(65+pos)}</span>
            <span class="otext">${esc(q.o[oi][0])}</span>
          </div>`}).join('')}
      </div>`}
      <div class="explain" id="explain"></div>
    </div>
    <button class="jtog" onclick="toggleJump()" aria-expanded="${open}">Jump to question ${open?'▴':`▾ (${sess.items.length})`}</button>
    <div class="dots${open?'':' hidden'}">
      ${sess.items.map((x,i)=>`<button class="dot${dotClass(x,i)}${flagged(x.q.g)?' flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}
    </div>
    <div class="qnav">
      <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled':''}>← Prev</button>
      <div class="spacer"></div>
      ${recallHidden(it)
        ? `<button class="btn primary" id="mainBtn" onclick="revealOpts()">Show the options</button>`
        : sess.instant && !it.checked
        ? `<button class="btn primary" id="mainBtn" onclick="checkQ()">Check answer</button>`
        : (sess.idx<sess.items.length-1
            ? `<button class="btn primary" id="mainBtn" onclick="nextQ()">Next →</button>`
            : `<button class="btn primary" id="mainBtn" onclick="finishQuiz()">Finish (${answeredCount}/${sess.items.length})</button>`)}
    </div>`;
  if(sess.instant && it.checked)paintCheck();
}
function pick(oi){
  const it=sess.items[sess.idx];if(it.checked)return;
  const multi=correctIdx(it.q).length>1;
  if(multi){const k=it.picked.indexOf(oi);k>=0?it.picked.splice(k,1):it.picked.push(oi)}
  else it.picked=[oi];
  // update selection visuals without full re-render
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const s=it.picked.includes(+o.dataset.oi);o.classList.toggle('sel',s);
    if(multi)o.querySelector('.mark').textContent=s?'✓':'';
  });
  // auto-advance in exam single-choice? no — let user move. But refresh dot + finish count
  refreshDots();
  touchSess();
}
function refreshDots(){
  document.querySelectorAll('.dots .dot').forEach((d,i)=>{
    d.className='dot'+dotClass(sess.items[i],i)+(flagged(sess.items[i].q.g)?' flag':'');
  });
  /* The strip is the only navigator on screen while the grid is folded away, so
     it cannot be the one that goes stale. */
  document.querySelectorAll('#qstrip > i').forEach((s,i)=>{s.className=dotClass(sess.items[i],i).trim()});
  const mb=document.getElementById('mainBtn');
  if(mb&&sess.idx===sess.items.length-1&&!sess.instant){const a=sess.items.filter(x=>x.picked.length).length;mb.textContent=`Finish (${a}/${sess.items.length})`}
}
/* The fold comes down for this question and stays down for it. Not for the
   session: the next question is a new attempt at remembering something. */
function revealOpts(){
  const it=sess&&sess.items[sess.idx];
  if(!it||it.shown)return;
  it.shown=true;touchSess();renderQuiz();
}
/* Peeking stays free. The alternative — making the fold expensive to open —
   buys nothing, because you would open it anyway, just crossly. What it asks
   for instead is one tap of honesty, which is the part that carries. */
function recallSay(hit){
  const it=sess&&sess.items[sess.idx];
  if(!it||it.checked)return;
  it.recall=hit?'hit':'miss';touchSess();renderQuiz();
}
function checkQ(){
  const it=sess.items[sess.idx];if(!it.picked.length){toast('Pick an answer first');return}
  it.checked=true;
  const ci=correctIdx(it.q);
  it._correct=eqSet(it.picked,ci);
  it._rec=recordAnswer(it.q,it._correct,it.picked);
  /* A right answer you could not recall is a right answer you did not know —
     which is the statement "Wasn't sure" already makes, so it takes that path
     rather than a second one beside it. No new scoring axis, nothing new in the
     readiness model, and the mistakes list keeps explaining itself the way it
     always has. applyUnsure() ignores a wrong answer, which is right: a miss is
     already a miss and needs no help. */
  if(it.recall==='miss')applyUnsure(it);
  touchSess();
  /* renderQuiz() reassigns innerHTML and paints the check itself, so painting
     here first only ever decorated a DOM that was about to be thrown away (F-9). */
  renderQuiz();
  /* Four options push the verdict below the fold on a phone. `nearest` means
     this does nothing at all when it is already on screen. */
  const ex=document.getElementById('explain');
  if(ex)ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function paintCheck(){
  const it=sess.items[sess.idx],ci=correctIdx(it.q);
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const oi=+o.dataset.oi;o.classList.add('locked');o.onclick=null;
    if(ci.includes(oi))o.classList.add('correct');
    else if(it.picked.includes(oi))o.classList.add('wrong');
    o.querySelector('.mark').textContent=ci.includes(oi)?'✓':(it.picked.includes(oi)?'✕':o.querySelector('.mark').textContent);
  });
  const ex=document.getElementById('explain');
  ex.className='explain show';
  ex.innerHTML=`<div class="vrow">
      <div class="verdict ${it._correct?'good':'bad'}">${it._correct?'✓ Correct':'✕ Not quite'}</div>
      ${it._correct?`<button class="btn sm ghost unsure${it.unsure?' on':''}" onclick="markUnsure()"${it.unsure?' disabled':''}>${it.unsure?'🤔 Marked unsure':'🤔 Wasn’t sure'}</button>`:''}
    </div>
    <div class="lbl">Explanation</div><div>${esc(it.q.e||'—')}</div>
    ${it.unsure?`<div class="sub" style="margin:8px 0 0;font-size:12.5px">${it.recall==='miss'?'You had the answer in front of you, not in your head. ':''}No promotion, no credit towards clearing it — back tomorrow, and added to your mistakes list to practise.</div>`:''}`;
}
/* ---- "Wasn't sure" ----
   A right answer you did not know is a lucky guess, and 509 questions here are
   coin flips. One tap takes the promotion back: the box stays where it was,
   the card returns tomorrow, and the day does not count towards retirement.

   It also puts the question on the mistakes list, because a question you
   guessed is a question to review — but as its own kind of entry. `count` is
   misses and stays untouched; `unsure` counts the guesses. A record with
   `count:0` means you have never actually got this wrong, you have just never
   known it either, and the list says exactly that rather than accusing you of
   forty wrong answers you did not give.

   Clearing one is the ordinary rule: right on N separate days, confidently.
   `miss` is set to today for the same reason a real miss sets it — answering
   confidently ten minutes after admitting you guessed is not a separate day. */
function markUnsure(){if(applyUnsure(sess&&sess.items[sess.idx]))paintCheck()}
/* The state half, so a failed recall can take the same road without going
   through the button. Returns whether anything changed. */
function applyUnsure(it){
  if(!it||!it.checked||it.unsure||!it._correct)return false;
  it.unsure=true;
  const g=canon(it.q.g),e=S.sr[g],r=it._rec||{},today=dayKey();
  if(e){
    e.box=r.preBox||0;
    e.due=clampDue(Date.now()+DAY);
    e.unsure=(e.unsure||0)+1;
  }
  const m=S.mistakes[g]||(S.mistakes[g]={count:0,ok:[],done:false});
  if(r.credited)m.ok=(m.ok||[]).filter(d=>d!==r.credited);   /* the day it just banked comes back off */
  m.unsure=(m.unsure||0)+1;
  m.miss=today;
  m.done=false;                                    /* guessed is not mastered, even if it was */
  save();touchSess();
  return true;
}
const flagged=g=>!!S.flags[canon(g)];              /* duplicates share one flag */
function toggleFlag(g){const c=canon(g);S.flags[c]?delete S.flags[c]:S.flags[c]=1;save();
  const b=document.getElementById('flagBtn');const on=flagged(g);
  b.classList.toggle('on',on);b.textContent=on?'★ Flagged':'☆ Flag';refreshDots()}
/* Every question starts at the top of itself. Moving on from a long explanation
   otherwise drops you into the middle of the next question — the other half of
   the scroll-down-scroll-up tax the sticky action bar fixes. Instant, not
   smooth: a 200ms glide on every Next gets old by question five. */
function toQuestionTop(){
  const hd=document.querySelector('header');
  const top=document.getElementById('view-quiz').getBoundingClientRect().top+window.scrollY
    -((hd?hd.offsetHeight:0)+8);
  window.scrollTo(0,Math.max(0,top));
}
function prevQ(){if(sess.idx>0){sess.idx--;touchSess();renderQuiz();toQuestionTop()}}
function nextQ(){if(sess.idx<sess.items.length-1){sess.idx++;touchSess();renderQuiz();toQuestionTop()}}
function jump(i){sess.idx=i;touchSess();renderQuiz();toQuestionTop()}

/* ---- Swipe between questions ----
   Next is a small target at the bottom of the screen that you aim at sixty
   times with one thumb; a swipe lands anywhere. That is the whole win — the tap
   count barely moves, the precision does.

   A forward swipe does whatever #mainBtn says, which makes it a big invisible
   main button and costs no new mental model: picked-but-unchecked reveals the
   answer and stays put, everything else moves on. That is a guard, not a
   flourish (F-10) — an item picked and never checked is scored wrong at the end
   and never reaches recordAnswer(), so it costs a point and teaches the
   schedule nothing. Aiming at Prev mid-answer can do that today and rarely
   does; a gesture this cheap would make it routine.

   An untouched question moves rather than toasting "pick an answer first": a
   gesture that silently does nothing reads as broken, because there is no
   target to blame. */
const SWIPE_MIN=60, SWIPE_EDGE=24;
let _swx=0,_swy=0,_swLive=false;
(()=>{
  const vq=document.getElementById('view-quiz');
  vq.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    /* iOS Safari owns the first 24px of either edge for back/forward. In a
       browser tab, hijacking that is worse than not having the feature; in
       standalone PWA mode there is no such gesture, so it costs nothing where
       this matters most. */
    _swLive=e.touches.length===1&&t.clientX>SWIPE_EDGE&&t.clientX<innerWidth-SWIPE_EDGE;
    _swx=t.clientX;_swy=t.clientY;
  },{passive:true});
  vq.addEventListener('touchend',e=>{
    if(!_swLive||!sess||quizHidden())return;
    _swLive=false;
    const t=e.changedTouches[0],dx=t.clientX-_swx,dy=t.clientY-_swy;
    /* Twice the vertical delta, so scrolling a long explanation never turns
       into a question change, and a tap on an option is never a swipe. */
    if(Math.abs(dx)<SWIPE_MIN||Math.abs(dx)<=Math.abs(dy)*2)return;
    if(dx<0)swipeForward();else prevQ();
  },{passive:true});
  vq.addEventListener('touchcancel',()=>{_swLive=false},{passive:true});
})();
function swipeForward(){
  const it=sess.items[sess.idx];
  if(sess.instant&&it.picked.length&&!it.checked){checkQ();return}
  /* The last question's forward swipe does nothing. Finishing stays an aimed
     tap on a button that names the score. */
  nextQ();
}

/* ============ SPACED REPETITION ============
   Leitner boxes. Get it right, it comes back later; get it wrong, it drops to
   box 0 and reappears in the same session's tail or the next drill.

   The ladder is the standard one only while there is room for it. With a fixed
   exam date the top box has to fit inside the days remaining: at 25 days out,
   [0,1,3,7,16,35] files a well-known question 35 days ahead — ten days after
   the exam. Every question you know best would be the one you never see
   again. srDays() scales the whole ladder into the window; clampDue() is the
   backstop that catches everything else (INV-8). */
const SR_BASE=[0,1,3,7,16,35];
const DAY=864e5;
const EXAM_GAP=2;                    /* last useful review: two days before the exam */
function examTs(){if(!S.examDate)return null;const t=new Date(S.examDate+'T00:00:00').getTime();return isNaN(t)?null:t}
function daysLeft(){const e=examTs();return e==null?null:Math.ceil((e-Date.now())/DAY)}
function lastReviewTs(){const e=examTs();return e==null?null:e-EXAM_GAP*DAY}
function clampDue(t){const c=lastReviewTs();return c==null?t:Math.min(t,c)}
function srDays(){
  const c=lastReviewTs();if(c==null)return SR_BASE;
  const top=SR_BASE[SR_BASE.length-1];
  const win=Math.max(0,Math.floor((c-Date.now())/DAY));
  if(win>=top)return SR_BASE;
  const k=win/top;let prev=-1;                     /* stays strictly rising until it saturates */
  return SR_BASE.map(d=>{const v=Math.min(win,Math.max(Math.round(d*k),prev+1));prev=v;return v});
}
/* Returns the box the question was in before this answer — what "wasn't sure"
   puts back (see markUnsure). */
function srUpdate(g,correct){
  const now=Date.now(),days=srDays();
  g=canon(g);                                      /* duplicates share one box */
  const e=S.sr[g]||(S.sr[g]={box:0,due:0,seen:0});
  const preBox=e.box||0;
  e.seen=(e.seen||0)+1;e.last=now;
  e.box=correct?Math.min(preBox+1,days.length-1):0;
  e.due=clampDue(e.box?now+days[e.box]*DAY:now+10*6e4);   /* wrong → back in 10 minutes */
  return preBox;
}
function srDue(now){now=now||Date.now();
  return Object.keys(S.sr).filter(g=>QByG[g]&&S.sr[g].due<=now)
    .sort((a,b)=>S.sr[a].due-S.sr[b].due)}
/* Coverage: how many of the 1,858 unique questions have ever been answered.
   Counts canonical, in-bank ids only, so a stale key from an old bank cannot
   inflate it. */
function srSeen(){return Object.keys(S.sr).filter(g=>QByG[g]&&canon(g)===+g).length}
function srUnseen(){return Math.max(0,UNIQUE_N-srSeen())}

/* ---- Retirement ----
   The old rule was "right twice", counted in answers. Wrong answers come back
   in ten minutes, so a question missed at 09:00 could be answered at 09:10 and
   09:20 and be filed as mastered before you had left the sofa. That is recall
   of the last ten minutes, not knowledge.

   So: right on N *separate days*, and never on the day you last missed it.
   Two-option questions cost a fourth day because they are a coin flip — three
   right answers there happen by accident one time in eight, and 509 of the
   1,858 questions have two options. */
const RETIRE_4=3,RETIRE_2=4,LEECH_AT=4;
const retireDays=q=>q.o.length<=2?RETIRE_2:RETIRE_4;

/* ---- Which wrong answer, not just that it was wrong ----
   "You have chosen 1801 three times" is a different instruction from "you keep
   getting this wrong": it names the belief that needs replacing. Counts are
   kept per option on the CANONICAL question, because a duplicate id can list
   the same options in a different order — an index copied across would accuse
   you of the wrong answer. Matching on normalised text is what survives that.

   Derived questions (the Date Gauntlet) are skipped: their options are built
   for the session and do not correspond to the bank question's option list. */
function notePicked(m,q,picked){
  if(!picked||!picked.length||q._derived)return;
  const cq=QByG[canon(q.g)];if(!cq)return;
  const wrong=picked.filter(i=>q.o[i]&&!q.o[i][1]);
  if(!wrong.length)return;
  const p=m.picked||(m.picked={});
  for(const i of wrong){
    const k=cq.o.findIndex(o=>dupNorm(o[0])===dupNorm(q.o[i][0]));
    if(k>=0)p[k]=(p[k]||0)+1;
  }
}
/* record into topic/mistake stats (once per exam grading or per practice check).
   Returns what it did, so markUnsure() can take it back. */
function recordAnswer(q,correct,picked){
  S.answered++;if(correct)S.correct++;
  noteRecent(correct);
  const rec={preBox:srUpdate(q.g,correct),credited:null,retired:false};
  const tp=S.topics[q.p]||(S.topics[q.p]={seen:0,correct:0});tp.seen++;if(correct)tp.correct++;
  const g=canon(q.g),today=dayKey();               /* duplicates share one record */
  let m=S.mistakes[g];
  if(correct){
    if(m&&!m.done){
      if(!Array.isArray(m.ok))m.ok=[];
      if(m.miss!==today&&!m.ok.includes(today)){m.ok.push(today);rec.credited=today}
      /* A leech is never retired by the counter — it takes an explicit tap. */
      if(!m.leech&&m.ok.length>=retireDays(q)){m.done=true;rec.retired=true}
    }
  }else{
    if(!m)m=S.mistakes[g]={count:0,ok:[],done:false};
    m.done=false;m.ok=[];m.miss=today;m.count=(m.count||0)+1;
    if(m.count>=LEECH_AT)m.leech=true;             /* four misses: stop pretending it will stick */
    notePicked(m,q,picked);
  }
  save();
  return rec;
}

/* ============ ROLLING ACCURACY ============
   Lifetime accuracy never forgets your first week. In a sprint that starts by
   deliberately serving 1,500 questions you have never seen, it is a number
   that can only fall for a fortnight and then crawl — precisely when you need
   to see the recovery. So the headline is the last RECENT_N answers and the
   lifetime figure sits underneath it in small type.

   A "wasn't sure" tap does not take the tick back here. Accuracy is the
