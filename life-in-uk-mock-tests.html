ondon",1],["Suffolk",0],["Kent",0],["Portsmouth",0]]},{"g":390,"t":"When did the 'Battle of the Boyne' happen?","e":"James II wanted to regain the throne and invaded Ireland with the help of a French army. William defeated James II at the Battle of the Boyne in Ireland in 1690, an event which is still celebrated by some in Northern Ireland today. William re-conquered Ireland and James fled back to France.","p":1,"o":[["1697",0],["1690",1],["1695",0],["1693",0]]},{"g":391,"t":"When did Queen Victoria become queen?","e":"In 1837, Queen Victoria became queen of the UK at the age of 18. She reigned until 1901, almost 64 years.","p":1,"o":[["1877",0],["1861",0],["1845",0],["1837",1]]},{"g":392,"t":"Which British TV shows are popular in the UK now?","e":"Popular programmes include regular soap operas such as Coronation Street and EastEnders.","p":0,"o":[["Coronation Street",1],["How I met your mother",0],["Friends",0],["The Big Bang theory",0]]},{"g":393,"t":"What was build as part of the UK's celebration of the new millennium?","e":"The London Eye is situated on the southern bank of the River Thames and is a Ferris wheel that is 443 feet (135 metres) tall. It was originally built as part of the UK's celebration of the new millennium and continues to be an important part of New Year celebrations.","p":0,"o":[["The Tower of London",0],["The London Eye",1],["Big Ben",0],["The Eden Project",0]]},{"g":394,"t":"What became the symbol of the House of Tudor?","e":"This war was called the Wars of the Roses, because the symbol of Lancaster was a red rose and the symbol of York was a white rose. The war ended with the Battle of Bosworth Field in 1485 the House of Lancaster won. The symbol of the House of Tudor was a red rose with a white rose inside it as a sign that the Houses of York and Lancaster were now allies.","p":1,"o":[["A pink rose",0],["A red and white rose",1],["A red rose",0],["A white rose",0]]},{"g":395,"t":"Which Patron Saint day is on the 17th of March?","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":1,"o":[["St Patrick",1],["St David",0],["St Andrew",0],["St George",0]]},{"g":396,"t":"After the Emancipation Act, how many Indian and Chinese workers were employed to replace the slaves?","e":"The Emancipation Act of 1833 abolished slavery throughout British Empire. William Wilberforce was leading abolitionist and Quakers set up first anti-slavery groups. More than 2 million migrants came from India and China to replace labour force.","p":1,"o":[["2 million",1],["2.6 million",0],["1 million",0],["1.4 million",0]]},{"g":397,"t":"Which TWO are NOT part of the UK?","e":"The UK is made up of England, Scotland, Wales and Northern Ireland.","p":4,"o":[["The Isle of Man",1],["The Channel Islands",1],["Northern Ireland",0],["Wales",0]]},{"g":398,"t":"What do many theatres produce at Christmas time?","e":"One British tradition is the pantomime. Many theatres produce a pantomime at Christmas time. They are based on fairy stories and are light-hearted plays with music and comedy, enjoyed by family audiences. One of the traditional characters is the Dame, a woman played by a man. There is often also a pantomime horse or cow played by two actors in the same costume.","p":0,"o":[["New Years Celebration",0],["Tragedy Play",0],["Huge Display",0],["Pantomime",1]]},{"g":399,"t":"Winston Churchill lost the General Election in 1945","e":"Churchill was the son of a politician and, before becoming a Conservative MP in 1900, was a soldier and journalist. In May 1940 he became Prime Minister. He refused to surrender to the Nazis and was an inspirational leader to the British people in a time of great hardship. He lost the General Election in 1945 but returned as Prime Minister in 1951.","p":1,"o":[["True",1],["False",0]]},{"g":400,"t":"Who was the monarch when the Book of Common Prayer was written to be used in the Church of England?","e":"Henry VIII was succeeded by his son Edward VI, who was strongly Protestant. During his reign, the Book of Common Prayer was written to be used in the Church of England. A version of this book is still used in some churches today.","p":1,"o":[["Henry VII",0],["King Richard III",0],["Edward VI",1],["Henry VIII",0]]},{"g":401,"t":"Britain became fully democratic in the 19th century","e":"The UK has had a fully democratic voting system since 1928 (20th century). The present voting age of 18 was set in 1969 and (with a few exceptions) all UK-born and naturalised adult citizens have the right to vote.","p":1,"o":[["True",0],["False",1]]},{"g":402,"t":"When did motor-car racing start in the UK?","e":"Motor-car racing in the UK started in 1902. The UK continues to be a world leader in the development and manufacture of motor-sport technology. A Formula 1 Grand Prix event is held in the UK each year and a number of British Grand Prix drivers have won the Formula 1 World Championship. Recent British winners include Damon Hill, Lewis Hamilton and Jenson Button.","p":0,"o":[["1930s",0],["1896",0],["1902",1],["1899",0]]},{"g":403,"t":"Which of these drugs can you buy or sell legally in UK?","e":"Selling or buying drugs such as heroin, cocaine, ecstasy and cannabis is illegal in the UK.","p":2,"o":[["Heroin",0],["Paracetamol",1],["Ecstasy",0],["Cannabis",0]]},{"g":404,"t":"Which sport often refers to the phrase 'rain stopped play'?","e":"You may come across expressions such as 'rain stopped play', 'batting on a sticky wicket', 'playing a straight bat', 'bowled a googly' or 'it's just not cricket', which have passed into everyday usage. The most famous cricket competition is the Ashes, which is a series of Test matches played between England and Australia.","p":1,"o":[["Cricket",1],["Tennis",0],["Football",0],["Rugby",0]]},{"g":405,"t":"Who was Thomas Gainsborough?","e":"Thomas Gainsborough (1727-88) was a portrait painter who often painted people in country or garden scenery.","p":0,"o":[["Was a landscape painter in modern style",0],["Painted pictures on religious or literary themes in bright colours",0],["Was a portrait painter who often painted people in country or garden scenery",1],["Is best known for his large bronze abstract sculptures",0]]},{"g":406,"t":"What is the most famous competition which is a series of Test matches played between England and Australia?","e":"Cricket originated in England and is now played in many countries. Games can last up to five days but still result in a draw! The idiosyncratic nature of the game and its complex laws are said to reflect the best of the British character and sense of fair play. You may come across expressions such as 'rain stopped play', 'batting on a sticky wicket', 'playing a straight bat', 'bowled a googly' or 'it's just not cricket', which have passed into everyday usage. The most famous competition is the Ashes, which is a series of Test matches played between England and Australia.","p":0,"o":[["Formula One",0],["The Open Championship",0],["The Wimbledon Championship",0],["The Ashes",1]]},{"g":407,"t":"Who wrote 'The Lord of the Rings'?","e":"The Lord of the Rings by JRR Tolkien was voted the country's best-loved novel in 2003.","p":0,"o":[["Charles Dickens",0],["JRR Tolkien",1],["Ian Fleming",0],["J K Rowling",0]]}]},{"n":18,"name":"Life in the UK Test 18","q":[{"g":408,"t":"Where did the people of the Bronze Age bury their dead?","e":"People lived in roundhouses and buried their dead in tombs called round barrows.","p":1,"o":[["Gardens",0],["Round barrows",1],["Graveyards",0],["Coffin Houses",0]]},{"g":409,"t":"What does the UK offer to its residents?","e":"In return, the UK offers: freedom of belief and religion, freedom of speech, freedom from unfair discrimination, a right to a fair trial, a right to join in the election of a government.","p":3,"o":[["Freedom of belief and religion",1],["Untaxed income",0],["Luxurious Life",0],["Free TV license",0]]},{"g":410,"t":"When were the women given the right to vote at the same age as men?","e":"Emmeline Pankhurst was born in Manchester in 1858. She set up the Women's Franchise League in 1889, which fought to get the vote in local elections for married women. Shortly before Emmeline's death in 1928, women were given the right to vote at the age of 21, the same as men.","p":1,"o":[["1918",0],["1957",0],["1969",0],["1928",1]]},{"g":411,"t":"What is known as the Bessemer process?","e":"The development of the Bessemer process for the mass production of steel led to the development of the shipbuilding industry and the railways.","p":1,"o":[["Production of coal",0],["Production of steel",1],["Production of iron",0],["Production of bronze",0]]},{"g":412,"t":"Which party formed the government in 2010?","e":"In May 2010, and for the first time in the UK since February 1974, no political party won an overall majority in the General Election. The Conservative and Liberal Democrat parties formed a coalition and the leader of the Conservative Party, David Cameron, became Prime Minister.","p":1,"o":[["Conservative Party only",0],["It was a coalition",1],["Labour Party only",0],["Liberal Democrats only",0]]},{"g":413,"t":"What organisations try to influence government policy?","e":"Pressure and lobby groups are organisations which try to influence government policy. They play an important role in politics.","p":2,"o":[["Pressure and lobby groups",1],["The Cabinet",0],["Quakers",0],["Chartists",0]]},{"g":414,"t":"Where are the youth cases heard in Scotland?","e":"In Scotland a system called the Children's Hearings System is used to deal with children and young people who have committed an offence.","p":2,"o":[["There is a Children's Hearings System",1],["Sheriff Court",0],["Crown Court",0],["Youth Court",0]]},{"g":415,"t":"When did Scotland abolish the authority of the Pope?","e":"Scotland had also been strongly influenced by Protestant ideas. In 1560, the predominantly Protestant Scottish Parliament abolished the authority of the Pope in Scotland and Roman Catholic religious services became illegal.","p":1,"o":[["1600",0],["1560",1],["1501",0],["1450",0]]},{"g":416,"t":"Which play was written by Shakespeare?","e":"Shakespeare was born in Stratford-upon-Avon, England. He was a playwright and actor and wrote many poems and plays. His most famous plays include A Midsummer Night's Dream, Hamlet, Macbeth and Romeo and Juliet. Lines from his plays and poems which are often still quoted include: Once more unto the breach (Henry V); To be or not to be (Hamlet); A rose by any other name (Romeo and Juliet); All the world's a stage (As You Like It); The darling buds of May (Sonnet 18, Shall I Compare Thee To a Summer's Day).","p":0,"o":[["Before the Dawn",0],["Freedom of Love",0],["Come, Walk with me",0],["Hamlet",1]]},{"g":417,"t":"Where is the Eden Project located?","e":"The Eden Project is located in Cornwall, in the south west of England. Its biomes, which are like giant greenhouses, house plants from all over the world. The Eden Project is also a charity which runs environmental and social projects internationally.","p":0,"o":[["London",0],["Liverpool",0],["Cornwall",1],["Dorset",0]]},{"g":418,"t":"Which TWO scientists led a team which was the first to clone an animal?","e":"In 1996, two British scientists, Sir Ian Wilmot (1944-) and Keith Campbell (1954-2012), led a team which was the first to succeed in cloning a mammal, Dolly the sheep. This has led to further research into the possible use of cloning to preserve endangered species and for medical purposes.","p":1,"o":[["Sir Ian Wilmot",1],["Ernest Rutherford",0],["Keith Campbell",1],["James Goodfellow",0]]},{"g":419,"t":"When did the American colonies declare independence?","e":"In 1776, 13 American colonies declared their independence, stating that people had a right to establish their own governments. The colonists eventually defeated the British army and Britain recognised the colonies' independence in 1783.","p":1,"o":[["1783",0],["1776",1],["1779",0],["1781",0]]},{"g":420,"t":"The Monarch is responsible for the opening of the new parliamentary session each year","e":"The Monarch has important ceremonial roles, such as the opening of the new parliamentary session each year. On this occasion the Monarch makes a speech which summarises the government’s policies for the year ahead. All Acts of Parliament are made in her/his name.","p":2,"o":[["True",1],["False",0]]},{"g":421,"t":"Who is the next heir to the throne?","e":"Queen Elizabeth II reigned since her father's death in 1952 (in 2012 she celebrated her Diamond Jubilee - 60 years as queen) until she passed away in 2022. Her eldest son, King Charles III (previously the Prince of Wales) became the new monarch. His elder son, William, Prince of Wales is next in line.","p":2,"o":[["Queen Elizabeth II's eldest son",0],["Queen Elizabeth II's husband",0],["Prince Harry",0],["Prince William",1]]},{"g":422,"t":"Henry VIII's fourth wife, Anne of Cleves was a Spanish princess","e":"Anne of Cleves was a German princess. Henry married her for political reasons but divorced her soon after.","p":1,"o":[["False",1],["True",0]]},{"g":423,"t":"In Elizabeth I's time, English settlers began to colonise which part of the world?","e":"In Elizabeth I's time, English settlers first began to colonise the eastern coast of America. The Elizabethan period is also remembered for the richness of its poetry and drama, especially the plays and poems of William Shakespeare.","p":1,"o":[["India",0],["Australia",0],["Eastern coast of America",1],["Central Africa",0]]},{"g":424,"t":"In which years did British Film Studios flourish?","e":"British studios flourished in the 1930s. The 1950s and 1960s were a high point for British comedies, including Passport to Pimlico, The Ladykillers and, later, the Carry On films.","p":0,"o":[["1910's",0],["1970's",0],["1950's",0],["1930's",1]]},{"g":425,"t":"The jury decides whether a person is 'guilty' or 'not guilty' based on what they have heard","e":"The jury has to listen to the evidence presented at the trial and then decide a verdict of 'guilty' or 'not guilty' based on what they have heard. In Scotland, a third verdict of 'not proven' is also possible. If the jury finds a defendant guilty, the judge decides on the penalty. The judge is only responsible for interpreting the law.","p":2,"o":[["True",1],["False",0]]},{"g":426,"t":"How many Olympic gold medals has the Scottish cyclist, Sir Chris Hoy, won?","e":"Sir Chris Hoy (1976-) is a Scottish cyclist who has won six gold and one silver Olympic medals. He has also won 11 world championship titles.","p":0,"o":[["5",0],["2",0],["6",1],["7",0]]},{"g":427,"t":"During the WWII, the evacuation of more than 300,000 British and French soldiers from France gave rise to which phrase?","e":"Many civilian volunteers in small pleasure and fishing boats from Britain helped the Navy to rescue more than 300,000 men from the beaches around Dunkirk. Although many lives and a lot of equipment were lost, the evacuation was a success and meant that Britain was better able to continue the fight against the Germans. The evacuation gave rise to the phrase 'the Dunkirk spirit'.","p":1,"o":[["The British rescue",0],["The Dunkirk spirit",1],["The Blitz",0],["The Great escape",0]]},{"g":428,"t":"Which film or film franchise produced in UK has been the biggest gross earner?","e":"Many of the films now produced in the UK are made by foreign companies, using British expertise. Some of the most commercially successful films of all time, including the two highest-grossing film franchises (Harry Potter and James Bond), have been produced in the UK.","p":0,"o":[["Charlie Chaplin",0],["James Bond",1],["Matrix",0],["Lord of the rings",0]]},{"g":429,"t":"What is the reason for more ageing population? Choose Two Answers","e":"People in the UK are living longer than ever before. This is due to improved living standards and better health care. There are now a record number of people aged 85 and over. This has an impact on the cost of pensions and health care.","p":0,"o":[["Improved Education",0],["Better Health Care",1],["Better Living Standards",1],["Cheaper Food",0]]},{"g":430,"t":"What is the National Anthem of the UK?","e":"The National Anthem of the UK is 'God Save the King/Queen'. It is played at important national occasions and at events attended by the King/Queen or the Royal Family. The first verse is: 'God save our gracious King! Long live our noble King! God save the King! Send him victorious, Happy and glorious, Long to reign over us, God save the King!'.","p":2,"o":[["United we stand",0],["God Save the King/Queen",1],["God Save the UK",0],["King reign over the UK",0]]},{"g":431,"t":"What did the 'Bill of Rights' confirm?","e":"The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king's power.","p":1,"o":[["Parliament's increased power",1],["Kings can collect taxes",0],["Kings can administer justice",0],["King's increased power",0]]}]},{"n":19,"name":"Life in the UK Test 19","q":[{"g":432,"t":"When did people learn how to make bronze?","e":"Around 4,000 years ago, people learned to make bronze","p":1,"o":[["10,000 years ago",0],["8,000 years ago",0],["4,000 years ago",1],["6,000 years ago",0]]},{"g":433,"t":"When is Valentine's Day?","e":"Valentine's Day, 14 February, is when lovers exchange cards and gifts. Sometimes people send anonymous cards to someone they secretly admire.","p":0,"o":[["23rd of April",0],["14th of February",1],["16th of December",0],["31st of December",0]]},{"g":434,"t":"Which Scottish poet wrote 'The Bruce'?","e":"In Scotland, many people continued to speak Gaelic and the Scots language also developed. A number of poets began to write in the Scots language. One example is John Barbour, who wrote The Bruce about the Battle of Bannockburn.","p":0,"o":[["Geoffrey Chaucer",0],["Kevin MacAlpin",0],["Kevin MacDonald",0],["John Barbour",1]]},{"g":435,"t":"How often do you have to take the MOT test for an old vehicle?","e":"If your vehicle is over three years old, you must take it for a Ministry of Transport (MOT) test every year. It is an offence not to have an MOT certificate if your vehicle is more than three years old.","p":2,"o":[["Every 3 years",0],["Every 5 years",0],["Every year",1],["Every 2 years",0]]},{"g":436,"t":"When did Britain become separated from the continent?","e":"Britain only became permanently separated from the continent by the Channel about 10,000 years ago.","p":1,"o":[["4,000 years ago",0],["10,000 years ago",1],["8,000 years ago",0],["6,000 years ago",0]]},{"g":437,"t":"When did many Scottish people leave for North America?","e":"A process began which became known as the 'Highland Clearances'. Many Scottish landlords destroyed individual small farms (known as 'crofts') to make space for large flocks of sheep and cattle. Evictions became very common in the early 19th century. Many Scottish people left for North America at this time.","p":1,"o":[["18th century",0],["19th century",1],["17th century",0],["20th century",0]]},{"g":438,"t":"What is the most famous rugby tournament?","e":"The most famous rugby union competition is the Six Nations Championship between England, Ireland, Scotland, Wales, France and Italy. The Super League is the most well-known rugby league (club) competition.","p":0,"o":[["The Six Nations Championship",1],["The Super Bowl",0],["Royal Ascot",0],["The Wimbledon Championship",0]]},{"g":439,"t":"Where can you see the 'Bayeux Tapestry' today?","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror. The battle is commemorated in a great piece of embroidery, known as the Bayeux Tapestry, which can still be seen in France today.","p":1,"o":[["France",1],["Wales",0],["Scotland",0],["England",0]]},{"g":440,"t":"What is an example of a Criminal Offence?","e":"Examples of criminal laws are: Carrying a weapon, selling or buying drugs, racial crime, selling tobacco to under 18s, smoking/drinking in public in inappropriate places, buying alcohol for under 18s.","p":2,"o":[["Owing Money",0],["Selling Tobacco to under 18's",1],["Discrimination in the workplace",0],["Housing disputes",0]]},{"g":441,"t":"Who was Isambard Kingdom Brunel?","e":"Brunel was originally from Portsmouth, England. He was an engineer who built tunnels, bridges, railway lines and ships.","p":1,"o":[["A novelist",0],["An engineer",1],["A gardener",0],["An artist",0]]},{"g":442,"t":"The Union Flag is made up of Welsh, Scottish, Irish and English crosses","e":"The Union Flag consists of three crosses: The cross of St George, patron saint of England, is a red cross on a white ground; The cross of St Andrew, patron saint of Scotland, is a diagonal white cross on a blue ground; The cross of St Patrick, patron saint of Ireland, is a diagonal red cross on a white ground.","p":1,"o":[["True",0],["False",1]]},{"g":443,"t":"Scotland and Wales remained free of Anglo-Saxon rule","e":"Parts of the west of Britain, including much of what is now Wales, and Scotland, remained free of Anglo-Saxon rule.","p":1,"o":[["False",0],["True",1]]},{"g":444,"t":"Oliver Cromwell took the title 'King of Ireland'","e":"Cromwell was given the title of Lord Protector and ruled until his death in 1658. Henry VIII took the title 'King of Ireland'","p":1,"o":[["False",1],["True",0]]},{"g":445,"t":"On Valentine's Day people exchange gifts and cards and send anonymous cards to people they secretly admire","e":"Valentine's Day, 14 February, is when lovers exchange cards and gifts. Sometimes people send anonymous cards to someone they secretly admire.","p":0,"o":[["True",1],["False",0]]},{"g":446,"t":"Who wrote music for George VI and Queen Elizabeth II?","e":"Sir William Walton (1902-83) wrote a wide range of music, from film scores to opera. He wrote marches for the coronations of King George VI and Queen Elizabeth II but his best-known works are probably Facade, which became a ballet, and Balthazar's Feast, which is intended to be sung by a large choir.","p":0,"o":[["George Frederick Handel",0],["Henry Purcell",0],["Sir William Walton",1],["Sir Edward Elgar",0]]},{"g":447,"t":"In 2003, The Lord of the Rings by JRR Tolkien was voted the country's best loved novel","e":"In 2003, The Lord of the Rings by JRR Tolkien was voted the country's best loved novel","p":0,"o":[["True",1],["False",0]]},{"g":448,"t":"When did hereditary peers lose the automatic right to attend the House of Lords?","e":"Since 1999, hereditary peers have lost the automatic right to attend the House of Lords. They now elect a few of their number to represent them in the House of Lords.","p":2,"o":[["1999",1],["1969",0],["1979",0],["1989",0]]},{"g":449,"t":"Which official holiday is celebrated on the 30th November in Scotland?","e":"Only Scotland and Northern Ireland have their patron saint's day as an official holiday. Events are held across Scotland, Northern Ireland and the rest of the country, especially where there are a lot of people of Scottish, Northern Irish and Irish heritage.","p":0,"o":[["Hogmanay",0],["Father's Day",0],["St Andrew's Day",1],["Bonfire Night",0]]},{"g":450,"t":"When is St George's Day?","e":"England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David's Day, Wales;17 March: St Patrick's Day, Northern Ireland; 23 April: St George's Day, England; 30 November: St Andrew's Day, Scotland.","p":0,"o":[["1st March",0],["30th November",0],["17th March",0],["23rd April",1]]},{"g":451,"t":"Who led the invasion of England in 1066?","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror. The battle is commemorated in a great piece of embroidery, known as the Bayeux Tapestry, which can still be seen in France today.","p":1,"o":[["King Alfred the Great",0],["Julius Caesar",0],["William the Duke of Normandy",1],["Harold the Saxon King",0]]},{"g":452,"t":"Who was Catherine of Aragon (the first of Henry VIII's six wives)?","e":"Catherine was a Spanish princess. She and Henry had a number of children but only one, Mary, survived. When Catherine was too old to give him another child, Henry decided to divorce her, hoping that another wife would give him a son to be his heir.","p":1,"o":[["Swedish princess",0],["Spanish princess",1],["Dutch princess",0],["French princess",0]]},{"g":453,"t":"What is Sir Isaac Newton's famous published work?","e":"His most famous published work was Philosophiae Naturalis Principia Mathematica ('Mathematical Principles of Natural Philosophy'), which showed how gravity applied to the whole universe. Newton also discovered that white light is made up of the colours of the rainbow","p":1,"o":[["Mathematical Principles of Natural Philosophy",1],["Relativistic theory of light",0],["Quantum Photon Properties",0],["Discovery of the God particle",0]]},{"g":454,"t":"Who is Sir Edward Elgar(1857-1934)?","e":"Sir Edward Elgar (1857-1934) was born in Worcester, England. His best-known work is probably the Pomp and Circumstance Marches. March No 1 (Land of Hope and Glory) is usually played at the Last Night of the Proms at the Royal Albert Hall.","p":0,"o":[["A musician",1],["A politician",0],["A doctor",0],["An actor",0]]},{"g":455,"t":"Nick Park created the 'Wallace and Gromit' film. What kind of film was it?","e":"Britain continues to be particularly strong in special effects and animation. One example is the work of Nick Park, who has won four Oscars for his animated films, including three for films featuring Wallace and Gromit.","p":1,"o":[["Animated film",1],["Romance film",0],["Adventure film",0],["Detective film",0]]}]},{"n":20,"name":"Life in the UK Test 20","q":[{"g":456,"t":"What Palace was a cast-iron and plate-glass building originally erected in Hyde Park, London, England, to house the Great Exhibition of 1851?","e":"British industry led the world in the 19th century. The UK produced more than half of the world's iron, coal and cotton cloth. The UK also became a centre for financial services, including insurance and banking. In 1851, the Great Exhibition opened in Hyde Park in the Crystal Palace, a huge building made of steel and glass. Exhibits ranged from huge machines to handmade goods. Countries from all over the world showed their goods but most of the objects were made in Britain.","p":0,"o":[["The Great Palace",0],["Crystal Palace",1],["Dream Palace",0],["Gold Palace",0]]},{"g":457,"t":"Who invented the World Wide Web?","e":"World Wide Web was invented by Sir Tim Berners-Lee (1955-) who is British. Information was successfully transferred via the web for the first time on 25 December 1990.","p":1,"o":[["Sir Tim Berners-Lee",1],["Florence Nightingale",0],["Alexander Fleming",0],["James Goodfellow",0]]},{"g":458,"t":"What percentage of the population has a grandparent born outside of the UK?","e":"Post-war immigration means that nearly 10% of the population has a parent or grandparent born outside the UK.","p":0,"o":[["5%",0],["10%",1],["15%",0],["20%",0]]},{"g":459,"t":"Where can you find the ship HMS Victory now?","e":"HMS Victory, can be visited in Portsmouth. It was Admiral Nelson's ship.","p":1,"o":[["London",0],["Portsmouth",1],["Edinburgh",0],["Dorset",0]]},{"g":460,"t":"How long can you use an EU driving licence for?","e":"If your driving licence is from a country in the European Union (EU), Iceland, Liechtenstein or Norway, you can drive in the UK for as long as your licence is valid, subject to UK licence renewal requirements (at the age of 70, or three years after the driver becomes resident). If you have a licence from any other country, you may use it in the UK for up to 12 months.","p":2,"o":[["As long as it's valid",1],["2 years",0],["5 years",0],["12 months",0]]},{"g":461,"t":"What does the Turner Prize celebrate?","e":"The Turner Prize was established in 1984 and celebrates contemporary art.","p":0,"o":[["The Best Song",0],["Contemporary Art",1],["The Best Album",0],["The Best Play",0]]},{"g":462,"t":"Who discovered Insulin?","e":"The Scottish physician and researcher John MacLeod (1876-1935) was the co-discoverer of insulin, used to treat diabetes.","p":1,"o":[["Ian Wilmot",0],["John MacLeod",1],["Patrick Steptoe",0],["Mary Peters",0]]},{"g":463,"t":"When did the English defeat the Spanish Armada?","e":"Elizabeth became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism.","p":1,"o":[["1588",1],["1584",0],["1597",0],["1600",0]]},{"g":464,"t":"Which of these is an Anglo-Saxon poem?","e":"The Anglo-Saxon poem 'Beowulf' tells of its hero's battles against monsters and is still translated into modern English.","p":0,"o":[["Mr Hyde",0],["Pride and Prejudice",0],["Beowulf",1],["Jude the Obscure",0]]},{"g":465,"t":"Which court deals with the most serious cases in Scotland?","e":"The most serious cases in Scotland, such as murder, are heard at a High Court with a judge and jury.","p":2,"o":[["Justice of the Peace Court",0],["Crown Court",0],["High Court",1],["Sheriff Court",0]]},{"g":466,"t":"What was the 'Black Death'?","e":"In 1348, a disease, probably a form of plague, came to Britain. This was known as the Black Death. One third of the population of England died and a similar proportion in Scotland and Wales.","p":1,"o":[["A form of plague",1],["A battle",0],["Lack of water",0],["Lack of food",0]]},{"g":467,"t":"The Bill of Rights confirmed the rights of Parliament and the limits of the King's power","e":"The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king's power.","p":1,"o":[["False",0],["True",1]]},{"g":468,"t":"When William of Orange re-conquered Ireland (in 1690) he took the title 'William the Conqueror'","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror.","p":1,"o":[["False",1],["True",0]]},{"g":469,"t":"Why is 1928 an important date for women's rights?","e":"Emmeline Pankhurst was born in Manchester in 1858. She set up the Women's Franchise League in 1889, which fought to get the vote in local elections for married women. In 1918, women over the age of 30 were given voting rights. Shortly before Emmeline's death in 1928, women were given the right to vote at the age of 21, the same as men.","p":1,"o":[["None of these",0],["Women could vote at 21, the same age as men",1],["Women could vote at 18, the same age as men",0],["Women could vote if they were over 30 years old",0]]},{"g":470,"t":"English laws and the English language were introduced in Wales by the middle of which century?","e":"By the middle of the 15th century the last Welsh rebellions had been defeated. English laws and the English language were introduced.","p":1,"o":[["15th century",1],["17th century",0],["11th century",0],["13th century",0]]},{"g":471,"t":"The people of the Bronze Age were accomplished glassworkers","e":"The people of the Bronze Age were accomplished metalworkers","p":1,"o":[["False",1],["True",0]]},{"g":472,"t":"Whose powers were increased by the Bill of Rights of 1689?","e":"The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king's power. Parliament took control of who could be monarch and declared that the king or queen must be a Protestant. A new Parliament had to be elected at least every three years.","p":1,"o":[["Slaves'",0],["Prisoners'",0],["Parliament's",1],["King's",0]]},{"g":473,"t":"What is Diwali?","e":"Diwali normally falls in October or November and lasts for five days. It is often called the Festival of Lights. It is celebrated by Hindus and Sikhs. It celebrates the victory of good over evil and the gaining of knowledge. There are different stories about how the festival came about. There is a famous celebration of Diwali in Leicester.","p":0,"o":[["Festival of Happiness",0],["Festival of White",0],["Festival of Sun",0],["Festival of Lights",1]]},{"g":474,"t":"Charles Dickens, Thomas Hardy and Jane Austen are famous writers","e":"They are all famous authors and writers.","p":0,"o":[["True",1],["False",0]]},{"g":475,"t":"Where is the Royal Crescent is located?","e":"In the 18th century, simpler designs became popular. The Scottish architect Robert Adam influenced the development of architecture in the UK, Europe and America. He designed the inside decoration as well as the building itself in great houses such as Dumfries House in Scotland. His ideas influenced architects in cities such as Bath, where the Royal Crescent was built.","p":0,"o":[["Portsmouth",0],["London",0],["Bath",1],["Edinburgh",0]]},{"g":476,"t":"St Augustine led missionaries from Rome. Where did he spread Christianity?","e":"The Anglo-Saxons were not Christians when they first came to Britain but, during this period, missionaries came to Britain to preach about Christianity. Missionaries from Ireland spread the religion in the north. The most famous of these were St Patrick, who would become the patron saint of Ireland and St Columba, who founded a monastery on the island of Iona, off the coast of what is now Scotland. St Augustine led missionaries from Rome, who spread Christianity in the south. St Augustine became the first Archbishop of Canterbury.","p":1,"o":[["In the West",0],["In the East",0],["In the North",0],["In the South",1]]},{"g":477,"t":"Which pair won gold medals for Ice dancing at the Olympic Games in 1984 and in four consecutive world championships?","e":"Jayne Torvill (1957-) and Christopher Dean (1958-) won gold medals for ice dancing at the Olympic Games in 1984 and in four consecutive world championships.","p":0,"o":[["Jean Westwood and Lawrence Demmy",0],["Jayne Torvill and Christopher Dean",1],["Jennifer Nicks and John Nicks",0],["Doreen Denny and Courtney Jones",0]]},{"g":478,"t":"Which TWO are associated with rugby?","e":"The most famous rugby union competition is the Six Nations Championship between England, Ireland, Scotland, Wales, France and Italy. The Super League is the most well-known rugby league (club) competition.","p":0,"o":[["The Six Nations Championship",1],["The Super League",1],["The Premier League",0],["Wimbledon",0]]},{"g":479,"t":"The band called Beatles was popular and some alteration to social laws occurred during which period?","e":"The decade of the 1960s was a period of significant social change. It was known as 'the Swinging Sixties'. There was growth in British fashion, cinema and popular music. Two well-known pop music groups at the time were The Beatles and The Rolling Stones. It was also a time when social laws were liberalised, for example in relation to divorce and to abortion in England, Wales and Scotland. The position of women in the workplace also improved.","p":1,"o":[["1960s",1],["1950s",0],["1980s",0],["1970s",0]]}]},{"n":21,"name":"Life in the UK Test 21","q":[{"g":480,"t":"What is the official report that contains everything said in Parliament called?","e":"Proceedings in Parliament are broadcast on television and published in official reports called Hansard.","p":2,"o":[["The Government press",0],["Hansard",1],["The Domesday Book",0],["The Government report",0]]},{"g":481,"t":"What did the Statute of Rhuddlan do?","e":"In 1284 King Edward I of England introduced the Statute of Rhuddlan, which annexed Wales to the Crown of England.","p":1,"o":[["Annexed Scotland to England",0],["Annexed Britain to England",0],["Annexed Ireland to England",0],["Annexed Wales to England",1]]},{"g":482,"t":"Which of these was a British plane in WWII?","e":"The most important planes used by the Royal Air Force in the Battle of Britain were the Spitfire and the Hurricane - which were designed and built in Britain.","p":1,"o":[["F-22",0],["Hurricane",1],["Mig-21",0],["PAK-22",0]]},{"g":483,"t":"Which is not a Protestant Christian group?","e":"There is no established Church in Wales or Northern Ireland. Other Protestant Christian groups in the UK are Baptists, Methodists, Presbyterians and Quakers. There are also other denominations of Christianity, the biggest of which is Roman Catholic.","p":0,"o":[["Catholics",1],["Baptists",0],["Presbyterians",0],["Methodists",0]]},{"g":484,"t":"What is the capital of Scotland?","e":"Edinburgh is the capital city of Scotland.","p":0,"o":[["Cardiff",0],["Edinburgh",1],["London",0],["Belfast",0]]},{"g":485,"t":"When did the Anglo-Saxon kingdoms establish in Britain?","e":"Britain was invaded by tribes from northern Europe: the Jutes, the Angles and the Saxons. The languages they spoke are the basis of modern-day English. Battles were fought against these invaders but, by about AD 600, Anglo-Saxon kingdoms were established in Britain.","p":1,"o":[["AD 789",0],["AD 600",1],["AD 698",0],["AD 410",0]]},{"g":486,"t":"Where can you visit Admiral Nelson's ship , HMS Victory?","e":"Admiral Nelson's ship, HMS Victory, can be visited in Portsmouth","p":1,"o":[["Cheshire",0],["Lincolnshire",0],["London",0],["Portsmouth",1]]},{"g":487,"t":"What time do Public Houses open at?","e":"Public houses (pubs) are an important part of the UK social culture. Pubs are usually open during the day from 11.00 am (12 noon on Sundays).","p":0,"o":[["Noon",0],["11:00",1],["10:00",0],["09:00",0]]},{"g":488,"t":"A very impressive hill fort can still be seen today at Maiden Castle, what English county does it stand in?","e":"A very impressive hill fort can still be seen today at Maiden Castle, in the English county of Dorset.","p":1,"o":[["East Lothian",0],["Danebury",0],["Dorset",1],["Cornwall",0]]},{"g":489,"t":"What do you have to pay tax on in the UK?","e":"People in the UK have to pay tax on their income, which includes: wages from paid employment; profits from self-employment, taxable benefits; pensions; income from property, savings and dividends.","p":2,"o":[["Pensions",1],["All ISAs and Savings Certificates",0],["Attendance Allowance",0],["Disability Living Allowance",0]]},{"g":490,"t":"On election day, you will get your ballot paper, which you take to a polling booth to fill in front of the polling officer","e":"When you arrive at the polling station, the staff will ask for your name and address. In Northern Ireland you will also have to show photographic identification. You will then get your ballot paper, which you take to a polling booth to fill in privately","p":2,"o":[["True",0],["False",1]]},{"g":491,"t":"Which popular yearly sporting event takes place between Oxford and Cambridge universities?","e":"Rowing is also popular, both as a leisure activity and as a competitive sport. There is a popular yearly race on the Thames between Oxford and Cambridge Universities.","p":0,"o":[["Rugby",0],["Horse Racing",0],["Sailing",0],["Rowing",1]]},{"g":492,"t":"Dame Ellen MacArthur is famous for her achievements in which sport?","e":"Dame Ellen MacArthur (1976-) is a yachtswoman and in 2004 became the fastest person to sail around the world single handed.","p":0,"o":[["Sailing",1],["Athletics",0],["Swimming",0],["Cycling",0]]},{"g":493,"t":"The UK has hosted the Olympic Games three times. When did the UK host the games in the 20th century? (Choose TWO)","e":"The UK has hosted the Olympic Games on three occasions: 1908, 1948 and 2012. The main Olympic site for the 2012 Games was in Stratford, East London. The British team was very successful, across a wide range of Olympic sports, finishing third in the medal table.","p":0,"o":[["1916",0],["1948",1],["1928",0],["1908",1]]},{"g":494,"t":"When did the first farmers start settling in Britain?","e":"The first farmers arrived in Britain about 6,000 years ago. The ancestors of these first farmers probably came from south-east Europe. These people built houses, tombs and monuments on the land.","p":1,"o":[["8500 years ago",0],["10000 years ago",0],["4000 years ago",0],["6000 years ago",1]]},{"g":495,"t":"What followed the Bronze Age?","e":"The Bronze Age was followed by the Iron Age, when people learned how to make weapons and tools out of iron.","p":1,"o":[["The Silver Age",0],["The Iron Age",1],["The Stone Age",0],["The medieval period",0]]},{"g":496,"t":"James VI of Scotland was not related to Queen Elizabeth I of England","e":"Mary was suspected of murdering her husband and fled to England. She gave her throne to her Protestant son, James VI of Scotland. Mary was Elizabeth I's cousin.","p":1,"o":[["True",0],["False",1]]},{"g":497,"t":"Which of these flowers is closely associated with Remembrance Day?","e":"The poppy has become the symbol of Remembrance worn during the weeks leading to Remembrance Sunday and Armistice Day.","p":0,"o":[["Lily",0],["Daffodil",0],["Rose",0],["Poppy",1]]},{"g":498,"t":"Who, in 1810 opened the first curry house in Britain called 'The Hindoostane Coffee House' in George Street, London?","e":"In 1810 Sake Dean Mahomet opened the Hindoostane Coffee House in George Street, London. It was the first curry house to open in Britain. Mahomet and his wife also introduced 'shampooing', the Indian art of head massage, to Britain.","p":1,"o":[["Richard Arkwright",0],["Ali Kerimov",0],["Sake Dean Mahomet",1],["Alexander Burns",0]]},{"g":499,"t":"Which TWO are correct about King Henry's wives?","e":"3 of the wives were called Catherine and 2 were called Anne.","p":1,"o":[["Two wives were called Anne",1],["Two of the wives were sisters",0],["All were British",0],["Three wives were called Catherine",1]]},{"g":500,"t":"Ralph Vaughan Williams was strongly influenced by traditional English folk music","e":"Ralph Vaughan Williams (1872-1958) wrote music for orchestras and choirs. He was strongly influenced by traditional English folk music.","p":0,"o":[["False",0],["True",1]]},{"g":501,"t":"What's the Monarch's yearly parliamentary speech for?","e":"The King has important ceremonial roles, such as the opening of the new parliamentary session each year. On this occasion the Monarch makes a speech which summarises the government's policies for the year ahead. All Acts of Parliament are made in his name.","p":2,"o":[["Set out the government's legislative plans for the next year",1],["Credit distinguished politicians and policy-makers",0],["Give advice to the general public on upcoming legislations",0],["Summarise all of the last year's policies",0]]},{"g":502,"t":"How can you arrange to get a National Insurance number?","e":"If you have permission to work in the UK, you will need to telephone the Department for Work and Pensions (DWP) to arrange to get a National Insurance number.","p":2,"o":[["Contact your employer",0],["Contact the Department for Work and Pensions",1],["Write to your MP",0],["Contact your local council",0]]},{"g":503,"t":"How can you contact your MP?","e":"You can contact MPs by letter or telephone at their constituency Office, or at their Office in the House of Commons","p":2,"o":[["By sending a text message",0],["By writing a letter",1],["By sending an Email",0],["By using social networks",0]]}]},{"n":22,"name":"Life in the UK Test 22","q":[{"g":504,"t":"Where is the Cenotaph located?","e":"The Cenotaph can be visited in London in Whitehall.","p":0,"o":[["Whitehall",1],["Wiltshire",0],["Dorset",0],["Trafalgar Square",0]]},{"g":505,"t":"What proportion of the population died because of the Black Death?","e":"One third of the population of England and a similar proportion in Scotland and Wales died because of the Black Death.","p":1,"o":[["One half",0],["One third",1],["One fourth",0],["One fifth",0]]},{"g":506,"t":"How long does it take to give blood?","e":"Donated blood is used by hospitals to help people with a wide range of injuries and illnesses, it takes about an hour to do so.","p":2,"o":[["20 minutes",0],["1 hour",1],["10 minutes",0],["2 hours",0]]},{"g":507,"t":"What country is Swansea in?","e":"Swansea is a Welsh city.","p":0,"o":[["England",0],["Northern Ireland",0],["Scotland",0],["Wales",1]]},{"g":508,"t":"How is the New Year often called in Scotland?","e":"Known in Scotland as 'The Bard', Robert Burns was a Scottish poet. His best-known work is probably the song Auld Lang Syne, which is sung by people in the UK and other countries when they are celebrating the New Year (or Hogmanay as it is called in Scotland).","p":1,"o":[["Second Christmas",0],["Hogmanay",1],["New Year",0],["New Year's eve",0]]},{"g":509,"t":"What did the Magna Carta do?","e":"The Magna Carta established the idea that even the king was subject to the law. It protected the rights of the nobility and restricted the king's power to collect taxes or to make or change laws.","p":1,"o":[["Introduced Christianity",0],["Allowed to collect taxes",0],["Introduced Democracy",0],["Restricted King's power",1]]},{"g":510,"t":"Which of these is known as West End in London?","e":"There are theatres in most towns and cities throughout the UK, ranging from the large to the small. London's West End, also known as 'Theatreland', is particularly well known.","p":0,"o":[["Playland",0],["Theatreland",1],["Actland",0],["Actorland",0]]},{"g":511,"t":"The King James' Bible is a new translation of the Bible into English","e":"One achievement of King James' reign was a new translation of the Bible into English. This translation is known as the 'King James Version' or the 'Authorised Version'. It was not the first English Bible but is a version which continues to be used in many Protestant churches today.","p":1,"o":[["True",1],["False",0]]},{"g":512,"t":"For which TWO subjects are the Secretaries of State responsible?","e":"Secretaries of State are responsible for subjects such as education, health and defence.","p":2,"o":[["Education",1],["Defence",1],["Economy",0],["Policing",0]]},{"g":513,"t":"Which TWO kings believed in the 'Divine Right of Kings'?","e":"James I and his son Charles I were less skilled politically. Both believed in the 'Divine Right of Kings': the idea that the king was directly appointed by God to rule. They thought that the king should be able to act without having to seek approval from Parliament.","p":1,"o":[["Henry VIII",0],["Charles I",1],["William of Orange",0],["James I",1]]},{"g":514,"t":"Which TWO of these aircrafts were used by Britain in WWII?","e":"The most important planes used by the Royal Air Force in the Battle of Britain(1940) were the Spitfire and the Hurricane - which were designed and built in Britain.","p":1,"o":[["F-22",0],["Mig-21",0],["Hurricane",1],["Spitfire",1]]},{"g":515,"t":"During Queen Elizabeth I's reign the English (1588) defeated a large fleet of ships. Where did the ships come from?","e":"Elizabeth became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism.","p":1,"o":[["France",0],["Spain and France",0],["Spain",1],["Netherlands",0]]},{"g":516,"t":"People don't celebrate Christmas as much as they used to before","e":"Christmas remains very popular in the UK. People usually spend the day at home and eat a special meal, which often includes roast turkey, Christmas pudding and mince pies.","p":0,"o":[["True",0],["False",1]]},{"g":517,"t":"Which TWO British Actors have recently won Oscars?","e":"British actors continue to be popular and continue to win awards throughout the world. Recent British actors to have won Oscars include Colin Firth, Sir Anthony Hopkins, Dame Judi Dench, Kate Winslet and Tilda Swinton.","p":0,"o":[["Dame Kelly Holmes",0],["Simon Cowell",0],["Dame Judi Dench",1],["Kate Winslet",1]]},{"g":518,"t":"Which of these statements is correct?","e":"Most citizens of the UK, the Irish Republic or the Commonwealth aged 18 or over can stand for Public Office. There are some exceptions, including: members of the armed forces; civil servants; people found guilty of certain criminal offences.","p":2,"o":[["People found guilty of all criminal offences cannot stand for Public Office",0],["People found guilty of certain criminal offences cannot stand for Public Office",1]]},{"g":519,"t":"In Northern Ireland, Deputy District Judges hear minor criminal cases","e":"In England, Wales and Northern Ireland, most minor criminal cases are dealt with in a Magistrates' Court. In Scotland, minor criminal offences go to a Justice of the Peace Court. In Northern Ireland, cases are heard by a District Judge or Deputy District Judge, who is legally qualified and paid.","p":2,"o":[["True",1],["False",0]]},{"g":520,"t":"Big Ben was named 'Elizabeth Tower' in honour of Queen Elizabeth I","e":"Big Ben is the nickname for the great bell of the clock at the Houses of Parliament in London. Many people call the clock Big Ben as well. The clock is over 150 years old and is a popular tourist attraction. The clock tower is named 'Elizabeth Tower' in honour of Queen Elizabeth II's Diamond Jubilee in 2012.","p":2,"o":[["False",1],["True",0]]},{"g":521,"t":"The Lake District is the largest national park in Scotland","e":"The Lake District is England's largest national park. It covers 885 square miles (2,292 square kilometres). It is famous for its lakes and mountains and is very popular with climbers, walkers and sailors. The biggest stretch of water is Windermere. In 2007, television viewers voted Wastwater as Britain's favourite view.","p":0,"o":[["False",1],["True",0]]},{"g":522,"t":"What is the minimum age for going into betting shops or gambling clubs?","e":"You have to be 18 to go into betting shops or gambling clubs.","p":2,"o":[["21",0],["16",0],["17",0],["18",1]]},{"g":523,"t":"What is the name of the charity that works to preserve important buildings, coastline and countryside in the UK?","e":"Many parts of the countryside and places of interest are kept open by the National Trust in England, Wales and Northern Ireland and the National Trust for Scotland. Both are charities that work to preserve important buildings, coastline and countryside in the UK. The National Trust was founded in 1895 by three volunteers. There are now more than 61,000 volunteers helping to keep the organisation running.","p":2,"o":[["Eden Project",0],["NSPCC",0],["National Trust",1],["Red Cross",0]]},{"g":524,"t":"Every MP in the UK has his/her own constituency","e":"Voters in each constituency elect their member of Parliament (MP) in a General Election. All of the elected MPs from the House of Commons. Most MPs belong to a political party, and the party with the majority of MPs forms the government.","p":2,"o":[["True",1],["False",0]]},{"g":525,"t":"In the UK, under the Individual Electoral Registration (IER) system, every eligible person is individually responsible for their own registration.","e":"The Individual Electoral Registration system replaced the old \"head of household\" method where one person could register everyone in the home. Now, each eligible person is legally responsible for their own registration.","p":2,"o":[["True",1],["False",0]]},{"g":526,"t":"Who helped found the Women's Social and Political Union (WSPU) in 1903?","e":"Emmeline Pankhurst was born in Manchester in 1858. She set up the Women's Franchise League in 1889, which fought to get the vote in local elections for married women. In 1903 she helped found the Women's Social and Political Union (WSPU).","p":1,"o":[["Emmeline Pankhurst",1],["Elizabeth of York",0],["Jane Seymour",0],["Mary Peters",0]]},{"g":527,"t":"The Union Jack is comprised of four countries' crosses. They are: England, Wales, Scotland and Northern Ireland.","e":"One symbol of the union between England, Scotland, Wales and Ireland was a new version of the official flag, the Union Flag. This is often called the Union Jack. The flag combined crosses associated with England, Scotland and Ireland. It is still used today as the official flag of the UK.","p":1,"o":[["True",0],["False",1]]}]},{"n":23,"name":"Life in the UK Test 23","q":[{"g":528,"t":"Who was one of the founders of England's naval tradition?","e":"Sir Francis Drake, one of the commanders in the defeat of the Spanish Armada, was one of the founders of England's naval tradition. His ship (The Golden Hind) was one of the first to sail around the world.","p":1,"o":[["Sir Francis Drake",1],["King James",0],["William Shakespeare",0],["Oliver Cromwell",0]]},{"g":529,"t":"How many Houses did the Scottish Parliament have in the middle ages?","e":"In the middle ages the Scottish Parliament had three Houses, called Estates: the lords, the commons and the clergy.","p":1,"o":[["3",1],["6",0],["2",0],["4",0]]},{"g":530,"t":"Which clan was killed because of not taking an oath?","e":"All Scottish clans were required formally to accept William as king by taking an oath. The MacDonalds of Glencoe were late in taking the oath and were all killed.","p":1,"o":[["The MacDonalds of Sleat",0],["The MacDonalds of Glencoe",1],["The MacDonalds of Clanranald",0],["The MacDonalds of Keppoch",0]]},{"g":531,"t":"What information about you is asked at the polling station?","e":"When you arrive at the polling station, the staff will ask for your name and address. In Northern Ireland you will also have to show photographic identification.","p":2,"o":[["Your name and telephone number",0],["Your name and address",1],["Your name and age",0],["Your name, contact details and age",0]]},{"g":532,"t":"What treaty was signed in 1707?","e":"The Act of Union, known as the Treaty of Union in Scotland, was therefore agreed in 1707, creating the Kingdom of Great Britain.","p":1,"o":[["The Act for Government of Wales",0],["The Act of Union",1],["The Great Union",0],["The Act of Great Britain",0]]},{"g":533,"t":"Which was the last successful invasion of Britain?","e":"The Norman Conquest was the last successful foreign invasion of England and led to many changes in government and social structures in England.","p":1,"o":[["The Roman invasion",0],["The Norman Conquest",1],["The Anglo Saxon invasion",0],["The Viking invasion",0]]},{"g":534,"t":"When was the time of growing patriotism?","e":"The Elizabethan period in England was a time of growing patriotism: a feeling of pride in being English. English explorers sought new trade routes and tried to expand British trade into the Spanish colonies in the Americas.","p":1,"o":[["The Iron Age",0],["The Elizabethan period",1],["The Victorian Age",0],["The Golden Age",0]]},{"g":535,"t":"Which TWO changes did the Chartists campaign for?","e":"In the 1830s and 1840s, a group called the Chartists campaigned for reform. They wanted six changes: for every man to have the vote; elections every year; for all regions to be equal in the electoral system; secret ballots; for any man to be able to stand as an MP; for MPs to be paid.","p":2,"o":[["Secret ballots",1],["For every woman to have the vote",0],["Elections every year",1],["Elections every 3 years",0]]},{"g":536,"t":"The Corn Laws were repealed in 1846. These had prevented the import of cheap grain","e":"The statement is true.","p":1,"o":[["True",1],["False",0]]},{"g":537,"t":"What are Halloween lanterns traditionally made out of?","e":"Halloween, 31 October, is an ancient festival and has roots in the pagan festival to mark the beginning of winter. Young people will often dress up in frightening costumes to play 'trick or treat'. People give them treats to stop them playing tricks on them. A lot of people carve lanterns out of pumpkins and put a candle inside.","p":0,"o":[["Potatoes",0],["Cucumbers",0],["Apples",0],["Pumpkins",1]]},{"g":538,"t":"The Speaker also represents Parliament on ceremonial occasions","e":"The Speaker keeps order during political debates to make sure the rules are followed. This includes making sure the opposition (see The government) has a guaranteed amount of time to debate issues which it chooses. The Speaker also represents Parliament on ceremonial occasions.","p":2,"o":[["False",0],["True",1]]},{"g":539,"t":"You must treat everyone equally, regardless of sex, race, age, religion, disability, class or sexual orientation","e":"The statement is true.","p":3,"o":[["True",1],["False",0]]},{"g":540,"t":"In the 2021 England and Wales census, what percentage of people identified themselves as Christian?","e":"The 2021 Census results released so far show that 46% of people in England and Wales (from a total sampled 60 million) identified themselves as Christian. Much smaller proportions identified themselves as Hindu (2%), Sikh (1%), Jewish or Buddhist (both around 0.5%), 37% stated not to follow any religion and 0.5% of people followed another religion","p":0,"o":[["91%",0],["46%",1],["34%",0],["63%",0]]},{"g":541,"t":"At the beginning of the Middle Ages, Ireland was an independent country","e":"At the beginning of the Middle Ages, Ireland was an independent country. The English first went to Ireland as troops to help the Irish king and remained to build their own settlements. By 1200, the English ruled an area of Ireland known as the Pale, around Dublin. Some of the important lords in other parts of Ireland accepted the authority of the English king.","p":1,"o":[["False",0],["True",1]]},{"g":542,"t":"Who led the Scottish, in 1314, to defeat the English at the Battle of Bannockburn?","e":"In Scotland, the English kings were less successful. In 1314 the Scottish, led by Robert the Bruce, defeated the English at the Battle of Bannockburn, and Scotland remained unconquered by the English.","p":1,"o":[["Oliver Cromwell",0],["William of Orange",0],["Robert the Bruce",1],["Robert Burns",0]]},{"g":543,"t":"The Reform Act of 1832 took away the automatic right of hereditary peers to attend the House of Lords","e":"Since 1999, hereditary peers have lost the automatic right to attend the House of Lords. The Reform Act of 1832 had greatly increased the number of people with the right to vote. The Act also abolished the old pocket and rotten boroughs and more parliamentary seats were given to the towns and cities.","p":2,"o":[["False",1],["True",0]]},{"g":544,"t":"The chairperson of the General Assembly of the Church of Scotland is the Moderator, who is appointed for the whole lifetime to speak on behalf of that Church.","e":"In Scotland, the national Church is the Church of Scotland, which is a Presbyterian Church. It is governed by ministers and elders. The chairperson of the General Assembly of the Church of Scotland is the Moderator, who is appointed for one year only and often speaks on behalf of that Church.","p":0,"o":[["True",0],["False",1]]},{"g":545,"t":"The Protestants formed their own churches during the Reformation","e":"At the same time the Reformation was happening across Europe. This was a movement against the authority of the Pope and the ideas and practices of the Roman Catholic Church. The Protestants formed their own churches. They read the Bible in their own languages instead of in Latin; they did not pray to saints or at shrines; and they believed that a person's own relationship with God was more important than submitting to the authority of the Church. Protestant ideas gradually gained strength in England, Wales and Scotland during the 16th century.","p":1,"o":[["False",0],["True",1]]},{"g":546,"t":"If you wish to be a permanent resident of the UK, you should look after yourself. In return you are guaranteed a job","e":"You are not guaranteed a job if you settle in the UK.","p":4,"o":[["True",0],["False",1]]},{"g":547,"t":"What did the Beveridge Report of 1942, by William Beveridge, provide the basis for?","e":"William Beveridge (later Lord Beveridge) was a British economist and social reformer. He served briefly as a Liberal MP and was subsequently the leader of the Liberals in the House of Lords but is best known for the 1942 report Social Insurance and Allied Services (known as the Beveridge Report). The report was commissioned by the wartime government in 1941. It recommended that the government should find ways of fighting the five 'Giant Evils' of Want, Disease, Ignorance, Squalor and Idleness and provided the basis of the modern welfare state.","p":2,"o":[["Education for All",0],["The Modern Welfare State",1],["NHS",0],["Equal Rights for Women",0]]},{"g":548,"t":"Which TWO are safe places to go and stay in for anyone facing domestic violence?","e":"It is important for anyone facing domestic violence to get help as soon as possible. A solicitor or the Citizens Advice Bureau can explain the available options. In some areas there are safe places to go and stay in, called refuges or shelters.","p":2,"o":[["Carehome",0],["Refuge",1],["Community Centre",0],["Shelter",1]]},{"g":549,"t":"How are members of Parliament (MPs) elected?","e":"MPs are elected through a system called 'first past the post'. In each constituency, the candidate who gets the most votes is elected. The government is usually formed by the party that wins the majority of constituencies. If no party wins a majority, two parties may join together to form a coalition.","p":2,"o":[["First past the post",1],["Proportional representation",0],["Open Ballot",0],["Online Voting",0]]},{"g":550,"t":"The European Union was originally called the EEC","e":"The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957. The UK originally decided not to join this group but it became a member in 1973. After UK's Brexit vote, there are now 27 EU member states.","p":2,"o":[["False",0],["True",1]]},{"g":551,"t":"Which Admiral's Column is in Trafalgar Square, London?","e":"Britain's navy fought against combined French and Spanish fleets, winning the Battle of Trafalgar in 1805. Admiral Nelson was in charge of the British fleet at Trafalgar and was killed in the battle. Nelson's Column in Trafalgar Square, London, is a monument to him. His ship, HMS Victory, can be visited in Portsmouth.","p":1,"o":[["Francis Drake",0],["Christopher Wren",0],["Charles I",0],["Nelson",1]]}]},{"n":24,"name":"Life in the UK Test 24","q":[{"g":552,"t":"Which TWO are British Overseas territories?","e":"There are also several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called 'Crown dependencies'. There are also several British overseas territories in other parts of the world, such as St Helena and the Falkland Islands. They are also linked to the UK but are not a part of it.","p":3,"o":[["Hawaii",0],["Ireland",0],["St Helena",1],["The Falkland Islands",1]]},{"g":553,"t":"Which flag has a white cross on a blue background?","e":"Scottish flag has a white cross on a blue background because St Andrew was the Patron Saint of Scotland.","p":4,"o":[["English",0],["Irish",0],["Welsh",0],["Scottish",1]]},{"g":554,"t":"Where does the Fringe take place?","e":"The Edinburgh Festival takes place in Edinburgh, Scotland, every summer. The most well-known is the Edinburgh Festival Fringe, also known as the Fringe.","p":0,"o":[["Liverpool",0],["Edinburgh",1],["London",0],["Newcastle",0]]},{"g":555,"t":"When did the Roman army leave Britain?","e":"The Roman army left Britain in AD 410 to defend other parts of the Roman Empire and never returned.","p":1,"o":[["AD 43",0],["AD 410",1],["AD 630",0],["AD 100",0]]},{"g":556,"t":"What helped the progress of the industrial revolution?","e":"Scientific discoveries, such as James Watt's work on steam power, helped the progress of the Industrial Revolution.","p":1,"o":[["Human Nature ideas",0],["New Economics ideas",0],["New Political Ideas",0],["Steam Power",1]]},{"g":557,"t":"What was the estimated population of the British Empire?","e":"During the Victorian period, the British Empire grew to cover all of India, Australia and large parts of Africa. It became the largest empire the world has ever seen, with an estimated population of more than 400 million people.","p":1,"o":[["400 million",1],["350 million",0],["300 million",0],["250 million",0]]},{"g":558,"t":"How many times did Sir Jackie Stewart win the Formula 1 championship?","e":"Sir Jackie Stewart (1939-) is a Scottish former racing driver who won the Formula 1 world championship three times.","p":0,"o":[["3",1],["4",0],["2",0],["1",0]]},{"g":559,"t":"Who was R. A. Butler?","e":"Richard Austen Butler (later Lord Butler) was born in 1902. He became a Conservative MP in 1923 and held several positions before becoming responsible for education in 1941.","p":1,"o":[["A Conservative MP",1],["A Poet",0],["Minister of Health",0],["An Economist",0]]},{"g":560,"t":"What county is 'Maiden Castle' in?","e":"A very impressive hill fort can still be seen today at Maiden Castle, in the English county of Dorset.","p":1,"o":[["Berkshire",0],["Lothians",0],["Wiltshire",0],["Dorset",1]]},{"g":561,"t":"What country did Britain fight against during the Crimean War?","e":"From 1853 to 1856, Britain fought with Turkey and France against Russia in the Crimean War. It was the first war to be extensively covered by the media through news stories and photographs. Many soldiers died from illnesses they caught in the hospitals, rather than from war wounds. Queen Victoria introduced the Victoria Cross medal during this war.","p":1,"o":[["France",0],["Russia",1],["India",0],["Turkey",0]]},{"g":562,"t":"The Medieval Period is referred to the period after the Norman Conquest up until what year?","e":"The period after the Norman Conquest up until about 1485 is called the Middle Ages (or the medieval period). It was a time of almost constant war.","p":1,"o":[["1400",0],["1385",0],["1455",0],["1485",1]]},{"g":563,"t":"In Northern Ireland, minor cases are heard by a District Judge or Deputy District Judge, who is legally qualified and paid","e":"In England, Wales and Northern Ireland, most minor criminal cases are dealt with in a Magistrates' Court. In Scotland, minor criminal offences go to a Justice of the Peace Court. In Northern Ireland, cases are heard by a District Judge or Deputy District Judge, who is legally qualified and paid.","p":2,"o":[["True",1],["False",0]]},{"g":564,"t":"How long does it take to give blood?","e":"Donated blood is used by hospitals to help people with a wide range of injuries and illnesses. Giving blood only takes about an hour to do.","p":2,"o":[["About 3 hours",0],["About 10 mins",0],["About 20 mins",0],["About 1 hour",1]]},{"g":565,"t":"Falkland Islands are a Crown Dependency","e":"There are also several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called 'Crown dependencies'. There are also several British overseas territories in other parts of the world, such as St Helena and the Falkland Islands. They are also linked to the UK but are not a part of it.","p":4,"o":[["True",0],["False",1]]},{"g":566,"t":"Which of these statements is incorrect?","e":"Owing money is a civil offence","p":2,"o":[["Selling or buying drugs such as heroin is illegal in the UK",0],["It's a criminal offence to offend one's religion or ethnic origin",0],["It's a criminal offence to carry a weapon of any kind",0],["It's a criminal offence to owe someone money",1]]},{"g":567,"t":"Which TWO countries took part in the development of Concorde?","e":"The 1960s was also a time of technological progress. Britain and France developed the world's only supersonic commercial airliner, Concorde. New styles of architecture, including high-rise buildings and the use of concrete and steel, became common.","p":2,"o":[["UK",1],["France",1],["Russia",0],["USA",0]]},{"g":568,"t":"Which of the following statements is correct?","e":"The king's army was defeated at the Battles of Marston Moor and Naseby. By 1646, it was clear that Parliament had won the war. Charles was held prisoner by the parliamentary army. He was still unwilling to reach any agreement with Parliament and in 1649 he was executed.","p":1,"o":[["Charles I's army was defeated at the Battle of Marston Moor but won the Battle of Naseby",0],["Parliament won the English Civil War",1]]},{"g":569,"t":"What is the highest denomination of coins one can find in the UK?","e":"The currency in the UK is the pound sterling (symbol £). There are 100 pence in a pound. The denominations (values) of currency are - coins: 1p, 2p, 5p, 10p, 20p, 50p, £1 and £2; notes: £5, £10, £20, £50.","p":0,"o":[["£20",0],["£50",0],["£2",1],["£1",0]]},{"g":570,"t":"Sir Ian Botham is famous for his achievements in which sport?","e":"Sir Ian Botham (1955-) captained the English cricket team and holds a number of English Test cricket records, both for batting and for bowling.","p":0,"o":[["Cycling",0],["Cricket",1],["Football",0],["Rugby",0]]},{"g":571,"t":"National Trust is a charity that works to preserve important buildings, coastline and countryside","e":"Many parts of the countryside and places of interest are kept open by the National Trust in England, Wales and Northern Ireland and the National Trust for Scotland. Both are charities that work to preserve important buildings, coastline and countryside in the UK. The National Trust was founded in 1895 by three volunteers. There are now more than 61,000 volunteers helping to keep the organisation running.","p":2,"o":[["False",0],["True",1]]},{"g":572,"t":"What character did Charlie Chaplin play?","e":"Sir Charles (Charlie) Chaplin became famous in silent movies for his tramp character and was one of many British actors to make a career in Hollywood.","p":0,"o":[["Tramp",1],["Comedian",0],["Hero",0],["Detective",0]]},{"g":573,"t":"Who ran 1 mile in 4 minutes in 1954?","e":"Sir Roger Bannister (1929-) was the first man in the world to run a mile in under four minutes, in 1954.","p":0,"o":[["Sir Roger Bannister",1],["Sir Jackie Stewart",0],["Sir Steve Redgrave",0],["Sir Chris Hoy",0]]},{"g":574,"t":"Queen Elizabeth I was a devout Catholic and persecuted Protestants","e":"Mary was a devout Catholic and persecuted Protestants (for this reason, she became known as 'Bloody Mary'). Mary also died after a short reign and the next monarch was her half-sister, Elizabeth, the daughter of Henry VIII and Anne Boleyn.","p":0,"o":[["False",1],["True",0]]},{"g":575,"t":"When did the UK join the EU?","e":"The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957. The UK originally decided not to join this group but it became a member in 1973. After UK's Brexit vote, there are now 27 EU member states.","p":2,"o":[["1973",1],["1957",0],["1961",0],["1967",0]]}]},{"n":25,"name":"Life in the UK Test 25","q":[{"g":576,"t":"Who defeated Napoleon at the Battle of Waterloo?","e":"In 1815, the French Wars ended with the defeat of the Emperor Napoleon by the Duke of Wellington at the Battle of Waterloo.","p":1,"o":[["Nelson",0],["Henry VII",0],["Louis XIV",0],["The Duke of Wellington",1]]},{"g":577,"t":"What is the National Anthem of the UK?","e":"The National Anthem of the UK is 'God Save the King/Queen'. It is played at important national occasions and at events attended by the King/Queen or the Royal Family. The first verse is: 'God save our gracious King! Long live our noble King! God save the King! Send him victorious, Happy and glorious, Long to reign over us, God save the King!'.","p":2,"o":[["God Save the King/Queen",1],["God Save the UK",0],["King reign over the UK",0],["United we stand",0]]},{"g":578,"t":"Who was the first Danish King?","e":"The first Danish King was Cnut, also called Canute.","p":1,"o":[["Kenneth MacAlpin",0],["Cnut also 'Canute'",1],["William",0],["Harold",0]]},{"g":579,"t":"How long is Hanukkah celebrated for?","e":"Hanukkah is in November or December and is celebrated for eight days. It is to remember the Jews' struggle for religious freedom. On each day of the festival a candle is lit on a stand of eight candles (called a menorah) to remember the story of the festival, where oil that should have lasted only a day did so for eight.","p":0,"o":[["9 days",0],["7 days",0],["8 days",1],["10 days",0]]},{"g":580,"t":"How old do you have to be to buy a lottery ticket or a scratch card?","e":"As of 2021, people under 18 are not allowed to participate in the National Lottery (Previously 16). This includes buying Scratch Cards.","p":0,"o":[["18",1],["16",0],["15",0],["17",0]]},{"g":581,"t":"How many 'local authorities' does the city of London have?","e":"London has 33 local authorities, with the Greater London Authority and the Mayor of London coordinating policies across the capital.","p":2,"o":[["33",1],["21",0],["5",0],["15",0]]},{"g":582,"t":"Who developed important Economics ideas?","e":"Many of the great thinkers of the Enlightenment were Scottish. Adam Smith developed ideas about economics which are still referred to today.","p":1,"o":[["David Hume",0],["James Watt",0],["Adam Smith",1],["Richard Arkwright",0]]},{"g":583,"t":"What happens at 11:00 on the Remembrance Day?","e":"Remembrance Day, 11 November, commemorates those who died fighting for the UK and its allies. Originally it commemorated the dead of the First World War, which ended on 11 November 1918. People wear poppies (the red flower found on the battlefields of the First World War). At 11.00 am there is a two-minute silence and wreaths are laid at the Cenotaph in Whitehall, London.","p":0,"o":[["A 10 second silence",0],["A 30 second silence",0],["A 1 minute silence",0],["A 2 minute silence",1]]},{"g":584,"t":"What was the purpose of the Emancipation Act?","e":"In 1807, it became illegal to trade slaves in British ships or from British ports, and in 1833 the Emancipation Act abolished slavery throughout the British Empire.","p":1,"o":[["Abolish slavery in the British Empire",1],["Freedom of speech",0],["Freedom of religion",0],["No one could be held prisoner unlawfully",0]]},{"g":585,"t":"Who was the first 'Scottish King'?","e":"In the north, the threat of attack by Vikings had encouraged the people to unite under one king, Kenneth MacAlpin. The term Scotland began to be used to describe that country.","p":1,"o":[["William I",0],["Harold",0],["Cnut also 'Canute'",0],["Kenneth MacAlpin",1]]},{"g":586,"t":"When was the famous satirical magazine 'Punch' published?","e":"In the 19th century, satirical magazines began to be published. The most famous was 'Punch', which was published for the first time in the 1840s. Today, political cartoons continue to be published in newspapers, and magazines such as Private Eye continue the tradition of satire.","p":0,"o":[["1880s",0],["1840s",1],["1860s",0],["1820s",0]]},{"g":587,"t":"How old do you have to be to go into betting shops or gambling clubs?","e":"You have to be 18 to go into betting shops or gambling clubs.","p":0,"o":[["20",0],["16",0],["21",0],["18",1]]},{"g":588,"t":"Which TWO are used when making Haggis?","e":"Scottish Traditional Food: Haggis, a sheep's stomach stuffed with offal, suet, onions and oatmeal.","p":0,"o":[["Chicken",0],["Dough",0],["Oatmeal",1],["Onions",1]]},{"g":589,"t":"What are the 40 days before Easter known as?","e":"The 40 days before Easter are known as Lent. It is a time when Christians take time to reflect and prepare for Easter. Traditionally, people would fast during this period and today many people will give something up, like a favourite food. The day before Lent starts is called Shrove Tuesday, or Pancake Day. Lent begins on Ash Wednesday.","p":0,"o":[["Starve",0],["Fast",0],["Lent",1],["Dent",0]]},{"g":590,"t":"As per 2021 England and Wales census, what's the percetage of Jewish or Buddhist people in the UK?","e":"In the 2021 England and Wales census, around 525,000 people from the sampled population of 60 million identified as Sikh. 46% of people identified themselves as Christian. Much smaller proportions identified themselves as Muslim (6.5%), Hindu (2%), Sikh (1%), Jewish or Buddhist (both around 0.5%), 0.5% of people followed another religion and 37% stated not to follow any religion.","p":0,"o":[["5%",0],["15%",0],["10%",0],["1%",1]]},{"g":591,"t":"To be able to vote in a parliamentary, local or European election, you must have your name on the electoral register","e":"To be able to vote in a parliamentary, local or European election, you must have your name on the electoral register. If you are eligible to vote, you can register by contacting your local council electoral registration Office.","p":2,"o":[["False",0],["True",1]]},{"g":592,"t":"In what year did the Troubles break out?","e":"Some 3,000 people lost their lives in the decades after 1969 in the violence in Northern Ireland. The conflict between those wishing for full Irish independence and those wishing to remain loyal to the British government is often referred to as 'the Troubles'.","p":1,"o":[["1957",0],["1921",0],["1922",0],["1969",1]]},{"g":593,"t":"The Welsh language, spoken in Wales and is taught in schools and universities, is a completely different language from English","e":"The English language has many accents and dialects. In Wales, many people speak Welsh - a completely different language from English - and it is taught in schools and universities. In Scotland, Gaelic (again, a different language) is spoken in some parts of the Highlands and Islands, and in Northern Ireland some people speak Irish Gaelic.","p":1,"o":[["False",0],["True",1]]},{"g":594,"t":"In which TWO countries were PCCs elected in?","e":"In November 2012, the public elected Police and Crime Commissioners (PCCs) in England and Wales. These are directly elected individuals who are responsible for the delivery of an efficient and effective police force that reflects the needs of their local communities. PCCs set local police priorities and the local policing budget. They also appoint the Chief Constable.","p":2,"o":[["Northern Ireland",0],["Wales",1],["Scotland",0],["England",1]]},{"g":595,"t":"When did newspapers begin to operate without a government licence?","e":"This was also an important time for the development of a free press (newspapers and other publications which are not controlled by the government). From 1695, newspapers were allowed to operate without a government licence. Increasing numbers of newspapers began to be published.","p":2,"o":[["1712",0],["1708",0],["1695",1],["1681",0]]},{"g":596,"t":"In which country was Charles II residing before he was invited to England by the Parliament?","e":"In May 1660, Parliament invited Charles II to come back from exile in the Netherlands. He was crowned King Charles II of England, Wales, Scotland and Ireland.","p":1,"o":[["Germany",0],["France",0],["Ireland",0],["Netherlands",1]]},{"g":597,"t":"During Queen Elizabeth's reign the British Empire became the largest empire the world had ever seen","e":"During the Victorian period, the British Empire grew to cover all of India, Australia and large parts of Africa. It became the largest empire the world has ever seen, with an estimated population of more than 400 million people.","p":1,"o":[["True",0],["False",1]]},{"g":598,"t":"You need to be a member of a political party to be able to stand for election as an MP","e":"Anyone aged 18 or over can stand for election as an MP but they are unlikely to win unless they have
