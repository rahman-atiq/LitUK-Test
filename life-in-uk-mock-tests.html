/* ---- A tab navigates, a button acts (§3.1) ----
   The Drill tab used to be a start action wearing a navigation label: Drill →
   Stats → Drill left two half-finished drills behind. Now the tab walks back
   into the newest one, and the dashboard's Start drill button is the thing that
   deliberately begins a fresh one. */
function resumeOrStart(source,start){
  const s=newestOf(source);
  if(s)return resumeSess(s.sid);
  start();
}
function drillTab(){resumeOrStart('drill',startDrill)}
/* The one genuinely ambiguous case: source AND testN both matching. A Test 12
   against an open Daily drill is not a collision — it is the point of D-2. */
let _freshFn=null;
function runFresh(){const f=_freshFn;_freshFn=null;if(f)f()}
function collisionPrompt(s,fresh){
  _freshFn=fresh;
  modal(`<h3 style="margin:0 0 4px">${esc(s.title)} is already open</h3>
    <p class="sub" style="margin:0 0 14px">${esc(sessLine(s))}. Starting fresh leaves that one waiting on your dashboard.</p>
    <div class="btn-row">
      <button class="btn primary" onclick="closeModal();resumeSess(${s.sid})">Resume</button>
      <button class="btn" onclick="closeModal();runFresh()">Start fresh</button>
    </div>`);
}

/* ============ SESSION ============ */
/* `instant` overrides the feedback pref for modes that only make sense one way
   (Sweep). Everything else — timed tests included — follows the pref: when you
   see the answer is your decision, not the app's. What the app does owe you is
   an honest label, so a `best` set with the answers on screen says so on the
   tile (see testTile).

   `order` decides how the questions are laid out:
     null      shuffle, unless the pref says otherwise (the old behaviour)
     'cluster' related questions adjacent, neediest cluster first (see CLUSTERS)
     'keep'    exactly as handed in — the caller has already ordered it */
function makeSession(qs,{title,timed,testN=null,source='custom',instant=null,order=null}){
  let list=qs.slice();
  if(order==='cluster')list=clusterOrder(list);
  else if(order!=='keep'&&prefs.shufQ&&source!=='mistakes')list=shuffle(list);
  if(instant==null)instant=prefs.feedback==='instant';
  /* startTs doubles as the session id: unique per session for any human, and it
     sorts the resume list by recency for free. The loop is pure insurance
     against two sessions landing in the same millisecond. */
  let startTs=Date.now();while(sessions[startTs])startTs++;
  sess={sid:startTs,instant,title,timed,testN,source,idx:0,
    readyBefore:readiness().p,             /* so the results screen can show what the session moved */
    items:list.map(q=>{
      let order=q.o.map((_,i)=>i);
      if(prefs.shufO)order=shuffle(order);
      return {q,order,picked:[],checked:false};
    }),
    startTs,
    /* INV-10: an absolute deadline, so time passes whether the app is on screen
       or not. The old counter was decremented once per interval tick, which a
       backgrounded PWA stops firing — every timed test was quietly longer than
       45 minutes by however long you had looked away. */
    deadline:timed?startTs+TEST_MINUTES*60000:null};
  touchSess();
  go('quiz');renderQuiz();
  if(timed)startTimer();
}
function startTest(n){
  const t=TESTS.find(x=>x.n===n);if(!t){toast('That test no longer exists');return}
  const fresh=()=>makeSession(t.q,{title:`Test ${n}`,timed:true,testN:n,source:'test'});
  const open=newestOf('test',n);
  open?collisionPrompt(open,fresh):fresh();
}
function startExam(){makeSession(shuffle(POOL).slice(0,24),{title:'Random exam',timed:true,source:'random'})}
function practiceMistakes(){
  const ids=Object.entries(S.mistakes).filter(([g,m])=>!m.done).map(([g])=>QByG[g]).filter(Boolean);
  if(!ids.length){toast('No mistakes to review 🎉');return}
  makeSession(ids,{title:'Mistake practice',timed:false,source:'mistakes'});
}
function startTopic(tp){const qs=POOL.filter(q=>q.p===tp);makeSession(shuffle(qs).slice(0,24),{title:TOPICS[tp],timed:false,source:'topic'})}

/* ============ DAILY DRILL ============
   prefs.dailyTarget questions, mixed by an explicit ratio: what spaced
   repetition says is due, your open mistakes, and questions you have never
   seen.

   The old mix gave 4 of its 20 slots to unseen questions — 100 questions
   before exam day, 5% of the bank, with the other 16 slots recycling material
   already known. Coverage first: while there is bank left to see, 60% of every
   drill goes to questions you have never met. */
const MIX={coverage:   {due:.20,mistake:.20,new:.60},
           consolidate:{due:.35,mistake:.35,new:.30},
           final:      {due:.50,mistake:.50,new:.00}};
/* Not laid eyes on in this many days = cold, and in the final week it comes
   back regardless of which box it is sitting in. */
const STALE_DAYS=10;
/* Driven by the exam date: consolidate at 14 days out, final at 6. With no
   date set the sprint is treated as being in its coverage weeks. */
function drillMode(){
  const left=daysLeft();
  if(left==null)return 'coverage';
  return left<=6?'final':left<=14?'consolidate':'coverage';
}
function weakestTopics(){
  return TOPICS.map((n,i)=>{const s=S.topics[i]||{seen:0,correct:0};
    return{i,pct:s.seen?s.correct/s.seen:0,seen:s.seen}})
    .sort((a,b)=>(a.seen?a.pct:2)-(b.seen?b.pct:2)).map(t=>t.i);
}
/* Never-answered questions, weakest topic first. POOL, not ALLQ: a question
   whose duplicate you have already answered is not unseen. */
function unseenQuestions(){
  const byTopic={};
  for(const q of POOL)if(!S.sr[q.g])(byTopic[q.p]||(byTopic[q.p]=[])).push(q);
  return weakestTopics().flatMap(tp=>shuffle(byTopic[tp]||[]));
}
function drillPlan(){
  const now=Date.now(),N=drillSize(),mode=drillMode(),mix=MIX[mode]||MIX.coverage,fin=mode==='final';
  const picked=[],taken=new Set();
  const add=(g,why)=>{g=canon(+g);
    if(taken.has(g)||!QByG[g]||picked.length>=N)return false;
    taken.add(g);picked.push({q:QByG[g],why});return true};
  /* Take up to `quota` from this list. add() caps the total at N, so a quota
     of N means "as many as still fit". */
  const fill=(list,why,quota)=>{let n=0;for(const g of list){if(n>=quota)break;if(add(g,why))n++}};

  const due=srDue(now);
  /* Leeches first, always: four misses means the drill is where it gets fixed,
     not somewhere behind 40 questions you have missed once. Then by how much
     trouble the question has caused — misses and guesses both count. */
  const trouble=m=>(m.count||0)+(m.unsure||0);
  const mistakes=Object.entries(S.mistakes).filter(([,m])=>!m.done)
    .sort((a,b)=>(b[1].leech?1:0)-(a[1].leech?1:0)||trouble(b[1])-trouble(a[1])).map(([g])=>+g);
  const unseen=mix.new>0?unseenQuestions().map(q=>q.g):[];
  /* Final week only. Everything you have ever missed comes back, retired or
     not — cleared in August is not the same as known in September — and so
     does anything you have not laid eyes on in STALE_DAYS, whatever box it
     climbed to. Spaced repetition is a plan for a year you do not have. */
  const missed=fin?Object.entries(S.mistakes).filter(([,m])=>m.done)
    .sort((a,b)=>trouble(b[1])-trouble(a[1])).map(([g])=>+g):[];
  const stale=fin?Object.keys(S.sr).filter(g=>QByG[g]&&(S.sr[g].last||0)<now-STALE_DAYS*DAY)
    .sort((a,b)=>(S.sr[a].last||0)-(S.sr[b].last||0)).map(g=>+g):[];

  fill(due,'due',Math.round(N*mix.due));
  fill(mistakes,'mistake',Math.round(N*mix.mistake));
  fill(unseen,'new',N);                      /* new takes its share plus every slot the other two left */
  /* Both empty outside the final week. Inside it they split what is left
     rather than letting one eat the drill: there are hundreds of old mistakes
     and hundreds of cold cards, and a session of nothing but old mistakes
     never checks whether the questions you got right in August survived. */
  if(fin){
    fill(missed,'missed',Math.ceil((N-picked.length)/2));
    fill(stale,'stale',N);
    fill(missed,'missed',N);                 /* nothing cold left → back to the mistakes */
  }
  /* Still short? A thin category's slack goes to whatever is left, in order of
     what it costs you to skip. `final` mode allows no new questions at all, so
     it can legitimately come in under target. */
  fill(due,'due',N);
  fill(mistakes,'mistake',N);
  if(mix.new>0)fill(shuffle(POOL).map(q=>q.g),'new',N);   /* nothing unseen left → anything */
  return picked;
}
function dayKey(d){d=d?new Date(d):new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function drillDoneToday(){return S.drill&&S.drill.last===dayKey()}
function startDrill(){
  const plan=drillPlan();
  if(!plan.length){toast('Nothing to drill yet');return}
  /* Clustered, not shuffled: the plan's priority order survives at cluster
     level, but questions about the same thing arrive together (see CLUSTERS). */
  makeSession(plan.map(p=>p.q),{title:'Daily drill',timed:false,source:'drill',order:'cluster'});
}
/* ---- Sweep: first contact with the bank ----
   Nothing but questions you have never seen, untimed, answer shown after each
   one. No due cards, no mistakes, no ratios — this is the mode the coverage
   weeks are actually spent in, and the only job is to meet all 1,858 once.
   A question leaves the pool the moment it is answered, so batches never
   repeat until there is nothing unseen left. */
const SWEEP_N=50;
function startSweep(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||SWEEP_N)));
  /* Cluster the whole unseen pool and then cut, rather than cutting first:
     that way cluster-mates land in the same batch instead of a fortnight
     apart. */
  const qs=clusterOrder(unseenQuestions()).slice(0,size);
  if(!qs.length){toast('Every question has been seen at least once 🎉');return}
  makeSession(qs,{title:`Sweep — ${qs.length} unseen`,timed:false,instant:true,source:'sweep',order:'keep'});
}
function noteDrillDone(){
  const t=dayKey(),y=dayKey(Date.now()-DAY);
  if(!S.drill)S.drill={last:null,streak:0,best:0};
  if(S.drill.last===t)return;
  S.drill.streak=S.drill.last===y?(S.drill.streak||0)+1:1;
  S.drill.last=t;
  S.drill.best=Math.max(S.drill.best||0,S.drill.streak);
}

/* ============ CLUSTERS ============
   Shuffling is what makes this bank easier than the exam. "Life peers are
   appointed by the monarchy on the advice of the Prime Minister" is trivial on
   its own — you recognise the wording. Put it straight after three other
   statements about constitutional appointments and recognition stops working;
   you have to actually know which way round it goes.

   So questions that share a salient entity — a year, a proper noun, an Act —
   are served adjacently. The signal is entirely derived from text already in
   the bank (INV-7): no content is generated, only re-ordered.

   Two passes, rarest key first, because a key shared by three questions says
   far more than one shared by thirty:
     1. proper nouns and years, the strong signal
     2. rare lowercase content words, to catch what pass 1 leaves behind
   That puts ~93% of the bank into a cluster; the rest are served alone. */
const CLUSTER_MAX=5;                                  /* longer runs stop feeling like one topic */
const YEAR_G=/\b(1[0-9]{3}|20[0-2][0-9])\b/g;
const HAS_YEAR=/\b(1[0-9]{3}|20[0-2][0-9])\b/;        /* /g + .test() is a lastIndex trap */
const qText=q=>q.t+' \n '+q.o.map(o=>o[0]).join(' \n ')+' \n '+(q.e||'');
/* Words that start a sentence are capitalised too, so "However" and "Almost"
   look like proper nouns. Anything also seen lowercase somewhere in 1,858
   questions is not a name. */
const CAP_STOP=new Set(('is are was were the a an of in on at to for and or which what who when where how why '+
  'true false correct statement below this that you your it its as by with from they them their there here '+
  'about into during over under between than then').split(' '));
let _lowerVocab=null,_df=null;
function lowerVocab(){
  if(_lowerVocab)return _lowerVocab;
  _lowerVocab=new Set();
  for(const q of POOL)for(const w of qText(q).split(/[^A-Za-z'’-]+/))
    if(/^[a-z][a-z'’-]{2,}$/.test(w))_lowerVocab.add(w);
  return _lowerVocab;
}
/* Document frequency, for pass 2: a word in two questions is a link, a word in
   two hundred is filler. */
function df(){
  if(_df)return _df;
  _df=new Map();
  for(const q of POOL){
    for(const w of new Set(qText(q).toLowerCase().split(/[^a-z'’-]+/)))
      if(w.length>4&&!CAP_STOP.has(w))_df.set(w,(_df.get(w)||0)+1);
  }
  return _df;
}
/* Pass 1 keys: every year mentioned, and every run of capitalised words. */
function salientKeys(q){
  const t=qText(q),out=new Set(),lo=lowerVocab();
  for(const m of t.matchAll(YEAR_G))out.add('y:'+m[1]);
  let run=[];
  const flush=()=>{
    if(run.length>1)out.add('n:'+run.join(' ').toLowerCase());
    else if(run.length===1){const w=run[0].toLowerCase();if(!lo.has(w)&&!CAP_STOP.has(w))out.add('n:'+w)}
    run=[];
  };
  for(const w of t.split(/[^A-Za-z0-9'’-]+/)){
    if(/^[A-Z][A-Za-z’'-]{2,}$/.test(w)&&!CAP_STOP.has(w.toLowerCase()))run.push(w);else flush();
  }
  flush();
  return out;
}
/* Pass 2 keys: uncommon ordinary words — "solicitor", "constituency". */
function weakKeys(q){
  const d=df(),out=new Set();
  for(const w of new Set(qText(q).toLowerCase().split(/[^a-z'’-]+/))){
    if(w.length<=4||CAP_STOP.has(w))continue;
    const n=d.get(w)||0;
    if(n>=2&&n<=25)out.add('w:'+w);
  }
  return out;
}
/* Greedy: take the rarest key first and give it every member still unclaimed.
   Works on array indices, not ids, because the Date Gauntlet can put two
   questions derived from the same id in one list. */
function clusterSplit(qs){
  const strong=new Map(),weak=new Map();
  const push=(m,k,i)=>{const a=m.get(k);a?a.push(i):m.set(k,[i])};
  qs.forEach((q,i)=>{
    for(const k of salientKeys(q))push(strong,k,i);
    for(const k of weakKeys(q))push(weak,k,i);
  });
  const taken=new Set(),clusters=[];
  const sweep=m=>{
    const cand=[...m.entries()].filter(([,v])=>v.length>1&&v.length<=CLUSTER_MAX*2)
      .sort((a,b)=>a[1].length-b[1].length||(a[0]<b[0]?-1:1));   /* rarest, then stable by key */
    for(const [,members] of cand){
      const free=members.filter(i=>!taken.has(i));
      for(let i=0;i+1<free.length;i+=CLUSTER_MAX){
        const grp=free.slice(i,i+CLUSTER_MAX);
        if(grp.length<2)break;
        grp.forEach(x=>taken.add(x));clusters.push(grp);
      }
    }
  };
  sweep(strong);sweep(weak);
  return {clusters,loners:qs.map((_,i)=>i).filter(i=>!taken.has(i))};
}
/* Reorders a list so cluster-mates are adjacent. `rank` (default: the position
   the caller handed it in at) decides which cluster goes first — a cluster is
   worth its most urgent member, so one unseen question drags its four relatives
   to the front with it. That is the point: you meet the whole knot at once. */
function clusterOrder(qs,rank){
  if(qs.length<3)return qs.slice();
  const pos=new Map();qs.forEach((q,i)=>{if(!pos.has(q))pos.set(q,i)});
  const rk=rank?(q=>rank(q)):(q=>pos.get(q));
  const {clusters,loners}=clusterSplit(qs);
  const groups=clusters.map(c=>c.map(i=>qs[i])).concat(loners.map(i=>[qs[i]]));
  const scored=groups.map(g=>{
    const sorted=g.slice().sort((a,b)=>rk(a)-rk(b));
    return {g:sorted,best:rk(sorted[0]),r:Math.random()};
  });
  scored.sort((a,b)=>a.best-b.best||a.r-b.r);         /* one random draw each: a stable comparator */
  return scored.flatMap(s=>s.g);
}

/* ============ TWIST GAUNTLET ============
   509 of the 1,858 questions have two options — 352 true/false and 157
   discrimination pairs. They are a 50% guess in isolation and they are exactly
   the format the real test twists you with. Diluted across the whole bank they
   arrive one at a time, where recognition carries you. Clustered, they cannot:
   four statements about the same appointment, three of them worded to look
   right.

   Order is by how much the question still owes you, so successive sessions walk
   the whole 509 rather than re-serving the same batch. */
const TWO_OPT=POOL.filter(q=>q.o.length===2);
/* Lower = drill me sooner. Never seen beats leech beats open mistake beats
   whatever is sitting in the lowest box. */
function urgency(q){
  const g=canon(q.g),e=S.sr[g],m=S.mistakes[g];
  if(!e)return 0;
  if(m&&!m.done)return m.leech?1:2;
  return 3+(e.box||0);
}
const lastSeen=q=>{const e=S.sr[canon(q.g)];return e&&e.last||0};
function twistOrder(){
  const rank=new Map();
  TWO_OPT.forEach(q=>rank.set(q,urgency(q)*1e13+lastSeen(q)));
  return clusterOrder(TWO_OPT,q=>rank.get(q));
}
function twistStats(){
  const fresh=TWO_OPT.filter(q=>!S.sr[canon(q.g)]).length;
  const weak=TWO_OPT.filter(q=>{const m=S.mistakes[canon(q.g)];return m&&!m.done}).length;
  return {total:TWO_OPT.length,fresh,weak};
}
function startTwist(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||drillSize())));
  const qs=twistOrder().slice(0,size);
  if(!qs.length){toast('No two-option questions in the bank');return}
  makeSession(qs,{title:`Twist gauntlet — ${qs.length}`,timed:false,source:'twist',order:'keep'});
}

/* ============ REAL-EXAM QUESTIONS ============
   663 of the 3,147 are reported by test-takers as recently asked in a real
   exam — 263 from testprep.uk's 11 exam papers and 406 from
   lifeintheuktestweb.co.uk's 17, which are 96% new material rather than a
   second copy of the first. That is 21% of the bank carrying the strongest
   yield signal anything here has, and the only other way to meet them is to
   happen to sit one of the 28 exam papers — which serve them 24 at a time,
   mixed with nothing, and say nothing about the rest.

   Ordered like the gauntlets, by what the question still owes you, so
   successive sessions walk all 663 instead of re-serving the same batch. It is
   a filter over the same pool, not a new one: every card is a real question,
   answered against its own id, feeding the same spaced repetition. */
function examStats(){
  const fresh=EXAM_POOL.filter(q=>!S.sr[canon(q.g)]).length;
  const weak=EXAM_POOL.filter(q=>{const m=S.mistakes[canon(q.g)];return m&&!m.done}).length;
  return {total:EXAM_POOL.length,fresh,weak};
}
function startExamQs(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||drillSize())));
  const qs=EXAM_POOL.slice().sort((a,b)=>urgency(a)-urgency(b)||lastSeen(a)-lastSeen(b)).slice(0,size);
  if(!qs.length){toast('No exam-reported questions in the bank');return}
  makeSession(qs,{title:`Real-exam questions — ${qs.length}`,timed:false,source:'examq',order:'keep'});
}

/* ============ DATE GAUNTLET ============
   62 questions in the bank are answered by a bare year, which makes them the
   only place a year is stated as fact rather than mentioned in passing. Both
   directions are drilled off them:

     forward   the original question, verbatim, but with the three nearest
               years found anywhere in the bank as distractors instead of the
               four it shipped with. You cannot pass it on the shape of the
               option list any more.
     reverse   a year, and four verbatim question stems — only one of which it
               answers.

   INV-7 is the constraint that shapes this. Nothing here is written: every
   option is a string lifted character-for-character out of the bank, and the
   only new text is the frame around them. A year mined out of an explanation
   and turned into a question would be a fact nobody checked, drilled daily.

   Only one direction per source question per session — serve both and the
   forward item hands you the answer to the reverse one. */
const BARE_YEAR=/^\s*(1[0-9]{3}|20[0-2][0-9])\s*$/;
function yearAnswer(q){
  const c=q.o.filter(o=>o[1]);
  return c.length===1&&BARE_YEAR.test(c[0][0])?c[0][0].trim():null;
}
const YEAR_Q=POOL.map(q=>({q,y:yearAnswer(q)})).filter(x=>x.y);
/* Every year that appears anywhere in the bank — stems, options, explanations.
   The distractor pool, so a near miss is a year the handbook actually uses. */
const YEAR_POOL=(function(){const s=new Set();
  for(const q of POOL)for(const m of qText(q).matchAll(YEAR_G))s.add(m[1]);
  return [...s]})();
/* Real questions that mention a year — what the gauntlet pads with once the 62
   derived items run out. */
const YEAR_CARRY=POOL.filter(q=>HAS_YEAR.test(qText(q)));
function dateForward(x){
  const y=+x.y;
  const near=YEAR_POOL.filter(v=>+v!==y).sort((a,b)=>Math.abs(+a-y)-Math.abs(+b-y)||+a-+b).slice(0,3);
  if(near.length<2)return null;
  return {...x.q,o:shuffle([[x.y,1],...near.map(v=>[v,0])]),_derived:'date'};
}
function dateReverse(x){
  /* A distractor must not be answered by this year too, and no two options may
     read as the same question — the bank holds "When did the English civil war
     begin?" and "When did the English Civil war begin?" as separate ids, and
     offering both is noise at best and unanswerable at worst. */
  const others=[],taken=new Set([dupNorm(x.q.t)]);
  for(const o of shuffle(YEAR_Q)){
    if(others.length===3)break;
    if(o.y===x.y)continue;
    const k=dupNorm(o.q.t);
    if(taken.has(k))continue;
    taken.add(k);others.push(o);
  }
  if(others.length<3)return null;
  return {g:x.q.g,p:x.q.p,e:x.q.e,_test:x.q._test,_bank:x.q._bank,_derived:'date',
    t:`${x.y} — which of these questions does it answer?`,
    o:shuffle([[x.q.t,1],...others.map(o=>[o.q.t,0])])};
}
function startDates(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||drillSize())));
  const src=YEAR_Q.slice().sort((a,b)=>urgency(a.q)-urgency(b.q)||lastSeen(a.q)-lastSeen(b.q));
  const qs=[],used=new Set();
  for(const x of src){
    if(qs.length>=size)break;
    const item=Math.random()<.5?(dateForward(x)||dateReverse(x)):(dateReverse(x)||dateForward(x));
    if(!item)continue;
    qs.push(item);used.add(x.q.g);
  }
  /* Short of a full session? Top up with real questions that carry a year,
     clustered — which, since a year is a cluster key, groups them by date. */
  if(qs.length<size){
    const pad=YEAR_CARRY.filter(q=>!used.has(q.g))
      .sort((a,b)=>urgency(a)-urgency(b)||lastSeen(a)-lastSeen(b));
    qs.push(...clusterOrder(pad).slice(0,size-qs.length));
  }
  if(!qs.length){toast('No dated questions in the bank');return}
  makeSession(qs,{title:`Date gauntlet — ${qs.length}`,timed:false,source:'dates',order:'keep'});
}

/* ============ TIMER ============ */
let timerInt=null;
function stopTimer(){clearInterval(timerInt);timerInt=null}
/* The tick paints; it does not keep score. Remaining time is derived from the
   absolute deadline every second (INV-10), so a dropped tick costs nothing and a
   backgrounded app cannot grant you extra minutes.

   The visibility guard is belt and braces on top of go() clearing the interval:
   no path may resurrect a hidden session's clock, because a clock reaching zero
   off screen is exactly how the app used to file a sit nobody asked for. */
function tickTimer(){
  if(!sess||!sess.timed||quizHidden()){stopTimer();return}
  const r=remainSecs(sess),t=document.getElementById('timer');
  if(t){t.textContent=fmt(r);t.classList.toggle('warn',r<=60)}
  /* Even here, watching it happen, expiry offers — it never submits (INV-9). */
  if(r<=0){stopTimer();expiredPrompt()}
}
function startTimer(){stopTimer();tickTimer();timerInt=setInterval(tickTimer,1000)}
/* iOS suspends a backgrounded PWA's intervals outright, so coming back to the
   app would otherwise show a clock frozen where you left it — the display lying
   about a deadline that never stopped. Repaint from the wall clock on return. */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&sess&&sess.timed&&!quizHidden())startTimer();
});
function fmt(s){s=Math.max(0,s);return`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

/* ============ QUIZ RENDER ============ */
/* Expanded at 24 or fewer — the exam-shaped sessions, where going back over
   your flagged ones is the point — collapsed above that, where the grid was
   costing more screen than it earned. prefs.jumpOpen is null until you say
   otherwise, and then it is your answer everywhere. */
const jumpOpen=()=>prefs.jumpOpen==null?sess.items.length<=24:!!prefs.jumpOpen;
function toggleJump(){prefs.jumpOpen=!jumpOpen();savePrefs();renderQuiz()}
/* One class function for both navigators, so the strip and the grid can never
   disagree about the same question. */
function dotClass(x,i){
  let c=i===sess.idx?' cur':'';
  if(x.checked)c+=x._correct?' ok':' no';else if(x.picked.length)c+=' ans';
  return c;
}
/* The gap closes as the session gets longer: at 200 questions, a 1px gap
   between every pair would be more gap than strip. */
function renderQuiz(){
  const it=sess.items[sess.idx],q=it.q,ci=correctIdx(q),multi=ci.length>1;
  const answeredCount=sess.items.filter(x=>x.picked.length).length;
  const open=jumpOpen();
  const el=document.getElementById('view-quiz');
  el.innerHTML=`
    <div class="qtop">
      <span class="chip title">${esc(sess.title)}</span>
      <span class="chip count">Q ${sess.idx+1} / ${sess.items.length}</span>
      <div class="spacer"></div>
      ${sess.timed?`<span class="chip timer" id="timer">${fmt(remainSecs(sess))}</span>`:''}
      <button class="flagbtn ${flagged(q.g)?'on':''}" id="flagBtn" onclick="toggleFlag(${q.g})">${flagged(q.g)?'★ Flagged':'☆ Flag'}</button>
    </div>
    <div class="qstrip" id="qstrip">
      ${sess.items.map((x,i)=>`<i class="${dotClass(x,i).trim()}"></i>`).join('')}
    </div>
    <div class="card pad">
      <div class="qhead">
        <span class="chip topic">${esc(TOPICS[q.p])}</span>
        ${multi?`<span class="chip" style="color:var(--warn)">Select ${ci.length}</span>`:''}
      </div>
      <div class="qtext">${esc(q.t)}</div>
      ${/* Only say something worth reading. "Choose one answer. Feedback shows
            after each answer." was two lines of screen repeated 60 times a
            session telling you what you already knew by question two. */
        (()=>{const bits=[];
          if(multi)bits.push(`This question needs <b>${ci.length}</b> answers.`);
          if(!sess.instant&&sess.idx===0)bits.push('Answers stay hidden until you finish.');
          return bits.length?`<div class="hint">${bits.join(' ')}</div>`:''})()}
      <div class="opts" id="opts">
        ${it.order.map((oi,pos)=>{
          const sel=it.picked.includes(oi);
          return `<div class="opt ${multi?'multi':''} ${sel?'sel':''}" data-oi="${oi}" onclick="pick(${oi})">
            <span class="mark">${multi?(sel?'✓':''):String.fromCharCode(65+pos)}</span>
            <span class="otext">${esc(q.o[oi][0])}</span>
          </div>`}).join('')}
      </div>
      <div class="explain" id="explain"></div>
    </div>
    <button class="jtog" onclick="toggleJump()" aria-expanded="${open}">Jump to question ${open?'▴':`▾ (${sess.items.length})`}</button>
    <div class="dots${open?'':' hidden'}">
      ${sess.items.map((x,i)=>`<button class="dot${dotClass(x,i)}${flagged(x.q.g)?' flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}
    </div>
    <div class="qnav">
      <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled':''}>← Prev</button>
      <div class="spacer"></div>
      ${sess.instant && !it.checked
        ? `<button class="btn primary" id="mainBtn" onclick="checkQ()">Check answer</button>`
        : (sess.idx<sess.items.length-1
            ? `<button class="btn primary" id="mainBtn" onclick="nextQ()">Next →</button>`
            : `<button class="btn primary" id="mainBtn" onclick="finishQuiz()">Finish (${answeredCount}/${sess.items.length})</button>`)}
    </div>`;
  if(sess.instant && it.checked)paintCheck();
}
function pick(oi){
  const it=sess.items[sess.idx];if(it.checked)return;
  const multi=correctIdx(it.q).length>1;
  if(multi){const k=it.picked.indexOf(oi);k>=0?it.picked.splice(k,1):it.picked.push(oi)}
  else it.picked=[oi];
  // update selection visuals without full re-render
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const s=it.picked.includes(+o.dataset.oi);o.classList.toggle('sel',s);
    if(multi)o.querySelector('.mark').textContent=s?'✓':'';
  });
  // auto-advance in exam single-choice? no — let user move. But refresh dot + finish count
  refreshDots();
  touchSess();
}
function refreshDots(){
  document.querySelectorAll('.dots .dot').forEach((d,i)=>{
    d.className='dot'+dotClass(sess.items[i],i)+(flagged(sess.items[i].q.g)?' flag':'');
  });
  /* The strip is the only navigator on screen while the grid is folded away, so
     it cannot be the one that goes stale. */
  document.querySelectorAll('#qstrip > i').forEach((s,i)=>{s.className=dotClass(sess.items[i],i).trim()});
  const mb=document.getElementById('mainBtn');
  if(mb&&sess.idx===sess.items.length-1&&!sess.instant){const a=sess.items.filter(x=>x.picked.length).length;mb.textContent=`Finish (${a}/${sess.items.length})`}
}
function checkQ(){
  const it=sess.items[sess.idx];if(!it.picked.length){toast('Pick an answer first');return}
  it.checked=true;
  const ci=correctIdx(it.q);
  it._correct=eqSet(it.picked,ci);
  it._rec=recordAnswer(it.q,it._correct,it.picked);
  touchSess();
  /* renderQuiz() reassigns innerHTML and paints the check itself, so painting
     here first only ever decorated a DOM that was about to be thrown away (F-9). */
  renderQuiz();
  /* Four options push the verdict below the fold on a phone. `nearest` means
     this does nothing at all when it is already on screen. */
  const ex=document.getElementById('explain');
  if(ex)ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function paintCheck(){
  const it=sess.items[sess.idx],ci=correctIdx(it.q);
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const oi=+o.dataset.oi;o.classList.add('locked');o.onclick=null;
    if(ci.includes(oi))o.classList.add('correct');
    else if(it.picked.includes(oi))o.classList.add('wrong');
    o.querySelector('.mark').textContent=ci.includes(oi)?'✓':(it.picked.includes(oi)?'✕':o.querySelector('.mark').textContent);
  });
  const ex=document.getElementById('explain');
  ex.className='explain show';
  ex.innerHTML=`<div class="vrow">
      <div class="verdict ${it._correct?'good':'bad'}">${it._correct?'✓ Correct':'✕ Not quite'}</div>
      ${it._correct?`<button class="btn sm ghost unsure${it.unsure?' on':''}" onclick="markUnsure()"${it.unsure?' disabled':''}>${it.unsure?'🤔 Marked unsure':'🤔 Wasn’t sure'}</button>`:''}
    </div>
    <div class="lbl">Explanation</div><div>${esc(it.q.e||'—')}</div>
    ${it.unsure?'<div class="sub" style="margin:8px 0 0;font-size:12.5px">No promotion, no credit towards clearing it — back tomorrow, and added to your mistakes list to practise.</div>':''}`;
}
/* ---- "Wasn't sure" ----
   A right answer you did not know is a lucky guess, and 509 questions here are
   coin flips. One tap takes the promotion back: the box stays where it was,
   the card returns tomorrow, and the day does not count towards retirement.

   It also puts the question on the mistakes list, because a question you
   guessed is a question to review — but as its own kind of entry. `count` is
   misses and stays untouched; `unsure` counts the guesses. A record with
   `count:0` means you have never actually got this wrong, you have just never
   known it either, and the list says exactly that rather than accusing you of
   forty wrong answers you did not give.

   Clearing one is the ordinary rule: right on N separate days, confidently.
   `miss` is set to today for the same reason a real miss sets it — answering
   confidently ten minutes after admitting you guessed is not a separate day. */
function markUnsure(){
  const it=sess&&sess.items[sess.idx];
  if(!it||!it.checked||it.unsure||!it._correct)return;
  it.unsure=true;
  const g=canon(it.q.g),e=S.sr[g],r=it._rec||{},today=dayKey();
  if(e){
    e.box=r.preBox||0;
    e.due=clampDue(Date.now()+DAY);
    e.unsure=(e.unsure||0)+1;
  }
  const m=S.mistakes[g]||(S.mistakes[g]={count:0,ok:[],done:false});
  if(r.credited)m.ok=(m.ok||[]).filter(d=>d!==r.credited);   /* the day it just banked comes back off */
  m.unsure=(m.unsure||0)+1;
  m.miss=today;
  m.done=false;                                    /* guessed is not mastered, even if it was */
  save();touchSess();paintCheck();
}
const flagged=g=>!!S.flags[canon(g)];              /* duplicates share one flag */
function toggleFlag(g){const c=canon(g);S.flags[c]?delete S.flags[c]:S.flags[c]=1;save();
  const b=document.getElementById('flagBtn');const on=flagged(g);
  b.classList.toggle('on',on);b.textContent=on?'★ Flagged':'☆ Flag';refreshDots()}
/* Every question starts at the top of itself. Moving on from a long explanation
   otherwise drops you into the middle of the next question — the other half of
   the scroll-down-scroll-up tax the sticky action bar fixes. Instant, not
   smooth: a 200ms glide on every Next gets old by question five. */
function toQuestionTop(){
  const hd=document.querySelector('header');
  const top=document.getElementById('view-quiz').getBoundingClientRect().top+window.scrollY
    -((hd?hd.offsetHeight:0)+8);
  window.scrollTo(0,Math.max(0,top));
}
function prevQ(){if(sess.idx>0){sess.idx--;touchSess();renderQuiz();toQuestionTop()}}
function nextQ(){if(sess.idx<sess.items.length-1){sess.idx++;touchSess();renderQuiz();toQuestionTop()}}
function jump(i){sess.idx=i;touchSess();renderQuiz();toQuestionTop()}

/* ---- Swipe between questions ----
   Next is a small target at the bottom of the screen that you aim at sixty
   times with one thumb; a swipe lands anywhere. That is the whole win — the tap
   count barely moves, the precision does.

   A forward swipe does whatever #mainBtn says, which makes it a big invisible
   main button and costs no new mental model: picked-but-unchecked reveals the
   answer and stays put, everything else moves on. That is a guard, not a
   flourish (F-10) — an item picked and never checked is scored wrong at the end
   and never reaches recordAnswer(), so it costs a point and teaches the
   schedule nothing. Aiming at Prev mid-answer can do that today and rarely
   does; a gesture this cheap would make it routine.

   An untouched question moves rather than toasting "pick an answer first": a
   gesture that silently does nothing reads as broken, because there is no
   target to blame. */
const SWIPE_MIN=60, SWIPE_EDGE=24;
let _swx=0,_swy=0,_swLive=false;
(()=>{
  const vq=document.getElementById('view-quiz');
  vq.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    /* iOS Safari owns the first 24px of either edge for back/forward. In a
       browser tab, hijacking that is worse than not having the feature; in
       standalone PWA mode there is no such gesture, so it costs nothing where
       this matters most. */
    _swLive=e.touches.length===1&&t.clientX>SWIPE_EDGE&&t.clientX<innerWidth-SWIPE_EDGE;
    _swx=t.clientX;_swy=t.clientY;
  },{passive:true});
  vq.addEventListener('touchend',e=>{
    if(!_swLive||!sess||quizHidden())return;
    _swLive=false;
    const t=e.changedTouches[0],dx=t.clientX-_swx,dy=t.clientY-_swy;
    /* Twice the vertical delta, so scrolling a long explanation never turns
       into a question change, and a tap on an option is never a swipe. */
    if(Math.abs(dx)<SWIPE_MIN||Math.abs(dx)<=Math.abs(dy)*2)return;
    if(dx<0)swipeForward();else prevQ();
  },{passive:true});
  vq.addEventListener('touchcancel',()=>{_swLive=false},{passive:true});
})();
function swipeForward(){
  const it=sess.items[sess.idx];
  if(sess.instant&&it.picked.length&&!it.checked){checkQ();return}
  /* The last question's forward swipe does nothing. Finishing stays an aimed
     tap on a button that names the score. */
  nextQ();
}

/* ============ SPACED REPETITION ============
   Leitner boxes. Get it right, it comes back later; get it wrong, it drops to
   box 0 and reappears in the same session's tail or the next drill.

   The ladder is the standard one only while there is room for it. With a fixed
   exam date the top box has to fit inside the days remaining: at 25 days out,
   [0,1,3,7,16,35] files a well-known question 35 days ahead — ten days after
   the exam. Every question you know best would be the one you never see
   again. srDays() scales the whole ladder into the window; clampDue() is the
   backstop that catches everything else (INV-8). */
const SR_BASE=[0,1,3,7,16,35];
const DAY=864e5;
const EXAM_GAP=2;                    /* last useful review: two days before the exam */
function examTs(){if(!S.examDate)return null;const t=new Date(S.examDate+'T00:00:00').getTime();return isNaN(t)?null:t}
function daysLeft(){const e=examTs();return e==null?null:Math.ceil((e-Date.now())/DAY)}
function lastReviewTs(){const e=examTs();return e==null?null:e-EXAM_GAP*DAY}
function clampDue(t){const c=lastReviewTs();return c==null?t:Math.min(t,c)}
function srDays(){
  const c=lastReviewTs();if(c==null)return SR_BASE;
  const top=SR_BASE[SR_BASE.length-1];
  const win=Math.max(0,Math.floor((c-Date.now())/DAY));
  if(win>=top)return SR_BASE;
  const k=win/top;let prev=-1;                     /* stays strictly rising until it saturates */
  return SR_BASE.map(d=>{const v=Math.min(win,Math.max(Math.round(d*k),prev+1));prev=v;return v});
}
/* Returns the box the question was in before this answer — what "wasn't sure"
   puts back (see markUnsure). */
function srUpdate(g,correct){
  const now=Date.now(),days=srDays();
  g=canon(g);                                      /* duplicates share one box */
  const e=S.sr[g]||(S.sr[g]={box:0,due:0,seen:0});
  const preBox=e.box||0;
  e.seen=(e.seen||0)+1;e.last=now;
  e.box=correct?Math.min(preBox+1,days.length-1):0;
  e.due=clampDue(e.box?now+days[e.box]*DAY:now+10*6e4);   /* wrong → back in 10 minutes */
  return preBox;
}
function srDue(now){now=now||Date.now();
  return Object.keys(S.sr).filter(g=>QByG[g]&&S.sr[g].due<=now)
    .sort((a,b)=>S.sr[a].due-S.sr[b].due)}
/* Coverage: how many of the 1,858 unique questions have ever been answered.
   Counts canonical, in-bank ids only, so a stale key from an old bank cannot
   inflate it. */
function srSeen(){return Object.keys(S.sr).filter(g=>QByG[g]&&canon(g)===+g).length}
function srUnseen(){return Math.max(0,UNIQUE_N-srSeen())}

/* ---- Retirement ----
   The old rule was "right twice", counted in answers. Wrong answers come back
   in ten minutes, so a question missed at 09:00 could be answered at 09:10 and
   09:20 and be filed as mastered before you had left the sofa. That is recall
   of the last ten minutes, not knowledge.

   So: right on N *separate days*, and never on the day you last missed it.
   Two-option questions cost a fourth day because they are a coin flip — three
   right answers there happen by accident one time in eight, and 509 of the
   1,858 questions have two options. */
const RETIRE_4=3,RETIRE_2=4,LEECH_AT=4;
const retireDays=q=>q.o.length<=2?RETIRE_2:RETIRE_4;

/* ---- Which wrong answer, not just that it was wrong ----
   "You have chosen 1801 three times" is a different instruction from "you keep
   getting this wrong": it names the belief that needs replacing. Counts are
   kept per option on the CANONICAL question, because a duplicate id can list
   the same options in a different order — an index copied across would accuse
   you of the wrong answer. Matching on normalised text is what survives that.

   Derived questions (the Date Gauntlet) are skipped: their options are built
   for the session and do not correspond to the bank question's option list. */
function notePicked(m,q,picked){
  if(!picked||!picked.length||q._derived)return;
  const cq=QByG[canon(q.g)];if(!cq)return;
  const wrong=picked.filter(i=>q.o[i]&&!q.o[i][1]);
  if(!wrong.length)return;
  const p=m.picked||(m.picked={});
  for(const i of wrong){
    const k=cq.o.findIndex(o=>dupNorm(o[0])===dupNorm(q.o[i][0]));
    if(k>=0)p[k]=(p[k]||0)+1;
  }
}
/* record into topic/mistake stats (once per exam grading or per practice check).
   Returns what it did, so markUnsure() can take it back. */
function recordAnswer(q,correct,picked){
  S.answered++;if(correct)S.correct++;
  noteRecent(correct);
  const rec={preBox:srUpdate(q.g,correct),credited:null,retired:false};
  const tp=S.topics[q.p]||(S.topics[q.p]={seen:0,correct:0});tp.seen++;if(correct)tp.correct++;
  const g=canon(q.g),today=dayKey();               /* duplicates share one record */
  let m=S.mistakes[g];
  if(correct){
    if(m&&!m.done){
      if(!Array.isArray(m.ok))m.ok=[];
      if(m.miss!==today&&!m.ok.includes(today)){m.ok.push(today);rec.credited=today}
      /* A leech is never retired by the counter — it takes an explicit tap. */
      if(!m.leech&&m.ok.length>=retireDays(q)){m.done=true;rec.retired=true}
    }
  }else{
    if(!m)m=S.mistakes[g]={count:0,ok:[],done:false};
    m.done=false;m.ok=[];m.miss=today;m.count=(m.count||0)+1;
    if(m.count>=LEECH_AT)m.leech=true;             /* four misses: stop pretending it will stick */
    notePicked(m,q,picked);
  }
  save();
  return rec;
}

/* ============ ROLLING ACCURACY ============
   Lifetime accuracy never forgets your first week. In a sprint that starts by
   deliberately serving 1,500 questions you have never seen, it is a number
   that can only fall for a fortnight and then crawl — precisely when you need
   to see the recovery. So the headline is the last RECENT_N answers and the
   lifetime figure sits underneath it in small type.

   A "wasn't sure" tap does not take the tick back here. Accuracy is the
   outcome — a guess that lands right would have landed right on the day too.
   What it does not know is *why*, and that is what the pass probability below
   is for: `unsure` is evidence there, not here. */
const RECENT_N=200;
function noteRecent(correct){
  const r=S.recent||(S.recent=[]);
  r.push(correct?1:0);
  if(r.length>RECENT_N)r.splice(0,r.length-RECENT_N);
}
function recentAcc(){
  const r=S.recent||[];
  if(!r.length)return null;
  return {pct:Math.round(r.reduce((a,b)=>a+b,0)/r.length*100),n:r.length};
}

/* ============ READINESS ============
   An honest answer to "are we ready?".

   Tests passed is the wrong headline. It counts sits — mostly retries of the
   same 24 questions — and says nothing about the 1,500 you have never met. So
   instead: draw 24 questions out of the bank the way the real exam does, grade
   them against what your history says you know about each one, and do it a
   thousand times. The number is the share of those exams that clear 18/24.

   Every question contributes something, including the unseen ones, floored at
   the rate you would guess it right and never zero. A paper of 24 questions
   you have never seen is not a 0% chance of passing — it is about 1% — and
   keeping that floor is what makes the figure rise honestly with coverage
   instead of jumping the day you happen to sit a test. */
const MC_DRAWS=1000, MC_SEED=0x5eed1;
/* P(right | box). Deliberately modest at the top: box 5 means "right four
   times across two weeks", not "cannot get this wrong". */
const BOX_P=[.45,.60,.72,.82,.90,.95];
const nCk=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return Math.round(r)};
/* What pure guessing is worth on this question. Two options is the coin flip
   the whole sprint is about; a "select 2 of 4" is one in six, the hardest
   thing in the bank to fall into by accident. */
function guessRate(q){
  const k=correctIdx(q).length||1;
  return 1/Math.max(2,nCk(q.o.length,k));
}
function pKnow(q){
  const g=canon(q.g),e=S.sr[g],m=S.mistakes[g],floor=guessRate(q);
  if(!e)return floor;                                  /* never seen: a coin flip, not a zero */
  let p=BOX_P[Math.min(e.box||0,BOX_P.length-1)];
  if(m&&!m.done)p*=m.leech?.62:.80;                    /* open mistake — and the ones that keep coming back */
  p*=Math.pow(.88,Math.min(e.unsure||0,4));            /* every "wasn't sure" is you telling the model something */
  if((e.seen||0)<=1)p*=.9;                             /* one right answer is one data point */
  return Math.max(floor,Math.min(.98,p));
}
/* ---- Calibration: what the tests you have actually sat say ----
   Boxes and mistake counts are the model's own bookkeeping; a real sit is the
   only outside check on it. Where sits exist the model is pulled towards
   them — but measured only over the questions those tests contain, because
   comparing a test score against a bank that is 80% unseen compares nothing.

   Phase 4 change 5: a best score set with the answers on screen is a softer
   room, so it counts for REVEALED_W of a blind one. And bests are optimistic
   by construction — the best of every attempt — which is why the whole
   correction is shrunk towards 1 by a prior worth CAL_PRIOR clean sits and
   then clamped. It nudges; it never takes over. */
const REVEALED_W=.35, CAL_PRIOR=3, CAL_MIN=.75, CAL_MAX=1.25;
function calibration(){
  let w=0,obs=0,mod=0;
  for(const [n,st] of Object.entries(S.tests)){
    if(!st||st.best==null)continue;
    const t=TESTS.find(x=>x.n===+n);if(!t||!t.q.length)continue;
    const wt=st.revealed?REVEALED_W:1;
    w+=wt;
    obs+=wt*(st.best/t.q.length);
    mod+=wt*(t.q.reduce((a,q)=>a+pKnow(q),0)/t.q.length);
  }
  if(!w||mod<=0)return {k:1,w:0};
  const k=(w*(obs/w)+CAL_PRIOR*(mod/w))/((w+CAL_PRIOR)*(mod/w));
  return {k:Math.max(CAL_MIN,Math.min(CAL_MAX,k)),w};
}
/* xorshift with a fixed seed. The same progress must produce the same number
   every time the app opens: a headline that wobbles two points on a reload is
   a headline nobody believes, and 1,000 draws wobble about that much. */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
let _ready=null;
function readiness(){
  if(_ready&&_ready.rev===_rev)return _ready;
  const cal=calibration();
  const p=POOL.map(q=>Math.max(guessRate(q),Math.min(.99,pKnow(q)*cal.k)));
  const n=p.length,K=Math.min(24,n),idx=p.map((_,i)=>i),rnd=rng(MC_SEED);
  let pass=0,score=0;
  for(let d=0;d<MC_DRAWS;d++){
    let hit=0;
    /* Partial Fisher-Yates: 24 *distinct* questions, like the real paper. */
    for(let i=0;i<K;i++){
      const j=i+((rnd()*(n-i))|0),t=idx[i];idx[i]=idx[j];idx[j]=t;
      if(rnd()<p[idx[i]])hit++;
    }
    score+=hit;
    if(hit>=PASSMARK)pass++;
  }
  const out={p:pass/MC_DRAWS,mean:score/MC_DRAWS,cal:cal.k,sits:cal.w,seen:srSeen(),ts:Date.now()};
  /* The hub carries no bank data, so it cannot model anything — it reads the
     last figure this page worked out. Stale by definition, and it says so. */
  S.readiness={p:out.p,mean:out.mean,seen:out.seen,ts:out.ts};
  save();
  _ready=Object.assign({rev:_rev},out);      /* after save(), which bumps _rev */
  return _ready;
}
const readyLabel=p=>p>=.85?'ready':p>=.6?'nearly there':p>=.3?'not yet':'early days';
function explainReadiness(){
  const r=readiness(),cov=Math.round(r.seen/UNIQUE_N*100);
  const sits=r.sits?`${r.sits.toFixed(1)} sit${r.sits===1?'':'s'} of evidence, pulling the model ${r.cal>=1?'up':'down'} by ${Math.abs(Math.round((r.cal-1)*100))}%`
    :'no test sits yet, so this is the model on its own';
  modal(`<h3 style="margin:0 0 4px">${Math.round(r.p*100)}% — ${readyLabel(r.p)}</h3>
    <p class="sub" style="margin:0 0 14px">Out of ${MC_DRAWS} simulated papers of 24 questions drawn from the whole bank, ${Math.round(r.p*MC_DRAWS)} scored ${PASSMARK} or better. Typical score ${r.mean.toFixed(1)}/24.</p>
    <div class="lbl">How each question is scored</div>
    <p class="sub" style="margin:4px 0 12px;font-size:12.5px">From its spaced-repetition box, whether it is an open mistake or a leech, and how often you have tapped "wasn't sure" — floored at the rate you would guess it right. A question you have never seen counts as that floor (50% for a two-option, 25% for four), never as a zero. Bank coverage is ${cov}%, so ${100-cov}% of every simulated paper is still guesswork.</p>
    <div class="lbl">Tests you have sat</div>
    <p class="sub" style="margin:4px 0 0;font-size:12.5px">${esc(sits)}. A best score set with instant feedback on counts for ${REVEALED_W} of a blind one — you answered before you saw the mark, but the explanations arriving between questions is a softer room than the real thing.</p>
    <div class="btn-row" style="margin-top:18px"><button class="btn primary" onclick="closeModal()">Got it</button>
      <button class="btn ghost" onclick="closeModal();go('cram')">📄 Cram sheet</button></div>`);
}

/* ============ FINISH / RESULTS ============
   Sources whose score is not a readiness signal: they are training sets, built
   to be harder or stranger than a real sit. */
/* Not scored as a pass attempt, and not a test result. Each of these serves a
   deliberately unrepresentative slice — unseen questions, coin flips, dates, or
   the 263 hardest-yield questions in the bank ordered by what you owe them — so
   a score here is not an estimate of anything and must not move the pass rate.
   All four still count as the day's work and keep the streak alive. */
const TRAINING=new Set(['sweep','twist','dates','examq']);
function finishQuiz(){
  stopTimer();
  /* Graded is finished: the store entry goes here and on an explicit discard,
     and nowhere else (INV-13). `sess` stays live — the results screen and
     retrySame() are still reading it. */
  forgetSess(sess.sid);
  // grade any unchecked (exam) items now
  if(!sess.instant){
    sess.items.forEach(it=>{const ci=correctIdx(it.q);it.checked=true;it._correct=it.picked.length?eqSet(it.picked,ci):false;recordAnswer(it.q,it._correct,it.picked)});
  }else{
    // practice: unchecked & unpicked count as not-correct but only grade if attempted
    sess.items.forEach(it=>{if(!it.checked){it.checked=true;it._correct=false}});
  }
  const score=sess.items.filter(it=>it._correct).length;
  const total=sess.items.length;
  const passed=score>=Math.round(PASSMARK/24*total);
  /* Sweep is first contact with unseen questions; the gauntlets are a deliberate
     pile-up of the hardest format in the bank. Neither is an attempt at a pass
     mark, and scoring them as one would bury the exam pass rate under sessions
     that were never meant to be passed. */
  if(!TRAINING.has(sess.source)){S.attempts++;if(passed)S.passes++}
  if(sess.testN){
    const st=testStat(sess.testN);
    /* `revealed` describes the best score, not the last sit: a 24 earned with
       the explanations on screen is a different thing from a 24 earned blind,
       and the tile says which one you are looking at. */
    const isBest=score>(st.best??-1);
    S.tests[sess.testN]={best:Math.max(st.best??0,score),attempts:st.attempts+1,
      lastPass:passed,lastScore:score,revealed:isBest?!!sess.instant:!!st.revealed};
  }
  /* A sweep or a gauntlet is the day's work as much as a drill is — it keeps
     the streak alive. */
  if(sess.source==='drill'||TRAINING.has(sess.source))noteDrillDone();
  S.history.unshift({t:Date.now(),title:sess.title,score,total,passed,src:sess.source});
  S.history=S.history.slice(0,50);
  save();
  renderResults(score,total,passed);
  go('results');
}
function renderResults(score,total,passed){
  const pct=Math.round(score/total*100);
  const training=TRAINING.has(sess.source);
  const rc=training?'var(--brand)':passed?'var(--good)':'var(--bad)';
  const el=document.getElementById('view-results');
  const wrongItems=sess.items.filter(it=>!it._correct);
  /* Elapsed, not effort. Now that a session can be left and picked up tomorrow,
     that gap is inside this number — so past a few hours it stops describing
     anything and is dropped rather than reported as "1440:00 taken". */
  const secs=Math.round((Date.now()-sess.startTs)/1000);
  const took=secs<6*3600?`<span class="chip" style="margin-left:6px">${fmt(secs)} taken</span>`:'';
  /* Only a numbered test belongs to a series. A drill, a sweep or a random
     exam has nothing either side of it, and `retrySame()` is already the right
     next move for those. */
  const nav=sess.testN?seriesNav(sess.testN):'';
  el.innerHTML=`
    <h1>${sess.title} — results</h1>
    <div class="card pad" style="margin-bottom:16px">
      <div class="result-hero">
        <div class="ring" style="--p:${pct};--rc:${rc}"><div class="inner"><div><div class="pct">${pct}%</div><div class="sc">${score}/${total}</div></div></div></div>
        <div>
          <div class="verdict-big ${training||passed?'good':'bad'}">${
            sess.source==='sweep'
            ?`🧭 ${total} more seen${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='twist'
            ?`🌀 Gauntlet run${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='dates'
            ?`📅 Dates drilled${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='examq'
            ?`⭐ Exam questions drilled${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='drill'
            ?`🔥 Drill done${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :(passed?'🎉 Passed!':'Keep practising')}</div>
          <p class="sub" style="margin:6px 0 12px">${sess.source==='sweep'
            ?`You got <b>${score}</b> of <b>${total}</b> first time. <b>${srUnseen()}</b> of ${UNIQUE_N} still never seen — a low score here is the point, not a problem.`
            :sess.source==='twist'
            ?`<b>${score}</b> of <b>${total}</b>. Every one of these was a coin flip served next to its own near-miss — this score is meant to be lower than a test, and it doesn't count towards your pass rate.`
            :sess.source==='dates'
            ?`<b>${score}</b> of <b>${total}</b>, with the near-miss years put back in. Doesn't count towards your pass rate.`
            :sess.source==='examq'
            ?`<b>${score}</b> of <b>${total}</b>, all of them reported as recently asked in a real exam. <b>${examStats().fresh}</b> of the ${EXAM_POOL.length} still never seen. Doesn't count towards your pass rate — hardest-first is not a fair sample.`
            :`You scored <b>${score}</b> of <b>${total}</b>. ${passed?`That's above the ${Math.round(PASSMARK/24*total)} needed.`:`You need <b>${Math.round(PASSMARK/24*total)}</b> to pass — ${Math.round(PASSMARK/24*total)-score} more.`}`} ${took}${readinessMove()}</p>
          <div class="btn-row">
            <button class="btn primary" onclick="retrySame()">${training?'↻ Next batch':'↻ Retry'}</button>
            ${wrongItems.length?`<button class="btn" onclick="practiceMistakes()">🎯 Fix ${wrongItems.length} mistake${wrongItems.length===1?'':'s'}</button>`:''}
            <button class="btn ghost" onclick="go('dashboard')">Dashboard</button>
          </div>
        </div>
      </div>
    </div>
    ${nav}
    <b>Review all ${total} questions</b>
    <div style="margin-top:8px">
    ${sess.items.map((it,i)=>{const ci=correctIdx(it.q);
      return `<details class="rev" ${it._correct?'':'open'}>
        <summary><span class="ic ${it._correct?'ok':'no'}">${it._correct?'✓':'✕'}</span>
          <span>${i+1}. ${esc(it.q.t)}</span>${examBadge(it.q)}<span class="tag">${esc(TOPICS[it.q.p])}</span></summary>
        <div class="body">
          ${it.q.o.map((o,oi)=>{const isC=ci.includes(oi),isP=it.picked.includes(oi);
            let cls=isC?'style="color:var(--good);font-weight:700"':(isP?'style="color:var(--bad);font-weight:700"':'style="color:var(--muted)"');
            return `<div ${cls}>${isC?'✓':(isP?'✕':'·')} ${esc(o[0])}</div>`}).join('')}
          <div class="lbl" style="margin-top:8px">Explanation</div><div>${esc(it.q.e||'—')}</div>
        </div>

    </div>

}
/* What the session did to the only number that matters. A sweep of 50 unseen
   questions moves it a point or two whatever you score, because coverage is
   itself worth something — which is exactly the argument for doing them. */
function readinessMove(){
  const b=sess&&sess.readyBefore;
  if(b==null)return '';
  const a=readiness().p,d=Math.round(a*100)-Math.round(b*100);
  return `<span class="chip" style="margin-left:6px;color:${d>0?'var(--good)':d<0?'var(--bad)':'var(--muted)'}" title="Chance of passing a random 24-question paper">${
    d>0?'▲':d<0?'▼':'='} pass ${Math.round(a*100)}%${d?` (${d>0?'+':''}${d})`:''}</span>`;
}
/* ============ TEST SERIES ============
   "The next test" has to mean the tile that comes next on the dashboard, so
   the series is the dashboard's own grouping and not the test-number line:
   the numbers are one flat space shared by four banks, so Test 238 + 1 is a
   different source's Test 301 and Test 45 + 1 does not exist at all. Grouping
   the same way testGroup() does — bank, split by kind only where the bank
   declares one — keeps Exam Conditions from spilling into The Proving Ground
   and stops the walk dead at each bank's edge. */
function testSeries(n){
  const t=TESTS.find(x=>x.n===n);if(!t)return null;
  const b=t._bank,ks=bankKinds(b);
  /* Same key and same membership rule as grpKeys()/bankSection(), so the
     section's name on the dashboard is the name used here. */
  const key=ks.length<2?`${b.id}:all`:`${b.id}:${t.kind}`;
  const list=ks.length<2?b.tests:b.tests.filter(x=>x.kind===t.kind);
  const i=list.indexOf(t);if(i<0)return null;
  return {list,i,name:(GRP_FACE[key]||{}).name||b.label,prev:list[i-1]||null,next:list[i+1]||null};
}
/* Whether the test you are about to walk into is new ground or a re-sit — the
   same two facts the dashboard tile carries, in the space a button has. */
function seriesMeta(t){
  const st=testStat(t.n);
  return st.best==null?'Not attempted':`Best ${st.best}/24${st.lastPass?' · passed':''}`;
}
function seriesNav(n){
  const s=testSeries(n);if(!s)return '';
  /* The empty side keeps its grid column, so the position line stays centred
     at both ends of a series rather than sliding under the one live button. */
  const side=(t,nx)=>t?`<button class="btn sm${nx?' nx':''}" onclick="startTest(${t.n})">
      <span>${nx?`Test ${t.n} →`:`← Test ${t.n}`}</span><span class="m">${seriesMeta(t)}</span></button>`:'<span></span>';
  return `<div class="snav">
    ${side(s.prev,false)}
    <div class="pos">Test ${s.i+1} of ${s.list.length}<span class="nm"> · ${esc(s.name)}</span></div>
    ${side(s.next,true)}
  </div>`;
}
function retrySame(){
  /* The training modes walk a queue, so "again" means the next batch off it,
     not a re-run of the one just finished. */
  if(sess.source==='sweep')return startSweep(sess.items.length);
  if(sess.source==='twist')return startTwist(sess.items.length);
  if(sess.source==='dates')return startDates(sess.items.length);
  if(sess.source==='examq')return startExamQs(sess.items.length);
  if(sess.testN)return startTest(sess.testN);
  const src=sess.items.map(it=>it.q);
  makeSession(src,{title:sess.title,timed:sess.timed,testN:sess.testN,source:sess.source});
}

/* ============ FACTS & CHAPTER LINKS ============
   facts.js (tools/build-facts.mjs) carries two things per question, both
   derived at build time from content already in the repo:

     cut   [start,length] into the question's own explanation — the one
           sentence that states the fact. Offsets, not text, so it is provably
           verbatim (INV-7) and the file stays small.
     link  the chapter block that explains it, as a target into the existing
           ?find= machinery in app.js.

   Loaded on demand, not up front: the Mistakes view is the only thing that
   needs it, and it is 100KB nobody should pay for on a drill. Everything below
   degrades to nothing if the file is missing. */
let FACTS=null,_factsReq=null;                        /* null = untried, false = unavailable */
function loadFacts(){
  if(FACTS!==null)return Promise.resolve(FACTS);
  if(_factsReq)return _factsReq;
  _factsReq=new Promise(res=>{
    const s=document.createElement('script');
    s.src='facts.js';
    s.onload=()=>{FACTS=window.LITUK_FACTS||false;res(FACTS)};
    s.onerror=()=>{FACTS=false;res(false)};
    document.head.appendChild(s);
  });
  return _factsReq;
}
/* The one sentence of the explanation that states the fact. A long enumeration
   gets cut at a clause boundary by the builder, so anything not ending in a
   full stop is marked as the fragment it is. */
function factOf(q){
  const c=FACTS&&FACTS.cut&&FACTS.cut[canon(q.g)];
  if(!c||!q.e)return '';
  const s=q.e.substr(c[0],c[1]).trim();
  if(s.length<=10)return '';
  return /[.!?]$/.test(s)?s:s+'…';
}
/* "Read why" — the chapter section this question comes out of, with the term
   highlighted on arrival. */
function chapterLink(q){
  if(!FACTS||!FACTS.link||!FACTS.targets)return null;
  const t=FACTS.targets[FACTS.link[canon(q.g)]];
  if(!t)return null;
  const f=FACTS.files[t[0]];if(!f)return null;
  /* No term means nothing on that page can be highlighted in one piece — the
     section anchor still puts you in the right place. */
  return {href:f[0]+(t[2]?'?find='+encodeURIComponent(t[2]):'')+(t[1]?'#'+t[1]:''),
    label:`Chapter ${f[2]} · ${f[3]}`};
}

/* ============ MISTAKES ============ */
function renderMistakes(){
  if(FACTS===null)loadFacts().then(f=>{if(f)renderMistakes()});   /* re-render once it lands */
  const all=Object.entries(S.mistakes).filter(([g,m])=>!m.done).map(([g,m])=>({q:QByG[g],m})).filter(x=>x.q);
  /* Three kinds of open entry, worst first: leeches, questions you have got
     wrong, and questions you have only ever guessed. */
  const leeches=all.filter(x=>x.m.leech);
  const open=all.filter(x=>!x.m.leech&&(x.m.count||0)>0);
  const guessed=all.filter(x=>!x.m.leech&&!(x.m.count||0));
  const done=Object.entries(S.mistakes).filter(([g,m])=>m.done).length;
  const flagged=Object.keys(S.flags).map(g=>QByG[g]).filter(Boolean);
  const el=document.getElementById('view-mistakes');
  el.innerHTML=`
    <h1>Mistakes & flags</h1>
    <p class="sub">A question clears when you get it right on <b>${RETIRE_4} separate days</b> — ${RETIRE_2} for a two-option question, never on the day you slipped, and never on a day you tapped "wasn't sure". ${done} cleared so far.</p>
    <div class="btn-row" style="margin-bottom:16px">
      <button class="btn primary" onclick="practiceMistakes()" ${all.length?'':'disabled'}>🎯 Practise ${all.length} mistake${all.length===1?'':'s'}</button>
      ${flagged.length?`<button class="btn" onclick="practiceFlagged()">★ Practise ${flagged.length} flagged</button>`:''}
      ${all.length?`<button class="btn ghost" onclick="go('cram')">📄 Cram sheet</button>`:''}
      ${all.length?`<button class="btn ghost" onclick="clearMistakes()">Clear list</button>`:''}
    </div>
    ${leeches.length?`<b>🐛 Leeches (${leeches.length})</b>
      <p class="sub" style="margin:2px 0 8px">Missed ${LEECH_AT}+ times. These never clear on their own — read the explanation properly, then tap "I know this now".</p>`
      +leeches.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${open.length?`<b style="display:block;margin-top:${leeches.length?'22px':'0'}">Got wrong (${open.length})</b>`+open.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${guessed.length?`<b style="display:block;margin-top:${leeches.length||open.length?'22px':'0'}">🤔 Wasn't sure (${guessed.length})</b>
      <p class="sub" style="margin:2px 0 8px">Right answer, but you said you were guessing. Never actually got wrong — they clear the same way, by getting them right on ${RETIRE_4} separate days without tapping "wasn't sure".</p>`
      +guessed.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${all.length?'':`<div class="empty"><div class="e">🎉</div><p>No mistakes to review. Take a test to find weak spots!</p></div>`}
    ${flagged.length?`<b style="display:block;margin-top:22px">★ Flagged (${flagged.length})</b>`+flagged.map(q=>mistakeRow(q,S.mistakes[q.g]||{},true)).join(''):''}
  `;
}
const times=n=>n===1?'once':n===2?'twice':`${n} times`;
function mistakeRow(q,m,isFlag){const ci=correctIdx(q);
  const need=retireDays(q),got=(m.ok||[]).length,guess=m.unsure||0,miss=m.count||0;
  /* A guess-only entry is not a wrong answer and does not get the red badge. */
  const kind=isFlag?'flag':m.leech?'leech':miss?'wrong':'guess';
  const badge={flag:'★',leech:'🐛',wrong:miss||1,guess:'🤔'}[kind];
  const colour=kind==='wrong'?'var(--bad)':kind==='guess'?'var(--muted)':'var(--warn)';
  /* Which wrong option you keep going for. Naming it is the whole point: the
     fix for "you keep missing this" is unknowable, the fix for "you have picked
     1801 three times" is one sentence long. */
  const picks=m.picked||{};
  const worst=Object.entries(picks).map(([oi,n])=>({oi:+oi,n:+n}))
    .filter(x=>q.o[x.oi]&&!q.o[x.oi][1]&&x.n>0).sort((a,b)=>b.n-a.n)[0];
  const fact=factOf(q),link=chapterLink(q);
  return `<details class="rev">
    <summary><span class="ic no" style="background:${colour}">${badge}</span>
      <span>${esc(q.t)}</span>${examBadge(q)}<span class="tag">${esc(TOPICS[q.p])}</span></summary>
    <div class="body">
      ${q.o.map((o,oi)=>{const n=picks[oi]||0;
        return `<div style="${ci.includes(oi)?'color:var(--good);font-weight:700':'color:var(--muted)'}">${ci.includes(oi)?'✓':'·'} ${esc(o[0])}${
          n&&!ci.includes(oi)?`<span class="pickn">you picked this ${times(n)}</span>`:''}</div>`}).join('')}
      ${worst&&worst.n>1?`<p class="wrongpull">You have chosen “${esc(q.o[worst.oi][0])}” ${times(worst.n)}.</p>`:''}
      ${fact?`<p class="fact">💡 ${esc(fact)}</p>`:''}
      <div class="lbl" style="margin-top:8px">Explanation</div><div>${esc(q.e||'—')}</div>
      ${isFlag?'':`<p class="sub" style="margin:8px 0 0;font-size:12.5px">${m.leech
        ? `Missed ${miss} times${guess?`, guessed ${guess}`:''} · right on ${got} day${got===1?'':'s'} since — clearing this one is a decision, not a counter.`
        : `Right on <b>${got}</b> of the ${need} separate days needed · ${miss?`missed ${miss}×`:'never actually got it wrong'}${guess?` · guessed ${guess}×`:''}${m.miss?` · last slip ${esc(m.miss)}`:''}.`}</p>`}
      <div class="btn-row" style="margin-top:8px">
        <button class="btn sm ghost" onclick="event.preventDefault();unflag(${q.g})">${isFlag?'Remove flag':m.leech?'I know this now':'Mark as known'}</button>
        ${link?`<a class="btn sm ghost" href="${esc(link.href)}">📖 Read why · ${esc(link.label)}</a>`:''}
      </div>
    </div>
  </details>`;
}
function practiceFlagged(){const qs=Object.keys(S.flags).map(g=>QByG[g]).filter(Boolean);if(!qs.length)return;makeSession(qs,{title:'Flagged review',timed:false,source:'mistakes'})}
/* The explicit tap a leech needs: it clears the leech flag too, so the question
   only becomes one again if it is missed LEECH_AT more times. */
function unflag(g){const c=canon(g),m=S.mistakes[c];if(S.flags[c])delete S.flags[c];if(m){m.done=true;m.leech=false}save();renderMistakes()}
function clearMistakes(){modal(`<h3 style="margin:0 0 8px">Clear all mistakes?</h3><p class="sub">This marks every mistake — leeches included — as mastered. Can't be undone.</p><div class="btn-row"><button class="btn primary" onclick="Object.values(S.mistakes).forEach(m=>{m.done=true;m.leech=false});save();closeModal();renderMistakes()">Yes, clear</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}

/* ============ CRAM SHEET ============
   The 4 September artifact: one screen, printable, everything still unresolved
   on two sides of A4. Nothing here is new information — it is S.mistakes and
   facts.js with the questions taken off, because on the last night you do not
   want to be tested, you want to be told.

   Ordered by what it costs you to have forgotten it: leeches, then open
   mistakes by topic, then the dates you keep losing. Capped, because a sheet
   that runs to nine pages is a sheet nobody reads. */
/* 60 mistakes and 24 dates is what fits on two sides of A4 at 8.6pt in two
   columns — measured against a real mid-sprint profile, not guessed. Past
   that the sheet is nine pages and nine pages get read as none. */
const CRAM_MISTAKES=60, CRAM_DATES=24;
const cramRank=m=>(m.leech?1e6:0)+(m.count||0)*10+(m.unsure||0);
function cramList(){
  return Object.entries(S.mistakes).filter(([,m])=>!m.done)
    .map(([g,m])=>({q:QByG[canon(g)],m})).filter(x=>x.q)
    .sort((a,b)=>cramRank(b.m)-cramRank(a.m));
}
function cramCount(){return Object.values(S.mistakes).filter(m=>!m.done).length}
/* How many questions in the bank turn on each year — 1066 in 21 of them, 2012
   in 32. A contested year is one the exam can twist, so it earns its line even
   when you have not got it wrong yet. */
let _yearDf=null;
function yearDf(){
  if(_yearDf)return _yearDf;
  _yearDf=new Map();
  for(const q of POOL)for(const y of new Set([...qText(q).matchAll(YEAR_G)].map(m=>m[1])))
    _yearDf.set(y,(_yearDf.get(y)||0)+1);
  return _yearDf;
}
function cramDates(){
  const df=yearDf(),weak=[],rest=[];
  for(const x of YEAR_Q){
    const g=canon(x.q.g),e=S.sr[g],m=S.mistakes[g];
    ((!e||(m&&!m.done)||(e.box||0)<=1||(e.unsure||0)>0)?weak:rest).push(x);
  }
  const byContest=(a,b)=>(df.get(b.y)||0)-(df.get(a.y)||0)||+a.y-+b.y;
  /* The bank holds "When did the English civil war begin?" and "When did the
     English Civil war begin?" as separate ids — different option sets, so the
     dedup keeps both, and rightly. On a sheet you read once they are one line. */
  const seen=new Set(),out=[];
  const take=(list,n)=>{for(const x of list){if(out.length>=n)break;
    const k=dupNorm(x.q.t);if(seen.has(k))continue;seen.add(k);out.push(x)}};
  take(weak.sort(byContest),CRAM_DATES);
  take(rest.sort(byContest),CRAM_DATES);
  return out.sort((a,b)=>+a.y-+b.y);          /* chronological: that is how dates stick */
}
/* "Which of these statements is correct?" is not worth printing — there the
   answer IS the fact. Everything else reads stem → answer. */
const STATEMENT_Q=/which (of these |of the following )?statements? (is|are) (correct|true)/i;
function cramItem(x){
  const {q,m}=x,ci=correctIdx(q);
  const ans=ci.map(i=>q.o[i][0]).join(' + ');
  const stem=STATEMENT_Q.test(q.t)?'':esc(q.t)+' ';
  const fact=m&&m.leech?factOf(q):'';
  const picks=(m&&m.picked)||{};
  const worst=Object.entries(picks).map(([oi,n])=>({oi:+oi,n:+n}))
    .filter(y=>q.o[y.oi]&&!q.o[y.oi][1]&&y.n>1).sort((a,b)=>b.n-a.n)[0];
  return `<div class="it">${m&&m.leech?'<span class="w">🐛 </span>':''}${stem?`<span class="k">${stem}</span>`:''}<span class="a">${esc(ans)}</span>${
    fact&&fact!==ans?`<span class="why">${esc(fact)}</span>`:''}${
    worst?`<span class="why b">not “${esc(q.o[worst.oi][0])}” — you have picked that ${times(worst.n)}</span>`:''}</div>`;
}
function renderCram(){
  if(FACTS===null)loadFacts().then(f=>{if(f)renderCram()});     /* leech facts land on the re-render */
  const all=cramList(),shown=all.slice(0,CRAM_MISTAKES),dates=cramDates();
  const leeches=shown.filter(x=>x.m.leech),open=shown.filter(x=>!x.m.leech);
  const byTopic=TOPICS.map((name,i)=>({name,items:open.filter(x=>x.q.p===i)})).filter(t=>t.items.length);
  const left=daysLeft(),r=readiness();
  const el=document.getElementById('view-cram');
  el.innerHTML=`
    <h1>Cram sheet</h1>
    <div class="cram-head">
      <p class="sub" style="margin:0">${S.examDate?`Exam ${esc(S.examDate)}${left!=null?` · ${Math.max(0,left)} day${left===1?'':'s'} to go`:''} · `:''}pass probability ${Math.round(r.p*100)}% · ${all.length} still open</p>
      <div class="btn-row noprint" style="margin-left:auto">
        <button class="btn sm primary" onclick="window.print()">🖨 Print</button>
        <button class="btn sm ghost" onclick="go('dashboard')">Back</button>
      </div>
    </div>
    ${all.length?'':dates.length
      ?`<p class="sub" style="margin:0 0 4px">Nothing open on your mistakes list 🎉 — what follows is the dates the bank contests most.</p>`
      :`<div class="empty"><div class="e">🎉</div><p>Nothing open. Sit a test or run a gauntlet and this fills itself.</p></div>`}
    <div class="cram">
      ${leeches.length?`<div class="grp"><h3>🐛 Leeches — read these twice</h3>${leeches.map(cramItem).join('')}</div>`:''}
      ${byTopic.map(t=>`<div class="grp"><h3>${esc(t.name)}</h3>${t.items.map(cramItem).join('')}</div>`).join('')}
      ${dates.length?`<div class="grp"><h3>📅 Dates</h3>${dates.map(x=>{
        const g=canon(x.q.g),e=S.sr[g],m=S.mistakes[g],bad=(m&&!m.done)||!e;
        return `<div class="it"><span class="y${bad?' b':''}">${esc(x.y)}</span><span class="k">${esc(x.q.t)}</span></div>`}).join('')}</div>`:''}
    </div>
    ${all.length>shown.length?`<p class="sub" style="margin-top:12px;font-size:12.5px">Showing the ${shown.length} worst of ${all.length} open — clear some and the rest appear.</p>`:''}
    <p class="sub" style="margin-top:14px;font-size:12px">Every line is your own mistake list plus the sentence from the explanation that states the fact. Nothing here is generated.</p>`;
}

/* ============ STATS ============ */

      <div class="btn-row" style="margin-top:12px">

        <span class="ic" style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--on-solid);font-size:11px;font-weight:800;background:${h.src==='sweep'?'var(--brand)':h.passed?'var(--good)':'var(--bad)'}">${h.src==='sweep'?'🧭':h.passed?'✓':'✕'}</span>

      <div class="btn-row">
        <button class="btn sm" onclick="exportData()">⬇ Export backup</button>
        <button class="btn sm" onclick="pickImport()">⬆ Restore…</button>
