   outcome — a guess that lands right would have landed right on the day too.
   What it does not know is *why*, and that is what the pass probability below
   is for: `unsure` is evidence there, not here. */
const RECENT_N=200;
function noteRecent(correct){
  const r=S.recent||(S.recent=[]);
  r.push(correct?1:0);
  if(r.length>RECENT_N)r.splice(0,r.length-RECENT_N);
}
function recentAcc(){
  const r=S.recent||[];
  if(!r.length)return null;
  return {pct:Math.round(r.reduce((a,b)=>a+b,0)/r.length*100),n:r.length};
}

/* ============ READINESS ============
   An honest answer to "are we ready?".

   Tests passed is the wrong headline. It counts sits — mostly retries of the
   same 24 questions — and says nothing about the 1,500 you have never met. So
   instead: draw 24 questions out of the bank the way the real exam does, grade
   them against what your history says you know about each one, and do it a
   thousand times. The number is the share of those exams that clear 18/24.

   Every question contributes something, including the unseen ones, floored at
   the rate you would guess it right and never zero. A paper of 24 questions
   you have never seen is not a 0% chance of passing — it is about 1% — and
   keeping that floor is what makes the figure rise honestly with coverage
   instead of jumping the day you happen to sit a test. */
const MC_DRAWS=1000, MC_SEED=0x5eed1;
/* P(right | box). Deliberately modest at the top: box 5 means "right four
   times across two weeks", not "cannot get this wrong". */
const BOX_P=[.45,.60,.72,.82,.90,.95];
const nCk=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return Math.round(r)};
/* What pure guessing is worth on this question. Two options is the coin flip
   the whole sprint is about; a "select 2 of 4" is one in six, the hardest
   thing in the bank to fall into by accident. */
function guessRate(q){
  const k=correctIdx(q).length||1;
  return 1/Math.max(2,nCk(q.o.length,k));
}
function pKnow(q){
  const g=canon(q.g),e=S.sr[g],m=S.mistakes[g],floor=guessRate(q);
  if(!e)return floor;                                  /* never seen: a coin flip, not a zero */
  let p=BOX_P[Math.min(e.box||0,BOX_P.length-1)];
  if(m&&!m.done)p*=m.leech?.62:.80;                    /* open mistake — and the ones that keep coming back */
  p*=Math.pow(.88,Math.min(e.unsure||0,4));            /* every "wasn't sure" is you telling the model something */
  if((e.seen||0)<=1)p*=.9;                             /* one right answer is one data point */
  return Math.max(floor,Math.min(.98,p));
}
/* ---- Calibration: what the tests you have actually sat say ----
   Boxes and mistake counts are the model's own bookkeeping; a real sit is the
   only outside check on it. Where sits exist the model is pulled towards
   them — but measured only over the questions those tests contain, because
   comparing a test score against a bank that is 80% unseen compares nothing.

   Phase 4 change 5: a best score set with the answers on screen is a softer
   room, so it counts for REVEALED_W of a blind one. And bests are optimistic
   by construction — the best of every attempt — which is why the whole
   correction is shrunk towards 1 by a prior worth CAL_PRIOR clean sits and
   then clamped. It nudges; it never takes over. */
const REVEALED_W=.35, CAL_PRIOR=3, CAL_MIN=.75, CAL_MAX=1.25;
function calibration(){
  let w=0,obs=0,mod=0;
  for(const [n,st] of Object.entries(S.tests)){
    if(!st||st.best==null)continue;
    const t=TESTS.find(x=>x.n===+n);if(!t||!t.q.length)continue;
    const wt=st.revealed?REVEALED_W:1;
    w+=wt;
    obs+=wt*(st.best/t.q.length);
    mod+=wt*(t.q.reduce((a,q)=>a+pKnow(q),0)/t.q.length);
  }
  if(!w||mod<=0)return {k:1,w:0};
  const k=(w*(obs/w)+CAL_PRIOR*(mod/w))/((w+CAL_PRIOR)*(mod/w));
  return {k:Math.max(CAL_MIN,Math.min(CAL_MAX,k)),w};
}
/* xorshift with a fixed seed. The same progress must produce the same number
   every time the app opens: a headline that wobbles two points on a reload is
   a headline nobody believes, and 1,000 draws wobble about that much. */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
let _ready=null;
function readiness(){
  if(_ready&&_ready.rev===_rev)return _ready;
  const cal=calibration();
  const p=POOL.map(q=>Math.max(guessRate(q),Math.min(.99,pKnow(q)*cal.k)));
  const n=p.length,K=Math.min(24,n),idx=p.map((_,i)=>i),rnd=rng(MC_SEED);
  let pass=0,score=0;
  for(let d=0;d<MC_DRAWS;d++){
    let hit=0;
    /* Partial Fisher-Yates: 24 *distinct* questions, like the real paper. */
    for(let i=0;i<K;i++){
      const j=i+((rnd()*(n-i))|0),t=idx[i];idx[i]=idx[j];idx[j]=t;
      if(rnd()<p[idx[i]])hit++;
    }
    score+=hit;
    if(hit>=PASSMARK)pass++;
  }
  const out={p:pass/MC_DRAWS,mean:score/MC_DRAWS,cal:cal.k,sits:cal.w,seen:srSeen(),ts:Date.now()};
  /* The hub carries no bank data, so it cannot model anything — it reads the
     last figure this page worked out. Stale by definition, and it says so. */
  S.readiness={p:out.p,mean:out.mean,seen:out.seen,ts:out.ts};
  save();
  _ready=Object.assign({rev:_rev},out);      /* after save(), which bumps _rev */
  return _ready;
}
const readyLabel=p=>p>=.85?'ready':p>=.6?'nearly there':p>=.3?'not yet':'early days';
function explainReadiness(){
  const r=readiness(),cov=Math.round(r.seen/UNIQUE_N*100);
  const sits=r.sits?`${r.sits.toFixed(1)} sit${r.sits===1?'':'s'} of evidence, pulling the model ${r.cal>=1?'up':'down'} by ${Math.abs(Math.round((r.cal-1)*100))}%`
    :'no test sits yet, so this is the model on its own';
  modal(`<h3 style="margin:0 0 4px">${Math.round(r.p*100)}% — ${readyLabel(r.p)}</h3>
    <p class="sub" style="margin:0 0 14px">Out of ${MC_DRAWS} simulated papers of 24 questions drawn from the whole bank, ${Math.round(r.p*MC_DRAWS)} scored ${PASSMARK} or better. Typical score ${r.mean.toFixed(1)}/24.</p>
    <div class="lbl">How each question is scored</div>
    <p class="sub" style="margin:4px 0 12px;font-size:12.5px">From its spaced-repetition box, whether it is an open mistake or a leech, and how often you have tapped "wasn't sure" — floored at the rate you would guess it right. A question you have never seen counts as that floor (50% for a two-option, 25% for four), never as a zero. Bank coverage is ${cov}%, so ${100-cov}% of every simulated paper is still guesswork.</p>
    <div class="lbl">Tests you have sat</div>
    <p class="sub" style="margin:4px 0 0;font-size:12.5px">${esc(sits)}. A best score set with instant feedback on counts for ${REVEALED_W} of a blind one — you answered before you saw the mark, but the explanations arriving between questions is a softer room than the real thing.</p>
    <div class="btn-row" style="margin-top:18px"><button class="btn primary" onclick="closeModal()">Got it</button>
      <button class="btn ghost" onclick="closeModal();go('cram')">📄 Cram sheet</button></div>`);
}

/* ============ FINISH / RESULTS ============
   Sources whose score is not a readiness signal: they are training sets, built
   to be harder or stranger than a real sit. */
/* Not scored as a pass attempt, and not a test result. Each of these serves a
   deliberately unrepresentative slice — unseen questions, coin flips, dates,
   the 263 hardest-yield questions in the bank ordered by what you owe them,
   your own open mistakes, or every question that has ever caught you — so a
   score here is not an estimate of anything and must not move the pass rate.
   The mistake set and the Ever wrong set are the plainest cases of the six:
   they are your worst questions, hardest-first, by construction.
   All six still count as the day's work and keep the streak alive. */
const TRAINING=new Set(['sweep','twist','dates','examq','mset','hset']);
function finishQuiz(){
  stopTimer();
  /* Graded is finished: the store entry goes here and on an explicit discard,
     and nowhere else (INV-13). `sess` stays live — the results screen and
     retrySame() are still reading it. */
  forgetSess(sess.sid);
  // grade any unchecked (exam) items now
  if(!sess.instant){
    /* _rec is kept, not dropped: applyUnsure() reads preBox out of it, and
       without it a recall miss graded here would zero the box instead of
       restoring it — the same F-7 that bit "Wasn't sure" on a resumed session. */
    sess.items.forEach(it=>{const ci=correctIdx(it.q);it.checked=true;it._correct=it.picked.length?eqSet(it.picked,ci):false;
      it._rec=recordAnswer(it.q,it._correct,it.picked);
      if(it.recall==='miss')applyUnsure(it)});
  }else{
    // practice: unchecked & unpicked count as not-correct but only grade if attempted
    sess.items.forEach(it=>{if(!it.checked){it.checked=true;it._correct=false}});
  }
  const score=sess.items.filter(it=>it._correct).length;
  const total=sess.items.length;
  const passed=score>=Math.round(PASSMARK/24*total);
  /* Sweep is first contact with unseen questions; the gauntlets are a deliberate
     pile-up of the hardest format in the bank. Neither is an attempt at a pass
     mark, and scoring them as one would bury the exam pass rate under sessions
     that were never meant to be passed. */
  if(!TRAINING.has(sess.source)){S.attempts++;if(passed)S.passes++}
  if(sess.testN){
    const st=testStat(sess.testN);
    /* `revealed` describes the best score, not the last sit: a 24 earned with
       the explanations on screen is a different thing from a 24 earned blind,
       and the tile says which one you are looking at. */
    const isBest=score>(st.best??-1);
    S.tests[sess.testN]={best:Math.max(st.best??0,score),attempts:st.attempts+1,
      lastPass:passed,lastScore:score,revealed:isBest?!!sess.instant:!!st.revealed};
    /* So the dashboard can find this tile again — its section opens itself and
       the tile pulses once, the next time you look at it. */
    if(passed)justPassed=sess.testN;
  }
  /* A sweep or a gauntlet is the day's work as much as a drill is — it keeps
     the streak alive. Only the drill, answered all the way through, closes the
     drill for the day. */
  if(sess.source==='drill'&&drillComplete(sess))noteDrillDone(sess.startTs);
  else if(sess.source==='drill'||TRAINING.has(sess.source))noteStudyDone(sess.startTs);
  S.history.unshift({t:Date.now(),title:sess.title,score,total,passed,src:sess.source});
  S.history=S.history.slice(0,50);
  save();
  renderResults(score,total,passed);
  go('results');
}
/* A drill that did not close the day leaves the tile still offering it, which is
   a surprise unless the screen that ended it says why. */
function drillOpenNote(){
  if(!sess||sess.source!=='drill'||drillComplete(sess))return '';
  const left=sess.items.filter(it=>!it.picked.length).length;
  return ` <b>${left}</b> question${left===1?'':'s'} went unanswered, so today's drill stays open.`;
}
function renderResults(score,total,passed){
  const pct=Math.round(score/total*100);
  const training=TRAINING.has(sess.source);
  const rc=training?'var(--brand)':passed?'var(--good)':'var(--bad)';
  const el=document.getElementById('view-results');
  const wrongItems=sess.items.filter(it=>!it._correct);
  /* Elapsed, not effort. Now that a session can be left and picked up tomorrow,
     that gap is inside this number — so past a few hours it stops describing
     anything and is dropped rather than reported as "1440:00 taken". */
  const secs=Math.round((Date.now()-sess.startTs)/1000);
  const took=secs<6*3600?`<span class="chip" style="margin-left:6px">${fmt(secs)} taken</span>`:'';
  /* Only a numbered test belongs to a series. A drill, a sweep or a random
     exam has nothing either side of it, and `retrySame()` is already the right
     next move for those. */
  const nav=sess.testN?seriesNav(sess.testN):'';
  el.innerHTML=`
    <h1>${sess.title} — results</h1>
    <div class="card pad" style="margin-bottom:16px">
      <div class="result-hero">
        <div class="ring" style="--p:${pct};--rc:${rc}"><div class="inner"><div><div class="pct">${pct}%</div><div class="sc">${score}/${total}</div></div></div></div>
        <div>
          <div class="verdict-big ${training||passed?'good':'bad'}">${
            sess.source==='sweep'
            ?`🧭 ${total} more seen${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='twist'
            ?`🌀 Gauntlet run${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='dates'
            ?`📅 Dates drilled${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='examq'
            ?`⭐ Exam questions drilled${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='mset'
            ?`🎯 ${esc(sess.title)} done`
            :sess.source==='hset'
            ?`📓 ${esc(sess.title)} done`
            :sess.source==='drill'
            ?(drillComplete(sess)
              ?`🔥 Drill done${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
              :`🔥 Drill left unfinished`)
            :(passed?'🎉 Passed!':'Keep practising')}</div>
          <p class="sub" style="margin:6px 0 12px">${sess.source==='sweep'
            ?`You got <b>${score}</b> of <b>${total}</b> first time. <b>${srUnseen()}</b> of ${UNIQUE_N} still never seen — a low score here is the point, not a problem.`
            :sess.source==='twist'
            ?`<b>${score}</b> of <b>${total}</b>. Every one of these was a coin flip served next to its own near-miss — this score is meant to be lower than a test, and it doesn't count towards your pass rate.`
            :sess.source==='dates'
            ?`<b>${score}</b> of <b>${total}</b>, with the near-miss years put back in. Doesn't count towards your pass rate.`
            :sess.source==='examq'
            ?`<b>${score}</b> of <b>${total}</b>, all of them reported as recently asked in a real exam. <b>${examStats().fresh}</b> of the ${EXAM_POOL.length} still never seen. Doesn't count towards your pass rate — hardest-first is not a fair sample.`
            :sess.source==='mset'
            ?(()=>{const p=mistakeSetPos();
               return `<b>${score}</b> of <b>${total}</b> — the ${score} you got right have earned a day each towards clearing. ${p.live
                 ? `<b>${p.live}</b> still open and able to earn one today, ${Math.ceil(p.live/MISTAKE_SET_N)} more set${Math.ceil(p.live/MISTAKE_SET_N)===1?'':'s'}' worth.`
                 : `That's every open mistake given its day. The next tick has to be tomorrow — spacing is what makes them stick.`} Doesn't count towards your pass rate — these are your worst questions by construction.`})()
            :sess.source==='hset'
            ?(()=>{const p=historySetPos();
               return `<b>${score}</b> of <b>${total}</b>, drawn from the <b>${p.total}</b> questions that have ever caught you. ${wrongItems.length
                 ? `The <b>${wrongItems.length}</b> you missed ${wrongItems.length===1?'is':'are'} back on your mistakes list — cleared or not, a miss reopens it.`
                 : `None of them caught you this time.`} ${p.lapDone
                 ? `That's all ${p.total} through once today — go round again whenever you like.`
                 : `<b>${p.fresh}</b> still to come round today, ${Math.ceil(p.fresh/HISTORY_SET_N)} more set${Math.ceil(p.fresh/HISTORY_SET_N)===1?'':'s'}' worth.`} Doesn't count towards your pass rate — these are your worst questions by construction.`})()
            :`You scored <b>${score}</b> of <b>${total}</b>. ${passed?`That's above the ${Math.round(PASSMARK/24*total)} needed.`:`You need <b>${Math.round(PASSMARK/24*total)}</b> to pass — ${Math.round(PASSMARK/24*total)-score} more.`}`}${drillOpenNote()} ${took}${readinessMove()}</p>
          <div class="btn-row">
            <button class="btn primary" onclick="retrySame()">${training?'↻ Next batch':'↻ Retry'}</button>
            ${wrongItems.length?`<button class="btn" onclick="practiceMistakes()">🎯 Fix ${wrongItems.length} mistake${wrongItems.length===1?'':'s'}</button>`:''}
            <button class="btn ghost" onclick="go('dashboard')">Dashboard</button>
          </div>
        </div>
      </div>
    </div>
    ${nav}
    <b>Review all ${total} questions</b>
    <div style="margin-top:8px">
    ${sess.items.map((it,i)=>{const ci=correctIdx(it.q);
      return `<details class="rev" ${it._correct?'':'open'}>
        <summary><span class="ic ${it._correct?'ok':'no'}">${it._correct?'✓':'✕'}</span>
          <span>${i+1}. ${esc(it.q.t)}</span>${examBadge(it.q)}<span class="tag">${esc(TOPICS[it.q.p])}</span></summary>
        <div class="body">
          ${it.q.o.map((o,oi)=>{const isC=ci.includes(oi),isP=it.picked.includes(oi);
            let cls=isC?'style="color:var(--good);font-weight:700"':(isP?'style="color:var(--bad);font-weight:700"':'style="color:var(--muted)"');
            return `<div ${cls}>${isC?'✓':(isP?'✕':'·')} ${esc(o[0])}</div>`}).join('')}
          <div class="lbl" style="margin-top:8px">Explanation</div><div>${esc(it.q.e||'—')}</div>
        </div>
      </details>`}).join('')}
    </div>
    ${nav}`;
}
/* What the session did to the only number that matters. A sweep of 50 unseen
   questions moves it a point or two whatever you score, because coverage is
   itself worth something — which is exactly the argument for doing them. */
function readinessMove(){
  const b=sess&&sess.readyBefore;
  if(b==null)return '';
  const a=readiness().p,d=Math.round(a*100)-Math.round(b*100);
  return `<span class="chip" style="margin-left:6px;color:${d>0?'var(--good)':d<0?'var(--bad)':'var(--muted)'}" title="Chance of passing a random 24-question paper">${
    d>0?'▲':d<0?'▼':'='} pass ${Math.round(a*100)}%${d?` (${d>0?'+':''}${d})`:''}</span>`;
}
/* ============ TEST SERIES ============
   "The next test" has to mean the tile that comes next on the dashboard, so
   the series is the dashboard's own grouping and not the test-number line:
   the numbers are one flat space shared by four banks, so Test 238 + 1 is a
   different source's Test 301 and Test 45 + 1 does not exist at all. Grouping
   the same way testGroup() does — bank, split by kind only where the bank
   declares one — keeps Exam Conditions from spilling into The Proving Ground
   and stops the walk dead at each bank's edge. */
function testSeries(n){
  const t=TESTS.find(x=>x.n===n);if(!t)return null;
  const b=t._bank,ks=bankKinds(b);
  /* Same key and same membership rule as grpKeys()/bankSection(), so the
     section's name on the dashboard is the name used here. */
  const key=ks.length<2?`${b.id}:all`:`${b.id}:${t.kind}`;
  const list=ks.length<2?b.tests:b.tests.filter(x=>x.kind===t.kind);
  const i=list.indexOf(t);if(i<0)return null;
  return {list,i,name:(GRP_FACE[key]||{}).name||b.label,prev:list[i-1]||null,next:list[i+1]||null};
}
/* Whether the test you are about to walk into is new ground or a re-sit — the
   same two facts the dashboard tile carries, in the space a button has. */
function seriesMeta(t){
  const st=testStat(t.n);
  return st.best==null?'Not sat':`Best ${st.best}/24${st.lastPass?' · passed':''}`;
}
function seriesNav(n){
  const s=testSeries(n);if(!s)return '';
  /* The empty side keeps its grid column, so the position line stays centred
     at both ends of a series rather than sliding under the one live button. */
  const side=(t,nx)=>t?`<button class="btn sm${nx?' nx':''}" onclick="startTest(${t.n})">
      <span>${nx?`Test ${t.n} →`:`← Test ${t.n}`}</span><span class="m">${seriesMeta(t)}</span></button>`:'<span></span>';
  return `<div class="snav">
    ${side(s.prev,false)}
    <div class="pos">Test ${s.i+1} of ${s.list.length}<span class="nm"> · ${esc(s.name)}</span></div>
    ${side(s.next,true)}
  </div>`;
}
function retrySame(){
  /* The training modes walk a queue, so "again" means the next batch off it,
     not a re-run of the one just finished. */
  if(sess.source==='sweep')return startSweep(sess.items.length);
  if(sess.source==='twist')return startTwist(sess.items.length);
  if(sess.source==='dates')return startDates(sess.items.length);
  if(sess.source==='examq')return startExamQs(sess.items.length);
  if(sess.source==='mset')return startMistakeSet(sess.items.length);
  if(sess.source==='hset')return startHistorySet(sess.items.length);
  if(sess.testN)return startTest(sess.testN);
  const src=sess.items.map(it=>it.q);
  makeSession(src,{title:sess.title,timed:sess.timed,testN:sess.testN,source:sess.source});
}

/* ============ FACTS & CHAPTER LINKS ============
   facts.js (tools/build-facts.mjs) carries two things per question, both
   derived at build time from content already in the repo:

     cut   [start,length] into the question's own explanation — the one
           sentence that states the fact. Offsets, not text, so it is provably
           verbatim (INV-7) and the file stays small.
     link  the chapter block that explains it, as a target into the existing
           ?find= machinery in app.js.

   Loaded on demand, not up front: the Mistakes view is the only thing that
   needs it, and it is 100KB nobody should pay for on a drill. Everything below
   degrades to nothing if the file is missing. */
let FACTS=null,_factsReq=null;                        /* null = untried, false = unavailable */
function loadFacts(){
  if(FACTS!==null)return Promise.resolve(FACTS);
  if(_factsReq)return _factsReq;
  _factsReq=new Promise(res=>{
    const s=document.createElement('script');
    s.src='facts.js';
    s.onload=()=>{FACTS=window.LITUK_FACTS||false;res(FACTS)};
    s.onerror=()=>{FACTS=false;res(false)};
    document.head.appendChild(s);
  });
  return _factsReq;
}
/* The one sentence of the explanation that states the fact. A long enumeration
   gets cut at a clause boundary by the builder, so anything not ending in a
   full stop is marked as the fragment it is. */
function factOf(q){
  const c=FACTS&&FACTS.cut&&FACTS.cut[canon(q.g)];
  if(!c||!q.e)return '';
  const s=q.e.substr(c[0],c[1]).trim();
  if(s.length<=10)return '';
  return /[.!?]$/.test(s)?s:s+'…';
}
/* "Read why" — the chapter section this question comes out of, with the term
   highlighted on arrival. */
function chapterLink(q){
  if(!FACTS||!FACTS.link||!FACTS.targets)return null;
  const t=FACTS.targets[FACTS.link[canon(q.g)]];
  if(!t)return null;
  const f=FACTS.files[t[0]];if(!f)return null;
  /* No term means nothing on that page can be highlighted in one piece — the
     section anchor still puts you in the right place. */
  return {href:f[0]+(t[2]?'?find='+encodeURIComponent(t[2]):'')+(t[1]?'#'+t[1]:''),
    label:`Chapter ${f[2]} · ${f[3]}`};
}

/* ============ MISTAKES ============ */
function renderMistakes(){
  if(FACTS===null)loadFacts().then(f=>{if(f)renderMistakes()});   /* re-render once it lands */
  const all=Object.entries(S.mistakes).filter(([g,m])=>!m.done).map(([g,m])=>({q:QByG[g],m})).filter(x=>x.q);
  /* Three kinds of open entry, worst first: leeches, questions you have got
     wrong, and questions you have only ever guessed. */
  const leeches=all.filter(x=>x.m.leech);
  const open=all.filter(x=>!x.m.leech&&(x.m.count||0)>0);
  const guessed=all.filter(x=>!x.m.leech&&!(x.m.count||0));
  const done=Object.entries(S.mistakes).filter(([g,m])=>m.done).length;
  const ms=mistakeSetPos();
  const flagged=Object.keys(S.flags).map(g=>QByG[g]).filter(Boolean);
  const el=document.getElementById('view-mistakes');
  el.innerHTML=`
    <h1>Mistakes & flags</h1>
    <p class="sub">A question clears when you get it right on <b>${RETIRE_4} separate days</b> — ${RETIRE_2} for a two-option question, never on the day you slipped, and never on a day you tapped "wasn't sure". ${done} cleared so far — clearing one deletes nothing, and 📓 Ever wrong keeps every question that has ever caught you.</p>
    <p class="sub" style="margin:-6px 0 12px">Sets of ${MISTAKE_SET_N}, oldest-untouched first, and only what can still earn a day today — so each one is ${MISTAKE_SET_N} the last set didn't show you. ${ms.live
      ? `<b>${ms.live}</b> left today across ${Math.ceil(ms.live/MISTAKE_SET_N)} set${Math.ceil(ms.live/MISTAKE_SET_N)===1?'':'s'}.`
      : all.length?`All ${all.length} have had their day — come back tomorrow.`:''}</p>
    <div class="btn-row" style="margin-bottom:16px">
      <button class="btn primary" onclick="startMistakeSet()" ${ms.live?'':'disabled'}>🎯 ${ms.live?`Mistake set ${ms.i} of ${ms.of}`:'All had their day today'}</button>
      <button class="btn" onclick="practiceMistakes()" ${all.length?'':'disabled'}>Practise all ${all.length}</button>
      ${flagged.length?`<button class="btn" onclick="practiceFlagged()">★ Practise ${flagged.length} flagged</button>`:''}
      <button class="btn ghost" onclick="go('history')">📓 Ever wrong (${historyPool().length})</button>
      ${all.length?`<button class="btn ghost" onclick="go('cram')">📄 Cram sheet</button>`:''}
      ${all.length?`<button class="btn ghost" onclick="clearMistakes()">Clear list</button>`:''}
    </div>
    ${leeches.length?`<b>🐛 Leeches (${leeches.length})</b>
      <p class="sub" style="margin:2px 0 8px">Missed ${LEECH_AT}+ times. These never clear on their own — read the explanation properly, then tap "I know this now".</p>`
      +leeches.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${open.length?`<b style="display:block;margin-top:${leeches.length?'22px':'0'}">Got wrong (${open.length})</b>`+open.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${guessed.length?`<b style="display:block;margin-top:${leeches.length||open.length?'22px':'0'}">🤔 Wasn't sure (${guessed.length})</b>
      <p class="sub" style="margin:2px 0 8px">Right answer, but you said you were guessing. Never actually got wrong — they clear the same way, by getting them right on ${RETIRE_4} separate days without tapping "wasn't sure".</p>`
      +guessed.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${all.length?'':`<div class="empty"><div class="e">🎉</div><p>No mistakes to review. Take a test to find weak spots!</p></div>`}
    ${flagged.length?`<b style="display:block;margin-top:22px">★ Flagged (${flagged.length})</b>`+flagged.map(q=>mistakeRow(q,S.mistakes[q.g]||{},true)).join(''):''}
  `;
}
const times=n=>n===1?'once':n===2?'twice':`${n} times`;
function mistakeRow(q,m,isFlag){const ci=correctIdx(q);
  const need=retireDays(q),got=(m.ok||[]).length,guess=m.unsure||0,miss=m.count||0;
  /* A guess-only entry is not a wrong answer and does not get the red badge.
     `cleared` only ever arrives here from the Ever wrong page — every other
     caller filters done entries out long before they reach a row. */
  const kind=isFlag?'flag':m.done?'cleared':m.leech?'leech':miss?'wrong':'guess';
  const badge={flag:'★',cleared:'✓',leech:'🐛',wrong:miss||1,guess:'🤔'}[kind];
  const colour=kind==='wrong'?'var(--bad)':kind==='guess'?'var(--muted)'
    :kind==='cleared'?'var(--good)':'var(--warn)';
  /* Which wrong option you keep going for. Naming it is the whole point: the
     fix for "you keep missing this" is unknowable, the fix for "you have picked
     1801 three times" is one sentence long. */
  const picks=m.picked||{};
  const worst=Object.entries(picks).map(([oi,n])=>({oi:+oi,n:+n}))
    .filter(x=>q.o[x.oi]&&!q.o[x.oi][1]&&x.n>0).sort((a,b)=>b.n-a.n)[0];
  const fact=factOf(q),link=chapterLink(q);
  return `<details class="rev">
    <summary><span class="ic no" style="background:${colour}">${badge}</span>
      <span>${esc(q.t)}</span>${examBadge(q)}<span class="tag">${esc(TOPICS[q.p])}</span></summary>
    <div class="body">
      ${q.o.map((o,oi)=>{const n=picks[oi]||0;
        return `<div style="${ci.includes(oi)?'color:var(--good);font-weight:700':'color:var(--muted)'}">${ci.includes(oi)?'✓':'·'} ${esc(o[0])}${
          n&&!ci.includes(oi)?`<span class="pickn">you picked this ${times(n)}</span>`:''}</div>`}).join('')}
      ${worst&&worst.n>1?`<p class="wrongpull">You have chosen “${esc(q.o[worst.oi][0])}” ${times(worst.n)}.</p>`:''}
      ${fact?`<p class="fact">💡 ${esc(fact)}</p>`:''}
      <div class="lbl" style="margin-top:8px">Explanation</div><div>${esc(q.e||'—')}</div>
      ${isFlag?'':`<p class="sub" style="margin:8px 0 0;font-size:12.5px">${kind==='cleared'
        ? `${got>=need
            ? `Cleared on the counter — right on <b>${got}</b> separate days`
            : `Marked as known by hand${got?` after ${got} right day${got===1?'':'s'}`:''}, never cleared on the counter`} · got it wrong ${times(miss)}${guess?` · guessed ${guess}×`:''}${m.miss?` · last slip ${esc(m.miss)}`:''}.`
        : m.leech
        ? `Missed ${miss} times${guess?`, guessed ${guess}`:''} · right on ${got} day${got===1?'':'s'} since — clearing this one is a decision, not a counter.`
        : `Right on <b>${got}</b> of the ${need} separate days needed · ${miss?`missed ${miss}×`:'never actually got it wrong'}${guess?` · guessed ${guess}×`:''}${m.miss?` · last slip ${esc(m.miss)}`:''}.`}</p>`}
      <div class="btn-row" style="margin-top:8px">
        ${kind==='cleared'
          ? `<button class="btn sm ghost" onclick="event.preventDefault();reopen(${q.g})">↩ Put back on the list</button>`
          : `<button class="btn sm ghost" onclick="event.preventDefault();unflag(${q.g})">${isFlag?'Remove flag':m.leech?'I know this now':'Mark as known'}</button>`}
        ${link?`<a class="btn sm ghost" href="${esc(link.href)}">📖 Read why · ${esc(link.label)}</a>`:''}
      </div>
    </div>
  </details>`;
}
function practiceFlagged(){const qs=Object.keys(S.flags).map(g=>QByG[g]).filter(Boolean);if(!qs.length)return;makeSession(qs,{title:'Flagged review',timed:false,source:'mistakes'})}
/* The explicit tap a leech needs: it clears the leech flag too, so the question
   only becomes one again if it is missed LEECH_AT more times. */
function unflag(g){const c=canon(g),m=S.mistakes[c];if(S.flags[c])delete S.flags[c];if(m){m.done=true;m.leech=false}save();repaintList()}
/* Mistakes and Ever wrong draw the same rows, so either can be the page a
   row's button was tapped on. Repaint the one actually on screen — re-rendering
   the hidden one leaves the tapped row sitting there looking like nothing
   happened. */
function repaintList(){document.getElementById('view-history').classList.contains('hidden')?renderMistakes():renderHistory()}
function clearMistakes(){modal(`<h3 style="margin:0 0 8px">Clear all mistakes?</h3><p class="sub">This marks every mistake — leeches included — as mastered. Can't be undone.</p><div class="btn-row"><button class="btn primary" onclick="Object.values(S.mistakes).forEach(m=>{m.done=true;m.leech=false});save();closeModal();renderMistakes()">Yes, clear</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}

/* ============ EVER WRONG ============
   The mistakes list is a queue with an exit: get a question right on enough
   separate days and it retires, which is what makes the list drain — and the
   drain is the point, three weeks out. But retiring a question only sets
   `done`. The record itself — how many times it caught you, which wrong option
   you kept reaching for, the day you last slipped — has been kept all along,
   and until now nothing ever showed it to you.

   This is that record. Every question that has ever caught you, cleared or
   not, in one place that never empties, so the last few days before the exam
   can be spent on the questions that actually beat you rather than on a list
   which has spent a month emptying itself.

   Derived, never stored. Anything that increments `count` anywhere in the app
   — a timed test, the daily drill, a sweep, a gauntlet, a mistake set, a set
   from this very page — is in here on the next render. There is no second
   list to keep in step, and nothing has to be told a new mistake happened.

   Guess-only entries are not in it. A question you got right while tapping
   "wasn't sure" carries `count:0`: it belongs on the mistakes list, which says
   so in its own words, but filing it under "ever got wrong" would be a lie. */
const HISTORY_SET_N=24;
const todayStart=()=>new Date().setHours(0,0,0,0);
/* count>0 — actually answered wrong at least once, whatever became of it. */
function historyPool(){
  return Object.entries(S.mistakes)
    .filter(([,m])=>(m.count||0)>0)
    .map(([g,m])=>({q:QByG[canon(g)],m})).filter(x=>x.q);
}
/* Least-recently-seen first, worst as the tie-break: the mistake-set queue's
   rule, for the mistake-set reason — a random draw over hundreds leaves a tail
   that never comes up at all.

   What it does NOT have is the mistake set's "can still earn a day today"
   filter, because nothing here is trying to earn anything. Retirement is the
   other list's job. This one is for repetition, and repetition has no daily
   ration: every answer moves `sr.last`, so the 24 you just did fall to the
   back on their own and the next set is 24 this one didn't show you, all day,
   for as many laps as you want. */
function historyQueue(){
  return historyPool().sort((a,b)=>lastSeen(a.q)-lastSeen(b.q)||cramRank(b.m)-cramRank(a.m));
}
/* How much of the list is still to come today, derived and never stored.

   This deliberately does NOT report a set number. It used to, and the number
   was honest but answered a question nobody asks: `seen` counts everything
   that touched these questions today by ANY route — the daily drill, a mistake
   set, a timed test — so opening the page after a normal morning's work said
   "Set 6 of 15" and read as though five sets had been skipped. Nothing had
   been: the queue is least-recently-seen first, so a set is always drawn from
   `fresh` and never from what the drill already covered.

   `fresh` and `seen` say that plainly. `of` still describes the shape of the
   whole list ("15 sets to a full pass"), which is the part a position was
   really standing in for. `fresh` at zero means every question has been
   through once today, and the page offers another lap rather than inventing
   a set 16. */
function historySetPos(){
  const pool=historyPool(),t0=todayStart();
  const total=pool.length,of=Math.max(1,Math.ceil(total/HISTORY_SET_N));
  const fresh=pool.filter(x=>lastSeen(x.q)<t0).length;
  return {total,of,fresh,seen:total-fresh,lapDone:total>0&&fresh===0};
}
const NOTHING_WRONG='Nothing here yet — no question has ever caught you 🎉';
/* `order:'keep'` because the queue above IS the point: shuffling it hands back
   a random 24 and the walk stops walking. Its own source, so the results screen
   can talk about laps rather than a pass mark, Next batch takes the next 24 off
   the queue, and TRAINING keeps a set of your worst questions out of the pass
   rate. */
function startHistorySet(nq){
  const p=historySetPos();
  /* The tail of a pass is short — 60 questions are 24 + 24 + 12, not
     24 + 24 + (12 fresh and 12 you did this morning) — so "set 3 of 3" is the
     end of the list and a pass is exactly the list. Once the pass is done the
     ration is off and a full set comes round again: everything seen today
     sorts to the back of the queue, so another lap replays it in the order you
     first met it. */
  const want=+nq||(p.fresh?Math.min(HISTORY_SET_N,p.fresh):HISTORY_SET_N);
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(want)));
  const qs=historyQueue().slice(0,size).map(x=>x.q);
  if(!qs.length){toast(NOTHING_WRONG);return}
  makeSession(qs,{title:p.lapDone?`Ever wrong · another ${qs.length}`:`Ever wrong · next ${qs.length}`,
    timed:false,source:'hset',order:'keep'});
}
function practiceHistory(){
  const qs=historyQueue().map(x=>x.q);
  if(!qs.length){toast(NOTHING_WRONG);return}
  makeSession(qs,{title:'Everything you have ever got wrong',timed:false,source:'hset',order:'keep'});
}
/* Answering here is not a separate bookkeeping path, and deliberately so:
   recordAnswer runs exactly as it does anywhere else. Right on a question
   that is still open earns it a day towards clearing; right on one already
   cleared changes nothing. Wrong reopens it — `done=false`, `ok=[]`, count up
   — so a question you cleared in July and fluffed in September is back on the
   mistakes list before you have left the results screen. */
function renderHistory(){
  if(FACTS===null)loadFacts().then(f=>{if(f)renderHistory()});   /* re-render once it lands */
  const pool=historyPool(),p=historySetPos();
  const worst=(a,b)=>cramRank(b.m)-cramRank(a.m);
  const leeches=pool.filter(x=>!x.m.done&&x.m.leech).sort(worst);
  const open=pool.filter(x=>!x.m.done&&!x.m.leech).sort(worst);
  const cleared=pool.filter(x=>x.m.done).sort(worst);
  const misses=pool.reduce((t,x)=>t+(x.m.count||0),0);
  const el=document.getElementById('view-history');
  el.innerHTML=`
    <h1>Everything you've ever got wrong</h1>
    <p class="sub">Every question that has ever caught you${pool.length?` — <b>${pool.length}</b> of them, across <b>${misses}</b> wrong answer${misses===1?'':'s'}`:''} — whether it is on your mistakes list right now or cleared weeks ago. Nothing ever leaves this page, and anything you get wrong anywhere in the app joins it.</p>
    <p class="sub" style="margin:-6px 0 12px">Sets of ${HISTORY_SET_N}, least-recently-seen first, so each set is ${HISTORY_SET_N} the last one didn't show you${pool.length>HISTORY_SET_N?` — ${p.of} sets to a full pass`:''}. ${p.lapDone
      ? `<b>All ${pool.length}</b> have been through once today. Go round again as often as you like — nothing here is rationed by the day.`
      : p.seen?`<b>${p.seen}</b> seen today, <b>${p.fresh}</b> still to come round.`:''}</p>
    <div class="btn-row" style="margin-bottom:${pool.length?'10px':'16px'}">
      <button class="btn primary" onclick="startHistorySet()" ${pool.length?'':'disabled'}>📓 ${!pool.length?'Nothing here yet':p.lapDone?'Go round again':`Next ${Math.min(HISTORY_SET_N,p.fresh)} · ${p.fresh} left today`}</button>
      <button class="btn" onclick="practiceHistory()" ${pool.length?'':'disabled'}>Practise all ${pool.length}</button>
      <button class="btn ghost" onclick="go('mistakes')">← Mistakes &amp; flags</button>
    </div>
    ${pool.length?`<p class="sub" style="margin:0 0 18px;font-size:12.5px">Getting one right here still earns it a day towards clearing, if it is still open. Getting one wrong puts it straight back on the mistakes list — cleared or not. Doesn't count towards your pass rate.</p>`:''}
    ${leeches.length?`<b>🐛 Leeches (${leeches.length})</b>
      <p class="sub" style="margin:2px 0 8px">Open, and missed ${LEECH_AT}+ times. The ones that keep coming back.</p>`
      +leeches.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${open.length?`<b style="display:block;margin-top:${leeches.length?'22px':'0'}">Still open (${open.length})</b>
      <p class="sub" style="margin:2px 0 8px">On your mistakes list right now, worst first.</p>`
      +open.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${cleared.length?`<b style="display:block;margin-top:${leeches.length||open.length?'22px':'0'}">✅ Cleared (${cleared.length})</b>
      <p class="sub" style="margin:2px 0 8px">Off the list, kept here. Each row says whether it cleared on the counter or was marked known by hand — and any of them can be put back.</p>`
      +cleared.map(({q,m})=>mistakeRow(q,m)).join(''):''}
    ${pool.length?'':`<div class="empty"><div class="e">🎉</div><p>No question has caught you yet. The first one that does will be here for good.</p></div>`}
  `;
}
/* The opposite of "Mark as known": a cleared question you do not actually
   trust goes back on the list. `ok` is emptied with it — a record that already
   holds its full quota of days would otherwise re-clear on the next correct
   answer, which is not putting it back, it is putting it back for an hour. */
function reopen(g){
  const c=canon(g),m=S.mistakes[c];if(!m)return;
  m.done=false;m.ok=[];
  save();repaintList();toast('Back on your mistakes list');
}

/* ============ CRAM SHEET ============
   The 4 September artifact: one screen, printable, everything still unresolved
   on two sides of A4. Nothing here is new information — it is S.mistakes and
   facts.js with the questions taken off, because on the last night you do not
   want to be tested, you want to be told.

   Ordered by what it costs you to have forgotten it: leeches, then open
   mistakes by topic, then the dates you keep losing. Capped, because a sheet
   that runs to nine pages is a sheet nobody reads. */
/* 60 mistakes and 24 dates is what fits on two sides of A4 at 8.6pt in two
   columns — measured against a real mid-sprint profile, not guessed. Past
   that the sheet is nine pages and nine pages get read as none. */
const CRAM_MISTAKES=60, CRAM_DATES=24;
const cramRank=m=>(m.leech?1e6:0)+(m.count||0)*10+(m.unsure||0);
function cramList(){
  return Object.entries(S.mistakes).filter(([,m])=>!m.done)
    .map(([g,m])=>({q:QByG[canon(g)],m})).filter(x=>x.q)
    .sort((a,b)=>cramRank(b.m)-cramRank(a.m));
}
function cramCount(){return Object.values(S.mistakes).filter(m=>!m.done).length}
/* How many questions in the bank turn on each year — 1066 in 21 of them, 2012
   in 32. A contested year is one the exam can twist, so it earns its line even
   when you have not got it wrong yet. */
let _yearDf=null;
function yearDf(){
  if(_yearDf)return _yearDf;
  _yearDf=new Map();
  for(const q of POOL)for(const y of new Set([...qText(q).matchAll(YEAR_G)].map(m=>m[1])))
    _yearDf.set(y,(_yearDf.get(y)||0)+1);
  return _yearDf;
}
function cramDates(){
  const df=yearDf(),weak=[],rest=[];
  for(const x of YEAR_Q){
    const g=canon(x.q.g),e=S.sr[g],m=S.mistakes[g];
    ((!e||(m&&!m.done)||(e.box||0)<=1||(e.unsure||0)>0)?weak:rest).push(x);
  }
  const byContest=(a,b)=>(df.get(b.y)||0)-(df.get(a.y)||0)||+a.y-+b.y;
  /* The bank holds "When did the English civil war begin?" and "When did the
     English Civil war begin?" as separate ids — different option sets, so the
     dedup keeps both, and rightly. On a sheet you read once they are one line. */
  const seen=new Set(),out=[];
  const take=(list,n)=>{for(const x of list){if(out.length>=n)break;
    const k=dupNorm(x.q.t);if(seen.has(k))continue;seen.add(k);out.push(x)}};
  take(weak.sort(byContest),CRAM_DATES);
  take(rest.sort(byContest),CRAM_DATES);
  return out.sort((a,b)=>+a.y-+b.y);          /* chronological: that is how dates stick */
}
/* "Which of these statements is correct?" is not worth printing — there the
   answer IS the fact. Everything else reads stem → answer. */
const STATEMENT_Q=/which (of these |of the following )?statements? (is|are) (correct|true)/i;
function cramItem(x){
  const {q,m}=x,ci=correctIdx(q);
  const ans=ci.map(i=>q.o[i][0]).join(' + ');
  const stem=STATEMENT_Q.test(q.t)?'':esc(q.t)+' ';
  const fact=m&&m.leech?factOf(q):'';
  const picks=(m&&m.picked)||{};
  const worst=Object.entries(picks).map(([oi,n])=>({oi:+oi,n:+n}))
    .filter(y=>q.o[y.oi]&&!q.o[y.oi][1]&&y.n>1).sort((a,b)=>b.n-a.n)[0];
  return `<div class="it">${m&&m.leech?'<span class="w">🐛 </span>':''}${stem?`<span class="k">${stem}</span>`:''}<span class="a">${esc(ans)}</span>${
    fact&&fact!==ans?`<span class="why">${esc(fact)}</span>`:''}${
    worst?`<span class="why b">not “${esc(q.o[worst.oi][0])}” — you have picked that ${times(worst.n)}</span>`:''}</div>`;
}
function renderCram(){
  if(FACTS===null)loadFacts().then(f=>{if(f)renderCram()});     /* leech facts land on the re-render */

  el.innerHTML=`

      <div class="btn-row noprint" style="margin-left:auto">

    </div>
    ${all.length?'':dates.length
      ?`<p class="sub" style="margin:0 0 4px">Nothing open on your mistakes list 🎉 — what follows is the dates the bank contests most.</p>`
      :`<div class="empty"><div class="e">🎉</div><p>Nothing open. Sit a test or run a gauntlet and this fills itself.</p></div>`}
    <div class="cram">
      ${leeches.length?`<div class="grp"><h3>🐛 Leeches — read these twice</h3>${leeches.map(cramItem).join('')}</div>`:''}
      ${byTopic.map(t=>`<div class="grp"><h3>${esc(t.name)}</h3>${t.items.map(cramItem).join('')}</div>`).join('')}
      ${dates.length?`<div class="grp"><h3>📅 Dates</h3>${dates.map(x=>{

        return `<div class="it"><span class="y${bad?' b':''}">${esc(x.y)}</span><span class="k">${esc(x.q.t)}</span></div>`}).join('')}</div>`:''}

/* ============ BACKUP / RESTORE ============
   Everything you have is two localStorage keys: lituk_v1 (progress) and
   lituk_prefs (settings). Export writes both into one file; restore validates
   the shape, confirms, writes both back and reloads.
   An untested backup is not a backup — do a real restore at least once. */
const BACKUP_APP='lituk',BACKUP_V=1,PREFS_LS='lituk_prefs';
function stamp(d){const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
/* How stale a backup has to get before the dashboard says so. A permanent
   "last backed up today" line is furniture people stop seeing, so this stays
   silent until there is genuinely something to lose. */
const BACKUP_STALE_DAYS=7;
function backupAge(){
  const at=(S.backup&&S.backup.at)||0;
  return at?Math.floor((Date.now()-at)/DAY):null;      /* null = never */
}
function lastBackupLine(){
  const d=backupAge();
  if(d===null)return 'Never exported.';
  return d===0?'Backed up today.':`Last backup ${d} day${d===1?'':'s'} ago.`;
}
function backupNag(){
  if(!(S.answered>0))return '';                        /* nothing to lose yet */
  const d=backupAge();
  if(d!==null&&d<BACKUP_STALE_DAYS)return '';
  return `<div class="card pad" style="border-color:var(--bad);margin-bottom:14px">
    <b>⚠️ Back up your progress</b>
    <p class="sub" style="margin:4px 0 10px">${esc(lastBackupLine())} It lives only in this browser — deleting the Home Screen icon or clearing website data takes it with it, and there is no undo.</p>
    <div class="btn-row"><button class="btn sm primary" onclick="exportData()">⬇ Export backup</button></div>
  </div>`;
}
/* Records that a backup left the device, for backupNag(). Deliberately not
   called when the share sheet is cancelled: nothing was saved, so claiming
   otherwise would be the one lie this feature cannot afford. */
function noteBackup(){
  S.backup={at:Date.now()};save();
  if(!document.getElementById('view-dashboard').classList.contains('hidden'))renderDashboard();
}
/* Where the share sheet is the ONLY way to save a file, which is iOS and iPadOS
   and nowhere else. Installed on iOS there is no download UI: <a download>
   either opens the JSON in place or does nothing at all, so the backup fails
   silently — worse than no backup, because you believe you have one.
   Desktop is the opposite case, and asking canShare() instead of asking the
   platform is what broke it: Chrome and Edge answer canShare({files}) with
   true, then hand a .json to a sheet with nowhere useful to put it. iPadOS 13+
   reports itself as a Mac, so touch points are what give it away. */
function shareIsOnlyWayToSave(){
  return /iP(hone|od|ad)/.test(navigator.userAgent)||
    (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
/* Returns false rather than throwing, so the caller can say "that failed"
   instead of claiming a backup that never landed. */
function downloadFile(text,name){
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url;a.download=name;a.rel='noopener';a.style.display='none';
    document.body.appendChild(a);a.click();
    /* Both outlive the click by a beat: tearing the anchor or the blob URL down
       in the same tick cancels the save outright in Firefox. */
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1000);
    return true;
  }catch(e){return false}
}
async function exportData(){
  const payload={app:BACKUP_APP,v:BACKUP_V,exported:new Date().toISOString(),[LS]:S,[PREFS_LS]:prefs};
  const json=JSON.stringify(payload);
  const name=`lituk-progress-${stamp(new Date())}.json`;

  if(shareIsOnlyWayToSave()){
    let file=null;
    try{file=new File([json],name,{type:'application/json'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'Life in the UK progress'});
        noteBackup();toast('Backup saved');return;
      }catch(e){
        /* Cancelling the sheet is a decision, not a failure — do not then fire a
           save the user did not ask for. Every other error, NotAllowedError
           included, means the sheet never saved anything, so keep going. */
        if(e&&e.name==='AbortError')return;
      }
    }
  }

  if(downloadFile(json,name)){noteBackup();toast('Backup downloaded')}
  else toast('Export failed — allow downloads for this site');
}
/* One input, created on demand — a static one would need a unique id in both
   the settings modal and the stats card. */
function pickImport(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';inp.className='hidden';
  inp.onchange=()=>{importData(inp);inp.remove()};
  document.body.appendChild(inp);inp.click();
}
/* A progress object is recognisable by its own shape, so the wrong file picked
   by mistake gets refused instead of silently wiping everything. */
function looksLikeState(o){
  return !!o&&typeof o==='object'&&!Array.isArray(o)&&
    ['tests','mistakes','sr'].every(k=>o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))&&
    typeof o.answered==='number';
}
function readBackup(raw){
  const j=JSON.parse(raw);
  if(looksLikeState(j))return{state:j,prefs:null};       /* older export: a bare lituk_v1 dump */
  if(j&&j.app===BACKUP_APP&&looksLikeState(j[LS]))
    return{state:j[LS],prefs:j[PREFS_LS]&&typeof j[PREFS_LS]==='object'?j[PREFS_LS]:null,exported:j.exported};
  return null;
}
let pendingRestore=null;
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onerror=()=>toast('Could not read that file');
  r.onload=()=>{
    let b=null;try{b=readBackup(r.result)}catch(e){b=null}
    if(!b){toast("That isn't a Life in the UK backup");return}
    pendingRestore=b;confirmRestore(b);
  };
  r.readAsText(f);
}
function summarise(st){
  const passed=Object.values(st.tests||{}).filter(t=>t.lastPass).length;
  const open=Object.values(st.mistakes||{}).filter(m=>!m.done).length;
  const streak=(st.drill&&st.drill.streak)||0;
  return `${passed} test${passed===1?'':'s'} passed · ${st.answered||0} answered · ${open} open mistake${open===1?'':'s'} · ${streak}-day streak`;
}
function confirmRestore(b){
  const when=b.exported?new Date(b.exported).toLocaleString():'an unknown date';
  const busy=(S.answered||0)>0||Object.keys(S.tests).length>0;
  modal(`<h3 style="margin:0 0 4px">Restore this backup?</h3>
    <p class="sub" style="margin:0 0 14px">Saved ${esc(when)}.</p>
    <div class="lbl">In the file</div><div style="margin-bottom:10px">${esc(summarise(b.state))}</div>
    ${busy?`<div class="lbl">On this device now</div><div style="margin-bottom:10px">${esc(summarise(S))}</div>
      <p class="sub" style="color:var(--bad);font-weight:600">This replaces everything above. It can't be undone — export first if you're not sure.</p>`
     :`<p class="sub">There's no progress on this device yet, so nothing is lost.</p>`}
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="applyRestore()">Restore &amp; reload</button>
      <button class="btn ghost" onclick="pendingRestore=null;closeModal()">Cancel</button>
    </div>`);
}
function applyRestore(){
  const b=pendingRestore;if(!b)return;
  localStorage.setItem(LS,JSON.stringify(b.state));
  if(b.prefs)localStorage.setItem(PREFS_LS,JSON.stringify(b.prefs));
  pendingRestore=null;
  location.reload();      /* reload rather than patch S — nothing stale survives */
}
/* The one user action that also clears the session store — "everything" has to
   mean everything, and leaving half-finished sessions pointing at wiped progress
   would be a stranger outcome than deleting them (INV-13 wants a user action,
   and this is the most explicit one in the app). */
function resetAll(){modal(`<h3 style="margin:0 0 8px">Reset everything?</h3><p class="sub">Deletes all scores, mistakes, stats and unfinished sessions on this device.</p><div class="btn-row"><button class="btn primary" style="background:var(--bad);border-color:var(--bad)" onclick="S=structuredClone(DEFAULT);save();sess=null;stopTimer();sessions={};saveSessions();closeModal();go('dashboard');toast('All progress reset')">Delete all</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}

/* What this drill size actually buys, in days — the only number that matters
   with a fixed exam date. Drills alone; Sweep gets through it faster. */
function settingsCoverageLine(n,left){
  if(!left)return `All ${UNIQUE_N} questions seen at least once.`;
  const fresh=Math.round(n*(MIX[drillMode()]||MIX.coverage).new);
  if(!fresh)return `${left} of ${UNIQUE_N} still never seen — this mode serves no new questions, so use Sweep.`;
  return `${left} of ${UNIQUE_N} still never seen — ${fresh} new per drill, so ${Math.ceil(left/fresh)} days to see the bank once.`;
}
/* What the exam date is actually doing to your schedule. Changing it rewrites
   every due date on the spot — an interval that outlives the exam is dead
   weight, so it gets pulled back rather than left to expire (INV-8). */
function examLine(){
  const left=daysLeft();
  if(left==null)return 'No date set — full spaced-repetition intervals, and the drill stays in coverage mode.';
  if(left<0)return 'That date has passed. Everything is due, every day.';
  const d=srDays();
  return `${left} day${left===1?'':'s'} to go · drill in <b>${drillMode()}</b> mode · reviews spaced ${d.slice(1).join('/')} days, nothing after ${dayKey(lastReviewTs())}.`;
}
function setExamDate(v){
  S.examDate=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';
  clampAllDues();save();openSettings();
}
function setFeedback(v){prefs.feedback=v;savePrefs();openSettings()}
/* Takes effect on the next session you start, like every other setting here —
   sess.recall is fixed when the session is made. */
function setRecall(v){prefs.recall=v;savePrefs();openSettings()}
function closeSettings(){closeModal();if(!document.getElementById('view-dashboard').classList.contains('hidden'))renderDashboard()}
/* The page keeps its scroll position across a modal rather than being sent to
   the top: body.modal-open pins it, and the offset it was pinned at is put back
   on close. See the .modal-open rule for why iOS needs pinning at all. */
let _lockY=0,_locked=false;
function lockScroll(){
  if(_locked)return;
  _lockY=window.scrollY||window.pageYOffset||0;
  document.body.style.top=(-_lockY)+'px';
  document.body.classList.add('modal-open');
  _locked=true;
}
function unlockScroll(){
  if(!_locked)return;
  document.body.classList.remove('modal-open');
  document.body.style.top='';
  _locked=false;
  window.scrollTo(0,_lockY);
}
/* `key` marks a modal that re-renders itself in place — Settings rebuilds on
   every drill size, feedback and exam date change. innerHTML resets scrollTop,
   so without this the panel snapped back to the top the moment you tapped
   anything halfway down it. Only a modal replacing itself keeps its scroll;
   one modal opening a different one still starts at the top. */
function modal(html,key){
  const bg=document.getElementById('modalBg'),box=document.getElementById('modalBox');
  const same=bg.classList.contains('show')&&!!key&&box.dataset.key===key;
  const keep=same?box.scrollTop:0;
  box.innerHTML=html;
  box.dataset.key=key||'';
  bg.classList.add('show');
  lockScroll();
  if(keep)box.scrollTop=keep;
}
function closeModal(){
  const bg=document.getElementById('modalBg');
  bg.classList.remove('show');
  document.getElementById('modalBox').dataset.key='';
  unlockScroll();
}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',e=>{
  if(quizHidden()||!sess)return;
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const it=sess.items[sess.idx];
  if(/^[1-9]$/.test(e.key)){const pos=+e.key-1;if(pos<it.order.length){pick(it.order[pos]);e.preventDefault()}}
  else if(e.key==='Enter'){const b=document.getElementById('mainBtn');if(b&&!b.disabled)b.click();e.preventDefault()}
  else if(e.key==='ArrowRight')nextQ();
  else if(e.key==='ArrowLeft')prevQ();
  else if(e.key.toLowerCase()==='f')toggleFlag(it.q.g);
});

/* ============ HEADER ON SCROLL ============
   Reading down a question hides it; any scroll back up brings it straight
   back, as does every go() (which scrolls to 0) and every toQuestionTop().
   The 6px threshold keeps a thumb resting mid-scroll from flapping it, and it
   never hides in the first 140px, so the top of a page always has its nav. */
(()=>{
  const hd=document.querySelector('header');
  let lastY=0,queued=false;
  addEventListener('scroll',()=>{
    if(queued)return;queued=true;
    requestAnimationFrame(()=>{
      queued=false;
      const y=Math.max(0,window.scrollY),d=y-lastY;
      if(Math.abs(d)<6)return;                 /* below the threshold, remember nothing */
      if(d<0||y<140)hd.classList.remove('hd-away');
      else hd.classList.add('hd-away');
      lastY=y;
    });
  },{passive:true});
})();

/* The "are you sure you want to leave?" guard that used to live here is gone.
   It warned about losing a timed session, and a timed session is now durable —
   close the tab, come back, resume it off the dashboard. A dialog defending
   against a loss that can no longer happen is just a dialog. */

/* ============ DEEP LINKS ============
   #drill · #sweep · #twist · #dates · #examq · #mistakes · #history · #stats · #cram ·
   #test=7 · #q=412 (from the hub's search) */
function showQuestion(g){
  const q=QByG[g];if(!q){toast('Question not found');return}
  const ci=correctIdx(q);
  modal(`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
      <span class="tag" style="margin-left:0">${esc(TOPICS[q.p])} · Test ${q._test}${q._bank?` · ${esc(q._bank.source)}`:''}</span>${examBadge(q)}
    </div>
    ${isExamQ(q)?`<p class="sub" style="margin:0 0 10px;font-size:12px">${esc(EXAM_CLAIM)}.</p>`:''}
    <h3 style="margin:0 0 12px;font-size:17px;line-height:1.4">${esc(q.t)}</h3>
    ${q.o.map((o,i)=>`<div style="padding:5px 0;${ci.includes(i)?'color:var(--good);font-weight:700':'color:var(--muted)'}">${ci.includes(i)?'✓':'·'} ${esc(o[0])}</div>`).join('')}
    <div class="lbl" style="margin-top:12px">Explanation</div><div>${esc(q.e||'—')}</div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="closeModal();startTest(${q._test})">Take Test ${q._test}</button>
      <button class="btn" onclick="closeModal();startTopic(${q.p})">Practise this topic</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>`);
}
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h)return;
  const q=h.match(/^q=(\d+)$/);   if(q){go('dashboard');showQuestion(+q[1]);return}
  const t=h.match(/^test=(\d+)$/);if(t){startTest(+t[1]);return}
  /* Deep links take the tab behaviour, not the button's: a bookmarked launch
     should land you back in the drill you were doing, not open a second one
     beside it (§3.1). */
  if(h==='drill'){drillTab();return}
  if(h==='sweep'){resumeOrStart('sweep',()=>startSweep());return}
  if(h==='twist'){resumeOrStart('twist',()=>startTwist());return}
  if(h==='dates'){resumeOrStart('dates',()=>startDates());return}
  if(h==='examq'){resumeOrStart('examq',()=>startExamQs());return}
  if(h==='mistakes'||h==='history'||h==='stats'||h==='cram')go(h);
}
addEventListener('hashchange',route);

/* ---- The day turning over under an open app ----
   The dashboard is drawn once and then only when something is tapped. An
   installed PWA is not closed at night, it is put down — so a tile drawn at
   half eleven is still on screen the next morning, still saying "done today"
   about yesterday. Redraw when the date moves on, whether the app was away at
   the time or sitting there awake. */
let dashDay=dayKey();
function checkDayRoll(){
  if(dashDay===dayKey())return;
  dashDay=dayKey();
  /* Mid-quiz the dashboard is behind the quiz view; go() redraws it on the way
     back, so there is nothing to do here but note the day. */
  if(!document.getElementById('view-dashboard').classList.contains('hidden'))renderDashboard();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDayRoll()});
setInterval(checkDayRoll,60000);

/* ============ INIT ============ */
migrate();                 /* before anything reads S */
renderDashboard();
route();
</script>
