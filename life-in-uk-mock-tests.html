/* ============ BACKUP / RESTORE ============
   Everything you have is two localStorage keys: lituk_v1 (progress) and
   lituk_prefs (settings). Export writes both into one file; restore validates
   the shape, confirms, writes both back and reloads.
   An untested backup is not a backup — do a real restore at least once. */
const BACKUP_APP='lituk',BACKUP_V=1,PREFS_LS='lituk_prefs';
function stamp(d){const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
/* How stale a backup has to get before the dashboard says so. A permanent
   "last backed up today" line is furniture people stop seeing, so this stays
   silent until there is genuinely something to lose. */
const BACKUP_STALE_DAYS=7;
function backupAge(){
  const at=(S.backup&&S.backup.at)||0;
  return at?Math.floor((Date.now()-at)/DAY):null;      /* null = never */
}
function lastBackupLine(){
  const d=backupAge();
  if(d===null)return 'Never exported.';
  return d===0?'Backed up today.':`Last backup ${d} day${d===1?'':'s'} ago.`;
}
function backupNag(){
  if(!(S.answered>0))return '';                        /* nothing to lose yet */
  const d=backupAge();
  if(d!==null&&d<BACKUP_STALE_DAYS)return '';
  return `<div class="card pad" style="border-color:var(--bad);margin-bottom:14px">
    <b>⚠️ Back up your progress</b>
    <p class="sub" style="margin:4px 0 10px">${esc(lastBackupLine())} It lives only in this browser — deleting the Home Screen icon or clearing website data takes it with it, and there is no undo.</p>
    <div class="btn-row"><button class="btn sm primary" onclick="exportData()">⬇ Export backup</button></div>
  </div>`;
}
/* Records that a backup left the device, for backupNag(). Deliberately not
   called when the share sheet is cancelled: nothing was saved, so claiming
   otherwise would be the one lie this feature cannot afford. */
function noteBackup(){
  S.backup={at:Date.now()};save();
  if(!document.getElementById('view-dashboard').classList.contains('hidden'))renderDashboard();
}
/* Where the share sheet is the ONLY way to save a file, which is iOS and iPadOS
   and nowhere else. Installed on iOS there is no download UI: <a download>
   either opens the JSON in place or does nothing at all, so the backup fails
   silently — worse than no backup, because you believe you have one.
   Desktop is the opposite case, and asking canShare() instead of asking the
   platform is what broke it: Chrome and Edge answer canShare({files}) with
   true, then hand a .json to a sheet with nowhere useful to put it. iPadOS 13+
   reports itself as a Mac, so touch points are what give it away. */
function shareIsOnlyWayToSave(){
  return /iP(hone|od|ad)/.test(navigator.userAgent)||
    (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
/* Returns false rather than throwing, so the caller can say "that failed"
   instead of claiming a backup that never landed. */
function downloadFile(text,name){
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url;a.download=name;a.rel='noopener';a.style.display='none';
    document.body.appendChild(a);a.click();
    /* Both outlive the click by a beat: tearing the anchor or the blob URL down
       in the same tick cancels the save outright in Firefox. */
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1000);
    return true;
  }catch(e){return false}
}
async function exportData(){
  const payload={app:BACKUP_APP,v:BACKUP_V,exported:new Date().toISOString(),[LS]:S,[PREFS_LS]:prefs};
  const json=JSON.stringify(payload);
  const name=`lituk-progress-${stamp(new Date())}.json`;

  if(shareIsOnlyWayToSave()){
    let file=null;
    try{file=new File([json],name,{type:'application/json'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'Life in the UK progress'});
        noteBackup();toast('Backup saved');return;
      }catch(e){
        /* Cancelling the sheet is a decision, not a failure — do not then fire a
           save the user did not ask for. Every other error, NotAllowedError
           included, means the sheet never saved anything, so keep going. */
        if(e&&e.name==='AbortError')return;
      }
    }
  }

  if(downloadFile(json,name)){noteBackup();toast('Backup downloaded')}
  else toast('Export failed — allow downloads for this site');
}
/* One input, created on demand — a static one would need a unique id in both
   the settings modal and the stats card. */
function pickImport(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';inp.className='hidden';
  inp.onchange=()=>{importData(inp);inp.remove()};
  document.body.appendChild(inp);inp.click();
}
/* A progress object is recognisable by its own shape, so the wrong file picked
   by mistake gets refused instead of silently wiping everything. */
function looksLikeState(o){
  return !!o&&typeof o==='object'&&!Array.isArray(o)&&
    ['tests','mistakes','sr'].every(k=>o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))&&
    typeof o.answered==='number';
}
function readBackup(raw){
  const j=JSON.parse(raw);
  if(looksLikeState(j))return{state:j,prefs:null};       /* older export: a bare lituk_v1 dump */
  if(j&&j.app===BACKUP_APP&&looksLikeState(j[LS]))
    return{state:j[LS],prefs:j[PREFS_LS]&&typeof j[PREFS_LS]==='object'?j[PREFS_LS]:null,exported:j.exported};
  return null;
}
let pendingRestore=null;
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onerror=()=>toast('Could not read that file');
  r.onload=()=>{
    let b=null;try{b=readBackup(r.result)}catch(e){b=null}
    if(!b){toast("That isn't a Life in the UK backup");return}
    pendingRestore=b;confirmRestore(b);
  };
  r.readAsText(f);
}
function summarise(st){
  const passed=Object.values(st.tests||{}).filter(t=>t.lastPass).length;
  const open=Object.values(st.mistakes||{}).filter(m=>!m.done).length;
  const streak=(st.drill&&st.drill.streak)||0;
  return `${passed} test${passed===1?'':'s'} passed · ${st.answered||0} answered · ${open} open mistake${open===1?'':'s'} · ${streak}-day streak`;
}
function confirmRestore(b){
  const when=b.exported?new Date(b.exported).toLocaleString():'an unknown date';
  const busy=(S.answered||0)>0||Object.keys(S.tests).length>0;
  modal(`<h3 style="margin:0 0 4px">Restore this backup?</h3>
    <p class="sub" style="margin:0 0 14px">Saved ${esc(when)}.</p>
    <div class="lbl">In the file</div><div style="margin-bottom:10px">${esc(summarise(b.state))}</div>
    ${busy?`<div class="lbl">On this device now</div><div style="margin-bottom:10px">${esc(summarise(S))}</div>
      <p class="sub" style="color:var(--bad);font-weight:600">This replaces everything above. It can't be undone — export first if you're not sure.</p>`
     :`<p class="sub">There's no progress on this device yet, so nothing is lost.</p>`}
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="applyRestore()">Restore &amp; reload</button>
      <button class="btn ghost" onclick="pendingRestore=null;closeModal()">Cancel</button>
    </div>`);
}
function applyRestore(){
  const b=pendingRestore;if(!b)return;
  localStorage.setItem(LS,JSON.stringify(b.state));
  if(b.prefs)localStorage.setItem(PREFS_LS,JSON.stringify(b.prefs));
  pendingRestore=null;
  location.reload();      /* reload rather than patch S — nothing stale survives */
}
/* The one user action that also clears the session store — "everything" has to
   mean everything, and leaving half-finished sessions pointing at wiped progress
   would be a stranger outcome than deleting them (INV-13 wants a user action,
   and this is the most explicit one in the app). */
function resetAll(){modal(`<h3 style="margin:0 0 8px">Reset everything?</h3><p class="sub">Deletes all scores, mistakes, stats and unfinished sessions on this device.</p><div class="btn-row"><button class="btn primary" style="background:var(--bad);border-color:var(--bad)" onclick="S=structuredClone(DEFAULT);save();sess=null;stopTimer();sessions={};saveSessions();closeModal();go('dashboard');toast('All progress reset')">Delete all</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}

/* ============ TOPIC PICKER / MODAL ============ */
function topicPicker(){
  modal(`<h3 style="margin:0 0 4px">Practice by topic</h3><p class="sub" style="margin:0 0 14px">Up to 24 random questions, with instant feedback.</p>
    <div class="grid" style="gap:8px">
    ${TOPICS.map((n,i)=>{const c=ALLQ.filter(q=>q.p===i).length;return `<button class="btn ghost" style="text-align:left;justify-content:flex-start" onclick="closeModal();startTopic(${i})">${esc(n)} <span class="tag">${c} Qs</span></button>`}).join('')}
    </div>`);
}
function openSettings(){
  const fb=prefs.feedback,n=drillSize();
  const seen=srSeen(),left=UNIQUE_N-seen;
  modal(`<h3 style="margin:0 0 4px">Settings</h3><p class="sub" style="margin:0 0 14px">Applies to every test and practice you start next.</p>
    <div class="lbl">Questions per drill</div>
    <div class="btn-row" style="margin:6px 0 6px">
      ${DRILL_SIZES.map(v=>`<button class="btn sm ${n===v?'primary':'ghost'}" onclick="setDailyTarget(${v})">${v}</button>`).join('')}
      ${DRILL_SIZES.includes(n)?'':`<button class="btn sm primary">${n}</button>`}
    </div>
    <p class="sub" style="margin:0 0 16px;font-size:12.5px">${settingsCoverageLine(n,left)}</p>
    <div class="lbl">Exam date</div>
    <input type="date" value="${esc(S.examDate||'')}" onchange="setExamDate(this.value)" style="width:100%;margin:6px 0 6px">
    <p class="sub" style="margin:0 0 16px;font-size:12.5px">${examLine()}</p>
    <div class="lbl">When do you see the answer?</div>
    <p class="sub" style="margin:2px 0 0;font-size:12.5px">Applies to everything, timed tests included. A test whose best score was set with feedback on is labelled "answers shown" on its tile.</p>
    <div class="grid" style="gap:8px;margin:6px 0 16px">
      <button class="btn ghost setopt ${fb==='instant'?'on':''}" onclick="setFeedback('instant')">
        <b>✅ Right after each question</b>
        <div style="color:var(--muted);font-size:12.5px;font-weight:500">Marks correct/incorrect and shows the explanation the moment you answer. Best for learning.</div></button>
      <button class="btn ghost setopt ${fb==='end'?'on':''}" onclick="setFeedback('end')">
        <b>🏁 Only at the end</b>
        <div style="color:var(--muted);font-size:12.5px;font-weight:500">No hints while you work — real exam feel. Every answer &amp; explanation shows on the results screen.</div></button>
    </div>
    <div class="lbl">Randomise</div>
    <label style="display:flex;gap:10px;align-items:center;padding:9px 0 2px;cursor:pointer;font-weight:600"><input type="checkbox" ${prefs.shufQ?'checked':''} onchange="prefs.shufQ=this.checked;savePrefs()"> Shuffle question order</label>
    <label style="display:flex;gap:10px;align-items:center;padding:2px 0 4px;cursor:pointer;font-weight:600"><input type="checkbox" ${prefs.shufO?'checked':''} onchange="prefs.shufO=this.checked;savePrefs()"> Shuffle answer options</label>
    <p class="sub" style="margin:6px 0 0;font-size:12.5px">Drills, Sweep and the two gauntlets group related questions together instead — the same date or the same Act, back to back. That is deliberate: a twisted statement is easy on its own and hard next to three of its neighbours.</p>
    <div class="lbl" style="margin-top:18px">Your progress</div>
    <p class="sub" style="margin:4px 0 4px"><b>${esc(lastBackupLine())}</b></p>
    <p class="sub" style="margin:0 0 10px">Saved in this browser only. Export before you change phone or clear browser data — and try a restore once, so you know it works.</p>
    <div class="btn-row">
      <button class="btn sm" onclick="exportData()">⬇ Export backup</button>
      <button class="btn sm" onclick="pickImport()">⬆ Restore…</button>
    </div>
    <div class="btn-row" style="margin-top:18px"><button class="btn primary" onclick="closeSettings()">Done</button></div>`,'settings');
}
/* What this drill size actually buys, in days — the only number that matters
   with a fixed exam date. Drills alone; Sweep gets through it faster. */
function settingsCoverageLine(n,left){
  if(!left)return `All ${UNIQUE_N} questions seen at least once.`;
  const fresh=Math.round(n*(MIX[drillMode()]||MIX.coverage).new);
  if(!fresh)return `${left} of ${UNIQUE_N} still never seen — this mode serves no new questions, so use Sweep.`;
  return `${left} of ${UNIQUE_N} still never seen — ${fresh} new per drill, so ${Math.ceil(left/fresh)} days to see the bank once.`;
}
/* What the exam date is actually doing to your schedule. Changing it rewrites
   every due date on the spot — an interval that outlives the exam is dead
   weight, so it gets pulled back rather than left to expire (INV-8). */
function examLine(){
  const left=daysLeft();
  if(left==null)return 'No date set — full spaced-repetition intervals, and the drill stays in coverage mode.';
  if(left<0)return 'That date has passed. Everything is due, every day.';
  const d=srDays();
  return `${left} day${left===1?'':'s'} to go · drill in <b>${drillMode()}</b> mode · reviews spaced ${d.slice(1).join('/')} days, nothing after ${dayKey(lastReviewTs())}.`;
}
function setExamDate(v){
  S.examDate=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';
  clampAllDues();save();openSettings();
}
function setFeedback(v){prefs.feedback=v;savePrefs();openSettings()}
function closeSettings(){closeModal();if(!document.getElementById('view-dashboard').classList.contains('hidden'))renderDashboard()}
/* The page keeps its scroll position across a modal rather than being sent to
   the top: body.modal-open pins it, and the offset it was pinned at is put back
   on close. See the .modal-open rule for why iOS needs pinning at all. */
let _lockY=0,_locked=false;
function lockScroll(){
  if(_locked)return;
  _lockY=window.scrollY||window.pageYOffset||0;
  document.body.style.top=(-_lockY)+'px';
  document.body.classList.add('modal-open');
  _locked=true;
}
function unlockScroll(){
  if(!_locked)return;
  document.body.classList.remove('modal-open');
  document.body.style.top='';
  _locked=false;
  window.scrollTo(0,_lockY);
}
/* `key` marks a modal that re-renders itself in place — Settings rebuilds on
   every drill size, feedback and exam date change. innerHTML resets scrollTop,
   so without this the panel snapped back to the top the moment you tapped
   anything halfway down it. Only a modal replacing itself keeps its scroll;
   one modal opening a different one still starts at the top. */
function modal(html,key){
  const bg=document.getElementById('modalBg'),box=document.getElementById('modalBox');
  const same=bg.classList.contains('show')&&!!key&&box.dataset.key===key;
  const keep=same?box.scrollTop:0;
  box.innerHTML=html;
  box.dataset.key=key||'';
  bg.classList.add('show');
  lockScroll();
  if(keep)box.scrollTop=keep;
}
function closeModal(){
  const bg=document.getElementById('modalBg');
  bg.classList.remove('show');
  document.getElementById('modalBox').dataset.key='';
  unlockScroll();
}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',e=>{
  if(quizHidden()||!sess)return;
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const it=sess.items[sess.idx];
  if(/^[1-9]$/.test(e.key)){const pos=+e.key-1;if(pos<it.order.length){pick(it.order[pos]);e.preventDefault()}}
  else if(e.key==='Enter'){const b=document.getElementById('mainBtn');if(b&&!b.disabled)b.click();e.preventDefault()}
  else if(e.key==='ArrowRight')nextQ();
  else if(e.key==='ArrowLeft')prevQ();
  else if(e.key.toLowerCase()==='f')toggleFlag(it.q.g);
});

/* ============ HEADER ON SCROLL ============
   Reading down a question hides it; any scroll back up brings it straight
   back, as does every go() (which scrolls to 0) and every toQuestionTop().
   The 6px threshold keeps a thumb resting mid-scroll from flapping it, and it
   never hides in the first 140px, so the top of a page always has its nav. */
(()=>{
  const hd=document.querySelector('header');
  let lastY=0,queued=false;
  addEventListener('scroll',()=>{
    if(queued)return;queued=true;
    requestAnimationFrame(()=>{
      queued=false;
      const y=Math.max(0,window.scrollY),d=y-lastY;
      if(Math.abs(d)<6)return;                 /* below the threshold, remember nothing */
      if(d<0||y<140)hd.classList.remove('hd-away');
      else hd.classList.add('hd-away');
      lastY=y;
    });
  },{passive:true});
})();

/* The "are you sure you want to leave?" guard that used to live here is gone.
   It warned about losing a timed session, and a timed session is now durable —
   close the tab, come back, resume it off the dashboard. A dialog defending
   against a loss that can no longer happen is just a dialog. */

/* ============ DEEP LINKS ============
   #drill · #sweep · #twist · #dates · #examq · #mistakes · #stats · #cram ·
   #test=7 · #q=412 (from the hub's search) */
function showQuestion(g){
  const q=QByG[g];if(!q){toast('Question not found');return}
  const ci=correctIdx(q);
  modal(`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
      <span class="tag" style="margin-left:0">${esc(TOPICS[q.p])} · Test ${q._test}${q._bank?` · ${esc(q._bank.source)}`:''}</span>${examBadge(q)}
    </div>
    ${isExamQ(q)?`<p class="sub" style="margin:0 0 10px;font-size:12px">${esc(EXAM_CLAIM)}.</p>`:''}
    <h3 style="margin:0 0 12px;font-size:17px;line-height:1.4">${esc(q.t)}</h3>
    ${q.o.map((o,i)=>`<div style="padding:5px 0;${ci.includes(i)?'color:var(--good);font-weight:700':'color:var(--muted)'}">${ci.includes(i)?'✓':'·'} ${esc(o[0])}</div>`).join('')}
    <div class="lbl" style="margin-top:12px">Explanation</div><div>${esc(q.e||'—')}</div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="closeModal();startTest(${q._test})">Take Test ${q._test}</button>
      <button class="btn" onclick="closeModal();startTopic(${q.p})">Practise this topic</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>`);
}
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h)return;
  const q=h.match(/^q=(\d+)$/);   if(q){go('dashboard');showQuestion(+q[1]);return}
  const t=h.match(/^test=(\d+)$/);if(t){startTest(+t[1]);return}
  /* Deep links take the tab behaviour, not the button's: a bookmarked launch
     should land you back in the drill you were doing, not open a second one
     beside it (§3.1). */
  if(h==='drill'){drillTab();return}
  if(h==='sweep'){resumeOrStart('sweep',()=>startSweep());return}
  if(h==='twist'){resumeOrStart('twist',()=>startTwist());return}
  if(h==='dates'){resumeOrStart('dates',()=>startDates());return}
  if(h==='examq'){resumeOrStart('examq',()=>startExamQs());return}
  if(h==='mistakes'||h==='stats'||h==='cram')go(h);
}
addEventListener('hashchange',route);

/* ============ INIT ============ */
migrate();                 /* before anything reads S */
renderDashboard();
route();
</script>
