<!-- /lituk:shared -->
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f7f9fc; --ink:#111827; --muted:#5b6472;
  --line:#e5e9f0; --brand:#1e5eff; --brand-ink:#ffffff; --good:#12965a; --good-bg:#e5f6ee;
  --bad:#d63b46; --bad-bg:#fdeaec; --warn:#b8860b; --chip:#eef2f9; --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --ring:#1e5eff33; --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b22; --panel-2:#1b212b; --ink:#e6edf3; --muted:#9aa4b2;
  --line:#262d38; --brand:#4d82ff; --brand-ink:#ffffff; --good:#39d98a; --good-bg:#0f2a20;
  --bad:#ff6b74; --bad-bg:#2b1417; --warn:#e0b341; --chip:#212836; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --ring:#4d82ff44;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  /* Nothing here is meant to scroll sideways — without this a single wide child
     drags the whole page off-centre every time you tap. */
  overflow-x:hidden}
button,.opt,.dot,summary,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--brand);text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
/* Header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.brand .flag{flex:none;font-size:22px}
/* The title stays on one line and ellipsises — it must never wrap to "Life / in / the / UK". */
.brand .name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.hubLink{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-weight:700;text-decoration:none}
.hubLink:hover{border-color:var(--brand);color:var(--brand)}
.spacer{flex:1}
.icon-btn{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--brand)}
.nav{display:flex;flex:none;gap:4px}
.nav button{border:none;background:transparent;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap}
.nav button:hover{background:var(--chip);color:var(--ink)}
.nav button.on{background:var(--brand);color:var(--brand-ink)}
/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
h1{font-size:22px;letter-spacing:-.02em;margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:12px}
.stat-row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{padding:14px 16px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .n.good{color:var(--good)} .stat .n.bad{color:var(--bad)} .stat .n.brand{color:var(--brand)}
/* Buttons */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;padding:11px 16px;border-radius:11px;cursor:pointer;font-size:14px;transition:.12s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
/* Actions */
.actions{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:16px 0}
/* Daily drill hero */
.drill{display:flex;gap:16px;align-items:center;padding:18px;margin:18px 0;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel));
  border:1px solid color-mix(in srgb,var(--brand) 32%,var(--line))}
.drill .emo{font-size:32px;flex:0 0 auto;line-height:1}
.drill .body{flex:1;min-width:0}
.drill .t{font-weight:800;font-size:16px;letter-spacing:-.01em}
.drill .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.drill .streak{flex:0 0 auto;text-align:center;padding-left:14px;border-left:1px solid var(--line)}
.drill .streak b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.drill .streak span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){
  .drill{flex-wrap:wrap;gap:12px}
  .drill .streak{padding-left:0;border-left:0;text-align:left}
  .drill .go{width:100%}
}
.act{display:flex;gap:12px;align-items:center;text-align:left;padding:16px}
.act .emo{font-size:24px}
.act .t{font-weight:700}
.act .d{color:var(--muted);font-size:12.5px}
/* Test grid */
.bankhd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:22px 0 10px}
.bankhd:first-of-type{margin-top:0}
.bankhd b{font-size:15px}
.bankhd .src{margin-left:auto;color:var(--muted);font-size:12px}
.bankhd .src a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.bankhd .src a:hover{color:var(--brand)}
.tests{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tcard{padding:14px;cursor:pointer;position:relative;transition:.12s;display:flex;flex-direction:column;gap:8px}
.tcard:hover{border-color:var(--brand);transform:translateY(-2px)}
.tcard .tt{font-weight:800;font-size:15px}
.tcard .meta{color:var(--muted);font-size:12px}
.badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
.badge.pass{background:var(--good-bg);color:var(--good)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.none{background:var(--chip);color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar.good > i{background:var(--good)} .bar.bad > i{background:var(--bad)}
/* Quiz */
.qtop{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.qtop .prog{flex:1;min-width:160px}
.chip{background:var(--chip);color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;border-radius:20px;white-space:nowrap}
.chip.topic{background:transparent;border:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.warn{color:var(--bad)}
.qtext{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.4;margin:6px 0 4px}
.hint{color:var(--muted);font-size:13px;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel-2);transition:.1s;user-select:none}
.opt:hover{border-color:var(--brand)}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;color:transparent;margin-top:1px}
.opt.multi .mark{border-radius:6px}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--panel-2))}
.opt.sel .mark{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .mark{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.locked{cursor:default}
.setopt{text-align:left;padding:12px 14px}
.setopt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--panel))}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px}
.opt .otext{flex:1}
.explain{margin-top:14px;padding:14px 15px;border-radius:12px;border-left:4px solid var(--brand);background:var(--panel-2);display:none}
.explain.show{display:block;animation:fade .2s}
.explain .verdict{font-weight:800;margin-bottom:4px}
.explain .verdict.good{color:var(--good)} .explain .verdict.bad{color:var(--bad)}
.explain .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.qnav{display:flex;gap:10px;margin-top:18px;align-items:center}
.qnav .spacer{flex:1}
.flagbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.flagbtn.on{color:var(--warn);border-color:var(--warn)}
/* Dot navigator */
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.dot.cur{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 2px var(--ring)}
.dot.ans{background:var(--chip);color:var(--ink)}
.dot.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.dot.flag{border-color:var(--warn)}
/* Results ring */
.result-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--chip) 0)}
.ring .inner{width:104px;height:104px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:30px;font-weight:800;line-height:1}
.ring .sc{font-size:12px;color:var(--muted);font-weight:700}
.verdict-big{font-size:24px;font-weight:800}
.verdict-big.good{color:var(--good)} .verdict-big.bad{color:var(--bad)}
/* Review list */
.rev{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.rev summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.rev .ic.ok{background:var(--good)} .rev .ic.no{background:var(--bad)}
.rev .body{padding:0 14px 14px 46px;border-top:1px solid var(--line)}
.rev[open] summary{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted);margin-left:auto}
/* In a review row the topic name sits beside the question, so it stays on one
   line and gives the question the space — a wrapped tag squeezed it to a sliver. */
.rev summary .tag{flex:none;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Topic bars */
.tbar{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;margin:10px 0}
.tbar .tn{font-weight:600;font-size:13.5px}
.tbar .track{height:9px;border-radius:9px;background:var(--chip);overflow:hidden;grid-column:1/-1}
.tbar .track > i{display:block;height:100%;border-radius:9px}
.tbar .pctl{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.55);display:none;place-items:center;z-index:60;padding:16px}
.modal-bg.show{display:grid}
.modal{max-width:420px;width:100%;animation:pop .16s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .e{font-size:40px}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;font-family:inherit}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:70;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
select,input[type=text]{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
/* Below this the brand + 4 nav tabs + 2 icon buttons no longer fit on one line,
   so the nav wraps to a second row of its own instead of shoving the page sideways. */
@media(max-width:700px){
  .hd{gap:8px;padding:10px 12px 8px}
  .nav{order:5;flex:1 0 100%;gap:2px;margin-top:2px}
  .nav button{flex:1 1 0;padding:8px 6px;font-size:13px}
  .hubLink,.icon-btn{width:34px;height:34px;font-size:15px}
}
@media(max-width:560px){
  h1{font-size:20px}
  .qtext{font-size:17px}
  /* Truncated to "A modern, thri…" it says nothing — give the question the row. */
  .rev summary .tag{display:none}
}
@media(max-width:400px){
  .brand small{display:none}
}
</style>

<div class="wrap">

    Pass mark: <b>18 / 24 (75%)</b> · Study aid built for personal practice from questions on
    <a href="https://britizen.uk" target="_blank" rel="noopener noreferrer">britizen.uk</a> and
    <a href="https://lifeintheuktest.com/practice-tests/" target="_blank" rel="noopener noreferrer">lifeintheuktest.com</a>.
  </div>

<div class="modal-bg" id="modalBg"><div class="modal card pad" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<!-- Question banks, in order, before the engine that reads them. -->
<script src="mock-data.js"></script>
<script src="practice-data.js"></script>
<script>
/* ============ STATE ============ */
const LS='lituk_v1';
const DEFAULT={tests:{},topics:{},mistakes:{},flags:{},answered:0,correct:0,attempts:0,passes:0,history:[],
  sr:{},                                   /* g -> {box,due,seen,last} spaced repetition */
  drill:{last:null,streak:0,best:0},       /* daily drill streak */
  mig:{}};                                 /* one-time migrations already applied */
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(LS));return Object.assign(structuredClone(DEFAULT),r||{})}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(LS,JSON.stringify(S))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ BANKS ============
   Each data file registers itself on window.LITUK_BANKS before this script
   runs. All banks share one question-id space and one test-number space:
   saved progress is keyed on both, so a collision would quietly reattach your
   spaced-repetition history to somebody else's question. tools/validate-banks.mjs
   is what stops that happening; the shape check here is the last line of
   defence against a service worker serving a stale or half-written data file. */
const TOPICS=['A modern, thriving society','A long and illustrious history',
  'The UK government, the law and your role','The Values and principles of the UK','What is the UK?'];
const DEFAULT_PASSMARK=18;

function bankOk(b){
  const ok=b&&Array.isArray(b.tests)&&b.tests.length&&
    b.tests.every(t=>typeof t.n==='number'&&Array.isArray(t.q)&&t.q.length&&
      t.q.every(q=>typeof q.g==='number'&&typeof q.t==='string'&&Array.isArray(q.o)));
  if(!ok)console.error('LITUK: ignoring a malformed question bank',b&&b.id);
  return !!ok;
}
const BANKS=(window.LITUK_BANKS||[]).filter(bankOk);
const TESTS=BANKS.flatMap(b=>b.tests.map(t=>Object.assign(t,{_bank:b})));
if(!TESTS.length)console.error('LITUK: no question banks loaded — check the data <script> tags');

/* Build flat question index by global id */
const QByG={};
TESTS.forEach(t=>t.q.forEach(q=>{QByG[q.g]=q;q._test=t.n;q._bank=t._bank}));
const ALLQ=Object.values(QByG);
const PASSMARK=BANKS.length?BANKS[0].passmark:DEFAULT_PASSMARK;
if(BANKS.some(b=>b.passmark!==PASSMARK))console.error('LITUK: banks disagree on passmark');

/* ============ DUPLICATE COLLAPSE (INV-6) ============
   32 of the 1,890 ids are the same question twice — "Who built the Tower of
   London?" is both 118 and 984. Left alone each copy keeps its own spaced
   repetition, so answering 118 today leaves 984 "never seen": coverage can
   never reach 100% and the same fact is drilled twice.

   The key is the stem PLUS the normalised option set, never the stem alone.
   141 questions ask "Which of these statements is correct?" and differ only in
   their two options; keying on the stem would merge 140 distinct discrimination
   questions into one and delete the best twist-training material in the bank.
   Punctuation is stripped because two of the 32 pairs differ only by a missing
   apostrophe or full stop.

   Question ids never change (INV-2) — only which id holds the shared state. */
const UNIQUE_EXPECT=1858;
const dupNorm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const dupKey=q=>dupNorm(q.t)+' '+q.o.map(o=>dupNorm(o[0])).sort().join('');
const CANON={};                            /* every g -> the id that owns its state */
(function(){
  const firstWithKey={};
  for(const q of ALLQ.slice().sort((a,b)=>a.g-b.g)){       /* lowest id wins, stably */
    const k=dupKey(q);
    if(firstWithKey[k]===undefined)firstWithKey[k]=q.g;
    CANON[q.g]=firstWithKey[k];
  }
  const n=Object.keys(firstWithKey).length;
  if(n!==UNIQUE_EXPECT)console.error(`LITUK: dedup found ${n} unique questions, expected ${UNIQUE_EXPECT} — do not trust coverage until tools/validate-banks.mjs agrees`);
})();
const canon=g=>CANON[g]!==undefined?CANON[g]:+g;   /* unknown (stale) ids pass through */
/* One question per piece of content: what every drill draws from, and the
   denominator for coverage. */
const POOL=ALLQ.filter(q=>CANON[q.g]===q.g);
const UNIQUE_N=POOL.length;

document.getElementById('brandSub').textContent=`${TESTS.length} Tests · ${UNIQUE_N} Questions`;

/* ============ MIGRATIONS ============
   Run once, at load, before anything reads S. Each one must be safe to run
   against state it has already migrated — a restored backup arrives here
   again. */
function migrate(){
  if(mergeDuplicateState())save();
}
/* State that landed on a redundant id moves to the id that now owns it,
   taking the WORSE of the two records: a mistake anywhere is a mistake, and
   the earlier due date is the safer one. Idempotent — once merged there are
   no redundant keys left to find. */
function mergeDuplicateState(){
  let moved=0;
  const worseSr=(a,b)=>({box:Math.min(a.box||0,b.box||0),
    due:Math.min(a.due||0,b.due||0),
    seen:(a.seen||0)+(b.seen||0),
    last:Math.max(a.last||0,b.last||0)});
  const worseMistake=(a,b)=>({count:(a.count||0)+(b.count||0),
    streak:Math.min(a.streak||0,b.streak||0),
    done:!!(a.done&&b.done)});
  for(const k of Object.keys(S.sr)){
    const c=canon(k);if(c===+k)continue;
    S.sr[c]=S.sr[c]?worseSr(S.sr[k],S.sr[c]):S.sr[k];
    delete S.sr[k];moved++;
  }
  for(const k of Object.keys(S.mistakes)){
    const c=canon(k);if(c===+k)continue;
    S.mistakes[c]=S.mistakes[c]?worseMistake(S.mistakes[k],S.mistakes[c]):S.mistakes[k];
    delete S.mistakes[k];moved++;
  }
  for(const k of Object.keys(S.flags)){
    const c=canon(k);if(c===+k)continue;
    S.flags[c]=1;delete S.flags[k];moved++;
  }
  return moved;
}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const correctIdx=q=>q.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);
const eqSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));

      <button class="card act" onclick="startExam()"><span class="emo">🎲</span><div><div class="t">Random exam</div><div class="d">24 mixed questions, timed</div></div></button>

/* ============ PREFS ============
   dailyTarget is the drill size. 60 by default: 1,858 questions and a
   four-week sprint means 60 a day is the floor for seeing the bank once with
   room for a second pass. 20 was a habit-builder, not a study plan. */
const DRILL_MIN=5,DRILL_MAX=200,DRILL_DEFAULT=60,DRILL_SIZES=[20,40,60,100];
let prefs=Object.assign({shufQ:true,shufO:true,feedback:'instant',dailyTarget:DRILL_DEFAULT},JSON.parse(localStorage.getItem('lituk_prefs')||'{}'));
function savePrefs(){localStorage.setItem('lituk_prefs',JSON.stringify(prefs))}
function drillSize(){const n=Math.round(+prefs.dailyTarget||DRILL_DEFAULT);
  return Math.max(DRILL_MIN,Math.min(DRILL_MAX,n))}
function setDailyTarget(n){prefs.dailyTarget=n;savePrefs();openSettings()}

/* ============ SESSION ============ */
let sess=null;
/* `instant` overrides the feedback pref for modes that only make sense one way
   (Sweep). Everything else — timed tests included — follows the pref: when you
   see the answer is your decision, not the app's. What the app does owe you is
   an honest label, so a `best` set with the answers on screen says so on the
   tile (see testTile). */
function makeSession(qs,{title,timed,testN=null,source='custom',instant=null}){
  let list=qs.slice();
  if(prefs.shufQ && source!=='mistakes')list=shuffle(list);
  if(instant==null)instant=prefs.feedback==='instant';
  sess={instant,title,timed,testN,source,idx:0,
    items:list.map(q=>{
      let order=q.o.map((_,i)=>i);
      if(prefs.shufO)order=shuffle(order);
      return {q,order,picked:[],checked:false};
    }),
    startTs:Date.now(),endTs:null,remain:timed?45*60:null};
  if(timed)startTimer();
  go('quiz');renderQuiz();
}
function startTest(n){const t=TESTS.find(x=>x.n===n);if(!t){toast('That test no longer exists');return}makeSession(t.q,{title:`Test ${n}`,timed:true,testN:n,source:'test'})}
function startExam(){makeSession(shuffle(POOL).slice(0,24),{title:'Random exam',timed:true,source:'random'})}
function practiceMistakes(){
  const ids=Object.entries(S.mistakes).filter(([g,m])=>!m.done).map(([g])=>QByG[g]).filter(Boolean);
  if(!ids.length){toast('No mistakes to review 🎉');return}
  makeSession(ids,{title:'Mistake practice',timed:false,source:'mistakes'});
}
function startTopic(tp){const qs=POOL.filter(q=>q.p===tp);makeSession(shuffle(qs).slice(0,24),{title:TOPICS[tp],timed:false,source:'topic'})}

/* ============ DAILY DRILL ============
   prefs.dailyTarget questions, mixed by an explicit ratio: what spaced
   repetition says is due, your open mistakes, and questions you have never
   seen.

   The old mix gave 4 of its 20 slots to unseen questions — 100 questions
   before exam day, 5% of the bank, with the other 16 slots recycling material
   already known. Coverage first: while there is bank left to see, 60% of every
   drill goes to questions you have never met. */
const MIX={coverage:   {due:.20,mistake:.20,new:.60},
           consolidate:{due:.35,mistake:.35,new:.30},
           final:      {due:.50,mistake:.50,new:.00}};
/* Phase 2 adds the exam-date setting and with it the switch to consolidate at
   14 days out and final at 6. Until that field exists the sprint is in its
   coverage weeks. */
function drillMode(){
  if(!S.examDate)return 'coverage';
  const left=Math.ceil((new Date(S.examDate+'T00:00:00').getTime()-Date.now())/DAY);
  return left<=6?'final':left<=14?'consolidate':'coverage';
}
function weakestTopics(){
  return TOPICS.map((n,i)=>{const s=S.topics[i]||{seen:0,correct:0};
    return{i,pct:s.seen?s.correct/s.seen:0,seen:s.seen}})
    .sort((a,b)=>(a.seen?a.pct:2)-(b.seen?b.pct:2)).map(t=>t.i);
}
/* Never-answered questions, weakest topic first. POOL, not ALLQ: a question
   whose duplicate you have already answered is not unseen. */
function unseenQuestions(){
  const byTopic={};
  for(const q of POOL)if(!S.sr[q.g])(byTopic[q.p]||(byTopic[q.p]=[])).push(q);
  return weakestTopics().flatMap(tp=>shuffle(byTopic[tp]||[]));
}
function drillPlan(){
  const now=Date.now(),N=drillSize(),mix=MIX[drillMode()]||MIX.coverage;
  const picked=[],taken=new Set();
  const add=(g,why)=>{g=canon(+g);
    if(taken.has(g)||!QByG[g]||picked.length>=N)return false;
    taken.add(g);picked.push({q:QByG[g],why});return true};
  /* Take up to `quota` from this list. add() caps the total at N, so a quota
     of N means "as many as still fit". */
  const fill=(list,why,quota)=>{let n=0;for(const g of list){if(n>=quota)break;if(add(g,why))n++}};

  const due=srDue(now);
  const mistakes=Object.entries(S.mistakes).filter(([,m])=>!m.done)
    .sort((a,b)=>(b[1].count||0)-(a[1].count||0)).map(([g])=>+g);
  const unseen=mix.new>0?unseenQuestions().map(q=>q.g):[];

  fill(due,'due',Math.round(N*mix.due));
  fill(mistakes,'mistake',Math.round(N*mix.mistake));
  fill(unseen,'new',N);                      /* new takes its share plus every slot the other two left */
  /* Still short? A thin category's slack goes to whatever is left, in order of
     what it costs you to skip. `final` mode allows no new questions at all, so
     it can legitimately come in under target. */
  fill(due,'due',N);
  fill(mistakes,'mistake',N);
  if(mix.new>0)fill(shuffle(POOL).map(q=>q.g),'new',N);   /* nothing unseen left → anything */
  return picked;
}
function dayKey(d){d=d?new Date(d):new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function drillDoneToday(){return S.drill&&S.drill.last===dayKey()}
function startDrill(){
  const plan=drillPlan();
  if(!plan.length){toast('Nothing to drill yet');return}
  makeSession(plan.map(p=>p.q),{title:'Daily drill',timed:false,source:'drill'});
}
/* ---- Sweep: first contact with the bank ----
   Nothing but questions you have never seen, untimed, answer shown after each
   one. No due cards, no mistakes, no ratios — this is the mode the coverage
   weeks are actually spent in, and the only job is to meet all 1,858 once.
   A question leaves the pool the moment it is answered, so batches never
   repeat until there is nothing unseen left. */
const SWEEP_N=50;
function startSweep(n){
  const size=Math.max(1,Math.min(DRILL_MAX,Math.round(+n||SWEEP_N)));
  const qs=unseenQuestions().slice(0,size);
  if(!qs.length){toast('Every question has been seen at least once 🎉');return}
  makeSession(qs,{title:`Sweep — ${qs.length} unseen`,timed:false,instant:true,source:'sweep'});
}
function noteDrillDone(){
  const t=dayKey(),y=dayKey(Date.now()-DAY);
  if(!S.drill)S.drill={last:null,streak:0,best:0};
  if(S.drill.last===t)return;
  S.drill.streak=S.drill.last===y?(S.drill.streak||0)+1:1;
  S.drill.last=t;
  S.drill.best=Math.max(S.drill.best||0,S.drill.streak);
}

/* ============ TIMER ============ */
let timerInt=null;
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{
  if(!sess||!sess.timed)return;
  sess.remain--;
  const t=document.getElementById('timer');
  if(t){t.textContent=fmt(sess.remain);t.classList.toggle('warn',sess.remain<=60)}
  if(sess.remain<=0){clearInterval(timerInt);toast("Time's up!");finishQuiz()}
},1000)}
function fmt(s){s=Math.max(0,s);return`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

/* ============ QUIZ RENDER ============ */
function renderQuiz(){
  const it=sess.items[sess.idx],q=it.q,ci=correctIdx(q),multi=ci.length>1;
  const answeredCount=sess.items.filter(x=>x.picked.length).length;
  const el=document.getElementById('view-quiz');
  el.innerHTML=`
    <div class="qtop">
      <span class="chip">${sess.title}</span>
      <span class="chip">Q ${sess.idx+1} / ${sess.items.length}</span>
      <div class="prog"><div class="bar"><i style="width:${(sess.idx+1)/sess.items.length*100}%"></i></div></div>
      ${sess.timed?`<span class="chip timer" id="timer">${fmt(sess.remain)}</span>`:''}
      <button class="flagbtn ${flagged(q.g)?'on':''}" id="flagBtn" onclick="toggleFlag(${q.g})">${flagged(q.g)?'★ Flagged':'☆ Flag'}</button>
    </div>
    <div class="card pad">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <span class="chip topic">${esc(TOPICS[q.p])}</span>
        ${multi?`<span class="chip" style="color:var(--warn)">Select ${ci.length}</span>`:''}
      </div>
      <div class="qtext">${esc(q.t)}</div>
      <div class="hint">${multi?`This question needs <b>${ci.length}</b> answers.`:'Choose one answer.'} ${sess.instant?'Feedback shows after each answer.':'Answers stay hidden until you finish.'}</div>
      <div class="opts" id="opts">
        ${it.order.map((oi,pos)=>{
          const sel=it.picked.includes(oi);
          return `<div class="opt ${multi?'multi':''} ${sel?'sel':''}" data-oi="${oi}" onclick="pick(${oi})">
            <span class="mark">${multi?(sel?'✓':''):String.fromCharCode(65+pos)}</span>
            <span class="otext">${esc(q.o[oi][0])}</span>
          </div>`}).join('')}
      </div>
      <div class="explain" id="explain"></div>
    </div>
    <div class="qnav">
      <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled':''}>← Prev</button>
      <div class="spacer"></div>
      ${sess.instant && !it.checked
        ? `<button class="btn primary" id="mainBtn" onclick="checkQ()">Check answer</button>`
        : (sess.idx<sess.items.length-1
            ? `<button class="btn primary" id="mainBtn" onclick="nextQ()">Next →</button>`
            : `<button class="btn primary" id="mainBtn" onclick="finishQuiz()">Finish (${answeredCount}/${sess.items.length})</button>`)}
    </div>
    <div class="dots">
      ${sess.items.map((x,i)=>{let c='dot';if(i===sess.idx)c+=' cur';
        if(x.checked){c+=x._correct?' ok':' no'}else if(x.picked.length)c+=' ans';
        if(flagged(x.q.g))c+=' flag';
        return `<button class="${c}" onclick="jump(${i})">${i+1}</button>`}).join('')}
    </div>`;
  if(sess.instant && it.checked)paintCheck();
}
function pick(oi){
  const it=sess.items[sess.idx];if(it.checked)return;
  const multi=correctIdx(it.q).length>1;
  if(multi){const k=it.picked.indexOf(oi);k>=0?it.picked.splice(k,1):it.picked.push(oi)}
  else it.picked=[oi];
  // update selection visuals without full re-render
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const s=it.picked.includes(+o.dataset.oi);o.classList.toggle('sel',s);
    if(multi)o.querySelector('.mark').textContent=s?'✓':'';
  });
  // auto-advance in exam single-choice? no — let user move. But refresh dot + finish count
  if(!sess.instant)refreshDots();
}
function refreshDots(){
  document.querySelectorAll('.dots .dot').forEach((d,i)=>{
    d.className='dot'+(i===sess.idx?' cur':'')+(sess.items[i].picked.length&&!sess.items[i].checked?' ans':'')
      +(sess.items[i].checked?(sess.items[i]._correct?' ok':' no'):'')+(flagged(sess.items[i].q.g)?' flag':'');
  });
  const mb=document.getElementById('mainBtn');
  if(mb&&sess.idx===sess.items.length-1&&!sess.instant){const a=sess.items.filter(x=>x.picked.length).length;mb.textContent=`Finish (${a}/${sess.items.length})`}
}
function checkQ(){
  const it=sess.items[sess.idx];if(!it.picked.length){toast('Pick an answer first');return}
  it.checked=true;
  const ci=correctIdx(it.q);
  it._correct=eqSet(it.picked,ci);
  recordAnswer(it.q,it._correct);
  paintCheck();
  // swap button to Next/Finish
  renderQuiz();
}
function paintCheck(){
  const it=sess.items[sess.idx],ci=correctIdx(it.q);
  document.querySelectorAll('#opts .opt').forEach(o=>{
    const oi=+o.dataset.oi;o.classList.add('locked');o.onclick=null;
    if(ci.includes(oi))o.classList.add('correct');
    else if(it.picked.includes(oi))o.classList.add('wrong');
    o.querySelector('.mark').textContent=ci.includes(oi)?'✓':(it.picked.includes(oi)?'✕':o.querySelector('.mark').textContent);
  });
  const ex=document.getElementById('explain');
  ex.className='explain show';
  ex.innerHTML=`<div class="verdict ${it._correct?'good':'bad'}">${it._correct?'✓ Correct':'✕ Not quite'}</div>
    <div class="lbl">Explanation</div><div>${esc(it.q.e||'—')}</div>`;
}
const flagged=g=>!!S.flags[canon(g)];              /* duplicates share one flag */
function toggleFlag(g){const c=canon(g);S.flags[c]?delete S.flags[c]:S.flags[c]=1;save();
  const b=document.getElementById('flagBtn');const on=flagged(g);
  b.classList.toggle('on',on);b.textContent=on?'★ Flagged':'☆ Flag';refreshDots()}
function prevQ(){if(sess.idx>0){sess.idx--;renderQuiz()}}
function nextQ(){if(sess.idx<sess.items.length-1){sess.idx++;renderQuiz()}}
function jump(i){sess.idx=i;renderQuiz()}

/* ============ SPACED REPETITION ============
   Leitner boxes. Get it right, it comes back later; get it wrong, it drops to
   box 0 and reappears in the same session's tail or the next drill. */
const SR_DAYS=[0,1,3,7,16,35];
const DAY=864e5;
function srUpdate(g,correct){
  const now=Date.now();
  g=canon(g);                                      /* duplicates share one box */
  const e=S.sr[g]||(S.sr[g]={box:0,due:0,seen:0});
  e.seen=(e.seen||0)+1;e.last=now;
  e.box=correct?Math.min((e.box||0)+1,SR_DAYS.length-1):0;
  e.due=e.box?now+SR_DAYS[e.box]*DAY:now+10*6e4;   /* wrong → back in 10 minutes */
}
function srDue(now){now=now||Date.now();
  return Object.keys(S.sr).filter(g=>QByG[g]&&S.sr[g].due<=now)
    .sort((a,b)=>S.sr[a].due-S.sr[b].due)}
/* Coverage: how many of the 1,858 unique questions have ever been answered.
   Counts canonical, in-bank ids only, so a stale key from an old bank cannot
   inflate it. */
function srSeen(){return Object.keys(S.sr).filter(g=>QByG[g]&&canon(g)===+g).length}
function srUnseen(){return Math.max(0,UNIQUE_N-srSeen())}

/* record into topic/mistake stats (once per exam grading or per practice check) */
function recordAnswer(q,correct){
  S.answered++;if(correct)S.correct++;
  srUpdate(q.g,correct);
  const tp=S.topics[q.p]||(S.topics[q.p]={seen:0,correct:0});tp.seen++;if(correct)tp.correct++;
  const g=canon(q.g);                              /* duplicates share one record */
  const m=S.mistakes[g];
  if(correct){
    if(m&&!m.done){m.streak=(m.streak||0)+1;if(m.streak>=2){m.done=true}}
  }else{
    if(m){m.done=false;m.streak=0;m.count=(m.count||0)+1}
    else S.mistakes[g]={count:1,streak:0,done:false};
  }
  save();
}

/* ============ FINISH / RESULTS ============ */
function finishQuiz(){
  clearInterval(timerInt);
  // grade any unchecked (exam) items now
  if(!sess.instant){
    sess.items.forEach(it=>{const ci=correctIdx(it.q);it.checked=true;it._correct=it.picked.length?eqSet(it.picked,ci):false;recordAnswer(it.q,it._correct)});
  }else{
    // practice: unchecked & unpicked count as not-correct but only grade if attempted
    sess.items.forEach(it=>{if(!it.checked){it.checked=true;it._correct=false}});
  }
  const score=sess.items.filter(it=>it._correct).length;
  const total=sess.items.length;
  const passed=score>=Math.round(PASSMARK/24*total);
  /* A sweep is first contact with unseen questions, not an attempt at a pass
     mark — counting 25 of them would bury the exam pass rate. */
  const isSweep=sess.source==='sweep';
  if(!isSweep){S.attempts++;if(passed)S.passes++}
  if(sess.testN){
    const st=testStat(sess.testN);
    /* `revealed` describes the best score, not the last sit: a 24 earned with
       the explanations on screen is a different thing from a 24 earned blind,
       and the tile says which one you are looking at. */
    const isBest=score>(st.best??-1);
    S.tests[sess.testN]={best:Math.max(st.best??0,score),attempts:st.attempts+1,
      lastPass:passed,lastScore:score,revealed:isBest?!!sess.instant:!!st.revealed};
  }
  /* A sweep is the day's work during the coverage weeks — it keeps the streak
     alive exactly like a drill does. */
  if(sess.source==='drill'||sess.source==='sweep')noteDrillDone();
  S.history.unshift({t:Date.now(),title:sess.title,score,total,passed,src:sess.source});
  S.history=S.history.slice(0,50);
  save();
  renderResults(score,total,passed);
  go('results');
}
function renderResults(score,total,passed){
  const pct=Math.round(score/total*100);

  const secs=Math.round((Date.now()-sess.startTs)/1000);
  el.innerHTML=`
    <h1>${sess.title} — results</h1>
    <div class="card pad" style="margin-bottom:16px">
      <div class="result-hero">
        <div class="ring" style="--p:${pct};--rc:${rc}"><div class="inner"><div><div class="pct">${pct}%</div><div class="sc">${score}/${total}</div></div></div></div>
        <div>
          <div class="verdict-big ${sess.source==='sweep'?'good':passed?'good':'bad'}">${
            sess.source==='sweep'
            ?`🧭 ${total} more seen${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :sess.source==='drill'
            ?`🔥 Drill done${S.drill&&S.drill.streak>1?` — ${S.drill.streak}-day streak`:''}`
            :(passed?'🎉 Passed!':'Keep practising')}</div>
          <p class="sub" style="margin:6px 0 12px">${sess.source==='sweep'
            ?`You got <b>${score}</b> of <b>${total}</b> first time. <b>${srUnseen()}</b> of ${UNIQUE_N} still never seen — a low score here is the point, not a problem.`
            :`You scored <b>${score}</b> of <b>${total}</b>. ${passed?`That's above the ${Math.round(PASSMARK/24*total)} needed.`:`You need <b>${Math.round(PASSMARK/24*total)}</b> to pass — ${Math.round(PASSMARK/24*total)-score} more.`}`} <span class="chip" style="margin-left:6px">${fmt(secs)} taken</span></p>
          <div class="btn-row">
            <button class="btn primary" onclick="retrySame()">${sess.source==='sweep'?'🧭 Next batch':'↻ Retry'}</button>
            ${wrongItems.length?`<button class="btn" onclick="practiceMistakes()">🎯 Fix ${wrongItems.length} mistake${wrongItems.length===1?'':'s'}</button>`:''}
            <button class="btn ghost" onclick="go('dashboard')">Dashboard</button>

    </div>

    ${sess.items.map((it,i)=>{const ci=correctIdx(it.q);
      return `<details class="rev" ${it._correct?'':'open'}>
        <summary><span class="ic ${it._correct?'ok':'no'}">${it._correct?'✓':'✕'}</span>

            return `<div ${cls}>${isC?'✓':(isP?'✕':'·')} ${esc(o[0])}</div>`}).join('')}
          <div class="lbl" style="margin-top:8px">Explanation</div><div>${esc(it.q.e||'—')}</div>

function retrySame(){
  if(sess.source==='sweep')return startSweep(sess.items.length);   /* the next batch, not the same one */
  if(sess.testN)return startTest(sess.testN);
  const src=sess.items.map(it=>it.q);
  makeSession(src,{title:sess.title,timed:sess.timed,testN:sess.testN,source:sess.source});
}

function unflag(g){const c=canon(g);if(S.flags[c])delete S.flags[c];if(S.mistakes[c]){S.mistakes[c].done=true}save();renderMistakes()}

/* ============ BACKUP / RESTORE ============
   Everything you have is two localStorage keys: lituk_v1 (progress) and
   lituk_prefs (settings). Export writes both into one file; restore validates
   the shape, confirms, writes both back and reloads.
   An untested backup is not a backup — do a real restore at least once. */
const BACKUP_APP='lituk',BACKUP_V=1,PREFS_LS='lituk_prefs';
function stamp(d){const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
function exportData(){
  const payload={app:BACKUP_APP,v:BACKUP_V,exported:new Date().toISOString(),[LS]:S,[PREFS_LS]:prefs};
  const url=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));
  const a=document.createElement('a');
  a.href=url;a.download=`lituk-progress-${stamp(new Date())}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Backup downloaded');
}
/* One input, created on demand — a static one would need a unique id in both
   the settings modal and the stats card. */
function pickImport(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';inp.className='hidden';
  inp.onchange=()=>{importData(inp);inp.remove()};
  document.body.appendChild(inp);inp.click();
}
/* A progress object is recognisable by its own shape, so the wrong file picked
   by mistake gets refused instead of silently wiping everything. */
function looksLikeState(o){
  return !!o&&typeof o==='object'&&!Array.isArray(o)&&
    ['tests','mistakes','sr'].every(k=>o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))&&
    typeof o.answered==='number';
}
function readBackup(raw){
  const j=JSON.parse(raw);
  if(looksLikeState(j))return{state:j,prefs:null};       /* older export: a bare lituk_v1 dump */
  if(j&&j.app===BACKUP_APP&&looksLikeState(j[LS]))
    return{state:j[LS],prefs:j[PREFS_LS]&&typeof j[PREFS_LS]==='object'?j[PREFS_LS]:null,exported:j.exported};
  return null;
}
let pendingRestore=null;
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onerror=()=>toast('Could not read that file');
  r.onload=()=>{
    let b=null;try{b=readBackup(r.result)}catch(e){b=null}
    if(!b){toast("That isn't a Life in the UK backup");return}
    pendingRestore=b;confirmRestore(b);
  };
  r.readAsText(f);
}
function summarise(st){
  const passed=Object.values(st.tests||{}).filter(t=>t.lastPass).length;
  const open=Object.values(st.mistakes||{}).filter(m=>!m.done).length;
  const streak=(st.drill&&st.drill.streak)||0;
  return `${passed} test${passed===1?'':'s'} passed · ${st.answered||0} answered · ${open} open mistake${open===1?'':'s'} · ${streak}-day streak`;
}
function confirmRestore(b){
  const when=b.exported?new Date(b.exported).toLocaleString():'an unknown date';
  const busy=(S.answered||0)>0||Object.keys(S.tests).length>0;
  modal(`<h3 style="margin:0 0 4px">Restore this backup?</h3>
    <p class="sub" style="margin:0 0 14px">Saved ${esc(when)}.</p>
    <div class="lbl">In the file</div><div style="margin-bottom:10px">${esc(summarise(b.state))}</div>
    ${busy?`<div class="lbl">On this device now</div><div style="margin-bottom:10px">${esc(summarise(S))}</div>
      <p class="sub" style="color:var(--bad);font-weight:600">This replaces everything above. It can't be undone — export first if you're not sure.</p>`
     :`<p class="sub">There's no progress on this device yet, so nothing is lost.</p>`}
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="applyRestore()">Restore &amp; reload</button>
      <button class="btn ghost" onclick="pendingRestore=null;closeModal()">Cancel</button>
    </div>`);
}
function applyRestore(){
  const b=pendingRestore;if(!b)return;
  localStorage.setItem(LS,JSON.stringify(b.state));
  if(b.prefs)localStorage.setItem(PREFS_LS,JSON.stringify(b.prefs));
  pendingRestore=null;
  location.reload();      /* reload rather than patch S — nothing stale survives */
}
function resetAll(){modal(`<h3 style="margin:0 0 8px">Reset everything?</h3><p class="sub">Deletes all scores, mistakes and stats on this device.</p><div class="btn-row"><button class="btn primary" style="background:var(--bad);border-color:var(--bad)" onclick="S=structuredClone(DEFAULT);save();closeModal();go('dashboard');toast('All progress reset')">Delete all</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}

/* What this drill size actually buys, in days — the only number that matters
   with a fixed exam date. Drills alone; Sweep gets through it faster. */
function settingsCoverageLine(n,left){
  if(!left)return `All ${UNIQUE_N} questions seen at least once.`;
  const fresh=Math.round(n*(MIX[drillMode()]||MIX.coverage).new);
  if(!fresh)return `${left} of ${UNIQUE_N} still never seen — this mode serves no new questions, so use Sweep.`;
  return `${left} of ${UNIQUE_N} still never seen — ${fresh} new per drill, so ${Math.ceil(left/fresh)} days to see the bank once.`;
}

  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const it=sess.items[sess.idx];
  if(/^[1-9]$/.test(e.key)){const pos=+e.key-1;if(pos<it.order.length){pick(it.order[pos]);e.preventDefault()}}

  else if(e.key==='ArrowRight')nextQ();

});

/* ============ DEEP LINKS ============
   #drill · #sweep · #mistakes · #stats · #test=7 · #q=412 (from the hub's search) */
function showQuestion(g){
  const q=QByG[g];if(!q){toast('Question not found');return}
  const ci=correctIdx(q);
  modal(`<div class="tag" style="margin-bottom:6px">${esc(TOPICS[q.p])} · Test ${q._test}${q._bank?` · ${esc(q._bank.source)}`:''}</div>
    <h3 style="margin:0 0 12px;font-size:17px;line-height:1.4">${esc(q.t)}</h3>
    ${q.o.map((o,i)=>`<div style="padding:5px 0;${ci.includes(i)?'color:var(--good);font-weight:700':'color:var(--muted)'}">${ci.includes(i)?'✓':'·'} ${esc(o[0])}</div>`).join('')}
    <div class="lbl" style="margin-top:12px">Explanation</div><div>${esc(q.e||'—')}</div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="closeModal();startTest(${q._test})">Take Test ${q._test}</button>
      <button class="btn" onclick="closeModal();startTopic(${q.p})">Practise this topic</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>`);
}
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h)return;
  const q=h.match(/^q=(\d+)$/);   if(q){go('dashboard');showQuestion(+q[1]);return}
  const t=h.match(/^test=(\d+)$/);if(t){startTest(+t[1]);return}
  if(h==='drill'){startDrill();return}
  if(h==='sweep'){startSweep();return}
  if(h==='mistakes'||h==='stats')go(h);
}
addEventListener('hashchange',route);

/* ============ INIT ============ */
migrate();                 /* before anything reads S */
renderDashboard();
route();
</script>
</body>
