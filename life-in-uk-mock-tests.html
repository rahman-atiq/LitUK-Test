]]},{"g":178,"t":"What is meant by 'common law'?","e":"In England, judges developed 'common law' by a process of precedence (that is, following previous decisions) and tradition. In Scotland, the legal system developed slightly differently and laws were 'codified' (that is, written down).","p":1,"o":[["Written down",0],["Following previous decisions",1],["Codified",0],["Sentence is decided by the jury",0]]},{"g":179,"t":"To be or not to be' is a famous Shakespeare line from which play or poem?","e":"Lines from Shakespeare's plays and poems which are often still quoted include: Once more unto the breach (Henry V); To be or not to be (Hamlet); A rose by any other name (Romeo and Juliet); All the world's a stage (As You Like It); The darling buds of May (Sonnet 18 'Shall I Compare Thee To a Summer's Day).","p":1,"o":[["As you like it",0],["Romeo and Juliet",0],["Hamlet",1],["Henry V",0]]},{"g":180,"t":"What county does Stonehenge stand in?","e":"Stonehenge still stands in what is now the English county of Wiltshire. Stonehenge was probably a special gathering place for seasonal ceremonies.","p":1,"o":[["Lincolnshire",0],["Wiltshire",1],["Dorset",0],["Lothians",0]]},{"g":181,"t":"Where does the Grand National takes place?","e":"There are racecourses all over the UK. Famous horse-racing events include: Royal Ascot, a five-day race meeting in Berkshire attended by members of the Royal Family; the Grand National at Aintree near Liverpool; and the Scottish Grand National at Ayr. There is a National Horseracing Museum in Newmarket, Suffolk.","p":0,"o":[["Near Liverpool",1],["Near Suffolk",0],["Near London",0],["Near Manchester",0]]},{"g":182,"t":"When is Halloween (an ancient festival) celebrated?","e":"Halloween, 31 October, is an ancient festival and has roots in the pagan festival to mark the beginning of winter. Young people will often dress up in frightening costumes to play 'trick or treat'. People give them treats to stop them playing tricks on them. A lot of people carve lanterns out of pumpkins and put a candle inside.","p":0,"o":[["31st November",0],["30th November",0],["31st October",1],["30th October",0]]},{"g":183,"t":"What does the money raised from National Insurance Contributions pay for? (Choose TWO)","e":"The money raised from National Insurance Contributions is used to pay for state benefits and services such as the state retirement pension and the National Health Service (NHS).","p":2,"o":[["Child benefits",0],["NHS",1],["The state retirement pension",1],["Job allowances",0]]},{"g":184,"t":"Who is considered ineligible to do jury service?","e":"Everyone who is summoned to do jury service must do it unless they are not eligible (for example, because they have a criminal conviction) or they provide a good reason to be excused, such as ill health.","p":2,"o":[["Police",0],["Judges",0],["Anyone with a criminal conviction",1],["Non-Christians",0]]},{"g":185,"t":"What are TWO core values of a civil servant?","e":"Civil servants are expected to carry out their role with dedication and a commitment to the civil service and its core values. These are: integrity, honesty, objectivity and impartiality","p":2,"o":[["Impartiality",1],["Integrity",1],["Sense of humour",0],["Must belong to a political party",0]]},{"g":186,"t":"Members of the public are allowed to attend Youth Courts hearings","e":"Members of the public are not allowed in Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media.","p":2,"o":[["False",1],["True",0]]},{"g":187,"t":"Who had a great influence on the English language?","e":"Shakespeare had a great influence on the English language and invented many words that are still common today.","p":1,"o":[["Wilfred Owen",0],["William Shakespeare",1],["Oliver Cromwell",0],["David Lean",0]]},{"g":188,"t":"Great Britain' and 'the United Kingdom' have the same meaning","e":"The official name of the country is the United Kingdom of Great Britain and Northern Ireland. 'Great Britain' refers only to England, Scotland and Wales, not to Northern Ireland.","p":4,"o":[["True",0],["False",1]]},{"g":189,"t":"The Welsh Dragon doesn't appear on the Union Flag because Wales was already united with England in 1606","e":"The Welsh dragon does not appear on the Union Flag because, when the first Union Flag was created in 1606 from the flags of Scotland and England, the Principality of Wales was already united with England.","p":1,"o":[["False",0],["True",1]]},{"g":190,"t":"Which Armed Force was used in the Battle of Britain?","e":"The Germans waged an air campaign against Britain, but the British resisted with their fighter planes and eventually won the crucial aerial battle against the Germans, called 'the Battle of Britain', in the summer of 1940. The most important planes used by the Royal Air Force in the Battle of Britain were the Spitfire and the Hurricane - which were designed and built in Britain.","p":1,"o":[["Army",0],["Royal Air Force",1],["Home Guards",0],["Royal Navy",0]]},{"g":191,"t":"Which is a famous area in London for theatres?","e":"There are theaters in most towns and cities throughout the UK, ranging from the large to the small. They are an important part of local communities and often show both professional and amateur productions. London's West End, also known as 'Theatreland', is particularly well known. The Mousetrap, a murder-mystery play by Dame Agatha Christie, has been running in the West End since 1952 and has had the longest initial run of any show in history.","p":0,"o":[["The City",0],["West End",1],["East End",0],["South End",0]]}]},{"n":9,"name":"Life in the UK Test 9","q":[{"g":192,"t":"Where does the Prime Minister reside?","e":"The official home of the Prime Minister is 10 Downing Street, in central London, near the Houses of Parliament.","p":2,"o":[["76 Charlotte Street",0],["10 Downing Street",1],["The Buckingham palace",0],["1 Devonshire Terrace",0]]},{"g":193,"t":"What is the 'King James' Bible?","e":"One achievement of King James' reign was a new translation of the Bible into English. This translation is known as the 'King James Version' or the 'Authorised Version'. It was not the first English Bible but is a version which continues to be used in many Protestant churches today.","p":1,"o":[["The Protestant Version",0],["A new translation into English",1],["The First English Bible",0],["The Correct Version",0]]},{"g":194,"t":"How many member states does the Commonwealth have?","e":"The Queen/King is the ceremonial head of the Commonwealth, which currently has 56 member states. Membership is voluntary.","p":2,"o":[["48",0],["56",1],["77",0],["28",0]]},{"g":195,"t":"What are the MPs who don't represent a political party called?","e":"There are a few MPs who do not represent any of the main political parties. They are called 'independents' and usually represent an issue important to their constituency.","p":2,"o":[["Civil MP",0],["Independents",1],["Sole MP",0],["Neutrals",0]]},{"g":196,"t":"Beefeaters, who tell visitors about the building's history are associated with which of these?","e":"The Tower of London was first built by William the Conqueror after he became king in 1066. Tours are given by the Yeoman Warders, also known as Beefeaters, who tell visitors about the building's history. People can also see the Crown Jewels there.","p":0,"o":[["Big Ben",0],["Unesco",0],["Edinburgh Castle",0],["The Tower of London",1]]},{"g":197,"t":"Who in 2002 was voted the greatest Briton of all time?","e":"In 2002, Winston Churchill was voted the greatest Briton of all time by the public.","p":1,"o":[["Winston Churchill",1],["Clement Attlee",0],["Margaret Thatcher",0],["Sir Robert Walpole",0]]},{"g":198,"t":"What were the people who supported the King known as in 1642?","e":"During the English Civil War (1642) the country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads).","p":1,"o":[["Roundheads",0],["Quakers",0],["Chartists",0],["Cavaliers",1]]},{"g":199,"t":"Protestant ideas gradually gained strength in England, Wales and Scotland during what century?","e":"Protestant ideas gradually gained strength in England, Wales and Scotland during the 16th century.","p":1,"o":[["15th",0],["14th",0],["16th",1],["17th",0]]},{"g":200,"t":"How long is the longest straight distance on the mainland?","e":"The longest distance on the mainland is from John O'Groats on the north coast of Scotland to Land's End in the south-west corner of England. It is about 870 miles (approximately 1,400 kilometres).","p":0,"o":[["1006 miles",0],["845 miles",0],["870 miles",1],["896 miles",0]]},{"g":201,"t":"What were James II's supporters known as?","e":"Some continued to believe that James was the rightful king, particularly in Scotland. Some joined him in exile in France; others were secret supporters. James' supporters became known as Jacobites.","p":1,"o":[["Jacobites",1],["Quakers",0],["Roundheads",0],["Cavaliers",0]]},{"g":202,"t":"In Northern Ireland some people speak Irish Gaelic","e":"In Wales, many people speak Welsh - a completely different language from English - and it is taught in schools and universities. In Scotland, Gaelic (again, a different language) is spoken in some parts of the Highlands and Islands, and in Northern Ireland some people speak Irish Gaelic.","p":0,"o":[["True",1],["False",0]]},{"g":203,"t":"What should you do when you move into a new house or apartment?","e":"When you move into a new house or apartment, introduce yourself to the people who live near you. Getting to know your neighbours can help you to become part of the community and make friends.","p":2,"o":[["Tell the people who live near you not to make noise",0],["Introduce yourself to the people who live near you so they can help you",1],["Warn the people who live near you not to talk to you",0],["Do nothing",0]]},{"g":204,"t":"What percentage of the population has a parent or a grandparent born outside of the UK due to post-war immigration?","e":"Post-war immigration means that nearly 10% of the population has a parent or grandparent born outside the UK.","p":0,"o":[["12%",0],["10%",1],["14%",0],["16%",0]]},{"g":205,"t":"Which of these TWO is correct about Halloween?","e":"Halloween, 31 October, is an ancient festival and has roots in the pagan festival to mark the beginning of winter. Young people will often dress up in frightening costumes to play 'trick or treat'. People give them treats to stop them playing tricks on them. A lot of people carve lanterns out of pumpkins and put a candle inside.","p":0,"o":[["It is an ancient festival and has roots in the pagan festival to mark the beginning of winter",1],["It is when lovers exchange cards and gifts",0],["It is celebrated on the 31 October",1],["It is not celebrated in Scotland",0]]},{"g":206,"t":"The devolved administrations each have their own civil service.","e":"The devolved administrations each have their own civil service.","p":2,"o":[["False",0],["True",1]]},{"g":207,"t":"Which patron Saint has a white cross on a blue ground?","e":"The Union Flag consists of three crosses: The cross of St George, patron saint of England, is a red cross on a white ground; The cross of St Andrew, patron saint of Scotland, is a diagonal white cross on a blue ground; The cross of St Patrick, patron saint of Ireland, is a diagonal red cross on a white ground.","p":1,"o":[["St David",0],["St Andrew",1],["St George",0],["St Patrick",0]]},{"g":208,"t":"Who was the first Danish king in England?","e":"Anglo-Saxon kings continued to rule what is now England, except for a short period when there were Danish kings. The first of these was Cnut, also called Canute.","p":1,"o":[["Edward",0],["William",0],["Cnut",1],["Harold",0]]},{"g":209,"t":"What is the name of the song sung by people in the UK and other countries when celebrating the New Year?","e":"One of the songs sung by people in the UK at New Year is Auld Lang Syne.","p":1,"o":[["The Heart of the Matter",0],["Auld Lang Syne",1],["Sense and Sensibility",0],["Scoop",0]]},{"g":210,"t":"Who can stand for office as a Local Councillor?","e":"British citizens can stand for Office as a local councillor, a member of Parliament (or the devolved equivalents). This is an opportunity to become even more involved in the political life of the UK. You may also be able to stand for Office if you are an Irish citizen, or an eligible Commonwealth citizen.","p":2,"o":[["Foreign citizens only",0],["British, Irish and Eligible Commonwealth citizens",1],["British citizens of the UK only",0],["All residents of the UK",0]]},{"g":211,"t":"Which famous poet's work was inspired by Nature?","e":"Other poets, including William Wordsworth, were inspired by nature. Sir Walter Scott wrote poems inspired by Scotland and the traditional stories and songs from the area on the borders of Scotland and England. He also wrote novels, many of which were set in Scotland.","p":0,"o":[["William Wordsworth",1],["Charles Dicken",0],["Sir Roger Bannister",0],["Damon Hill",0]]},{"g":212,"t":"How often do PM's Questions take place in the parliament?","e":"The leader of the opposition leads his or her party in pointing out what they see as the government's failures and weaknesses. One important opportunity to do this is at Prime Minister's Questions, which takes place every week while Parliament is sitting.","p":2,"o":[["Every Month",0],["Every Working Day",0],["Every Week",1],["Every Two Weeks",0]]},{"g":213,"t":"Which one of these countries in the UK requires you to complete your own registration form to get entitled to vote?","e":"In Northern Ireland a different system operates. This is called 'individual registration' and all those entitled to vote must complete their own registration form. Once registered, people stay on the register provided their personal details do not change.","p":2,"o":[["Wales",0],["Northern Ireland",1],["Scotland",0],["England",0]]},{"g":214,"t":"Where is the UK geographically located with respect to Europe?","e":"The UK is located in the North-West of Europe.","p":4,"o":[["South-East",0],["South-West",0],["North-West",1],["North-East",0]]},{"g":215,"t":"Towns, cities and rural areas in the UK are governed by civil servants who are appointed by the Government?","e":"Towns, cities and rural areas in the UK are governed by democratically elected councils, often called 'local authorities'. Some areas have both district and county councils, which have different functions. Most large towns and cities have a single local authority.","p":2,"o":[["True",0],["False",1]]}]},{"n":10,"name":"Life in the UK Test 10","q":[{"g":216,"t":"What does the TV licence money pay for?","e":"The money from TV licences is used to pay for the British Broadcasting Corporation also known as the BBC.","p":0,"o":[["Electricity",0],["The BBC",1],["Freeview Channels",0],["All Free Radio Channels",0]]},{"g":217,"t":"Who developed important Human Nature ideas?","e":"David Hume's ideas about human nature continue to influence philosophers.","p":1,"o":[["David Hume",1],["Richard Arkwright",0],["Adam Smith",0],["James Watt",0]]},{"g":218,"t":"What did the Romans introduce to Britain?","e":"The Romans remained in Britain for 400 years. They built roads and public buildings, created a structure of law, and introduced new plants and animals.","p":1,"o":[["Christianity",0],["New plants and animals",1],["New food and cloth",0],["New machinery",0]]},{"g":219,"t":"What is an example of the Middle Ages architecture?","e":"In the Middle Ages, great cathedrals and churches were built, many of which still stand today. Examples are the cathedrals in Durham, Lincoln, Canterbury and Salisbury. The White Tower in the Tower of London is an example of a Norman castle keep, built on the orders of William the Conqueror.","p":0,"o":[["The Queen's House in Greenwich",0],["The White Tower in the Tower of London",1],["The London Eye",0],["The O2 arena",0]]},{"g":220,"t":"When was the Giant's Causeway formed?","e":"Located on the north-east coast of Northern Ireland, the Giant's Causeway is a land formation of columns made from volcanic lava. It was formed about 50 million years ago. There are many legends about the Causeway and how it was formed.","p":0,"o":[["60 million years ago",0],["50 million years ago",1],["40 million years ago",0],["70 million years ago",0]]},{"g":221,"t":"Who is the heir to the throne?","e":"Queen Elizabeth II reigned since her father's death in 1952, (she celebrated her Diamond Jubilee i.e. 60 years as queen) until she passed away in 2022. She was married to Prince Philip, the Duke of Edinburgh. Her eldest son, King Charles III (previously known as the Prince of Wales) became the sovereign monarch in 2022. His eldest son, heir to the throne, Prince William is the new Prince of Wales.","p":2,"o":[["King Charles III",0],["Prince William",1],["Prince Harry",0],["Queen Elizabeth II's husband",0]]},{"g":222,"t":"Who invented the Internet as we know it today? (World Wide Web)","e":"The inventor of the World Wide Web, Sir Tim Berners-Lee (1955-), is British. Information was successfully transferred via the web for the first time on 25 December 1990.","p":1,"o":[["Wilfred Owen",0],["Clement Attlee",0],["Sir Tim Berners-Lee",1],["Peter Mansfield",0]]},{"g":223,"t":"Who directed the two British films 'Brief Encounter' and 'Lawrence of Arabia'?","e":"Brief Encounter (1945), Lawrence of Arabia (1962) were directed by David Lean","p":0,"o":[["Alfred Hitchcock",0],["William Walton",0],["Hugh Hudson",0],["David Lean",1]]},{"g":224,"t":"Who captained the English football team in 1966?","e":"Bobby Moore (1941-93) captained the English football team that won the World Cup in 1966.","p":0,"o":[["Andy Murray",0],["Sir Chris Hoy",0],["Jackie Stewart",0],["Bobby Moore",1]]},{"g":225,"t":"Which of the following is a fundamental principle of British Life?","e":"The fundamental principles of British life include: Democracy; The rule of law; Individual liberty; Tolerance of those with different faiths and beliefs; Participation in community life.","p":3,"o":[["Communism",0],["Terrorism",0],["Democracy",1],["Dictatorship",0]]},{"g":226,"t":"Only members of the public who have their name on the electoral register can listen to debates in the Palace of Westminster in the House of Lords","e":"The public can listen to debates in the Palace of Westminster from public galleries in both the House of Commons and the House of Lords.","p":2,"o":[["False",1],["True",0]]},{"g":227,"t":"What are TWO of the activities that you might be involved in when canvassing?","e":"Political parties are particularly busy at election times. Members work hard to persuade people to vote for their candidates - for instance, by handing out leaflets in the street or by knocking on people's doors and asking for their support. This is called 'canvassing'.","p":2,"o":[["Handing out leaflets in the street",1],["Knocking on people's doors and asking for their support",1],["Getting paid for each vote obtained in commission",0],["Getting paid for the time spent advertising",0]]},{"g":228,"t":"Which TWO things are you required to have to apply for ILR or British Citizenship?","e":"In order to apply for ILR or Naturalization as a British Citizen you must have a valid life in the UK pass certificate and good knowledge of English language","p":3,"o":[["A relative in the UK with a British Passport",0],["Knowledge of English Language",1],["A Life in the UK pass certificate",1],["A valid foreign passport",0]]},{"g":229,"t":"Which process for the mass production of steel led to the development of the shipbuilding industry and the railways?","e":"The development of the Bessemer process for the mass production of steel led to the development of the shipbuilding industry and the railways. Manufacturing jobs became the main source of employment in Britain.","p":1,"o":[["Durrer process",0],["Bessemer process",1],["Decarburization",0],["Flodin process",0]]},{"g":230,"t":"The invasion of which country by Germany provoked UK to declare war on Germany in 1939?","e":"When Hitler invaded Poland in 1939, Britain and France declared war in order to stop his aggression.","p":1,"o":[["Belgium",0],["The Soviet Union",0],["Poland",1],["Austria",0]]},{"g":231,"t":"Where are minor criminal cases in England, Wales and Northern Ireland heard?","e":"In England, Wales and Northern Ireland, most minor criminal cases are dealt with in a Magistrates' Court. In Scotland, minor criminal offences go to a Justice of the Peace Court.","p":2,"o":[["County Court",0],["Magistrates Court",1],["Appellate Court",0],["Justice of the Peace Court",0]]},{"g":232,"t":"The Opposition is the second largest party in the House of Commons","e":"The second-largest party in the House of Commons is called the Opposition. The leader of the Opposition usually becomes Prime Minister if his or her party wins the next General Election.","p":2,"o":[["True",1],["False",0]]},{"g":233,"t":"Which prehistoric monument still stands in the English county of Wiltshire?","e":"Stonehenge, still stands in what is now the English county of Wiltshire. Stonehenge was probably a special gathering place for seasonal ceremonies.","p":1,"o":[["Hadrian's Wall",0],["Offa's Dyke",0],["Fountains Abbey",0],["Stonehenge",1]]},{"g":234,"t":"Robert Stephenson and George were famous pioneers of which industry?","e":"Just before Victoria came to the throne, the father and son George and Robert Stephenson pioneered the railway engine and a major expansion of the railways took place in the Victorian period. Railways were built throughout the Empire.","p":1,"o":[["Railway engines",1],["Canal building",0],["Automobile",0],["Agricultural",0]]},{"g":235,"t":"Conservative Party is a political party in the UK","e":"The main political parties include: Conservative Party, the Labour Party, the Liberal Democrats, or one of the parties representing Scottish, Welsh or Northern Irish interests.","p":2,"o":[["False",0],["True",1]]},{"g":236,"t":"The name or photograph of cases heard in the Youth Court can be published in the newspapers once the young person has been found guilty","e":"Members of the public are not allowed in Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media.","p":2,"o":[["False",1],["True",0]]},{"g":237,"t":"What are traditional pub games? (Select TWO)","e":"Most communities will have a 'local' pub that is a natural focal point for social activities. Pub quizzes are popular. Pool and darts are traditional pub games.","p":0,"o":[["Lottery",0],["Pool",1],["Darts",1],["Slots",0]]},{"g":238,"t":"Where was Rudyard Kipling born?","e":"Rudyard Kipling was born in India in 1865 and later lived in India, the UK and the USA. He wrote books and poems set in both India and the UK. His poems and novels reflected the idea that the British Empire was a force for good. Kipling was awarded the Nobel Prize in Literature in 1907.","p":1,"o":[["India",1],["Spain",0],["England",0],["France",0]]},{"g":239,"t":"What was Isaac Newton famous for?","e":"His most famous published work was Philosophiae Naturalis Principia Mathematica (Mathematical Principles of Natural Philosophy), which showed how gravity applied to the whole universe. Newton also discovered that white light is made up of the colours of the rainbow. Many of his discoveries are still important for modern science.","p":1,"o":[["Splitting the atom",0],["Discovering penicillin",0],["Cloning a sheep",0],["Explaining gravitation",1]]}]},{"n":11,"name":"Life in the UK Test 11","q":[{"g":240,"t":"Where in Scotland is known as the home of golf?","e":"St Andrews in Scotland is known as the home of golf.","p":0,"o":[["Aberdeen",0],["St Andrews",1],["Edinburgh",0],["Glasgow",0]]},{"g":241,"t":"Where does the UK government sit?","e":"The UK is governed by the parliament sitting in Westminster.","p":4,"o":[["Stormont",0],["Senedd",0],["Holyrood",0],["Westminster",1]]},{"g":242,"t":"Who was the Prime Minister during 1945-1951?","e":"Clement Attlee was born in London in 1883. He was Prime Minister from 1945 to 1951 and led the Labour Party for 20 years.","p":1,"o":[["R A Butler",0],["Winston Churchill",0],["Dylan Thomas",0],["Clement Attlee",1]]},{"g":243,"t":"Who wrote 'The Lord of the Rings'?","e":"The Lord of the Rings by JRR Tolkien was voted the country's best-loved novel in 2003.","p":0,"o":[["Charles Dickens",0],["JRR Tolkien",1],["Ian Fleming",0],["J K Rowling",0]]},{"g":244,"t":"Which organization looks after the Edinburgh Castle?","e":"The Edinburgh Castle has a long history, dating back to the early Middle Ages. It is looked after by Historic Scotland, a Scottish government agency.","p":0,"o":[["NSPCC",0],["Historic Scotland",1],["The National Trust",0],["The Red Cross",0]]},{"g":245,"t":"What does an aged population have an impact on?","e":"People in the UK are living longer than ever before. This is due to improved living standards and better health care. There are now a record number of people aged 85 and over. This has an impact on the cost of pensions and health care.","p":0,"o":[["The cost of Insurance",0],["The cost of Health Care",1],["The cost of Bus Fares",0],["The price of food",0]]},{"g":246,"t":"What party won the election in 1945 (After WWII)?","e":"In 1945 the British people elected a Labour government. The new Prime Minister was Clement Attlee, who promised to introduce the welfare state outlined in the Beveridge Report. In 1948, Aneurin (Nye) Bevan, the Minister for Health, led the establishment of the National Health Service (NHS), which guaranteed a minimum standard of health care for all, free at the point of use.","p":1,"o":[["A coalition",0],["Liberal Democrats",0],["Conservative",0],["Labour",1]]},{"g":247,"t":"When did Queen Elizabeth II celebrate her Diamond Jubilee?","e":"Big Ben tower is named 'Elizabeth Tower' in honour of Queen Elizabeth II's Diamond Jubilee in 2012.","p":2,"o":[["2010",0],["2013",0],["2011",0],["2012",1]]},{"g":248,"t":"What do you have to pay tax on in the UK?","e":"People in the UK have to pay tax on their income, which includes: wages from paid employment; profits from self-employment, taxable benefits; pensions; income from property, savings and dividends.","p":2,"o":[["The Personal Allowance",0],["All kind of benefits",0],["Pensions",1],["Buying goods from supermarkets",0]]},{"g":249,"t":"Which of these is NOT part of the Commonwealth?","e":"The US is not part of the Commonwealth.","p":2,"o":[["Barbados",0],["UK",0],["Canada",0],["USA",1]]},{"g":250,"t":"You can find copies of Hansard report in large libraries and on the Internet","e":"Proceedings in Parliament are broadcast on television and published in official reports called Hansard. Written reports can be found in large libraries and online.","p":2,"o":[["False",0],["True",1]]},{"g":251,"t":"Queen Mary was a Protestant and persecuted Catholics (for this reason, she became known as 'Bloody Mary')","e":"Mary was a devout Catholic and persecuted Protestants (for this reason, she became known as 'Bloody Mary'). Mary also died after a short reign and the next monarch was her half-sister, Elizabeth, the daughter of Henry VIII and Anne Boleyn.","p":1,"o":[["False",1],["True",0]]},{"g":252,"t":"Where is Sutton Hoo?","e":"The burial place of one of the kings was at Sutton Hoo in modern Suffolk. This king was buried with treasure and armour, all placed in a ship which was then covered by a mound of earth.","p":1,"o":[["Suffolk",1],["Essex",0],["Sussex",0],["Norfolk",0]]},{"g":253,"t":"Wales wasn't under Anglo-Saxon rule","e":"Parts of the west of Britain, including much of what is now Wales, and Scotland, remained free of Anglo-Saxon rule.","p":1,"o":[["False",0],["True",1]]},{"g":254,"t":"Scotland, Wales and Northern Ireland each have devolved administrations which give them full control over all policies and laws","e":"Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control. However, many other public services, such as education, are controlled by the devolved administrations.","p":2,"o":[["False",1],["True",0]]},{"g":255,"t":"Who captained the English cricket team and holds a number of records, both for batting and bowling?","e":"Sir Ian Botham (1955-) captained the English cricket team and holds a number of English Test cricket records, both for batting and for bowling.","p":0,"o":[["Wasim Akram",0],["Brian Lara",0],["Shane Warne",0],["Ian Botham",1]]},{"g":256,"t":"The Prime Minister cannot be changed until the next General election","e":"The Prime Minister can be changed if the MPs in the governing party decide to do so, or if he or she wishes to resign.","p":2,"o":[["True",0],["False",1]]},{"g":257,"t":"Which TWO of the following are protected by law from discrimination?","e":"UK laws ensure that people are not treated unfairly in any area of life or work because of their age, disability, sex, pregnancy and maternity, race, religion or belief, sexuality or marital status.","p":2,"o":[["Eye colour",0],["Choice of car",0],["Disability",1],["Marital status",1]]},{"g":258,"t":"Forced Marriage Protection Orders were introduced in 2008 for England, Wales and Northern Ireland","e":"Forced Marriage Protection Orders were introduced in 2008 for England, Wales and Northern Ireland under the Forced Marriage (Civil Protection) Act 2007.","p":2,"o":[["False",0],["True",1]]},{"g":259,"t":"What is the name given to rented additional land which people use to grow fruit and vegetable?","e":"A lot of people have gardens at home and will spend their free time looking after them. Some people rent additional land called 'an allotment', where they grow fruit and vegetables. Gardening and flower shows range from major national exhibitions to small local events.","p":1,"o":[["Garden",0],["Allotment",1],["Roomage",0],["Spacage",0]]},{"g":260,"t":"Many Scottish landlords destroyed individual small farms (known as 'crofts') to make space for large flocks of sheep and cattle. What was this known as?","e":"A process began which became known as the 'Highland Clearances'. Many Scottish landlords destroyed individual small farms (known as 'crofts') to make space for large flocks of sheep and cattle. Evictions became very common in the early 19th century. Many Scottish people left for North America at this time.","p":1,"o":[["Highland Clearances",1],["Feudalism",0],["Pocket Boroughs",0],["The rebellion of the landlords",0]]},{"g":261,"t":"Which of the statements is true?","e":"Solicitors' charges are usually based on how much time they spend on a case. It is very important to find out at the start how much a case is likely to cost.","p":2,"o":[["Solicitors' charges are based on how serious the case is",0],["Solicitors' charges are based on how much time they spend on a case",1]]},{"g":262,"t":"What area is the Home Secretary responsible for?","e":"The Prime Minister appoints about 20 senior MPs to become ministers in charge of departments. These include: Chancellor of the Exchequer: responsible for the economy; Home Secretary:responsible for crime, policing and immigration; Foreign Secretary: responsible for managing relationships with foreign countries; other ministers (called 'Secretaries of State') are responsible for subjects such as education, health and defence.","p":2,"o":[["Education",0],["Health",0],["Police",1],["Defence",0]]},{"g":263,"t":"Which battle did William the Conqueror fight in?","e":"In 1066, an invasion led by William, the Duke of Normandy (in what is now northern France), defeated Harold, the Saxon king of England, at the Battle of Hastings. Harold was killed in the battle. William became king of England and is known as William the Conqueror. The battle is commemorated in a great piece of embroidery, known as the Bayeux Tapestry, which can still be seen in France today.","p":1,"o":[["The Battle of Hastings",1],["The Battle of Agincourt",0],["The Battle of Bosworth Field",0],["The Battle of Bannockburn",0]]}]},{"n":12,"name":"Life in the UK Test 12","q":[{"g":264,"t":"What is the Turner Prize given for?","e":"The Turner Prize is recognised as one of the most prestigious visual art awards in Europe. Previous winners include Damien Hirst and Richard Wright.","p":0,"o":[["Music",0],["Art",1],["Dancing",0],["Garden design",0]]},{"g":265,"t":"What is the main purpose of the Opposition?","e":"The opposition form the shadow cabinet and their role is to challenge the government and put forward alternative policies.","p":2,"o":[["To participate in public debates",0],["To represent the people of the UK",0],["To challenge the government",1],["To change laws",0]]},{"g":266,"t":"What is the 'Divine Right of Kings'?","e":"Divine Right of Kings' is the idea that the king was directly appointed by God to rule. The king should be able to act without having to seek approval from Parliament.","p":1,"o":[["Reduced the power of the nobles",0],["Reduced the power of the King",0],["Increased power of the parliament",0],["The King was Appointed by God",1]]},{"g":267,"t":"It is a civil offence to carry a weapon","e":"It is a criminal offence to carry a weapon.","p":2,"o":[["True",0],["False",1]]},{"g":268,"t":"How many members does a jury in England, Wales and Northern Ireland have?","e":"In England, Wales and Northern Ireland a jury has 12 members, and in Scotland a jury has 15 members.","p":2,"o":[["13",0],["12",1],["15",0],["14",0]]},{"g":269,"t":"Constituencies which had hardly any voters were called 'Pocket Boroughs'","e":"Some constituencies were controlled by a single wealthy family. These were called 'pocket boroughs'. Other constituencies had hardly any voters and were called 'rotten boroughs'.","p":1,"o":[["False",1],["True",0]]},{"g":270,"t":"Can the devolved administrations control sectors such as immigration, foreign affairs and taxation?","e":"Since 1997, some powers have been devolved from the central government to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them. Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control. However, many other public services, such as education, are controlled by the devolved administrations.","p":2,"o":[["No",1],["Yes",0],["Only in Scotland",0],["Only if the local people support them",0]]},{"g":271,"t":"Adult citizens of the UK, and citizens of the Commonwealth and the Irish Republic who are resident in the UK, can vote in all public elections","e":"Adult citizens of the UK, and citizens of the Commonwealth and the Irish Republic who are resident in the UK, can vote in all public elections.","p":2,"o":[["True",1],["False",0]]},{"g":272,"t":"Forced marriages are an offence in the UK","e":"Forced marriage is where one or both parties do not or cannot give their consent to enter into the partnership. Forcing another person to marry is a criminal offence.","p":2,"o":[["False",0],["True",1]]},{"g":273,"t":"Which of these statements is correct?","e":"Since 1958, the Prime Minister has had the power to nominate peers just for their own lifetime. These are called life peers. They have usually had an important career in politics, business, law or another profession. Life peers are appointed by the monarch on the advice of the Prime Minister.","p":2,"o":[["Life peers are appointed by the Prime Minister on the advice of the monarchy",0],["Life peers are appointed by the monarchy on the advice of the Prime Minister",1]]},{"g":274,"t":"How can you visit the Welsh Assembly?","e":"The Senedd is an open building. You can book guided tours or seats in the public galleries for the Welsh Assembly. To make a booking, contact the Assembly Booking Service","p":2,"o":[["By contacting the education service",0],["Through visitors services",0],["Using the booking service",1],["By queuing at the public entrance all day",0]]},{"g":275,"t":"Which political party is still known as the Tories?","e":"The modern Conservative Party is still sometimes referred to as the Tories","p":2,"o":[["Conservative",1],["Labour",0],["British National Party",0],["Liberal Democrats",0]]},{"g":276,"t":"Which TWO of these were introduced before the First World War in 1914?","e":"Financial help for the unemployed, old-age pensions and free school meals were just a few of the important measures introduced.","p":1,"o":[["National Health Service",0],["Free school meals",1],["Child Benefit payments",0],["State retirement pension",1]]},{"g":277,"t":"There is no upper age limit for doing jury service","e":"As well as getting the right to vote, people on the electoral register are randomly selected to serve on a jury. Anyone who is on the electoral register and is aged 18 to 70 can be asked to do this.","p":1,"o":[["False",1],["True",0]]},{"g":278,"t":"Which of these is correct in the chronological order?","e":"Magna Carta(1215), The Black Death (1348), The Canterbury Tales(1400)","p":1,"o":[["The Black Death, Canterbury Tales, Magna Carta",0],["Canterbury Tales, the Black Death, Magna Carta",0],["Magna Carta, the Black Death, Canterbury Tales,",1],["The Black Death, Magna Carta, Canterbury Tales",0]]},{"g":279,"t":"Which of these TWO countries are Commonwealth Members?","e":"Cameroon and Namibia are members of the Commonwealth","p":2,"o":[["Namibia",1],["USA",0],["Cameroon",1],["Germany",0]]},{"g":280,"t":"What does Eid al-Fitr celebrate?","e":"Eid al-Fitr celebrates the end of Ramadan, when Muslims have fasted for a month. They thank Allah for giving them the strength to complete the fast. The date when it takes place changes every year. Muslims attend special services and meals.","p":0,"o":[["The end of Ramadan",1],["That the prophet Ibrahim was willing to sacrifice his son when God ordered him to",0],["The founding of the Muslim community",0],["The struggle for religious freedom",0]]},{"g":281,"t":"In which year did the UK join the European Union (EU)?","e":"The European Union (EU), originally called the European Economic Community (EEC), was set up by six western European countries (Belgium, France, Germany, Italy, Luxembourg and the Netherlands) who signed the Treaty of Rome on 25 March 1957. The UK originally decided not to join this group but it became a member in 1973. After UK's Brexit vote, there are now 27 EU member states.","p":2,"o":[["1957",0],["1973",1],["1953",0],["1949",0]]},{"g":282,"t":"What is the minimum age for serving on a jury?","e":"As well as getting the right to vote, people on the electoral register are randomly selected to serve on a jury. Anyone who is on the electoral register and is aged 18 to 70 can be asked to do this.","p":2,"o":[["17",0],["16",0],["21",0],["18",1]]},{"g":283,"t":"William defeated James II at the Battle of the Boyne in Ireland in 1690. This event is celebrated in which country?","e":"William defeated James II at the Battle of the Boyne in Ireland in 1690, an event which is still celebrated by some in Northern Ireland today. William re-conquered Ireland and James fled back to France.","p":1,"o":[["Northern Ireland",1],["Wales",0],["Scotland",0],["England",0]]},{"g":284,"t":"Which one is not a valid UK coin?","e":"The currency in the UK is the pound sterling (symbol £). There are 100 pence in a pound. The denominations (values) of currency are - coins: 1p, 2p, 5p, 10p, 20p, 50p, £1 and £2; notes: £5, £10, £20, £50.","p":2,"o":[["25p",1],["2p",0],["5p",0],["50p",0]]},{"g":285,"t":"Who was the Prime minister and inspiration leader during the World War Two?","e":"Churchill was the son of a politician and, before becoming a Conservative MP in 1900, was a soldier and journalist. In May 1940 he became Prime Minister. He refused to surrender to the Nazis and was an inspirational leader to the British people in a time of great hardship. He lost the General Election in 1945 but returned as Prime Minister in 1951.","p":1,"o":[["Clement Attlee",0],["R A Butler",0],["Winston Churchill",1],["Alexander Fleming",0]]},{"g":286,"t":"What is the Grand National?","e":"Famous horse-racing events include: Royal Ascot, a five-day race meeting in Berkshire attended by members of the Royal Family; the Grand National at Aintree near Liverpool; and the Scottish Grand National at Ayr.","p":0,"o":[["Golf",0],["Horse racing",1],["Cricket",0],["Football",0]]},{"g":287,"t":"You can contact MPs only at their office in the House of Commons","e":"You can contact MPs by letter or telephone at their constituency Office, or at their Office in the House of Commons.","p":2,"o":[["False",1],["True",0]]}]},{"n":13,"name":"Life in the UK Test 13","q":[{"g":288,"t":"Who is the head of the Church of England?","e":"The monarch is the head of the Church of England. The spiritual leader of the Church of England is the Archbishop of Canterbury.","p":0,"o":[["The Duke of Edinburgh",0],["The Monarch",1],["The Pope",0],["The Prime Minister",0]]},{"g":289,"t":"Who ordered to write the Book of Common Prayer?","e":"Henry VIII was succeeded by his son Edward VI, who was strongly Protestant. During his reign, the Book of Common Prayer was written to be used in the Church of England.","p":1,"o":[["Edward VI",1],["Queen Mary",0],["Henry VIII",0],["Henry VII",0]]},{"g":290,"t":"What was the main crop in Ireland in the 19th century?","e":"In the 19th century, many people in Ireland depended on potatoes as a large part of their diet. In the middle of the century the potato crop failed, and Ireland suffered a famine. A million people died from disease and starvation.","p":1,"o":[["Tomato",0],["Potato",1],["Wheat",0],["Cucumber",0]]},{"g":291,"t":"What was the most important principle of the Enlightenment?","e":"One of the most important principles of the Enlightenment was that everyone should have the right to their own political and religious beliefs and that the state should not try to dictate to them.","p":1,"o":[["New technological advances",0],["Freedom of religion and political views",1],["Constitutional democracy",0],["Complete democracy",0]]},{"g":292,"t":"Which of the events is the landing of allied forces in Normandy?","e":"On 6 June 1944, allied forces landed in Normandy (this event is often referred to as 'D-Day').","p":1,"o":[["The Dunkirk spirit",0],["D-Day",1],["The Blitz",0],["The Battle of Britain",0]]},{"g":293,"t":"What did R. A. Butler introduce?","e":"R.A. Butler oversaw the introduction of the Education Act 1944 (often called 'The Butler Act'), which introduced free secondary education in England and Wales.","p":1,"o":[["Free college education in Scotland",0],["Free primary education in Wales",0],["Free secondary education in England",1],["Free university education in the UK",0]]},{"g":294,"t":"Who is considered ineligible to do jury service?","e":"Everyone who is summoned to do jury service must do it unless they are not eligible (for example, because they have a criminal conviction) or they provide a good reason to be excused, such as ill health.","p":2,"o":[["Judges",0],["Members of Parliament",0],["Police",0],["Anyone with a criminal conviction",1]]},{"g":295,"t":"In which year was the first Union Flag created?","e":"The Welsh dragon does not appear on the Union Flag because, when the first Union Flag was created in 1606 from the flags of Scotland and England, the Principality of Wales was already united with England.","p":1,"o":[["1801",0],["1606",1],["1707",0],["1800",0]]},{"g":296,"t":"What is the correct order of the Patron Saints' Days? (Starting from January)","e":"Only Scotland and Northern Ireland have their patron saint's day as an official holiday. Events are held across Scotland, Northern Ireland and the rest of the country, especially where there are a lot of people of Scottish, Northern Irish and Irish heritage.","p":1,"o":[["St David's Day, St Patrick's Day, St Andrew's Day, St George's Day",0],["St George's Day, St David's Day, St Patrick's Day, St Andrew's Day",0],["St David's Day, St Patrick's Day, St George's Day, St Andrew's Day",1],["St Patrick's Day, St David's Day, St Andrew's Day, St George's Day",0]]},{"g":297,"t":"In the 20th century, what did Sir Edwin Lutyens design to be the seat of government in India?","e":"In the 20th century, Sir Edwin Lutyens had an influence throughout the British Empire. He designed New Delhi to be the seat of government in India. After the First World War, he was responsible for many war memorials throughout the world, including the Cenotaph in Whitehall.","p":0,"o":[["Bangalore",0],["Mumbai",0],["New Delhi",1],["Kolkata",0]]},{"g":298,"t":"Select TWO early members of the Royal Society","e":"Charles II was interested in science. During his reign, the Royal Society was formed to promote 'natural knowledge'. This is the oldest surviving scientific society in the world. Among its early members were Sir Edmund Halley, who successfully predicted the return of the comet now called Halley's Comet, and Sir Isaac Newton.","p":0,"o":[["Sir Edmund Halley",1],["Sir Geoffrey Chaucer",0],["Sir Isaac Newton",1],["Sir William Shakespeare",0]]},{"g":299,"t":"Who resides in 10 Downing Street?","e":"The official home of the Prime Minister is 10 Downing Street, in central London, near the Houses of Parliament. He or she also has a country house outside London called Chequers.","p":2,"o":[["The Prime Minister",1],["King Charles III",0],["The President",0],["The Speaker",0]]},{"g":300,"t":"What is Boxing Day?(Choose TWO)","e":"Boxing Day is the day after Christmas Day and is a public holiday.","p":0,"o":[["The day after Christmas Day",1],["When people watch boxing championship",0],["A public holiday",1],["The day before New Year",0]]},{"g":301,"t":"The Commonwealth is an association of countries that support each other and work together towards shared goals in democracy and development","e":"The Commonwealth is an association of countries that support each other and work together towards shared goals in democracy and development. Most member states were once part of the British Empire, although a few countries which were not have also joined.","p":2,"o":[["False",0],["True",1]]},{"g":302,"t":"Where were the MacDonalds of Glencoe originally from?","e":"All Scottish clans were required formally to accept William as king by taking an oath. The MacDonalds of Glencoe were late in taking the oath and were all killed. The memory of this massacre meant some Scots distrusted the new government.","p":1,"o":[["Scotland",1],["England",0],["Wales",0],["Ireland",0]]},{"g":303,"t":"You should respect someone's right in court. In return, you are offered the right to a fair trial.","e":"You should always respect everyone rights in court. Vise versa everyone should respect your rights.","p":1,"o":[["False",0],["True",1]]},{"g":304,"t":"Which of these countries did NOT fight on the side of the Allied Powers during the First World War?","e":"The Allies fought against the Central Powers - mainly Germany, the Austro-Hungarian Empire, the Ottoman Empire and later Bulgaria.","p":1,"o":[["USA",0],["Italy",0],["Bulgaria",1],["Serbia",0]]},{"g":305,"t":"In the Church of Scotland, who is the Moderator?","e":"In Scotland, the national Church is the Church of Scotland, which is a Presbyterian Church. It is governed by ministers and elders. The chairperson of the General Assembly of the Church of Scotland is the Moderator, who is appointed for one year only and often speaks on behalf of that Church.","p":0,"o":[["The chairperson of the General Assembly, who is appointed for one year only and often speaks on behalf of the Church",1],["A key figure who is responsible for all relations with the Church of England",0],["A financial overseer who has overall responsibility for the accounts of the Church",0],["The spiritual leader of the Church, who is appointed for life",0]]},{"g":306,"t":"What is the name of the first major railway built in Britain?","e":"The Great Western Railway is the name of the first major railway built in Britain.","p":1,"o":[["The Great Western Railway",1],["Southern Railway",0],["Victorian Rail",0],["Blue Rail",0]]},{"g":307,"t":"The UK has a declining elderly population","e":"People in the UK are living longer than ever before. This is due to improved living standards and better health care. There are now a record number of people aged 85 and over. This has an impact on the cost of pensions and health care.","p":0,"o":[["True",0],["False",1]]},{"g":308,"t":"The Man Booker Prize is awarded in which area?","e":"The Man Booker Prize for Fiction is awarded annually for the best fiction novel written by an author from the Commonwealth, Ireland or Zimbabwe. It has been awarded since 1968. Past winners include Ian McEwan, Hilary Mantel and Julian Barnes.","p":0,"o":[["Movies",0],["Literature",1],["Music",0],["Theatre",0]]},{"g":309,"t":"Which two things should you do if you wish to be a permanent resident or citizen of the UK?","e":"If you wish to be a permanent resident or citizen of the UK, you should: respect and obey the law; respect the rights of others, including their right to their own opinions; treat others with fairness; look after yourself and your family; look after the area in which you live and the environment.","p":2,"o":[["Look after the roads",0],["Look after your stairs",0],["Look after the area in which you live and the environment",1],["Look after yourself and your family",1]]},{"g":310,"t":"Christmas Day, which celebrates the birth of Jesus Christ, is on which day?","e":"Christmas Day, 25 December, celebrates the birth of Jesus Christ. It is a public holiday. Many Christians go to church on Christmas Eve (24 December) or on Christmas Day itself.","p":0,"o":[["26-Dec",0],["01-Jan",0],["31-Dec",0],["25-Dec",1]]},{"g":311,"t":"What term arose after the evacuation of 300,000 people from the beaches?","e":"Many civilian volunteers in small pleasure and fishing boats from Britain helped the Navy to rescue more than 300,000 men from the beaches around Dunkirk. The evacuation gave rise to the phrase 'the Dunkirk spirit'.","p":1,"o":[["The British spirit",0],["The Blitz spirit",0],["D-Day",0],["The Dunkirk spirit",1]]}]},{"n":14,"name":"Life in the UK Test 14","q":[{"g":312,"t":"What is the fundamental principle of British life?","e":"The rule of law is one of the fundamental principles of British Life.","p":3,"o":[["Attending a Church on Sundays",0],["The rule of law",1],["Taking part in festivals",0],["Supporting your local team",0]]},{"g":313,"t":"Which word comes from the Viking language?","e":"Grimsby and Scunthorpe are the examples of words that come from the Viking languages.","p":1,"o":[["Arm",0],["Cow",0],["Leg",0],["Scunthorpe",1]]},{"g":314,"t":"Who designed the Clifton Suspension Bridge?","e":"Brunel was originally from Portsmouth, England. He was an engineer who built tunnels, bridges, railway lines and ships. He was responsible for constructing the Great Western Railway and the Clifton Suspension Bridge.","p":1,"o":[["Sir Christopher Wren",0],["Richard Arkwright",0],["Florence Nightingale",0],["Isambard Kingdom Brunel",1]]},{"g":315,"t":"What happens if an MP dies or resigns?","e":"If an MP dies or resigns, there will be a fresh election, called a by-election, in his or her constituency.","p":2,"o":[["A by-election is held",1],["Someone takes over",0],["The closest MP will have to cover",0],["A new General Election is held",0]]},{"g":316,"t":"How many times has the UK hosted the Olympic Games?","e":"The UK has hosted the Olympic Games on three occasions: 1908, 1948 and 2012. The main Olympic site for the 2012 Games was in Stratford, East London.","p":0,"o":[["3",1],["4",0],["1",0],["2",0]]},{"g":317,"t":"What does the 'R' Plate stand for?","e":"In Northern Ireland, a newly qualified driver must display an 'R' plate (for restricted driver) for one year after passing the test.","p":0,"o":[["Restricted Driver",1],["Repaired Damages",0],["Rage Drinking",0],["Refreshed Data",0]]},{"g":318,"t":"When did the Vikings first attack Britain?","e":"The Vikings came from Denmark and Norway. They first visited Britain in AD 789 to raid coastal towns and take away goods and slaves.","p":1,"o":[["AD 798",0],["AD 879",0],["AD 897",0],["AD 789",1]]},{"g":319,"t":"When was the Emancipation Act signed?","e":"In 1807, it became illegal to trade slaves in British ships or from British ports, and in 1833 the Emancipation Act abolished slavery throughout the British Empire. The Royal Navy stopped slave ships from other countries, freed the slaves and punished the slave traders.","p":1,"o":[["1813",0],["1833",1],["1807",0],["1821",0]]},{"g":320,"t":"How many members does the UN Security Council have?","e":"The UK is part of the United Nations (UN), an international organisation with more than 190 countries as members. The UN was set up after the Second World War and aims to prevent war and promote international peace and security. There are 15 members on the UN Security Council, which recommends action when there are international crises and threats to peace. The UK is one of five permanent members of the Security Council.","p":2,"o":[["150",0],["15",1],["5",0],["54",0]]},{"g":321,"t":"Who had the title 'Lord Protector'?","e":"After his campaign in Ireland and victory over Charles II at Worcester, Cromwell was recognised as the leader of the new republic. He was given the title of Lord Protector and ruled until his death in 1658.","p":1,"o":[["Oliver Cromwell",1],["Charles II",0],["Admiral Nelson",0],["Sir Francis Drake",0]]},{"g":322,"t":"When did William of Orange invade England?","e":"In 1688, important Protestants in England asked William to invade England and proclaim himself king.","p":1,"o":[["1696",0],["1684",0],["1692",0],["1688",1]]},{"g":323,"t":"The process 'Highland Clearances' happened due to rebellion of slaves","e":"A process began which became known as the 'Highland Clearances'. Many Scottish landlords destroyed individual small farms (known as 'crofts') to make space for large flocks of sheep and cattle. Evictions became very common in the early 19th century. Many Scottish people left for North America at this time.","p":1,"o":[["True",0],["False",1]]},{"g":324,"t":"What prehistoric village (off the north coast of Scotland) has helped archaeologists to understand more about how people lived near the end of the Stone Age?","e":"Skara Brae on Orkney, off the north coast of Scotland, is the best preserved prehistoric village in northern Europe, and has helped archaeologists to understand more about how people lived near the end of the Stone Age.","p":1,"o":[["Shetland",0],["St Helena",0],["Falkland Islands",0],["Skara Brae on Orkney",1]]},{"g":325,"t":"In what county can you see a hill fort at Maiden Castle?","e":"A very impressive hill fort can still be seen today at Maiden Castle, in the English county of Dorset.","p":1,"o":[["Dorset",1],["Wiltshire",0],["Cheshire",0],["Lancashire",0]]},{"g":326,"t":"What is the 'Grand National'?","e":"The Grand National at Aintree near Liverpool and the Scottish Grand National at Ayr are well known horse racing events.","p":0,"o":[["A motor race",0],["A horse race",1],["A football cup competition",0],["A tennis championship",0]]},{"g":327,"t":"On which TWO occasions will there be a fresh election, called a by-election, in MP's constituency?","e":"MPs are elected at a General Election, which is held at least every five years. If an MP dies or resigns, there will be a fresh election, called a by-election, in his or her constituency. MPs are elected through a system called 'first past the post'.","p":2,"o":[["Gets ill",0],["Dies",1],["Goes abroad",0],["Resigns",1]]},{"g":328,"t":"How is the Speaker elected?","e":"Debates in the House of Commons are chaired by the Speaker. This person is the chief Officer of the House of Commons. The Speaker is neutral and does not represent a political party, even though he or she is an MP, represents a constituency and deals with constituents' problems like any other MP. The Speaker is chosen by other MPs in a secret ballot.","p":2,"o":[["The Archbishop of Canterbury chooses the Speaker",0],["Fellow MPs choose the Speaker",1],["The Monarch appoints the Speaker",0],["The PM chooses the Speaker",0]]},{"g":329,"t":"Why was the Habeas Corpus Act (1679) so important?","e":"The Habeas Corpus Act became law in 1679. This was a very important piece of legislation which remains relevant today. Habeas corpus is Latin for 'you must present the person in court'. The Act guaranteed that no one could be held prisoner unlawfully. Every prisoner has a right to a court hearing.","p":1,"o":[["It gave women their property rights",0],["It gave women the right to vote",0],["It guaranteed that no one could be held prisoner unlawfully",1],["It limited the power of the monarch",0]]},{"g":330,"t":"At what age did Queen Victoria become Queen of the UK?","e":"In 1837, Queen Victoria became queen of the UK at the age of 18. She reigned until 1901, almost 64 years. At the date of writing (2013) this is the longest reign of any British monarch. Her reign is known as the Victorian Age.","p":1,"o":[["7 years old",0],["3 years old",0],["18 years old",1],["One week old",0]]},{"g":331,"t":"During the Victorian period, transport link improved, enabling goods and people to move easily around the country","e":"The statement is true","p":1,"o":[["True",1],["False",0]]},{"g":332,"t":"What was the more probable use for the Stonehenge?","e":"Stonehenge, still stands in what is now the English county of Wiltshire. Stonehenge was probably a special gathering place for seasonal ceremonies","p":1,"o":[["A special gathering place for seasonal ceremonies",1],["A safe place for shelter",0],["A fort for soldiers",0],["A hiding place from enemies",0]]},{"g":333,"t":"John Constable (1776-1837) founded the modern Police force in England","e":"John Constable (1776-1837) was a landscape painter most famous for his works of Dedham Vale on the Suffolk-Essex border in the east of England.","p":1,"o":[["False",1],["True",0]]},{"g":334,"t":"When was the Parliament of Northern Ireland first established?","e":"A Northern Ireland Parliament was established in 1922, when Ireland was divided, but it was abolished in 1972, shortly after the Troubles broke out in 1969. The Northern Ireland Assembly was established soon after the Belfast Agreement (or Good Friday Agreement) in 1998.","p":2,"o":[["1999",0],["1986",0],["1937",0],["1922",1]]},{"g":335,"t":"How old do you have to be to buy a lottery ticket or a scratch card?","e":"People under 18 (Changed in 2021) are not allowed to participate in the National Lottery. This includes buying Scratch Cards.","p":0,"o":[["18",1],["17",0],["15",0],["16",0]]}]},{"n":15,"name":"Life in the UK Test 15","q":[{"g":336,"t":"When is St David's day?","e":"St David's day is on the 1st of March. He is a Patron St of Wales.","p":0,"o":[["1st of March",1],["23rd of April",0],["30th of November",0],["17th of March",0]]},{"g":337,"t":"What did the Chartists campaign for?","e":"The Chartists demanded the vote for the working classes and other people without property.","p":1,"o":[["The right to vote for the 21 year olds",0],["The right to vote for the working class",1],["The right to vote for the women",0],["The right to vote for the 18 year olds",0]]},{"g":338,"t":"What do you need to apply for UK citizenship?","e":"To apply to become a permanent resident or citizen of the UK, you will need to: speak and read English; have a good understanding of life in the UK.","p":3,"o":[["Have a driving license",0],["Speak and read English",1],["Be able to use computers in English",0],["Have a university degree",0]]},{"g":339,"t":"Who won gold medals in rowing in five consecutive Olympic Games?","e":"Sir Steve Redgrave won gold medals in rowing in five consecutive Olympic Games and is one of Britain's greatest Olympians.","p":0,"o":[["Sir Steve Redgrave",1],["Sir Chris Hoy",0],["Dame Ellen MacArthur",0],["Sir Roger Bannister",0]]},{"g":340,"t":"When did the WWI begin?","e":"The first World War began in 1914 and ended in 1918.","p":1,"o":[["1918",0],["1914",1],["1941",0],["1939",0]]},{"g":341,"t":"Where did the supporters of Charles Edward Stuart come from?","e":"Charles Edward Stuart (Bonnie Prince Charlie), the grandson of James II, landed in Scotland. He was supported by clansmen from the Scottish highlands and raised an army.","p":3,"o":[["Edinburgh",0],["Glasgow",0],["Highlands",1],["Aberdeen",0]]},{"g":342,"t":"What is the official name of the country?","e":"The official name of the country is the United Kingdom of Great Britain and Northern Ireland. 'Great Britain' refers only to England, Scotland and Wales, not to Northern Ireland.","p":4,"o":[["The United Kingdom of Great Britain and Northern Ireland",1],["The UK and Ireland",0],["United Kingdom",0],["Great Britain",0]]},{"g":343,"t":"What is the British Constitution often described as?","e":"The British constitution is not written down in any single document, and therefore it is described as 'unwritten'. This is mainly because the UK, unlike America or France, has never had a revolution which led permanently to a totally new system of government.","p":2,"o":[["Unwritten",1],["Written down",0],["Documented",0],["Preserved",0]]},{"g":344,"t":"What was the population of the UK in 1998?","e":"Population growth in the UK (Year, Population): (1600, Just over 4 million), (1700, 5 million), (1801, 8 million), (1851, 20 million), (1901, 40 million), (1951, 50 million), (1998, 57 million), (2005, Just under 60 million), (2010, Just over 62 million).","p":0,"o":[["60 million",0],["57 million",1],["40 million",0],["50 million",0]]},{"g":345,"t":"Which TWO words appear in the first two lines of the national anthem 'God save the Queen/King'?","e":"The first verse is: 'God save our gracious King! Long live our noble King! God save the King! Send him victorious, Happy and glorious, Long to reign over us, God save the King!'.","p":2,"o":[["Gracious",1],["Noble",1],["Royal",0],["Majesty",0]]},{"g":346,"t":"What % of the UK population does Wales account for?","e":"As per 2021 census, the UK population at mid-year was estimated to be 67.0 million, an increase of 3.7 million (5.9%) on the population in mid-2011. Wales accounted for 3,064,000 people - just above 4.5% of the UK population.","p":0,"o":[["5",1],["1",0],["10",0],["2",0]]},{"g":347,"t":"Members in the Welsh Assembly can speak English and Welsh, and all publications of the Assembly are in both languages","e":"The statement is true","p":2,"o":[["False",0],["True",1]]},{"g":348,"t":"How old was the Queen of Scotland, Mary Stuart when her father died and she became Queen?","e":"The queen of Scotland, Mary Stuart (often now called 'Mary, Queen of Scots') was a Catholic. She was only a week old when her father died and she became queen.","p":1,"o":[["7 years",0],["1 year",0],["1 month",0],["1 week",1]]},{"g":349,"t":"When was the first public film shown in the UK?","e":"Films were first shown publicly in the UK in 1896 and film screenings very quickly became popular. From the beginning, film makers became famous for clever special effects and this continues to be an area of British expertise.","p":0,"o":[["1904",0],["1896",1],["1902",0],["1899",0]]},{"g":350,"t":"What is the name given to the PM's country house?","e":"The official home of the Prime Minister is 10 Downing Street, in central London, near the Houses of Parliament. He or she also has a country house outside London called Chequers.","p":2,"o":[["Quaker",0],["Country Retreat",0],["Chequers",1],["Windsor Palace",0]]},{"g":351,"t":"How long did the Hundred Years War last for?","e":"English kings also fought a long war with France, called the Hundred Years War (even though it actually lasted 116 years). One of the most famous battles of the Hundred Years War was the Battle of Agincourt in 1415, where King Henry V's vastly outnumbered English army defeated the French. The English left France in the 1450s.","p":1,"o":[["100 years",0],["116 years",1],["97 years",0],["108 years",0]]},{"g":352,"t":"All Acts of Parliament are made in who's name?","e":"The Monarch (King Charles III) has important ceremonial roles, such as the opening of the new parliamentary session each year. On this occasion the King makes a speech which summarises the government’s policies for the year ahead. All Acts of Parliament are made in his name.","p":2,"o":[["The Prime Minister's",0],["The King's",1],["The Prince's",0],["The Parliament's",0]]},{"g":353,"t":"In which year was there a major outbreak of plague in London?","e":"During Charles II's reign, in 1665, there was a major outbreak of plague in London. Thousands of people died, especially in poorer areas. The following year, a great fire destroyed much of the city, including many churches and St Paul's Cathedral.","p":1,"o":[["1665",1],["1765",0],["1565",0],["1465",0]]},{"g":354,"t":"Which TWO are facts about King William II of Scotland?","e":"James II's elder daughter, Mary, was married to her cousin William of Orange, the Protestant ruler of the Netherlands. In 1688, important Protestants in England asked William to invade England and proclaim himself king. When William reached England, there was no resistance. James fled to France and William took over the throne, becoming William III in England, Wales and Ireland, and William II of Scotland.","p":1,"o":[["He was married to the young daughter of King James II of England, Wales and Ireland",0],["He was defeated by King James II of England when the latter tried to take back the crown",0],["He was William of Orange before he became King William III of England. Wales and Ireland",1],["He was the Protestant rule of the Netherlands before he became King William II of Scotland",1]]},{"g":355,"t":"Eid al-Fitr and Eid ul Adha are festivals celebrated by which religion?","e":"Eid al-Fitr celebrates the end of Ramadan, when Muslims have fasted for a month. They thank Allah for giving them the strength to complete the fast. The date when it takes place changes every year. Muslims attend special services and meals. Eid ul Adha remembers that the prophet Ibrahim was willing to sacrifice his son when God ordered him to. It reminds Muslims of their own commitment to God. Many Muslims sacrifice an animal to eat during this festival. In Britain this has to be done in a slaughterhouse.","p":0,"o":[["Christianity",0],["Sikhism",0],["Buddhism",0],["Islam",1]]},{"g":356,"t":"It is compulsory to join National Citizen Service programme for 16 and 17 year olds","e":"There are many opportunities for young people to volunteer and receive accreditation which will help them to develop their skills. These include the National Citizen Service programme, which gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project.","p":2,"o":[["True",0],["False",1]]},{"g":357,"t":"Where are all minor criminal cases heard in England, Wales and Northern Ireland?","e":"In England, Wales and Northern Ireland, most minor criminal cases are dealt with in a Magistrates' Court. In Scotland, minor criminal offences go to a Justice of the Peace Court.","p":2,"o":[["Sheriff court",0],["High court",0],["County court",0],["Magistrates' court",1]]},{"g":358,"t":"What's the objective of the Commonwealth?","e":"The Commonwealth is an association of countries that support each other and work together towards shared goals in democracy and development. Most member states were once part of the British Empire, although a few countries which were not have also joined.","p":2,"o":[["Achieve goals in democracy and development",1],["Promote free trade",0],["Allow visa free migration across the member states",0],["Promote peace across the world",0]]},{"g":359,"t":"Which one of the following is the most famous play written by Shakespeare?","e":"Shakespeare was born in Stratford-upon-Avon, England. He was a playwright and actor and wrote many poems and plays. His most famous plays include A Midsummer Night's Dream, Hamlet, Macbeth and Romeo and Juliet.","p":1,"o":[["Under Milk Wood",0],["The Jungle Book",0],["A Midsummer Night's Dream",1],["The Canterbury Tales",0]]}]},{"n":16,"name":"Life in the UK Test 16","q":[{"g":360,"t":"What marked the beginning of 'constitutional monarchy'?","e":"The laws passed after the Glorious Revolution are the beginning of what is called 'constitutional monarchy'.","p":1,"o":[["The Glorious Revolution",1],["The English Civil War",0],["The Restoration",0],["The Magna Carta",0]]},{"g":361,"t":"Who sat in the House of Lords in the middle ages?","e":"The nobility, great landowners and bishops sat in the House of Lords.","p":1,"o":[["Wealthy People",0],["The nobility and great landowners",1],["Every Landowner",0],["Knights",0]]},{"g":362,"t":"Which of these charities works with children?","e":"The National Society for the Prevention of Cruelty to Children (NSPCC) works with children.","p":2,"o":[["NSPCC",1],["The National Trust",0],["PDSA",0],["Crisis and Shelter",0]]},{"g":363,"t":"Who won the Wars of the Roses?","e":"This war was called the Wars of the Roses, because the symbol of Lancaster was a red rose and the symbol of York was a white rose. The war ended with the Battle of Bosworth Field in 1485. King Richard III of the House of York was killed in the battle and Henry Tudor, the leader of the House of Lancaster, became King Henry VII.","p":1,"o":[["House of Lancaster",1],["House of Lords",0],["House of Commons",0],["House of York",0]]},{"g":364,"t":"Which country(s) did Britain fight against during the Battle of Trafalgar?","e":"Britain's navy fought against combined French and Spanish fleets, winning the Battle of Trafalgar in 1805.","p":1,"o":[["Only the Netherlands",0],["Spain and France",1],["France and the Netherlands",0],["Only France",0]]},{"g":365,"t":"What is an important part of the UK character?","e":"The traditions of comedy and satire, and the ability to laugh at ourselves, are an important part of the UK character.","p":0,"o":[["Go to University",0],["The ability to laugh at ourselves",1],["To have fish and chips every lunch",0],["Go to the pub every Friday",0]]},{"g":366,"t":"When is the Bonfire Night celebrated?","e":"Bonfire Night, 5 November, is an occasion when people in Great Britain set off fireworks at home or in special displays. The origin of this celebration was an event in 1605, when a group of Catholics led by Guy Fawkes failed in their plan to kill the Protestant king with a bomb in the Houses of Parliament.","p":0,"o":[["05-Nov",1],["31-Oct",0],["28-Oct",0],["28-Nov",0]]},{"g":367,"t":"Where did many of the Viking settle after they got defeated?","e":"The Anglo-Saxon kingdoms in England united under King Alfred the Great, who defeated the Vikings. Many of the Viking invaders stayed in Britain - especially in the east and north of England, in an area known as the Danelaw (many places names there, such as Grimsby and Scunthorpe, come from the Viking languages).","p":1,"o":[["Pale",0],["Danelaw",1],["Dorset",0],["Lancashire",0]]},{"g":368,"t":"Which flower is associated with Northern Ireland?","e":"Shamrock is associated with Northern Ireland","p":0,"o":[["Rose",0],["Thistle",0],["Daffodil",0],["Shamrock",1]]},{"g":369,"t":"Civil servants are expected to be politically neutral, what core values should they have?","e":"Civil servants are expected to carry out their role with dedication and a commitment to the civil service and its core values. These are: integrity, honesty, objectivity and impartiality (including being politically neutral).","p":2,"o":[["Impartiality",1],["Corruption",0],["Misleading",0],["Sense of humour",0]]},{"g":370,"t":"Who chairs the debates in the House of Commons?","e":"Debates in the House of Commons are chaired by the Speaker. This person is the chief Officer of the House of Commons. The Speaker is neutral and does not represent a political party, even though he or she is an MP, represents a constituency and deals with constituents' problems like any other MP. The Speaker is chosen by other MPs in a secret ballot.","p":2,"o":[["The Speaker",1],["The Judge",0],["The Shadow Minister",0],["The Prime Minister",0]]},{"g":371,"t":"How many members does the Welsh Assembly have?","e":"The Welsh Assembly has 60 members, with forty members chosen to represent individual Senedd constituencies, and twenty to represent the five electoral regions of the Senedd in Wales.","p":2,"o":[["108",0],["140",0],["129",0],["60",1]]},{"g":372,"t":"On what day does 'Lent' begin?","e":"The 40 days before Easter are known as Lent. It is a time when Christians take time to reflect and prepare for Easter. Traditionally, people would fast during this period and today many people will give something up, like a favourite food. The day before Lent starts is called Shrove Tuesday, or Pancake Day. Lent begins on Ash Wednesday.","p":0,"o":[["Good Friday",0],["Ash Wednesday",1],["Shrove Tuesday",0],["Pancake day",0]]},{"g":373,"t":"Select TWO famous Athletes","e":"Sir Roger Bannister (1929-) was the first man in the world to run a mile in under four minutes, in 1954. Mo Farah (1983-) is a British distance runner, born in Somalia. He won gold medals in the 2012 Olympics for the 5,000 and 10,000 metres and is the first Briton to win the Olympic gold medal in the 10,000 metres.","p":0,"o":[["Sir Roger Bannister",1],["Mo Farah",1],["John Barbour",0],["Henry Moore",0]]},{"g":374,"t":"Sir Kingsley Amis was a famous English novelist and poet who wrote more than 20 novels, including 'Lucky Jim'","e":"Sir Kingsley Amis (1922-95) was an English novelist and poet. He wrote more than 20 novels. The most well-known is Lucky Jim.","p":0,"o":[["False",0],["True",1]]},{"g":375,"t":"What is the Church of England also known as in Scotland and the US?","e":"In England, there is a constitutional link between Church and state. The official Church of the state is the Church of England (called the Anglican Church in other countries and the Episcopal Church in Scotland and the United States). It is a Protestant Church and has existed since the Reformation in the 1530s","p":1,"o":[["Protestant Church",0],["Catholic Church",0],["Anglican Church",0],["Episcopal Church",1]]},{"g":376,"t":"The Patron Saints' days are NOT public holidays in which TWO countries?","e":"Only Scotland and Northern Ireland have their Patron Saint's day as an official holiday. While the Patron Saints' days are no longer public holidays in England and Wales, they are still celebrated. Parades and small festivals are held all over the two countries.","p":0,"o":[["Scotland",0],["Northern Ireland",0],["Wales",1],["England",1]]},{"g":377,"t":"What percentage of the workforce are women?","e":"Women in Britain today make up about half of the workforce. On average, girls leave school with better qualifications than boys. More women than men study at university.","p":0,"o":[["60%",0],["50%",1],["40%",0],["30%",0]]},{"g":378,"t":"What is a traditional pub game?","e":"Pub quizzes are popular. Pool and darts are traditional pub games.","p":0,"o":[["Roulette",0],["Pool",1],["Chess",0],["Poker",0]]},{"g":379,"t":"When did a group of Catholics led by Guy Fawkes fail in their plan to kill the Protestant king with a bomb in the Houses of Parliament?","e":"Bonfire Night, 5 November, is an occasion when people in Great Britain set off fireworks at home or in special displays. The origin of this celebration was an event in 1605, when a group of Catholics led by Guy Fawkes failed in their plan to kill the Protestant king with a bomb in the Houses of Parliament.","p":0,"o":[["5th November 1705",0],["5th November 1605",1],["5th November 1405",0],["5th November 1505",0]]},{"g":380,"t":"What tells us about how people lived just after the Norman Conquest?","e":"William sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book. It still exists today and gives a picture of society in England just after the Norman Conquest.","p":1,"o":[["The best preserved prehistoric village",0],["The Domesday Book",1],["The Bayeux Tapestry",0],["The Great Charter",0]]},{"g":381,"t":"In 1913, the British government promised 'Home Rule' for Ireland, why was this postponed?","e":"In 1913, the British government promised 'Home Rule' for Ireland. It was opposed by the Protestants in the north of Ireland, who threatened to resist Home Rule by force. The outbreak of the First World War led the British government to postpone any changes in Ireland. Irish Nationalists were not willing to wait and in 1916 there was an uprising (the Easter Rising) against the British in Dublin. A guerilla war against the British army and the police in Ireland followed. In 1921 a peace treaty was signed and in 1922 Ireland became two countries.","p":1,"o":[["The Scottish people also wanted to self-govern",0],["The outbreak of World War I",1],["The English people complained",0],["It was opposed by Catholics",0]]},{"g":382,"t":"The British constitution is not written down in any single document, and therefore it is described as 'unwritten'.","e":"A constitution is a set of principles by which a country is governed. It includes all of the institutions that are responsible for running the country and how their power is kept in check. The constitution also includes laws and conventions. The British constitution is not written down in any single document, and therefore it is described as 'unwritten'.","p":1,"o":[["True",1],["False",0]]},{"g":383,"t":"What did the Chartists campaign for?","e":"In the 1830s and 1840s, a group called the Chartists campaigned for reform. They wanted six changes: for every man to have the vote; elections every year; for all regions to be equal in the electoral system; secret ballots; for any man to be able to stand as an MP; for MPs to be paid.","p":1,"o":[["Open ballots",0],["Elections every 5 years",0],["Anyone to be able to stand as an MP",0],["Every man to have a vote",1]]}]},{"n":17,"name":"Life in the UK Test 17","q":[{"g":384,"t":"Which of the following is part of the UK?","e":"The United Kingdom consists of Wales,England,Scotland and Northern Ireland.","p":4,"o":[["Wales",1],["Channel Islands",0],["Canada",0],["St Helena",0]]},{"g":385,"t":"Who became one of the most popular monarchs in the 16th century?","e":"Queen Elizabeth I became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada.","p":1,"o":[["Henry VII",0],["Henry VIII",0],["Mary I",0],["Elizabeth I",1]]},{"g":386,"t":"When did the BBC start the first radio broadcast?","e":"The BBC started radio broadcasts in 1922 and began the world's first regular television service in 1936.","p":1,"o":[["1928",0],["1922",1],["1903",0],["1936",0]]},{"g":387,"t":"Where do the Laurence Olivier Awards take place?","e":"The Laurence Olivier Awards take place annually at different venues in London. There are a variety of categories, including best director, best actor and best actress. The awards are named after the British actor Sir Laurence Olivier, later Lord Olivier, who was best known for his roles in various Shakespeare plays.","p":0,"o":[["London",1],["Edinburgh",0],["Manchester",0],["Kent",0]]},{"g":388,"t":"Who were the first people to start living in Britain?","e":"The first people to live in Britain were hunter-gatherers, in what we call the Stone Age.","p":1,"o":[["Pirates",0],["The Romans",0],["Inventors",0],["Hunter-gatherers",1]]},{"g":389,"t":"Where can you find Boudicca, the Queen of the Iceni statue?","e":"One of the tribal leaders who fought against the Romans was Boudicca, the queen of the Iceni in what is now eastern England. She is still remembered today and there is a statue of her on Westminster Bridge in London, near the Houses of Parliament.","p":1,"o":[["L
