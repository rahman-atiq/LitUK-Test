<style>
/* Rose-and-periwinkle. Every foreground/background pair below clears WCAG AA
   (4.5:1) in both themes — the palette was picked against the numbers, not by
   eye, because a soft palette is exactly where low contrast hides.

   --on-solid is the ink that sits on a saturated fill (--brand, --good, --bad):
   white in light, near-black in dark. It exists because the fills invert with
   the theme and the text on them has to invert too. The hardcoded `#fff` it
   replaced was 1.83:1 on the dark theme's green — a white tick on mint that you
   could not actually read. */
/* Rose-and-periwinkle. Every foreground/background pair below clears WCAG AA
   (4.5:1) in both themes — the palette was picked against the numbers, not by
   eye, because a soft palette is exactly where low contrast hides.

   --brand is the working colour and carries every interactive thing. --accent is
   the rose it is partnered with, and is spent ONLY on washes and gradients, never
   on text: it is the decorative half of the pair, and the moment it starts
   labelling things the page has two competing action colours.

   --shadow is four stacked layers rather than one blur. A single large shadow
   reads as a drop shadow; several tight ones with falling opacity read as an
   object sitting a few millimetres off the page, which is the whole difference
   between "a div with a box-shadow" and something that looks made. The dark
   theme adds a 1px inset top highlight, because on a dark panel a lit top edge
   does the job that a shadow does on a light one. */
:root{
  --bg:#fbf7fa; --panel:#ffffff; --panel-2:#f8f3f8; --ink:#2a2333; --muted:#6b6076;
  --line:#ebdfe9; --brand:#5468c4; --brand-ink:#ffffff; --on-solid:#ffffff; --accent:#b4557f;
  --good:#12795a; --good-bg:#e6f4ee;
  --bad:#c3374c; --bad-bg:#fceaee; --warn:#a06c0a; --chip:#f2eaf2;
  --shadow:0 1px 1px rgba(42,35,51,.04),0 2px 4px rgba(42,35,51,.04),0 6px 12px rgba(42,35,51,.05),0 12px 24px rgba(42,35,51,.04);
  --ring:#5468c433; --radius:16px;
  /* Two faces, borrowed wholesale from the hub (index.html) so the two halves of
     the app finally sound like one voice. --sans carries everything you read at
     length; --serif is spent only on headings, section names and the test
     numbers, which is the whole reason the page stopped reading as a utility.
     Both are system stacks: this app is installable and precached, and a webfont
     that 404s offline is a worse heading than a plain one. */
  --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Baskerville","Iowan Old Style","Palatino Linotype","Palatino",Georgia,serif;
  /* One colour per syllabus topic, for the fingerprint stripe on every tile.
     Mid-toned for the same reason GRP_ACC is: these are 4px blocks that sit on
     --panel in BOTH themes, so a single set has to clear 3:1 on white and on
     near-black at once. They deliberately span more hue than the rose-to-
     periwinkle ramp — the ramp's job is to keep five sections related, this
     one's job is to keep five topics apart at four pixels tall. */
  --t0:#2f9e8f; --t1:#c2882c; --t2:#6b7fd7; --t3:#c2628f; --t4:#4f9d5b;
}
html[data-theme="dark"]{
  --bg:#15111d; --panel:#1f1929; --panel-2:#272031; --ink:#ece5f2; --muted:#a79eb4;
  --line:#322a40; --brand:#93a3ec; --brand-ink:#1a1526; --on-solid:#1a1526; --accent:#e8a0c0;
  --good:#43d69a; --good-bg:#102e23;
  --bad:#ff7a8a; --bad-bg:#2e1620; --warn:#e6bc55; --chip:#2b2338;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
  --ring:#93a3ec44;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  /* Nothing here is meant to scroll sideways — without this a single wide child
     drags the whole page off-centre every time you tap. */
  overflow-x:hidden}
/* Buttons inherit neither colour nor font — the UA hands them `buttontext`,
   which is black, and its own 13.33px face. Every button class here sets its
   own colour except the three built on .card (.act, .drill, .tcard), and those
   rendered black titles on the dark theme's dark panels. The font half of the
   same gap is why .act .t (no size of its own) once sat at 13.33px above a .d
   that was explicitly smaller — a title 0.8px larger than its description was
   never the intent. Anything with its own colour or size still wins on specificity. */
button{font:inherit;color:inherit}
button,.opt,.dot,summary,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--brand);text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
/* Header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  transition:transform .2s ease}
/* Two rows of header pinned at every scroll position is ~100px of a phone
   screen spent on navigation you are not using while you read a question. It
   leaves on the way down and comes back the moment you scroll up — no tap, no
   hunting for it. Layout is untouched, so toQuestionTop() still measures the
   same header it always did. */
header.hd-away{transform:translateY(-100%)}
@media(prefers-reduced-motion:reduce){header{transition:none}}
.hd{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.brand .flag{flex:none;font-size:22px;line-height:0}
/* An image, not the emoji — Windows renders 🇬🇧 as the letters "GB". */
.brand .flag img{display:block;width:24px;height:auto;border-radius:2px}
/* The title stays on one line and ellipsises — it must never wrap to "Life / in / the / UK". */
.brand .name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.hubLink{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-weight:700;text-decoration:none}
.hubLink:hover{border-color:var(--brand);color:var(--brand)}
.spacer{flex:1}
.icon-btn{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--brand)}
.nav{display:flex;flex:none;gap:4px}
.nav button{border:none;background:transparent;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap}
.nav button:hover{background:var(--chip);color:var(--ink)}
/* iOS has no hover and the tap highlight is off above, so every target has to say
   "pressed" itself or the page feels dead under a thumb. */
.icon-btn:active,.hubLink:active,.nav button:active{background:var(--chip)}
.nav button.on{background:var(--brand);color:var(--brand-ink)}
/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
h1{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.015em;margin:22px 0 5px;line-height:1.12}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
/* ---- Page hero band ----
   Name, rail, two figures — and nothing else. It also carried an eyebrow reading
   "Life in the UK" and a three-clause sentence of specs, but the header an inch
   above already says "Life in the UK / Practice Tests", the pass mark is a
   constant you learn once, and a rail states "how far through" better than any
   sentence can. What is left is the number this page exists to move and the
   clock it is running against. */
.phero{position:relative;margin:16px 0 14px;padding:15px 18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),color-mix(in srgb,var(--brand) 12%,var(--panel)) 58%,var(--panel));
  border-color:color-mix(in srgb,var(--brand) 24%,var(--line))}
.phero h1{margin:0 0 11px;font-size:26px}
/* The band stages itself once, on the first paint, and never again.
   renderDashboard() rebuilds innerHTML on every filter tap, every section
   toggle, every close of the settings panel and every backup note — and a band
   that re-flies-in each time makes tapping a chip feel like a page load. The
   class is set by the first render and by nothing after it. */
.phero.in{animation:heroIn .32s ease both}
@keyframes heroIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rail{height:9px;border-radius:9px;overflow:hidden;
  background:color-mix(in srgb,var(--ink) 9%,transparent)}
.rail > i{display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,var(--accent),var(--brand));
  transition:width .7s cubic-bezier(.2,.7,.2,1)}
.rail-l{display:flex;justify-content:space-between;gap:10px;margin-top:7px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* Neither figure is decoration: left is the progress, right is the clock. The
   clock borrows the thresholds the Days-to-exam stat box already uses, so when
   the page starts going red it does it in one voice. */
.rail-l b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.rail-l .brand{color:var(--brand)} .rail-l .bad{color:var(--bad)}
@media (max-width:560px){.phero{padding:14px 15px}.phero h1{font-size:22px}}
/* ---- Start here ----
   150 identical doors, and no reason to open one rather than another, is most of
   why this page felt like wallpaper. This is the open one: the next paper you
   have never sat, or — once they are all sat — the weakest one you have not yet
   passed. It wears the colour of the section it belongs to, so it also says
   where you are about to land. It sits directly under the band, because a
   recommendation you only meet after 1,500px of dashboard is not one.

   It and the drill share a row (.duo). Stacked full-width they were 300px of the
   first screen spent saying "here are two buttons"; side by side they are a
   choice you make in one look. The pair is deliberately unequal — this one keeps
   its section wash and the primary button, the drill goes flat. One of them is
   the answer to "what now", the other is the habit. */
.duo{grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 14px}  /* gap comes from .grid, declared below */
.duo > .card{margin:0;min-width:0}
.nextup{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px;margin:0;
  cursor:pointer;transition:transform .14s,border-color .14s,box-shadow .14s;
  border-color:color-mix(in srgb,var(--tone) 38%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--tone) 15%,var(--panel)),var(--panel) 72%)}
.nextup:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--tone) 62%,var(--line));
  box-shadow:0 3px 6px rgba(42,35,51,.05),0 12px 26px color-mix(in srgb,var(--tone) 17%,transparent)}
.nextup:active{transform:scale(.99)}
.nextup .ico{flex:0 0 auto;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  font-size:22px;line-height:1;background:color-mix(in srgb,var(--tone) 17%,var(--panel));
  border:1px solid color-mix(in srgb,var(--tone) 32%,var(--line))}
.nextup .body{flex:1;min-width:0}
.nextup .k{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:color-mix(in srgb,var(--tone) 72%,var(--ink));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .t{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
  margin-top:1px;font-variant-numeric:lining-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .d{color:var(--muted);font-size:12.5px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .go{flex:0 0 auto}
/* ---- The tests header and its filters ----
   Four chips over 150 tiles. Nothing is added to the page that was not already
   on it — the chips only decide which tiles are drawn — but a section of 45
   shrinks to the six you still owe, which is the difference between a library
   and a wall. */
.tests-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 11px}
.tests-head h2{flex:1 0 auto;margin:0;font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.012em}
/* The expander is a control, not a filter — and a bordered chip an inch above
   four real ones said it was one. Plain text, right-aligned, out of the way.
   The settings summary that used to sit beside it is gone entirely: the gear in
   the header opens the same panel, and the summary was a 280px nowrap chip that
   forced this row to two lines on its own. */
.tests-head .ftog{flex:none;border:0;background:transparent;color:var(--muted);
  font-weight:700;font-size:12.5px;padding:6px 2px;cursor:pointer}
.tests-head .ftog:hover,.tests-head .ftog:active{color:var(--brand)}
/* Four chips measured ~411px against the 361px a phone gives them, so the row
   was always two. Six pixels of gap and one off each side of every chip lands
   it near 358px — three pixels of margin, which is the one number on this page
   that has to be looked at on the device rather than trusted. */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 13px}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
  font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:20px;transition:.12s}
.fchip:hover{border-color:var(--brand);color:var(--ink)}
.fchip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.fchip .c{margin-left:5px;font-weight:600;opacity:.7;font-variant-numeric:tabular-nums}
.fchip:disabled{opacity:.45;cursor:not-allowed}
.fchip:disabled:hover{border-color:var(--line);color:var(--muted)}
.grid{display:grid;gap:12px}
/* Two up on a phone, three on anything wider. auto-fit was the wrong tool: it
   sized tracks off a 140px floor, so a 900px page took five columns and any tile
   count that was not a multiple of five left a tile sitting alone beside a hole
   most of the page wide. Fixed counts plus the two orphan rules below mean the
   last row always closes itself, at 4 tiles here and 3 on the stats page — four
   is the one count that needs neither rule on a phone, since it is two clean
   rows of two. */
.stat-row{grid-template-columns:repeat(2,1fr)}
.stat-row > .stat:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:700px){
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .stat-row > .stat:last-child:nth-child(odd){grid-column:auto}
  .stat-row > .stat:last-child:nth-child(3n+1){grid-column:1/-1}
  .stat-row > .stat:last-child:nth-child(3n+2){grid-column:span 2}
}
.stat{padding:14px 16px}
/* tabular-nums is the difference between a counter that sits still and one that
   jitters sideways every time a 1 becomes a 7. These numbers change constantly. */
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
/* Seven identical tiles is seven things of equal importance, and they are not:
   pass probability is the one number the whole app exists to move. So it sits
   above the row entirely rather than as a member of it that spans every column,
   which is what used to strand the box beside it next to four columns of
   nothing. Out of the grid it takes the full width honestly, and the score it
   implies rides on the right so the card reads as a statement instead of a wide
   empty slab.

   The row under it is four boxes, not six. Days to exam and Tests passed were
   both stated word for word by the band and its rail 350px above — the page was
   arguing with itself — and Bank coverage went with them, because a percentage
   and seen/UNIQUE_N are the same fact and only one of them names the bank.

   Never seen is back beside it. It is the same fact counted from the other end,
   which is why it was folded away, but the two ends are not read for the same
   thing: seen/UNIQUE_N is how far you have come, and the remainder is the queue
   Sweep works from and the only figure here that is supposed to reach zero. The
   hub page and the plan page had both kept it as a tile of its own while this
   page, the one you actually drill on, made you subtract. */
.stat.hero{display:flex;align-items:center;gap:16px;margin:0 0 12px;padding:18px 20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),color-mix(in srgb,var(--brand) 9%,var(--panel)) 58%,var(--panel));
  border-color:color-mix(in srgb,var(--brand) 26%,var(--line))}
.stat.hero > div{min-width:0}
.stat.hero .n{font-size:44px;letter-spacing:-.045em}
.stat.hero .l{font-size:12.5px}
.hero-side{flex:0 0 auto;margin-left:auto;text-align:right;padding-left:16px;border-left:1px solid var(--line)}
.hero-side b{display:block;font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-side b i{font-style:normal;font-size:14px;color:var(--muted)}
.hero-side em{display:block;font-style:normal;margin-top:2px;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* The figure the headline replaced, kept where it can still be read but not
   mistaken for the answer — lifetime accuracy under the rolling one. */
.stat .s{color:var(--muted);font-size:11px;font-weight:600;margin-top:3px}
.stat .n.good{color:var(--good)} .stat .n.bad{color:var(--bad)} .stat .n.brand{color:var(--brand)}
.stat.tap{cursor:pointer;transition:transform .12s} .stat.tap:hover{border-color:var(--brand)}
/* Six read-only boxes under a hero that already states the headline was 458px of
   a 750px screen with nothing on it to tap. Four boxes now, and smaller: at
   26px a figure like "1412/1858" runs edge to edge in a 150px box. The hero
   keeps its size, because it is the one number the whole app exists to move —
   it just does not need 44px of it on a 393px screen. */
@media (max-width:560px){
  .stat{padding:11px 12px}
  .stat .n{font-size:20px}
  .stat.hero .n{font-size:38px}
}
/* Buttons */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;padding:11px 16px;border-radius:11px;cursor:pointer;font-size:14px;transition:.12s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* The press, again: .act and .tcard had one, everything else on the page did not. */
.btn:active,.fchip:active,.stat.tap:active{transform:scale(.985)}
/* Nothing on this page ever drew a focus ring, so a keyboard landed on the two
   tappable cards in silence. The tiles are real buttons now and the hero is a
   button by role; both get one ring rather than two different UA defaults.
   :focus-visible, so a thumb never sees it. */
.tcard:focus-visible,.stat.hero:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
/* Actions */
/* Two up on a phone, four on a desktop, and the last row always closes itself —
   the same fixed-counts-plus-orphan-rules answer .stat-row already uses, and for
   the same reason: auto-fit sized these off a 196px floor, which needed 401px to
   reach two tracks and so never gave a phone anything but one column of eight.
   The count is 8 or 7 depending on whether any real-exam questions have been
   reported, so an odd tail is the normal case here, not the edge one.

   "Practice mistakes" is still gone: it called go('mistakes'), which is the
   Mistakes button pinned in the nav on every screen, and its count is one of the
   three stat boxes 100px above — the door and the number were both already
   there, so the row was 65px of echo. What sits first instead is Mistake set,
   which is not that door: it starts a sitting rather than opening a list, and
   it is first because with an exam date on the page it is the one tile whose
   contents expire at midnight.
   After it the order runs by how much is waiting: the ones that count something,
   then the ones that do not, then the picker. The picker is last because the
   last tile is the one the orphan rule stretches across both columns, and of the
   eight it is the one with least to say. */
.actions{grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.actions > .act:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:700px){
  .actions{grid-template-columns:repeat(4,1fr)}
  .actions > .act:last-child:nth-child(odd){grid-column:auto}
  .actions > .act:last-child:nth-child(4n+1){grid-column:1/-1}
  .actions > .act:last-child:nth-child(4n+2){grid-column:span 3}
  .actions > .act:last-child:nth-child(4n+3){grid-column:span 2}
}
/* Daily drill — .nextup's twin, structurally identical (icon, k/t/d, button) so
   the two sit in one row without arguing about hierarchy. It drops its own wash
   for flat --panel: two gradient cards shoulder to shoulder is the "everything
   is equally important" problem in miniature, and the fire and the streak carry
   its identity perfectly well without one. The streak is absolute, which keeps
   the drill's children a one-for-one match with .nextup's. */
.drill{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;
  padding:14px;margin:0;background:var(--panel);border:1px solid var(--line)}
.drill .emo{flex:0 0 auto;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  font-size:22px;line-height:1;background:color-mix(in srgb,var(--brand) 12%,var(--panel));
  border:1px solid color-mix(in srgb,var(--brand) 26%,var(--line))}
.drill .body{flex:1;min-width:0}
.drill .k{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drill .t{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
  margin-top:1px;font-variant-numeric:lining-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drill .d{color:var(--muted);font-size:12.5px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drill .streak{position:absolute;top:14px;right:14px;text-align:right}
.drill .streak b{display:block;font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.drill .streak span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drill .go{flex:0 0 auto}
.duo .go{padding-left:10px;padding-right:10px}
@media (max-width:560px){.nextup .t,.drill .t{font-size:20px}}
/* Wide enough for the old side-by-side reading, so desktop keeps it: at 428px a
   column of content under a 44px icon is a lot of white space to cross. */
@media (min-width:760px){
  .nextup,.drill{flex-direction:row;align-items:center;gap:15px;padding:15px 17px}
  .duo .go{padding-left:16px;padding-right:16px}
  .drill .streak{position:static;padding-left:14px;border-left:1px solid var(--line);text-align:center}
}
/* Resume list — sessions you walked away from and can walk back into.
   Capped at 3 rows on the dashboard with an expander, so an unbounded pile of
   abandoned drills can never push the drill card below the fold (§3.1). */
.rescard{margin:14px 0}
.rsm{display:flex;gap:8px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.rsm .body{flex:1;min-width:0}
.rsm .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsm .d{color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 44px, the iOS floor. The ✕ is destructive and sits directly beside a primary
   button, both of them around 30px with the tap highlight off page-wide — a row
   that makes you aim. It is guarded by confirmDiscard, so a mis-tap costs a
   dialog rather than a session, but that is a safety net, not a design. Resume
   takes the same floor so the row stays level. */
.rsm .btn{flex:none;min-height:44px}
.rsm .x{min-width:44px;padding:7px 10px;display:grid;place-items:center}
.rsmhd{display:flex;align-items:center;gap:8px;padding:13px 14px 11px;font-weight:800;font-size:13.5px}
/* Emoji, name, count — one line, and the count pinned right so the figures sit
   in a column you can read down instead of landing wherever each name happened
   to end. That is not a new idea on this page: .bankhd's right-hand cluster is
   fixed-width for exactly this reason. What it replaces is eight two-line rows
   that each buried their one live number mid-sentence ("20 you've never seen ·
   412 left"), where no two of them started in the same place and so none of them
   scanned. The sentence is not lost, it is the title. */
.act{display:flex;gap:9px;align-items:center;text-align:left;padding:10px 11px;border-radius:12px;
  background:var(--panel-2);box-shadow:none;
  transition:transform .14s,border-color .14s,box-shadow .14s,background .14s}
/* The emoji keeps a tinted tile of its own rather than floating naked against
   the card — the same treatment .bankhd .ico gets, so the two grids speak one
   visual language and each row has a left-hand mark to scan down. 28px rather
   than the old 34: it now sets the height of a 48px row, and a 34px tile above a
   13px name is a row wearing a hat. */
.act .emo{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;line-height:1;
  background:color-mix(in srgb,var(--brand) 10%,var(--panel-2));
  border:1px solid color-mix(in srgb,var(--brand) 20%,var(--line));transition:background .14s}
.act:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(42,35,51,.05),0 10px 22px color-mix(in srgb,var(--brand) 13%,transparent)}
.act:hover .emo{background:color-mix(in srgb,var(--brand) 18%,var(--panel-2))}
/* iOS has no hover, so the press is the only feedback a tap ever gets. */
.act:active{transform:scale(.985)}
/* The name shrinks and the count never does: at 176px a row has ~117px after the
   emoji, and of the two the number is the half that changes. */
.act .t{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .n{flex:0 0 auto;font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.act .n.done{color:var(--good)}
/* Test grid */
/* Five grids of tiles below the fold, and everything under them pushed off the
   screen. Each group collapses to its header row, so the tail of the dashboard
   reads as a five-line index. <details> rather than a hand-rolled toggle: the
   keyboard, find-in-page and print behaviour come for free. */
/* Each header is a card carrying its bank's accent (--acc, set per section in
   testGroup): a tinted wash left to right, a matching icon tile, and its own
   progress in the bar. Shut, the five of them read as a stack of cards rather
   than five lines of text — and open, the header and its grid share one border
   so the section is visibly one object. */
.bankgrp{margin:10px 0 0}
.bankgrp:first-of-type{margin-top:0}
.bankhd{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;list-style:none;transition:.14s;
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 14%,var(--panel)),var(--panel) 62%)}
.bankhd::-webkit-details-marker{display:none}
.bankhd:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));
  box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 16%,transparent)}
.bankhd:active{background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 22%,var(--panel)),var(--panel) 62%)}
.bankgrp[open] > .bankhd{border-radius:var(--radius) var(--radius) 0 0}
.bankhd .ico{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;line-height:1;
  background:color-mix(in srgb,var(--acc) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 34%,var(--line))}
.bankhd .nm{flex:1;min-width:0}
.bankhd b{display:block;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bankhd .src{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bankhd .src a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.bankhd .src a:hover{color:var(--brand)}
/* The right-hand cluster is the same shape in every section — fixed bar, fixed
   badge, fixed caret — so the counts sit in a column down the page instead of
   landing wherever each title happened to end. */
/* A ring rather than the old 76px hairline. Same information in a quarter of
   the width, and it reads as a dial you are filling instead of a rule you are
   dragging — which is what five of them stacked down the page needed to be. */
.bankhd .ring-sm{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p,0)*1%),var(--chip) 0);transition:background .4s}
.bankhd .ring-sm::after{content:"";width:23px;height:23px;border-radius:50%;background:var(--panel)}
.bankhd .tag{flex:0 0 auto;margin-left:0;width:96px;text-align:center;font-size:11.5px;padding:4px 0}
.bankhd .tag.done{background:var(--good-bg);color:var(--good)}
.bankhd .chev{flex:0 0 auto;width:20px;text-align:center;color:var(--muted);font-size:12px;transition:transform .16s}
.bankgrp[open] > .bankhd .chev{transform:rotate(90deg);color:var(--acc)}
/* The spine is an inset shadow rather than a fat left border on purpose: a 3px
   border here against the header's 1px would throw the two edges out of line by
   two pixels down the whole section. This keeps the geometry identical and still
   carries the colour from the header into everything under it. */
.bankbody{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);
  padding:14px 14px 14px 16px;background:var(--panel-2);
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--acc) 50%,transparent)}
/* The whole body used to fade in as one slab. Staggering the tiles instead
   makes the section assemble itself, which is most of what "feels alive" is.
   --i is the tile's index, capped in testTile so the tail of a 45-tile section
   is not still arriving half a second after the head. */
@keyframes tileIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bankgrp[open] > .bankbody .tcard{animation:tileIn .28s ease both;animation-delay:calc(var(--i,0) * 14ms)}
/* A tile you have just passed, seen the moment you land back on the dashboard. */
@keyframes justPop{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}
  100%{box-shadow:0 0 0 13px transparent}}
.bankgrp[open] > .bankbody .tcard.just{animation:tileIn .28s ease both,justPop 1.15s ease-out .25s 2}
@media(prefers-reduced-motion:reduce){
  .bankgrp[open] > .bankbody .tcard,
  .bankgrp[open] > .bankbody .tcard.just{animation:none}
  .phero.in{animation:none}
  .bankhd .chev,.bankhd .ring-sm,.rail > i{transition:none}}
@media (max-width:560px){
  .bankhd{gap:10px;padding:12px 13px}
  .bankhd .ico{width:36px;height:36px;border-radius:11px;font-size:18px}
  .bankhd b{font-size:17px}
  .bankbody{padding:12px 10px 12px 12px}
}
/* Under ~400px the fixed badge column is eating the title. Let it shrink to its
   text — the badges are flex-end anchored, so their right edges stay in line. */
@media (max-width:420px){.bankhd .tag{width:auto;padding:4px 9px}.bankhd .ring-sm{display:none}}
/* A bank whose tests declare a kind gets one section per kind, and the exam
   section needs to say what makes it an exam section before you tap a tile. */
.banksub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
/* The source's own licence and disclaimer, once per bank, under its last grid. */
.banknote{color:var(--muted);font-size:11.5px;line-height:1.55;margin:12px 0 0}
.banknote a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
/* ---- Test tiles ----
   Every one of the 150 used to be the same white box reading "Test 101 / Not
   attempted / an empty grey bar". The number was the only thing that differed
   between any two of them, so the wall read as wallpaper and there was no reason
   your eye landed anywhere in particular. Four things fix that, and none of them
   change what a tile does when you tap it:

   1. The number is the tile. Set in the display serif — 31px, 27px on a phone
      — it is a focal point rather than the second word of a label, which is
      also what lets the tiles get narrower without getting harder to scan.
   2. It wears its section's colour (--tone, inherited from the --acc set on the
      section's <details>) on the number and the top edge. Open "The Reading
      Room" and everything on screen agrees you are in it — the old tiles went
      neutral the moment the coloured header scrolled away.
   3. State is the tile, not a pill in the corner. Passed tiles are tinted green
      with a solid top edge and a tick; retry tiles are tinted red. Scrolling a
      section now shows you how you are doing without reading a single word.
   4. The mix strip is a fingerprint. Every test is 24 questions drawn from the
      five syllabus topics in a different proportion — history-heavy, government-
      heavy — and that mix is drawn along the bottom. 95 of the 150 have one
      topic at 40% or more of the paper, so no two strips look alike and the
      difference between them means something. */
/* Three across a phone, not two. The floor is what decides it: 3x104+16 = 328
   against the 337px inside .bankbody at 393px, where 3x128+20 = 404 never had a
   chance. It also makes the mix strips do the job this file claims for them —
   at two up they are a list of bars, at three up they are a field the eye reads
   as a pattern. auto-fill still fans out to seven columns on a 900px .wrap, so
   nothing above 560px changes. */
.tests{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
/* No shadow, for the same reason .act has none: .card's four-layer lift is for a
   handful of objects, not 150 of them on a --panel-2 field. The border, the 3px
   top edge and the state tint already separate a tile from its neighbour, and the
   page has 150 fewer composited layers to repaint on the way down. The hover
   shadow below is untouched — it is one tile at a time, on a device with a mouse. */
/* A real <button>, the same call .act already made. 150 of these were <div
   onclick>: no keyboard could reach one, no screen reader announced one, and
   this file chose <details> for the sections specifically because the keyboard
   behaviour came for free. The two extra declarations are the price of the
   element — a button centres its text and does not stretch its flex children,
   and a tile needs a left-aligned number over a full-width mix strip. */
.tcard{--tone:var(--acc,var(--brand));position:relative;overflow:hidden;cursor:pointer;
  text-align:left;align-items:stretch;
  padding:12px 12px 11px;display:flex;flex-direction:column;box-shadow:none;transition:.13s}
.tcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--tone);opacity:.5}
.tcard:hover{border-color:var(--tone);transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(42,35,51,.05),0 10px 22px color-mix(in srgb,var(--tone) 16%,transparent)}
.tcard:active{transform:scale(.985)}
/* The lift and the press are decoration; the colour change carries the same
   information without moving anything. */
@media(prefers-reduced-motion:reduce){
  .act,.tcard{transition:none}
  .act:hover,.act:active,.tcard:hover,.tcard:active{transform:none}
  .btn:active,.fchip:active,.stat.tap:active,.nextup:active{transform:none}
}
/* The word above the number is the section's own: the reported-exam papers stop
   calling themselves "Test" when their own section calls them papers. */
.tcard .tw{display:block;min-height:17px;
  font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
/* The state mark is the word's sibling, not its child, and pinned rather than
   pushed. The phone hides .tw outright below, and display:none takes the whole
   subtree with it — so the one thing in that row that is not a repeat of the
   section header would have gone with the repeat. Pinned to exactly where the
   flex row put it, so no desktop pixel moves. */
.tcard .tm{position:absolute;top:12px;right:12px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font-size:9.5px;font-weight:800;color:var(--on-solid)}
/* lining-nums is load-bearing with a Baskerville/Palatino/Georgia stack: those
   faces set old-style figures by default, so 101 and 234 would sit at different
   heights on adjacent tiles. Lining figures put every number on one baseline. */
.tcard .tnum{font-family:var(--serif);font-size:31px;font-weight:700;line-height:1;letter-spacing:-.025em;
  color:var(--tone);margin-top:4px;font-variant-numeric:lining-nums tabular-nums}
.tcard .meta{color:var(--muted);font-size:11.5px;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard.pass{background:color-mix(in srgb,var(--good) 9%,var(--panel));
  border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.tcard.pass::before{background:var(--good);opacity:.9}
.tcard.pass .tnum{color:var(--good)}
.tcard.pass .tm{background:var(--good)}
.tcard.pass:hover{border-color:var(--good);box-shadow:0 2px 4px rgba(42,35,51,.05),0 10px 22px color-mix(in srgb,var(--good) 18%,transparent)}
.tcard.retry{background:color-mix(in srgb,var(--bad) 8%,var(--panel));
  border-color:color-mix(in srgb,var(--bad) 26%,var(--line))}
.tcard.retry::before{background:var(--bad);opacity:.85}
.tcard.retry .tnum{color:var(--bad)}
.tcard.retry .tm{background:var(--bad)}
.tcard.retry:hover{border-color:var(--bad);box-shadow:0 2px 4px rgba(42,35,51,.05),0 10px 22px color-mix(in srgb,var(--bad) 18%,transparent)}
/* ---- The tile on a phone ----
   The word above the number is the word the section header said two inches up,
   reprinted 45 times underneath it — and it reserved 17px on every one of the
   150 to do it. Gone below 560px, and the tile drops 111px to about 90px with
   the mark it carried pinned into the corner instead of deleted.
   27px for the number, not 31: at 107px wide the tile has 81px of content to
   spend and a three-digit figure at 31px asks for about 52px of it. 27px is
   also comfortably above the 18.66px floor a 700-weight face needs to clear AA
   as large text, which is the rule the palest section accent (#5e93d0, 3.20:1
   on white) is living under. Do not take this below 18.66px. */
@media (max-width:560px){
  .tcard .tw{display:none}
  .tcard .tm{top:8px;right:8px}
  .tcard .tnum{font-size:27px;margin-top:0}
}
/* Only ever drawn once there is a score to draw. 150 grey bars at zero was 150
   lines of the page saying nothing. */
.bar{height:5px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar.good > i{background:var(--good)} .bar.bad > i{background:var(--bad)}
/* content-box, not the sheet-wide border-box: the 8px of clear air above the
   strip is padding so that margin-top:auto can still push it to the bottom of
   the tile, and under border-box that padding ate the whole 4px of strip. */
.mix{display:flex;gap:1.5px;height:4px;margin-top:8px}
.mix > i{display:block;height:100%;border-radius:2px;min-width:2px}
.tcard .mix{box-sizing:content-box;margin-top:auto;padding-top:9px}
/* Quiz */
/* One meta row, never two. Title · counter · timer · flag on a single line with
   a hairline progress bar under it — the wrapping version cost ~40px of screen
   on every question, which on a phone is the difference between seeing the
   first option and not. The title is the only thing allowed to shrink. */
.qtop{display:flex;align-items:center;gap:8px;margin:12px 0 7px;min-width:0}
.qtop .chip{flex:none}
.qtop .chip.title{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qtop .count{font-variant-numeric:tabular-nums}
/* The flag button is the only thing in this row that isn't a chip; match it to
   one, or the row reads as ragged. */
.qtop .flagbtn{padding:5px 10px;font-size:12px}
/* One segment per question, in the space the plain progress bar used to take.
   It says everything that bar said — how far along you are is where the tall
   brand-coloured segment sits — and adds what the dot grid was really being
   kept on screen for: which ones you got right, which you got wrong, which are
   answered but unchecked. 6px instead of six rows of buttons.
   It is one unbroken track, not a row of ticks — gaps between the segments read
   as a dashed line hanging off the chips above rather than as progress. */
.qstrip{display:flex;align-items:flex-end;height:6px;margin:4px 0 14px;
  background:var(--chip);border-radius:3px;overflow:hidden}
.qstrip > i{flex:1 1 0;min-width:0;height:3px;background:transparent;transition:background .15s ease}
.qstrip > i.ans{background:var(--muted)}
.qstrip > i.ok{background:var(--good)}
.qstrip > i.no{background:var(--bad)}
.qstrip > i.cur{height:6px;background:var(--brand)}
/* Topic name and the "Select 2" badge. Chips are nowrap, and a nowrap flex item
   will not shrink below its own text — so "The UK government, the law and your
   role" pushed the badge clean off the card. The badge is the half you lose
   marks without; the topic is context you already have. Topic truncates. */
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:6px;min-width:0}
.qhead .topic{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qhead .chip:not(.topic){flex:none}
.qhead .hbadge{max-width:52%;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--chip);color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;border-radius:20px;white-space:nowrap}
.chip.topic{background:transparent;border:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.warn{color:var(--bad)}
.qtext{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.4;margin:6px 0 0}
/* The hint is now optional, so the gap above the options lives on the options. */
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel-2);transition:.1s;user-select:none}
.opt:hover{border-color:var(--brand)}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;color:transparent;margin-top:1px}
.opt.multi .mark{border-radius:6px}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--panel-2))}
.opt.sel .mark{background:var(--brand);border-color:var(--brand);color:var(--on-solid)}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .mark{background:var(--good);border-color:var(--good);color:var(--on-solid)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mark{background:var(--bad);border-color:var(--bad);color:var(--on-solid)}
.opt.locked{cursor:default}
.setopt{text-align:left;padding:12px 14px}
.setopt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--panel))}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px}
.opt .otext{flex:1}
/* scroll-margin keeps the verdict clear of the sticky header above and the
   sticky action bar below when it is scrolled into view after a check. */
/* The fold that stands where the options would be. Deliberately not a card: it
   is a gap in the question, and it should read as one thing missing rather than
   as a new panel to get through. */
.recall{margin-top:14px;padding:16px 15px;border:1.5px dashed var(--line);border-radius:12px;background:var(--panel-2)}
.recall .rlbl{font-weight:800;font-size:15px;letter-spacing:-.01em}
.recall .rsub{color:var(--muted);font-size:13px;line-height:1.5;margin:5px 0 12px}
/* The honesty row, once the options are open. Sits above them, because the
   question it asks is about the moment before you read them. */
.rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.rrow .rq{font-size:13px;color:var(--muted);font-weight:700;margin-right:auto}
.rrow .btn.on{border-color:var(--brand);color:var(--brand);opacity:1}
.rrow .btn.on.miss{border-color:var(--warn);color:var(--warn)}
.explain{margin-top:14px;padding:14px 15px;border-radius:12px;border-left:4px solid var(--brand);background:var(--panel-2);display:none;scroll-margin:72px 0 96px}
.explain.show{display:block;animation:fade .2s}
.explain .verdict{font-weight:800}
.explain .verdict.good{color:var(--good)} .explain .verdict.bad{color:var(--bad)}
/* The verdict and the "wasn't sure" escape hatch share one line — the honesty
   button has to be as reachable as the tick is satisfying. */
.explain .vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.explain .vrow .unsure{margin-left:auto}
.btn.unsure.on{color:var(--warn);border-color:var(--warn);opacity:1}
.explain .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* Pinned to the bottom of the screen for as long as the question is taller than
   the viewport. Checking an answer used to push Next below the explanation, so
   every question cost a scroll down to advance and a scroll back up to read the
   next one. It bleeds past the wrap padding so the blur covers the full width.
   It is the last thing on the page: anything rendered under a pinned bar is
   stranded there, half-cut at the fold, which is exactly where the jump
   navigator used to sit. */
.qnav{position:sticky;bottom:0;z-index:30;display:flex;gap:10px;align-items:center;
  margin:16px -16px 0;padding:10px 16px calc(10px + var(--lituk-sab));
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line)}
.qnav .spacer{flex:1}
.flagbtn{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:12.5px;line-height:1.4;color:var(--muted)}
.flagbtn.on{color:var(--warn);border-color:var(--warn)}
/* Dot navigator — the thing you use twice a session. At the default drill size
   of 60 it was six rows, ~210px, under every single question. It now folds
   behind its own label and the strip above carries the overview. */
.jtog{display:block;border:0;background:transparent;color:var(--muted);font-weight:700;
  font-size:12.5px;padding:5px 0;margin-top:10px;cursor:pointer}
.jtog:hover{color:var(--brand)}
/* 36px on an 8px gap — a 44px pitch, which is the honest compromise when 24 of
   them have to sit on a 361px row. 30px with the tap highlight off and no press
   state of its own was a mis-tap generator, and the mis-tap here throws you to a
   different question in the middle of a timed test. */
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.dot{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.dot.cur{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 2px var(--ring)}
.dot.ans{background:var(--chip);color:var(--ink)}
.dot.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.dot.flag{border-color:var(--warn)}
/* Results ring */
.result-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--chip) 0)}
.ring .inner{width:104px;height:104px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:30px;font-weight:800;line-height:1}
.ring .sc{font-size:12px;color:var(--muted);font-weight:700}
.verdict-big{font-size:24px;font-weight:800}
.verdict-big.good{color:var(--good)} .verdict-big.bad{color:var(--bad)}
/* Where this test sits in its series, and the two either side of it. Rendered
   twice on the page: the top copy is part of the decision you make while
   looking at the score, and the bottom one is there because after 24
   explanations the top of the page is a long scroll back. */
.snav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0}
.snav .btn{display:flex;flex-direction:column;gap:1px;justify-self:start;align-items:flex-start;text-align:left}
.snav .btn.nx{justify-self:end;align-items:flex-end;text-align:right}
.snav .m{font-size:11px;font-weight:600;opacity:.72}
.snav .pos{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
@media (max-width:560px){.snav .pos .nm{display:none}}
@media (max-width:420px){
  .snav{grid-template-columns:1fr 1fr}
  .snav .pos{grid-column:1/-1;order:-1}
}
/* Review list */
.rev{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.rev summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--on-solid);font-weight:800;font-size:12px}
.rev .ic.ok{background:var(--good)} .rev .ic.no{background:var(--bad)}
.rev .body{padding:0 14px 14px 46px;border-top:1px solid var(--line)}
.rev[open] summary{border-bottom:0}
/* The distractor you keep falling for, named on the option itself. */
.pickn{margin-left:8px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;
  background:var(--chip);color:var(--bad);white-space:nowrap}
.wrongpull{margin:10px 0 0;font-size:13px;font-weight:600;color:var(--bad)}
/* One mined sentence of the explanation — the fact on its own, for the days
   when reading the whole paragraph again is not going to help. */
.fact{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--panel-2);
  border-left:3px solid var(--warn);font-size:13.5px;line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted);margin-left:auto}
/* In a review row the topic name sits beside the question, so it stays on one
   line and gives the question the space — a wrapped tag squeezed it to a sliver. */
.rev summary .tag{flex:none;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* "Seen in a real exam". Short on purpose: it shares a row with the question
   text and the topic tag, and it is the one of the three that survives a phone. */
.xbadge{display:inline-block;flex:none;font-size:11px;font-weight:800;padding:2px 8px;
  border-radius:20px;background:var(--chip);color:var(--warn);white-space:nowrap}
.rev summary .xbadge{margin-left:auto}
.rev summary .xbadge + .tag{margin-left:6px}
/* Topic bars */
.tbar{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;margin:10px 0}
.tbar .tn{font-weight:600;font-size:13.5px}
.tbar .track{height:9px;border-radius:9px;background:var(--chip);overflow:hidden;grid-column:1/-1}
.tbar .track > i{display:block;height:100%;border-radius:9px}
.tbar .pctl{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
/* Modal */
/* Insets, not a flat 16px: the backdrop is position:fixed, so body padding
   never reaches it. Installed on iOS that put the modal's first line under the
   Dynamic Island and its last button under the home indicator. */
.modal-bg{position:fixed;inset:0;background:rgba(26,17,34,.55);display:none;z-index:60;
  overscroll-behavior:contain;
  padding:calc(var(--lituk-sat) + 16px) calc(var(--lituk-sar) + 16px) calc(var(--lituk-sab) + 16px) calc(var(--lituk-sal) + 16px)}
.modal-bg.show{display:grid}
/* Pinned by lockScroll() while a modal is open. iOS otherwise keeps scrolling
   the document behind the backdrop: the drag rubber-bands the page, Safari
   collapses its toolbar mid-gesture, and the fixed backdrop — sized off a
   viewport that just changed height — lurches under your finger. */
body.modal-open{position:fixed;left:0;right:0;width:auto}
/* margin:auto centres a modal that fits. place-items:center centred one that
   did not, which overflows a grid item off BOTH edges — that is what cut the
   top off Settings and put "Done" below the screen. max-height + overflow-y
   makes the long modals scroll inside themselves instead. */
.modal{max-width:420px;width:100%;margin:auto;max-height:100%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:pop .16s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .e{font-size:40px}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;font-family:inherit}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:70;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
select,input[type=text],input[type=date]{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
/* Below this the brand + 4 nav tabs + 2 icon buttons no longer fit on one line,
   so the nav wraps to a second row of its own instead of shoving the page sideways. */
@media(max-width:700px){
  .hd{gap:8px;padding:8px 12px 6px}
  .nav{order:5;flex:1 0 100%;gap:2px;margin-top:0}
  .nav button{flex:1 1 0;padding:7px 6px;font-size:12.5px}
  .hubLink,.icon-btn{width:32px;height:32px;font-size:15px}
  .brand .flag{font-size:20px}
  .brand .flag img{width:22px}
}
@media(max-width:560px){
  h1{font-size:20px}
  .qtext{font-size:17px}
  /* Truncated to "A modern, thri…" it says nothing — give the question the row. */
  .rev summary .tag{display:none}
}
@media(max-width:400px){
  .brand small{display:none}
}
/* ---- Cram sheet ----
   Built to be read off paper the night before, so it is laid out in columns
   and every item is one unbreakable line-and-a-half. */
.cram{columns:2;column-gap:26px;margin-top:14px}
.cram .grp{break-inside:avoid-column;margin:0 0 14px}
.cram .grp h3{font-size:13px;margin:0 0 6px;letter-spacing:-.01em;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.cram .it{break-inside:avoid;margin:0 0 7px;font-size:12.5px;line-height:1.45}
.cram .it .a{font-weight:800}
.cram .it .k{color:var(--muted)}
.cram .it .y{font-weight:800;font-variant-numeric:tabular-nums;margin-right:6px}
.cram .it .why{display:block;color:var(--muted);font-size:11.5px}
.cram .b{color:var(--bad)} .cram .w{color:var(--warn)}
.cram-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
@media(max-width:700px){.cram{columns:1}}
/* ---- Print ----
   The dark theme prints as a black rectangle and the header prints as a
   navigation bar nobody can tap. Both go; what is left is the cram sheet on
   two sides of A4. */
@media print{
  html,html[data-theme="dark"]{--bg:#fff;--panel:#fff;--panel-2:#fff;--ink:#000;--muted:#3a3a3a;
    --line:#b0b0b0;--chip:#eee;--shadow:none;--brand:#000;--good:#0a5a34;--bad:#8a1420;--warn:#6b4c00;--radius:0}
  header,.foot,.toast,.modal-bg,.noprint{display:none!important}
  body{background:#fff;font-size:9.5pt}
  .wrap{max-width:none;padding:0}
  .card{border:0;box-shadow:none}
  h1{font-size:15pt;margin:0 0 2px}
  .cram{columns:2;column-gap:14pt;margin-top:8pt}
  .cram .it{font-size:8.6pt;line-height:1.32;margin-bottom:5pt}
  .cram .it .why{font-size:8pt}
  .cram .grp h3{font-size:10pt}
  @page{margin:11mm}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <a class="hubLink" href="index.html" title="Back to the study hub" aria-label="Back to the study hub">←</a>
    <div class="brand" onclick="go('dashboard')">
      <span class="flag"><img src="icons/flag-gb.svg" alt="" width="60" height="30"></span>
      <div class="name">Life in the UK<small id="brandSub">Practice Tests</small></div>
    </div>
    <div class="spacer"></div>
    <nav class="nav" id="nav">
      <button data-v="dashboard" onclick="go('dashboard')">Tests</button>
      <button data-v="drill" onclick="drillTab()">Drill</button>
      <button data-v="mistakes" onclick="go('mistakes')">Mistakes</button>
      <button data-v="stats" onclick="go('stats')">Stats</button>
    </nav>
    <!-- One tap back into the session you are in the middle of. The resume list
         on the dashboard is the durable way in; this is the quick one. -->
    <button class="btn sm primary hidden" id="resumeChip" onclick="resumeActive()" title="Back to your session">▶ Resume</button>
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">🌙</button>
  </div>
</header>

<div class="wrap">
  <!-- DASHBOARD -->
  <section id="view-dashboard"></section>
  <!-- QUIZ -->
  <section id="view-quiz" class="hidden"></section>
  <!-- RESULTS -->
  <section id="view-results" class="hidden"></section>
  <!-- MISTAKES -->
  <section id="view-mistakes" class="hidden"></section>
  <!-- EVER WRONG -->
  <section id="view-history" class="hidden"></section>
  <!-- STATS -->
  <section id="view-stats" class="hidden"></section>
  <!-- CRAM SHEET -->
  <section id="view-cram" class="hidden"></section>

  <div class="foot">
    Your progress is saved on this device only (browser localStorage). Nothing is uploaded.<br>
    Pass mark: <b>18 / 24 (75%)</b> · Study aid built for personal practice from questions on
    <a href="https://britizen.uk" target="_blank" rel="noopener noreferrer">britizen.uk</a>,
    <a href="https://lifeintheuktest.com/practice-tests/" target="_blank" rel="noopener noreferrer">lifeintheuktest.com</a>,
    <a href="https://testprep.uk/life-in-the-uk-test/practice-tests" target="_blank" rel="noopener noreferrer">testprep.uk</a> and
    <a href="https://lifeintheuktestweb.co.uk/exams/" target="_blank" rel="noopener noreferrer">lifeintheuktestweb.co.uk</a>.
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal card pad" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<!-- Question banks, in order, before the engine that reads them. -->
<script src="mock-data.js"></script>
<script src="practice-data.js"></script>
<script src="testprep-data.js"></script>
<script src="lituktestweb-data.js"></script>
<script>
/* ============ STATE ============ */
const LS='lituk_v1';
/* The date everything is scheduled against. Every spaced-repetition interval is
   squeezed to fit inside it and nothing is ever filed for after it (INV-8) —
   a review booked for the week after the exam is a review that never happens. */
const EXAM_DEFAULT='2026-09-05';
const DEFAULT={tests:{},topics:{},mistakes:{},flags:{},answered:0,correct:0,attempts:0,passes:0,history:[],
  sr:{},                                   /* g -> {box,due,seen,last,unsure} spaced repetition */
  /* `last`/`streak`/`best` count days STUDIED, in anything; `drilled` is the day
     the daily drill itself was last finished. See drillDoneToday(). */
  drill:{last:null,streak:0,best:0,drilled:null},
  examDate:EXAM_DEFAULT,                   /* '' = no date: standard ladder, coverage mode */
  recent:[],                               /* rolling 0/1 ring, last RECENT_N answers */
  readiness:null,                          /* last computed pass probability, for the hub to read */
  /* When this device last wrote a backup file. It rides along in the export, so
     a restored backup reports the SOURCE device's previous backup — always
     older than the truth, never newer. That errs towards nagging, which is the
     safe direction to be wrong in. */
  backup:{at:0},
  mig:{}};                                 /* one-time migrations already applied */
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(LS));return Object.assign(structuredClone(DEFAULT),r||{})}catch(e){return structuredClone(DEFAULT)}}
/* Every write bumps the revision, which is how the Monte Carlo knows its
   cached answer is still the current one (see readiness()). */
let _rev=0;
/* This is the only copy of your progress, so a failed write can never be
   silent. It used to be bare: a QuotaExceededError threw uncaught out of
   recordAnswer(), mid-answer, and every write after it died the same way while
   the app carried on looking fine.

   Abandoned sessions are the one thing in localStorage that grows without a cap
   (INV-13), so they are what gets sacrificed — oldest first, retrying after
   each, so we give up the least we can get away with. The session being sat is
   never evicted. If even an empty session store is not enough, S is still
   intact in memory: saveFailed() says so and offers the export that rescues it. */
let _saveBroken=false;
function save(){
  _rev++;
  const body=JSON.stringify(S);
  try{localStorage.setItem(LS,body);return}catch(e){}

  /* save() can run during boot migrations, before `sessions` is initialised —
     touching a let in its TDZ throws ReferenceError, which try/catch absorbs. */
  let stale=[];
  try{stale=Object.values(sessions).sort((a,b)=>(a.startTs||0)-(b.startTs||0))}catch(e){}
  let dropped=0;
  for(const s of stale){
    if(sess&&sess.sid===s.sid)continue;
    forgetSess(s.sid);dropped++;
    try{localStorage.setItem(LS,body);
      toast(`Storage was full — dropped ${dropped} unfinished session${dropped===1?'':'s'}`);return}
    catch(e){}
  }
  /* Last resort: the store itself, in case a partial write left it oversized. */
  try{localStorage.removeItem(SESS_LS);localStorage.setItem(LS,body);
    toast('Storage was full — unfinished sessions were cleared');return}catch(e){}

  saveFailed();
}
/* Loud, once, and with the way out attached. A toast would be wrong here: it
   is gone in 1.8s and this is the app telling you it has stopped remembering. */
function saveFailed(){
  if(_saveBroken)return;
  _saveBroken=true;
  console.error('LITUK: localStorage is full — progress is no longer being written to disk');
  try{
    modal(`<h3 style="margin:0 0 4px;color:var(--bad)">Progress isn't being saved</h3>
      <p class="sub" style="margin:0 0 14px">This browser's storage is full, so the last few answers were not written to disk. Everything you have done <b>is</b> still here in memory — until you close this tab.</p>
      <p class="sub" style="margin:0 0 14px">Export a backup now. It is built from memory, not from storage, so it will be complete. Then restore it to carry on.</p>
      <div class="btn-row">
        <button class="btn primary" onclick="exportData()">⬇ Export backup now</button>
        <button class="btn ghost" onclick="closeModal()">Dismiss</button>
      </div>`);
  }catch(e){}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ BANKS ============
   Each data file registers itself on window.LITUK_BANKS before this script
   runs. All banks share one question-id space and one test-number space:
   saved progress is keyed on both, so a collision would quietly reattach your
   spaced-repetition history to somebody else's question. tools/validate-banks.mjs
   is what stops that happening; the shape check here is the last line of
   defence against a service worker serving a stale or half-written data file. */
const TOPICS=['A modern, thriving society','A long and illustrious history',
  'The UK government, the law and your role','The Values and principles of the UK','What is the UK?'];
const DEFAULT_PASSMARK=18;

function bankOk(b){
  const ok=b&&Array.isArray(b.tests)&&b.tests.length&&
    b.tests.every(t=>typeof t.n==='number'&&Array.isArray(t.q)&&t.q.length&&
      t.q.every(q=>typeof q.g==='number'&&typeof q.t==='string'&&Array.isArray(q.o)));
  if(!ok)console.error('LITUK: ignoring a malformed question bank',b&&b.id);
  return !!ok;
}
const BANKS=(window.LITUK_BANKS||[]).filter(bankOk);
const TESTS=BANKS.flatMap(b=>b.tests.map(t=>Object.assign(t,{_bank:b})));
if(!TESTS.length)console.error('LITUK: no question banks loaded — check the data <script> tags');

/* Build flat question index by global id */
const QByG={};
TESTS.forEach(t=>t.q.forEach(q=>{QByG[q.g]=q;q._test=t.n;q._bank=t._bank}));
const ALLQ=Object.values(QByG);
const PASSMARK=BANKS.length?BANKS[0].passmark:DEFAULT_PASSMARK;
if(BANKS.some(b=>b.passmark!==PASSMARK))console.error('LITUK: banks disagree on passmark');

/* ============ DUPLICATE COLLAPSE (INV-6) ============
   32 of the 1,890 ids are the same question twice — "Who built the Tower of
   London?" is both 118 and 984. Left alone each copy keeps its own spaced
   repetition, so answering 118 today leaves 984 "never seen": coverage can
   never reach 100% and the same fact is drilled twice.

   The key is the stem PLUS the normalised option set, never the stem alone.
   141 questions ask "Which of these statements is correct?" and differ only in
   their two options; keying on the stem would merge 140 distinct discrimination
   questions into one and delete the best twist-training material in the bank.
   Punctuation is stripped because two of the 32 pairs differ only by a missing
   apostrophe or full stop.

   Question ids never change (INV-2) — only which id holds the shared state. */
const UNIQUE_EXPECT=3147;
const dupNorm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const dupKey=q=>dupNorm(q.t)+' '+q.o.map(o=>dupNorm(o[0])).sort().join('');
const CANON={};                            /* every g -> the id that owns its state */
(function(){
  const firstWithKey={};
  for(const q of ALLQ.slice().sort((a,b)=>a.g-b.g)){       /* lowest id wins, stably */
    const k=dupKey(q);
    if(firstWithKey[k]===undefined)firstWithKey[k]=q.g;
    CANON[q.g]=firstWithKey[k];
  }
  const n=Object.keys(firstWithKey).length;
  if(n!==UNIQUE_EXPECT)console.error(`LITUK: dedup found ${n} unique questions, expected ${UNIQUE_EXPECT} — do not trust coverage until tools/validate-banks.mjs agrees`);
})();
const canon=g=>CANON[g]!==undefined?CANON[g]:+g;   /* unknown (stale) ids pass through */
/* One question per piece of content: what every drill draws from, and the
   denominator for coverage. */
const POOL=ALLQ.filter(q=>CANON[q.g]===q.g);
const UNIQUE_N=POOL.length;

/* ============ SEEN IN A REAL EXAM (x) ============
   testprep.uk slices one pool of questions two ways — 38 mock papers and 11
   "exam" papers — and 261 of the 263 exam questions also sit in a mock. So
   exam-ness is a property of the question, carried as x:1 and derived at build
   time from membership of an exam paper (INV-9). That is the whole reason the
   badge can fire on a question you first met in Mock 12: it is the same
   question, not a copy of it.

   Keyed on the CANONICAL id, never the raw one. q2228 is "What is the capital
   of Wales?" with x:1, and it collapses onto q166 from the britizen bank, which
   has no x — read q.x straight off a POOL question and that one silently drops
   out, leaving a drill of 262 and a badge that never appears on the question
   you actually drill. */
const EXAM_SEEN=new Set(ALLQ.filter(q=>q.x===1).map(q=>canon(q.g)));
const isExamQ=q=>q&&EXAM_SEEN.has(canon(q.g));
const EXAM_POOL=POOL.filter(isExamQ);
/* One label, three call sites — the review row, the mistakes row and the
   question modal all say the same thing in the same words.

   No year. This read "real 2026 exams" while testprep.uk was the only source
   of x:1, because that is testprep.uk's own claim. lifeintheuktestweb.co.uk
   makes the same claim with no year attached — "a compilation of exam
   questions reported by candidates" — and it now supplies 406 of the 663
   flagged questions. Stamping 2026 on 400 questions whose source never dated
   them would be this app inventing precision the data does not have. What is
   true of both sources is "recently"; the per-source specifics live in
   BANK_NOTE, where they can differ. */
const EXAM_CLAIM='Reported by test-takers as recently asked in real exams';
const examBadge=q=>isExamQ(q)?`<span class="xbadge" title="${EXAM_CLAIM}">⭐ Real exam</span>`:'';
/* What this question has already done to you, on the question card itself.
   Four words, in the metadata row next to the topic — enough to know you are
   looking at an old enemy rather than a stranger, without restating the whole
   row from the mistakes list.

   Never in a timed sit. A mock test feeds the pass rate, and "you have missed
   this 3 times" is a nudge the real exam will not give you: it would make the
   one number this app works hardest to keep honest quietly optimistic. Every
   untimed mode — drill, mistake set, Ever wrong, topic practice — shows it. */
function histBadge(q){
  if(!sess||sess.timed)return '';
  const m=S.mistakes[canon(q.g)];if(!m)return '';
  const miss=m.count||0;
  const chip=(txt,col)=>`<span class="chip hbadge" style="color:${col}">${txt}</span>`;
  if(m.leech)return chip(`🐛 Leech · missed ${miss}×`,'var(--warn)');
  if(m.done)return miss?chip(`✓ Cleared · missed ${miss}×`,'var(--good)'):'';
  if(miss)return chip(`Missed ${miss}×`,'var(--bad)');
  if(m.unsure)return chip('🤔 Guessed before','var(--muted)');
  return '';
}

document.getElementById('brandSub').textContent=`${TESTS.length} Tests · ${UNIQUE_N} Questions`;

/* ============ MIGRATIONS ============
   Run once, at load, before anything reads S. Each one must be safe to run
   against state it has already migrated — a restored backup arrives here
   again. */
function migrate(){
  let n=0;
  n+=reshapeMistakes();      /* streak -> ok[] first, so the merge below sees one shape */
  n+=mergeDuplicateState();
  n+=clampAllDues();
  n+=restampDrillDay();
  if(n)save();
}
/* A day already stamped from a finish time is still wrong on disk, and the fix
   above only reaches the next session — so re-derive the one on record.

   History keeps when a session was handed in, never when it began, but the
   session left its start behind anyway: every question it asked stamped
   sr[g].last, so it is the run of answers ending at the entry's own timestamp.
   Walk back from there while the gaps stay conversational and no further than
   the questions the session actually held — real sessions run a minute or two
   a question and sit an hour or more apart, so the two together find the edge
   without having to guess at it. Nothing found, or a session that genuinely did
   start on the day it claimed, and the date stands.

   Only ever applied to a `last` that IS the calendar day of the newest session
   that could have written it: any other value came from somewhere this bug
   cannot reach. That also makes it idempotent — one pass and the two no longer
   match — which the mig flag then makes moot for a restored backup.

   And only while the wrong date is still TODAY, which is the only day it can do
   any harm on. Once it has passed, the tile is offering the drill anyway and the
   date is doing nothing but holding the streak together — correcting it then
   would break a run of days over a credit the app itself handed out, on a day
   already gone. A correction nobody can see is not worth a streak.

   The streak is never rebuilt either. It is eleven days long in the file this
   came from, and taking a day off someone for a bug they did not write is the
   wrong way round; moving the date back one is exactly what noteStudyDone()
   needs to see to carry the count on when they study later today. */
const SESS_GAP=30*60000;
function sessionStart(h){
  const ts=Object.values(S.sr).map(e=>e&&e.last).filter(t=>t&&t<=h.t).sort((a,b)=>b-a);
  let start=null;
  for(let i=0;i<ts.length&&i<(h.total||0);i++){
    if(i&&ts[i-1]-ts[i]>SESS_GAP)break;
    start=ts[i];
  }
  return start;
}
function restampDrillDay(){
  if(!S.mig)S.mig={};        /* a hand-edited file can arrive without one */
  if(S.mig.drillStart)return 0;
  S.mig.drillStart=1;
  const h=S.drill&&S.drill.last===dayKey()&&S.history.find(x=>x.src==='drill'||TRAINING.has(x.src));
  if(!h||dayKey(h.t)!==S.drill.last)return 1;
  const t0=sessionStart(h);
  if(!t0||dayKey(t0)===S.drill.last)return 1;
  S.drill.last=dayKey(t0);
  return 1;
}
/* Retirement moved from "right twice, ever" to "right on N separate days"
   (see recordAnswer). Already-retired mistakes stay retired: reopening
   hundreds of them three weeks out is demoralising, and the old streak
   counter cannot tell you which days they were earned on anyway. Open ones
   start their day count from zero. */
function reshapeMistakes(){
  let n=0;
  for(const m of Object.values(S.mistakes)){
    if(Array.isArray(m.ok))continue;
    m.ok=[];
    if((m.count||0)>=LEECH_AT&&!m.done)m.leech=true;
    delete m.streak;
    n++;
  }
  return n;
}
/* INV-8, applied to state written before there was an exam date. */
function clampAllDues(){
  const c=lastReviewTs();if(c==null)return 0;
  let n=0;
  for(const e of Object.values(S.sr))if(e&&e.due>c){e.due=c;n++}
  return n;
}
/* State that landed on a redundant id moves to the id that now owns it,
   taking the WORSE of the two records: a mistake anywhere is a mistake, and
   the earlier due date is the safer one. Idempotent — once merged there are
   no redundant keys left to find. */
function mergeDuplicateState(){
  let moved=0;
  const worseSr=(a,b)=>({box:Math.min(a.box||0,b.box||0),
    due:Math.min(a.due||0,b.due||0),
    seen:(a.seen||0)+(b.seen||0),
    unsure:(a.unsure||0)+(b.unsure||0),
    last:Math.max(a.last||0,b.last||0)});
  const addPicked=(a,b)=>{const o={...(a||{})};
    for(const [k,v] of Object.entries(b||{}))o[k]=(o[k]||0)+v;return o};
  const worseMistake=(a,b)=>({count:(a.count||0)+(b.count||0),
    unsure:(a.unsure||0)+(b.unsure||0),
    ok:(a.ok||[]).filter(d=>(b.ok||[]).includes(d)),   /* only days BOTH copies were right */
    miss:[a.miss,b.miss].filter(Boolean).sort().pop(), /* the more recent miss */
    picked:addPicked(a.picked,b.picked),               /* option indices are canonical either way */
    leech:!!(a.leech||b.leech),
    done:!!(a.done&&b.done)});
  for(const k of Object.keys(S.sr)){
    const c=canon(k);if(c===+k)continue;
    S.sr[c]=S.sr[c]?worseSr(S.sr[k],S.sr[c]):S.sr[k];
    delete S.sr[k];moved++;
  }
  for(const k of Object.keys(S.mistakes)){
    const c=canon(k);if(c===+k)continue;
    S.mistakes[c]=S.mistakes[c]?worseMistake(S.mistakes[k],S.mistakes[c]):S.mistakes[k];
    delete S.mistakes[k];moved++;
  }
  for(const k of Object.keys(S.flags)){
    const c=canon(k);if(c===+k)continue;
    S.flags[c]=1;delete S.flags[k];moved++;
  }
  return moved;
}
